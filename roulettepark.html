function renderOut(){
  setBody('out','<div class="pmsg panel"><h2>メダルがなくなりました</h2><p>ここからは見学です。プロジェクターのルーレットを楽しもう！</p></div>');
}

/* ---- BET ---- */
function renderBet(){
  const st=P.st,m=me(),bal=m.b,key='bet:'+st.gid,ln=lineupNow();
  if(P.dgid!==st.gid){
    P.dgid=st.gid;P.sentConf=false;P.rr=cleanRr(m.rr);
    P.draft=st.gno>1&&m.lastBet?sanitizeBet(m.lastBet,bal,ln):ZERO();
    if(bal<MIN_BET)P.draft=sanitizeBet({[ln[0]]:bal},bal,ln);
  }
  if(P.key!==key){
    P.key=key;
    $('pBody').innerHTML=`<div class="status" id="betStatus"></div>
      <p class="hint betguide">賭けたいゲームに直接枚数を入れよう（${MAX_PICK}つまで）。BETしたゲームは上に大きく出ます。盤面をタップすると数字が並べかわるよ（BET受付中だけ）。</p>
      <div class="boards" id="boardsWrap"></div>
      <details class="panel rules"><summary>ゲームのルール</summary>${howtoHtml(ln)}</details>
      <div class="betbar" id="betBar"><div class="bettotal" id="betTotal"></div>
        <div class="confirm"><button class="btn go" id="confBtn" type="button">このBETで決定</button><span class="hint" id="confHint"></span></div></div>`;
    P.layout='';P.treeBetShown=-1;ensureBoards(P.rr);P.justNum=0;P.justClimb=false;P.justFish=[];
    $('confBtn').onclick=()=>{if(!betOk(P.draft,me().b))return;P.sentConf=true;sendBet();updateBet()};
  }
  updateBet();
}
function setDraft(g,v){
  const m=me();if(!m||P.st.phase!=='bet')return;
  if(!lineupNow().includes(g))return;
  if(!P.draft[g]&&v>0&&pickedOf(P.draft).length>=MAX_PICK)return; // 4つ目は賭けられない
  const bal=m.b,others=totalOf(P.draft)-P.draft[g];
  P.draft[g]=Math.max(0,Math.min(Math.floor(v)||0,bal-others));
  P.sentConf=false;sendBet();updateBet();
}
function sendBet(){P.net.set('bets/'+P.pid,{gid:P.st.gid,b:P.draft,conf:P.sentConf,rr:P.rr,ts:Date.now()})}
/* 盤面を用意（ゲームIDと並べかえ回数が変わったら作り直し） */
function ensureBoards(rr){
  const st=P.st,k=st.gid+':'+JSON.stringify(cleanRr(rr));
  if(P.bgid!==k){P.bgid=k;P.boards=boardsFor(st.seed,P.pid,rr);P.applied=0;P.animTok++;P.animBusy=false;P.note=''}
}
function reroll(g,d){
  const m=me();if(!m||P.st.phase!=='bet')return;
  P.rr[g]=Math.max(0,P.rr[g]+d);
  const y=window.scrollY;
  sendBet();ensureBoards(P.rr);P.justNum=0;P.justClimb=false;
  drawBoards(false);
  keepScroll(y);
  const el=$('bd_'+g);if(el){el.classList.remove('shuf');void el.offsetWidth;el.classList.add('shuf')}
  updateRrTools();
}
/* iPadで盤面を描き直したときに画面が上に戻らないよう、元の位置に戻す */
function keepScroll(y){
  const a=document.activeElement;
  if(a&&a!==document.body&&a.tagName!=='INPUT'&&a.blur)a.blur();
  window.scrollTo(0,y);requestAnimationFrame(()=>window.scrollTo(0,y));setTimeout(()=>window.scrollTo(0,y),80);
}
function updateRrTools(){
  lineupNow().forEach(g=>{
    const n=P.rr[g],u=$('rru_'+g),c=$('rrc_'+g);
    if(u)u.disabled=n<=0;
    if(c)c.textContent=n?`${n}回 並べかえた`:'まだ最初の並び';
  });
}
function updateBet(){
  const st=P.st,m=me();if(!m)return;
  const bal=m.b,tot=totalOf(P.draft),ok=betOk(P.draft,bal),conf=m.conf&&P.sentConf,ln=lineupNow();
  const picked=pickedOf(P.draft).length;
  mountBoards(true,pickedOf(P.draft).filter(g=>ln.includes(g)));
  ln.forEach(g=>{
    const i=$('bi_'+g);if(!i)return;
    const v=P.draft[g],lock=!v&&picked>=MAX_PICK,col=$('gc_'+g);
    if(document.activeElement!==i)i.value=v;
    i.disabled=lock;
    col.querySelectorAll('.gstep .sb').forEach(b=>{const d=+b.dataset.d;b.disabled=d<0?v<=0:(lock||tot>=bal)});
    col.classList.toggle('betting',!!v);col.classList.toggle('nobet',!v);col.classList.toggle('lock',lock);
    $('bl_'+g).hidden=!lock;
    const e=$('gb_'+g);e.textContent=v?`${v}枚`:'BETなし';e.classList.toggle('none',!v);
    const bh=$('bh_'+g),ph=payListHtml(g,v);if(bh.dataset.h!==ph){bh.dataset.h=ph;bh.innerHTML=ph}
    if(g==='tree'&&P.treeBetShown!==v&&P.boards){P.treeBetShown=v;setBd($('bd_tree'),bigTree(P.boards.tree,false,(P.chance&&P.chance.tree)||new Set(),v))}
  });
  $('betStatus').innerHTML=`BET受付中${st.betLeft>=0?` <span class="cd">あと${st.betLeft}秒</span>`:''}`;
  let warn='';
  if(bal<MIN_BET)warn=`メダルが${MIN_BET}枚未満なので、${bal}枚全部を賭けます`;
  else if(tot<MIN_BET)warn=`合計${MIN_BET}枚以上賭けてください`;
  $('betTotal').innerHTML=`<span>BET合計<b>${tot}</b>枚 ／ 残り<b>${bal-tot}</b>枚 ／ ゲーム<b>${picked}</b>/${MAX_PICK}</span>${warn?`<span class="warn">${warn}</span>`:''}`;
  $('confBtn').disabled=!ok;
  $('confBtn').textContent=conf?'決定しました！':'このBETで決定';
  $('confHint').textContent=conf?'締め切りまでは変更できます（変えたらもう一度「決定」）':(P.sentConf?'送信しています…':'');
}

/* ---- 抽選中・結果：盤面 ---- */
function syncBoards(){
  const st=P.st,m=me();
  ensureBoards(m&&m.rr);
  const nums=numsOf(parseDrawn(st.drawn));
  let anim=null;P.justNum=0;P.justClimb=false;P.justFish=[];
  const ln=lineupNow(),on=g=>ln.includes(g);
  while(P.applied<nums.length){
    const n=nums[P.applied],last=P.applied===nums.length-1;
    const r=applyNum(P.boards,n,last);
    if(last){P.justNum=n;P.justFish=r.f;
      if(on('chain')&&r.c.steps)anim=r.c.steps;
      if(r.t.climbed){P.justClimb=true;if(on('tree')&&r.t.climbed>1)P.note=`ラダー 一気に${r.t.climbed}階アップ！`}
      if(on('treasure')&&r.tr==='T')P.note='トレジャー 宝を発見！';
      if(on('treasure')&&r.tr==='S')P.note='トレジャー ドクロが出た…';
      if(on('chain')&&r.c.chains>=1)P.note=`ドロップ ${r.c.chains}連鎖！`;
      if(on('fish')&&r.f.length){const f=P.boards.fish.fish[r.f[r.f.length-1]];
        P.note=f.k==='boot'?'マリンキャッチ 長靴でした…':f.sp?`サプライズ！ ${FISH_NAME[f.k]}だった`:`${FISH_NAME[f.k]}が釣れた！`}}
    P.applied++;
  }
  return anim;
}
function catsNow(){const c={};GKEYS.forEach(g=>c[g]=GAMES[g].cat(P.boards[g]));return c}
/* 列の中のBET欄。配当は倍率ではなく「もらえる枚数」で見せる */
const PAYDESC={
  bingo:'縦・横・ななめに5つそろうと1ライン。あと1つで「リーチ」。',
  chain:'番号のブロックが消え、同じ色3つで連鎖。縦1列ぜんぶ消すと1列。',
  tree:'出た番号の階にはしご。のぼった階で、右の枚数がもらえます。',
  treasure:'出た番号の場所を掘る。見つけた宝箱の数で配当。ドクロを掘ると半分に！',
  fish:'影の番号が全部出たら釣り上げ。釣った魚ごとに下の枚数がもらえます。'
};
const payOf=(g,k,b)=>Math.ceil(b*(MULT[g][k]||0)); // 切り上げ。ダブルアップ前
function payListHtml(g,b){
  if(g==='tree')return '';

  else items=GAMES[g].cats.filter(c=>c.t!=='none'&&!/s$/.test(c.k)).slice().reverse().map(c=>chip(c.t,c.name,payOf(g,c.k,base))).join('');
  return (b?'':'<span class="pnote">10枚BETなら</span>')+items;
}
function betStepHtml(g){

      <button type="button" class="sb" data-g="${g}" data-d="-10" aria-label="${N}を10枚減らす">−10</button>

/* BETしたゲームは上に大きく、BETしていないゲームは下に小さく並べる */
function colHtml(g,edit,mini){
  return `<section class="gcol${mini?' mini':''}" id="gc_${g}" aria-label="${GAMES[g].name}">
    <div class="ghead"><span class="gtag" style="--g:${GAMES[g].color}">${GAMES[g].name}</span><span class="gbet" id="gb_${g}"></span></div>

function boardsHtml(edit,big){
  const small=lineupNow().filter(g=>!big.includes(g));
  return (big.length?`<div class="trio" style="--n:${big.length}">${big.map(g=>colHtml(g,edit,false)).join('')}</div>`:'')+
    (small.length?`<div class="trio minis" style="--n:${small.length}">${small.map(g=>colHtml(g,edit,true)).join('')}</div>`:'');
}
/* 並び（大きく出すゲーム）が変わったときだけ作り直す */
function mountBoards(edit,big){
  const key=(edit?'e:':'v:')+big.join(','),w=$('boardsWrap');if(!w)return;
  if(P.layout===key&&w.firstChild)return;
  const y=window.scrollY;
  P.layout=key;w.innerHTML=boardsHtml(edit,big);P.treeBetShown=-1;
  if(edit){
    w.querySelectorAll('.gstep .sb').forEach(b=>b.onclick=()=>{const g=b.dataset.g;setDraft(g,P.draft[g]+(+b.dataset.d))});
    w.querySelectorAll('.gstep input').forEach(i=>{const g=i.id.slice(3);i.onchange=e=>setDraft(g,+e.target.value)});
    w.querySelectorAll('[data-rr]').forEach(b=>b.onclick=()=>reroll(b.dataset.rr,+b.dataset.d));
    w.querySelectorAll('[data-rrb]').forEach(el=>{
      el.onclick=e=>{e.preventDefault();reroll(el.dataset.rrb,1)};
      el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reroll(el.dataset.rrb,1)}};
    });
    updateRrTools();
  }

  keepScroll(y);
}
function setCol(g,bet,statHtml){

    (st.order.length?st.order.map(i=>{const f=st.fish[i];
      return `<div class="c${f.sp?' sp':''}${f.k==='boot'?' boot':''}${f.k==='buri'||f.k==='maguro'?' big':''}${just&&just.includes(i)?' late':''}">${fishArt(f.k)}<span>${FISH_NAME[f.k]}</span><em>${FISH_PT[f.k]}pt</em></div>`}).join('')
      :'<span class="none">まだ釣れていません</span>')+'</div></div>';
  return h;
}
/* 魚の回遊と、竿から魚のウキへの糸（iPadだけで動かす） */
const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function seaLoop(t){
  document.querySelectorAll('.sea').forEach(sea=>{
    const bd=sea.closest('.board');if(!bd||!P.boards)return;
    const st=P.boards.fish,R=sea.getBoundingClientRect();if(!R.width)return;
    const busy=new Set(),lines=[];
    sea.querySelectorAll('.fsh').forEach(el=>{
      if(el.classList.contains('caught'))return;
      const i=+el.dataset.i,f=st.fish[i],s=FISH_SLOTS[i];if(!f)return;
      const p=fishXY(f,s,t);
      el.style.left=p.x+'%';el.style.top=p.y+'%';el.classList.toggle('r',p.r);
      if(el.classList.contains('bite')){
        let ri=el.dataset.rod!==undefined?+el.dataset.rod:-1;
        if(ri<0||busy.has(ri)){ // いちばん近い、空いている竿
          let bestD=1e9;RODS.forEach((r,k)=>{const d=Math.abs(r.t-p.x)+(busy.has(k)?1000:0);if(d<bestD){bestD=d;ri=k}});
          el.dataset.rod=ri;
        }
        busy.add(ri);
        const u=el.querySelector('.uki').getBoundingClientRect();
        lines.push(`<line x1="${RODS[ri].t}" y1="${ROD_TIP}" x2="${((u.left+u.width/2-R.left)/R.width*100).toFixed(2)}" y2="${((u.top-R.top)/R.height*100).toFixed(2)}"/>`);
      }else if(el.dataset.rod!==undefined)delete el.dataset.rod;
    });
    RODS.forEach((r,k)=>{if(!busy.has(k))lines.push(`<line x1="${r.t}" y1="${ROD_TIP}" x2="${r.t}" y2="76"/>`)});
    sea.querySelectorAll('.ifl').forEach(e=>{e.hidden=busy.has(+e.dataset.r)});
    const g=sea.querySelector('.dyn'),html=lines.join('');if(g&&g.dataset.h!==html){g.innerHTML=html;g.dataset.h=html}
  });
  requestAnimationFrame(seaLoop);
}
function animateChain(steps){
  const tok=++P.animTok;P.animBusy=true;let i=0;
  const next=()=>{
    const el=$('bd_chain');
    if(tok!==P.animTok||!el){if(tok===P.animTok)P.animBusy=false;return}
    const sp=steps[i];setBd(el,bigChain(sp.cols,sp.pop));i++;
    if(i<steps.length)setTimeout(next,360);else{P.animBusy=false;setBd(el,bigChain(P.boards.chain.cols,null,(P.chance&&P.chance.chain)||new Set()))}
  };
  next();
}
function bigBingo(st,justNum,chn){
  const e=evalCard(st);let h='<div class="card">';
  for(let i=0;i<25;i++){
    const n=st.cells[i];let cl=i===12?'free':'';
    if(i!==12&&st.hit.has(i))cl='hit';
    if(e.lineCells.has(i))cl+=' line';
    if(e.need.has(i))cl+=' need';
    else if(chn&&chn.has(n)&&!st.hit.has(i))cl+=' chn';
    if(justNum&&n===justNum)cl+=' justhit';
    h+=`<div class="${cl}">${i===12?'FREE':n}</div>`;
  }
  return h+'</div>';
}
function bigChain(cols,pop,chn){
  let h='<div class="chain">';
  for(let y=CH_H-1;y>=0;y--)for(let x=0;x<CH_W;x++){
    const b=cols[x][y];
    h+=b?`<div class="blk${pop&&pop.has(b.id)?' pop':''}${!pop&&chn&&chn.has(b.n)?' chn':''}" style="--bc:${CH_C[b.c]}">${b.n}</div>`:'<div class="emp"></div>';
  }
  h+='</div><div class="gems">';
  for(let x=0;x<CH_W;x++){const won=cols[x].length===0;h+=`<div class="gem${won?' won':''}" style="--bc:${CH_C[x%4]}"><i></i><span>${won?'GET':''}</span></div>`}
  return h+'</div>';
}
function bigTree(st,just,chn,bet){
  const cur=st.climbs,F=st.floors.length;
  const sign=f=>{const k=ladderKey(f),m=MULT.tree[k]||0;return `<span class="sign${bet?' med':''}">${m?(bet?payOf('tree',k,bet)+'枚':'×'+m):''}</span>`};
  let h='<div class="tree">';
  h+=`<div class="floor summit ${cur>=F?'cur':'up'}${cur>=F&&just?' just':''}"><b class="fl">頂上${cur>=F?'<small>とうちゃく</small>':''}</b><div class="nums"><em>GOAL</em></div>${sign(F+1)}</div>`;
  for(let f=F;f>=1;f--){
    const idx=f-1,nums=st.floors[idx],state=idx<cur?'done':idx===cur?'cur':'up';
    const lad=state==='up'&&nums.some(n=>st.drawn.has(n));
    h+=`<div class="floor ${state}${lad?' lad':''}${state==='cur'&&just?' just':''}"><b class="fl">${f}F${state==='cur'?'<small>いま</small>':lad?'<small class="ladtag">はしご</small>':''}</b>`+
       `<div class="nums">${nums.map(n=>`<span class="${(state==='done'&&st.by[idx]===n)||(state==='up'&&st.drawn.has(n))?'by':chn&&chn.has(n)&&!st.drawn.has(n)?'chn':''}">${n}</span>`).join('')}</div>${sign(f)}</div>`;
  }
  return h+'</div>';
}
function renderResult(){
  const st=P.st,m=me();P.chance={};
  syncBoards();
  const res=m.res||{},bet=m.bet||ZERO(),tb=totalOf(bet),net=m.pt-tb;
  const rows=GKEYS.filter(g=>bet[g]).map(g=>{const r=res[g]||{k:'',p:0},c=catOf(g,r.k);
    return `<tr><td><span class="gtag" style="--g:${GAMES[g].color}">${GAMES[g].name}</span> ${bet[g]}枚</td><td><span class="chip ${r.p>0?TIER[c.t]:'t-none'}">${r.p>0?c.name:'はずれ'}</span></td><td>${r.p>0?'+'+r.p:'0'}</td></tr>`}).join('');
  const key='result:'+st.gid;
  if(P.key===key)return;
  P.key=key;
  $('pBody').innerHTML=`<div class="panel" style="display:flex;flex-direction:column;gap:10px;align-items:center">
      <h2>第${st.gno}ゲームの結果</h2>${st.dbl?'<div class="dblbanner" style="width:100%">ダブルアップ！ 配当2倍</div>':''}
      <div class="bigres ${net>=0?'safe':'clean'}">${net>=0?'+':''}${net}枚</div>
      <table class="restable"><tbody>${rows}</tbody><tfoot><tr><td>BET ${tb}枚</td><td>配当</td><td>${m.pt}</td></tr></tfoot></table>
      <p style="font-weight:800;margin:0">いまのメダル <span style="font-family:var(--f-display);font-size:24px;color:var(--orange)">${m.b}</span> 枚</p>
      ${m.b<=0?'<p class="err">メダルがなくなりました。次のゲームからは見学です。</p>':''}
      <p class="hint">${st.gno>=st.cfg.games?'全ゲーム終了！ 結果発表を待ってね。':'次のゲームを待っています…'}</p></div>
    <div class="boards" id="boardsWrap"></div>`;
  P.layout='';mountBoards(false,pickedOf(bet));
  P.animTok++;P.animBusy=false;P.justNum=0;P.justClimb=false;P.justFish=[];
  lineupNow().forEach(g=>{
    const r=res[g],k=r?r.k:GAMES[g].cat(P.boards[g]),c=catOf(g,k);
    let h;
    if(bet[g])h=`<span class="chip ${r&&r.p>0?TIER[c.t]:'t-none'}">${r&&r.p>0?`${c.name}　+${r.p}`:'はずれ'}</span>`;
    else h=`<span class="chip ${TIER[c.t]}">${c.t==='none'?'はずれ':c.name}</span>`;
    setCol(g,bet,h);
  });
  drawBoards(false);
}

/* ---- 結果発表・サドンデス ---- */
function rankOf(roster,pid){const me=roster[pid];if(!me)return 0;return 1+Object.values(roster).filter(r=>r.b>me.b).length}
function renderFinal(){
  const st=P.st,m=me(),R=st.rev||{},sd=st.sd||{};
  const shown=R.shown||[],safe=R.safe||[],cands=sd.cands||[];
  let h='',key='final:'+st.phase+':'+shown.length+':'+(R.step||'')+':'+safe.length;
  const amClean=shown.includes(P.pid),inSd=cands.includes(P.pid);
  if(st.phase==='end'&&st.rank){
    h=`<div class="panel pmsg finalme"><h2>最終結果</h2>
      <div class="frank"><span class="fr">${rankOf(st.roster,P.pid)}</span><span class="fu">位</span></div>
      <p class="fmed">最終 <b>${m.b}</b> 枚</p>
      <span class="ftag ${amClean?'clean':'safe'}">${amClean?'🧹 掃除当番':'セーフ'}</span></div>`;
    setBody('final:rank',h);return;
  }
  if(st.phase==='sd_pick'&&inSd){
    key='sdpick';
    if(P.key!==key){
      P.key=key;
      $('pBody').innerHTML=`<div class="panel pmsg"><h2>サドンデス！</h2><p>1〜25の数字を1つ選んでください。ルーレットで自分の数字が出たらセーフ！</p>
        <div class="status" id="sdLeft"></div><div class="numgrid" id="sdGrid"></div><p class="hint" id="sdMine"></p></div>`;
      $('sdGrid').onclick=e=>{const b=e.target.closest('button[data-n]');if(!b||b.disabled)return;P.net.set('sdpick/'+P.pid,{id:sd.id,n:+b.dataset.n});P.sdSent=+b.dataset.n;updateSd()};
    }
    updateSd();return;
  }
  if(amClean){
    h=`<div class="panel pmsg"><div class="bigres clean">掃除当番…</div><p style="font-weight:800">今日の掃除をよろしくお願いします！</p><p class="hint">最後のメダル ${m.b}枚</p></div>`;
  }else if(st.phase==='end'||safe.includes(P.pid)){
    h=`<div class="panel pmsg"><div class="bigres safe">セーフ！</div><p style="font-weight:800">掃除当番にはなりませんでした</p><p class="hint">最後のメダル ${m.b}枚</p></div>`;
  }else if(st.phase==='sd_spin'&&inSd){
    h=`<div class="panel pmsg"><h2>サドンデス中</h2><p>あなたの数字は</p><div class="bigres" style="color:var(--yellow)">${sd.picks&&sd.picks[P.pid]||'?'}</div><p class="hint">プロジェクターのルーレットを見てください。出たらセーフ！</p></div>`;
  }else if(inSd){
    h=`<div class="panel pmsg"><h2>サドンデスになりました</h2><p>同じメダル数の人で、残りの掃除当番を決めます。</p></div>`;
  }else{
    h=`<div class="panel pmsg"><h2>結果発表中…</h2><p>ドキドキ…プロジェクターを見てください</p><p class="hint">掃除当番 ${shown.length}／${R.need||st.cfg.clean}人 発表済み</p></div>`;
  }
  setBody(key+':'+(amClean?1:0),h);
}
function updateSd(){
  const st=P.st,sd=st.sd||{},picks=sd.picks||{},mine=picks[P.pid];
  const taken=new Set(Object.keys(picks).filter(p=>p!==P.pid).map(p=>picks[p]));
  $('sdGrid').innerHTML=range25().map(n=>`<button type="button" data-n="${n}" class="${mine===n||(!mine&&P.sdSent===n)?'mine':''}" ${taken.has(n)?'disabled':''}>${n}</button>`).join('');
  $('sdLeft').innerHTML=`あと <span class="cd">${Math.max(0,sd.left||0)}</span> 秒`;
  $('sdMine').textContent=mine?`あなたの数字：${mine}（締め切りまで変えられます）`:'選ばなかった場合は、空いている数字が自動で決まります';
}

/* ===================== 起動 ===================== */
if(ROOM||params.has("join"))padInit();else hostInit();
</script>
