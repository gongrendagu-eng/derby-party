<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1116">
<title>先生の画面</title>
<style>
:root{
  box-sizing:border-box;
  --bg:#0e1116; --ink:#eef2f7; --soft:#8d98a8; --acc:#4da3ff;
  font-family:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-text-size-adjust:100%}
#stage{position:fixed;left:0;right:0;top:0;bottom:var(--bar);overflow:hidden}
:root{--bar:calc(46px + env(safe-area-inset-bottom,0px))}
/* 下のバー(iPadの人が自分で切り替えられるのはここだけ) */
#ctl{position:fixed;left:0;right:0;bottom:0;height:var(--bar);padding:0 10px env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:8px;
  background:#161b23;border-top:1px solid #2a3240;z-index:10;font-size:14px}
#ctl[hidden]{display:none}
#ctl .me{color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.seg{display:flex;background:#0e1116;border:1px solid #2f3947;border-radius:10px;padding:3px;gap:2px;flex:none}
.seg button{font:700 14px/1 inherit;font-family:inherit;color:#aab5c4;background:none;border:0;border-radius:7px;padding:8px 12px;position:relative;white-space:nowrap}
.seg button.on{background:#2d6cdf;color:#fff}
.seg button .dot{position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:#ffcc33;box-shadow:0 0 6px #ffcc33}
#tabs[hidden]{display:none}
#wrap{position:absolute;left:0;top:0;transform-origin:0 0;visibility:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
#wrap.on{visibility:visible}
#frame{display:block;border:0;background:#fff;pointer-events:none}
#shield{position:absolute;inset:0}
#shield[hidden]{display:none}
/* 待ち画面・参加画面 */
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.panel[hidden]{display:none}
.box{max-width:520px;width:100%}
.box h1{font-size:26px;margin:0 0 10px}
.box p{color:var(--soft);margin:6px 0;line-height:1.6}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:var(--acc);margin:0 auto 18px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.code{font:800 40px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;color:var(--ink);margin-top:14px}
#joinForm{display:flex;gap:10px;justify-content:center;margin-top:20px}
#joinInput{width:220px;font:800 34px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;text-transform:uppercase;text-align:center;
  padding:12px;border-radius:12px;border:2px solid #3a4454;background:#171c24;color:var(--ink)}
#joinForm button{font:700 20px/1 inherit;font-family:inherit;padding:0 22px;border-radius:12px;border:0;background:var(--acc);color:#fff}
/* 待ちの帯(画面を表示中に配信が止まったとき) */
#bar{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:5;
  background:rgba(0,0,0,.75);color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;white-space:nowrap}
#bar[hidden]{display:none}
#tip{position:fixed;right:10px;bottom:calc(var(--bar) + 10px);z-index:5;background:rgba(0,0,0,.7);color:#fff;
  border-radius:999px;padding:7px 14px;font-size:13px;transition:opacity .6s;pointer-events:none}
#tip.fade{opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div id="wrap"><iframe id="frame" title="先生の画面" scrolling="no" tabindex="-1" aria-hidden="true"></iframe><div id="shield"></div></div>
</div>

<div id="wait" class="panel" hidden>
  <div class="box">
    <div class="spin"></div>
    <h1 id="waitTitle">先生の画面を待っています…</h1>
    <p id="waitText">先生が「iPadに映す」を押すと、ここに表示されます。</p>
    <div class="code" id="waitCode"></div>
  </div>
</div>

<div id="join" class="panel" hidden>
  <div class="box">
    <h1>📺 先生の画面を見る</h1>
    <p>先生の画面に出ている参加コードを入れてください。</p>
    <form id="joinForm" autocomplete="off">
      <input id="joinInput" maxlength="8" inputmode="latin" autocapitalize="characters" spellcheck="false" placeholder="ABCDE">
      <button type="submit">見る</button>
    </form>
  </div>
</div>

<div id="bar" hidden></div>
<div id="ctl" hidden>
  <span class="me" id="me">👀 先生の画面(見るだけ)</span>
  <div class="seg" id="tabs" hidden></div>
  <div class="seg" id="sizes">
    <button type="button" data-m="fit">iPadに合わせる</button>
    <button type="button" data-m="same">先生と同じ</button>
  </div>
</div>
<div id="tip" class="fade"></div>

<script>
(function(){
'use strict';
var FB_VER='10.12.2';
var PAKO_URL='https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js';
var MINW=960;   // 「iPadに合わせる」でも、これより狭いときは縮小して表示する(PC向けの配置をくずさないため)
var $=function(s){return document.querySelector(s);};
var frame=$('#frame'), wrap=$('#wrap');
var code=(new URLSearchParams(location.search).get('r')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
var db=null, ref=null;
var headKey=null, docReady=false, cur=null, lastHtml=null, lastSc=[], lastScPaths={}, W=0, H=0, LW=0, LH=0, hasFrame=false;
var mode='fit', tab='', tabSeen={}, modalWas=false;
try{ mode=localStorage.getItem('mv.view.mode')==='same'?'same':'fit'; }catch(e){}

/* ---------- 読み込み ---------- */
function load(src){return new Promise(function(ok,ng){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=function(){ng(new Error(src));};document.head.appendChild(s);});}
function loadConfig(){
  if(window.FIREBASE_CONFIG) return Promise.resolve();
  return load('firebase-config.js').catch(function(){}).then(function(){
    if(window.FIREBASE_CONFIG) return; return load('../firebase-config.js');
  });
}
function connect(){
  return Promise.all([
    loadConfig().then(function(){
      if(window.firebase&&window.firebase.database) return;
      return load('https://www.gstatic.com/firebasejs/'+FB_VER+'/firebase-app-compat.js')
        .then(function(){return load('https://www.gstatic.com/firebasejs/'+FB_VER+'/firebase-database-compat.js');});
    }),
    window.pako?null:load(PAKO_URL)
  ]).then(function(){
    if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    db=firebase.database();
  });
}
function unb64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function unpack(o){ if(!o) return ''; return o.z? window.pako.inflate(unb64(o.d),{to:'string'}) : (o.d||''); }
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---------- 画面の組み立て ---------- */
var PANEL_CSS='#mvx-panel{position:fixed;inset:0;z-index:2147483000;overflow:auto;background:var(--bg,#fff);color:var(--ink,#111);padding:24px 28px 40px}'+
  '#mvx-panel[hidden]{display:none}#mvx-panel .mvx-in{max-width:980px;margin:0 auto}';
function buildDoc(head){
  var d=frame.contentDocument;
  var base=head.base?'<base href="'+esc(head.base)+'">':'';
  d.open();
  d.write('<!DOCTYPE html><html><head><meta charset="UTF-8">'+base+unpack(head)+
    '<style>html,body{overflow:hidden!important;-webkit-text-size-adjust:100%}*{-webkit-user-select:none;user-select:none}'+PANEL_CSS+'</style>'+
    '</head><body></body></html>');
  d.close();
  var panel=d.createElement('div'); panel.id='mvx-panel'; panel.hidden=true;
  panel.innerHTML='<div class="mvx-in"></div>';
  d.documentElement.appendChild(panel);     // body の外に置く(画面の更新で消されないように)
  document.title=(head.title||'先生の画面')+'(見るだけ)';
  $('#me').textContent='👀 '+(head.title||'先生の画面')+'(見るだけ)';
  docReady=true; lastHtml=null; lastScPaths={}; tab=''; tabSeen={};
  if(cur) apply(cur);
}
function setAttrs(el,list){
  list=list||[];
  var want={};
  list.forEach(function(p){want[p[0]]=p[1];});
  for(var i=el.attributes.length-1;i>=0;i--){var n=el.attributes[i].name; if(!(n in want)) el.removeAttribute(n);}
  for(var k in want){ if(el.getAttribute(k)!==want[k]) el.setAttribute(k,want[k]); }
}
// 変わったところだけ書き換える(アニメーションが途中で止まらないように)
function morph(a,b){
  var doc=a.ownerDocument, ak=Array.prototype.slice.call(a.childNodes), bk=b.childNodes;
  for(var i=0;i<bk.length;i++){
    var x=ak[i], y=bk[i];
    if(!x){ a.appendChild(doc.importNode(y,true)); continue; }
    if(x.nodeType!==y.nodeType||(x.nodeType===1&&x.tagName!==y.tagName)){ a.replaceChild(doc.importNode(y,true),x); continue; }
    if(x.nodeType===1){ setAttrs(x,Array.prototype.map.call(y.attributes,function(t){return[t.name,t.value];})); morph(x,y); }
    else if(x.nodeValue!==y.nodeValue) x.nodeValue=y.nodeValue;
  }
  for(var j=ak.length-1;j>=bk.length;j--) a.removeChild(ak[j]);
}
function nodeAt(d,path){
  if(path==='') return d.scrollingElement||d.documentElement;
  var el=d.body, ps=path.split('.');
  for(var i=0;i<ps.length&&el;i++) el=el.children[+ps[i]];
  return el||null;
}
// スクロール位置は「どのくらい下まで進んでいるか」の割合で合わせる(画面の大きさが違っても同じ所が見える)
function applyScroll(){
  if(!docReady) return;
  var d=frame.contentDocument, now={};
  lastSc.forEach(function(s){
    now[s[0]]=1; var el=nodeAt(d,s[0]); if(!el) return;
    var mt=el.scrollHeight-el.clientHeight, ml=el.scrollWidth-el.clientWidth;
    el.scrollTop = s.length>3 ? (s[3]>0 ? Math.round(s[1]/s[3]*mt) : 0) : s[1];
    el.scrollLeft= s.length>4 ? (s[4]>0 ? Math.round(s[2]/s[4]*ml) : 0) : s[2];
  });
  Object.keys(lastScPaths).forEach(function(p){ if(!now[p]){ var el=nodeAt(d,p); if(el){ el.scrollTop=0; el.scrollLeft=0; } } });
  lastScPaths=now;
}
function apply(f){
  cur=f;
  if(!docReady) return;
  var d=frame.contentDocument;
  if(f.w!==W||f.h!==H){ W=f.w; H=f.h; fit(); }
  var html=unpack(f);
  if(html!==lastHtml){
    var t=d.createElement('template'); t.innerHTML=html;
    morph(d.body,t.content); lastHtml=html;
  }
  setAttrs(d.documentElement,f.ha); setAttrs(d.body,f.ba);
  lastSc=f.sc||[]; applyScroll();
  // ルーレットや結果発表などのウィンドウが開いたら、画面タブにもどす
  var modalOn=Array.prototype.some.call(d.body.querySelectorAll('.modal'),function(m){return m.getClientRects().length>0;});
  if(modalOn&&!modalWas&&tab) tab='';
  modalWas=modalOn;
  updTabs();
  wrap.classList.add('on');
}

/* ---------- 表示の大きさ ---------- */
function fit(){
  if(!W||!H) return;
  var st=$('#stage'), vw=st.clientWidth, vh=st.clientHeight, s;
  if(mode==='same'){ LW=W; LH=H; s=Math.min(vw/W,vh/H); }
  else{ s=vw<MINW? vw/MINW : 1; LW=Math.round(vw/s); LH=Math.round(vh/s); }
  frame.style.width=LW+'px'; frame.style.height=LH+'px';
  wrap.style.width=LW+'px'; wrap.style.height=LH+'px';
  wrap.style.transform='translate('+Math.round((vw-LW*s)/2)+'px,'+Math.round((vh-LH*s)/2)+'px) scale('+s+')';
  if(mode==='same'&&vh>vw&&W>H) tip('iPadを横向きにすると大きく見えます');
  requestAnimationFrame(applyScroll);
}
function setMode(m){
  mode=m; try{localStorage.setItem('mv.view.mode',m);}catch(e){}
  Array.prototype.forEach.call(document.querySelectorAll('#sizes button'),function(b){b.classList.toggle('on',b.dataset.m===m);});
  fit();
}
var tipT=null;
function tip(msg){
  var el=$('#tip'); el.textContent=msg; el.classList.remove('fade');
  clearTimeout(tipT); tipT=setTimeout(function(){el.classList.add('fade');},4000);
}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',function(){setTimeout(fit,300);});

/* ---------- タブ(ゲーム側が data-mv-tab を付けた部分を大きく表示) ---------- */
function updTabs(){
  var d=frame.contentDocument, box=$('#tabs');
  var els=Array.prototype.slice.call(d.body.querySelectorAll('[data-mv-tab]')).filter(function(e){ return e.getClientRects().length>0; });
  if(tab && !els.some(function(e){return e.dataset.mvTab===tab;})) tab='';
  var names=els.map(function(e){return e.dataset.mvTab;});
  var key=names.join('|');
  if(box.dataset.key!==key){
    box.dataset.key=key;
    box.innerHTML=names.length?'<button type="button" data-t="">🖥 画面</button>'+names.map(function(n){return '<button type="button" data-t="'+esc(n)+'">'+esc(n)+'</button>';}).join(''):'';
  }
  box.hidden=!names.length;
  // 中身が変わったタブに印を付ける(見ていないときだけ)
  els.forEach(function(e){
    var n=e.dataset.mvTab, txt=e.textContent;
    if(tabSeen[n]===undefined) tabSeen[n]=txt;
    if(tab===n) tabSeen[n]=txt;
    var btn=box.querySelector('button[data-t="'+CSS.escape(n)+'"]');
    if(btn){ var has=tabSeen[n]!==txt, dot=btn.querySelector('.dot');
      if(has&&!dot){ dot=document.createElement('span'); dot.className='dot'; btn.appendChild(dot); }
      if(!has&&dot) dot.remove(); }
  });
  Array.prototype.forEach.call(box.querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.t===tab);});
  var panel=d.getElementById('mvx-panel');
  if(!panel) return;
  var src=tab&&els.filter(function(e){return e.dataset.mvTab===tab;})[0];
  var touch=!!src;   // タブを見ているときだけ指でスクロールできるようにする(中身は写しなので操作はできない)
  frame.style.pointerEvents=touch?'auto':'none'; $('#shield').hidden=touch;
  if(!src){ panel.hidden=true; return; }
  var c=src.cloneNode(true);
  c.removeAttribute('id'); Array.prototype.forEach.call(c.querySelectorAll('[id]'),function(x){x.removeAttribute('id');});
  var inner=panel.firstChild, html=c.outerHTML;
  if(inner.dataset.html!==html){ inner.innerHTML=html; inner.dataset.html=html; }
  panel.hidden=false;
}
function setTab(t){ tab=t; var p=frame.contentDocument&&frame.contentDocument.getElementById('mvx-panel'); if(p) p.scrollTop=0; updTabs(); }

/* ---------- 状態の表示 ---------- */
function status(){
  var showing=hasFrame&&docReady;
  $('#wait').hidden=showing||!code;
  $('#waitCode').textContent=code;
  $('#ctl').hidden=!(docReady&&(hasFrame||lastHtml!==null));
  if(!showing){ wrap.classList.remove('on'); }
  $('#bar').hidden=true;
  if(!hasFrame&&lastHtml!==null){
    // いったん表示したあとで止まった → 最後の画面は残して帯だけ出す
    $('#wait').hidden=true; wrap.classList.add('on');
    $('#bar').hidden=false; $('#bar').textContent='⏸ 先生の配信が止まっています(再開すると自動で表示されます)';
  }
  fit();
}

/* ---------- 開始 ---------- */
function watch(){
  status();
  connect().then(function(){
    ref=db.ref('rooms/'+code+'/mv');
    ref.child('head').on('value',function(s){
      var h=s.val();
      if(!h) return;
      var key=h.d+'|'+h.base;
      if(key===headKey) return;
      headKey=key; buildDoc(h); status();
    });
    ref.child('frame').on('value',function(s){
      var f=s.val();
      hasFrame=!!f;
      if(f) apply(f);
      status();
    });
    // 見ている台数を先生に知らせる
    var id=Math.random().toString(36).slice(2,10);
    db.ref('.info/connected').on('value',function(s){
      if(s.val()!==true) return;
      var me=ref.child('viewers/'+id);
      me.onDisconnect().remove(); me.set(true);
    });
  }).catch(function(e){
    $('#wait').hidden=false;
    $('#waitTitle').textContent='つながりませんでした';
    $('#waitText').textContent='インターネットにつながっているか確かめて、ページを読み込み直してください。('+(e&&e.message?e.message:e)+')';
  });
}

// 先生の画面はさわれない。iPadで操作できるのは下のバーだけ
['click','dblclick','contextmenu','keydown','keyup','keypress'].forEach(function(t){
  document.addEventListener(t,function(e){ if(e.target&&e.target.closest&&e.target.closest('#joinForm,#ctl')) return; e.preventDefault(); e.stopPropagation(); },true);
});
$('#sizes').addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) setMode(b.dataset.m); });
$('#tabs').addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) setTab(b.dataset.t); });
setMode(mode);

if(/^[A-Z0-9]{4,8}$/.test(code)) watch();
else{
  $('#join').hidden=false;
  $('#joinForm').addEventListener('submit',function(e){
    e.preventDefault();
    var c=$('#joinInput').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!/^[A-Z0-9]{4,8}$/.test(c)){ $('#joinInput').focus(); return; }
    location.search='?r='+c;
  });
  setTimeout(function(){$('#joinInput').focus();},100);
}
})();
</script>
</body>
</html>
