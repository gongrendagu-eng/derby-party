<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>メダルゲーム 観戦画面</title>
<style>
html,body{margin:0;height:100%;background:#0b1220;color:#fff;font-family:"M PLUS Rounded 1c",system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100vw;height:100vh;border:0;background:#0b1220}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
#msg h1{font-size:44px;margin:0}#msg p{font-size:22px;margin:0;opacity:.8}
#pick{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px}
#pick button{font:inherit;font-weight:800;font-size:22px;border:0;border-radius:14px;padding:14px 26px;background:#2f7bff;color:#fff;cursor:pointer}
#fs{position:fixed;right:10px;bottom:10px;opacity:.25;border:0;border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer}
#fs:hover{opacity:.9}
</style>
</head>
<body>
<div id="msg"><h1>観戦画面</h1><p>接続しています…</p></div>
<script src="mg-core.js"></script>
<script>
/* 別の教室のプロジェクター用の観戦画面(操作はできません)
   view.html?mg=公開の鍵&clean=掃除決めID … その掃除決めのゲームを自動で追いかける(次のゲームにも自動で切りかわる)
   view.html?mg=公開の鍵&game=ゲームID    … 稼働中のそのゲームを映す
   view.html?mg=公開の鍵                  … 稼働中のゲームから選ぶ */
(async function(){
  const q=new URLSearchParams(location.search), CLEAN=q.get('clean')||'', GAME=q.get('game')||'';
  const msg=document.getElementById('msg');
  const say=(h,p,extra)=>{ msg.hidden=false; msg.innerHTML=`<h1>${h}</h1>${p?`<p>${p}</p>`:''}${extra||''}`; };
  let V=null; try{ V=await MG.startViewer(); }catch(e){}
  if(!V){ say('観戦画面を開けません','URLに ?mg=… が必要です。管理画面の「観戦画面」のリンクから開いてください。'); return; }
  let fr=null, cur='', picked=GAME;
  const HAS_VIEW=['roulette','hockey','foos','baseball','tower'];   // 観戦画面があるゲーム(art)
  const show=g=>{
    const u=new URL(g.url); u.searchParams.set('mg',V.pub); u.searchParams.set('view','1'); if(MG.LOCAL) u.searchParams.set('local','1');
    if(u.href===cur) return; cur=u.href;
    if(!fr){ fr=document.createElement('iframe'); fr.allow='autoplay; fullscreen'; document.body.appendChild(fr); }
    fr.src=u.href; msg.hidden=true; };
  const hide=()=>{ cur=''; if(fr){ fr.remove(); fr=null; } };
  V.onGames(games=>{
    const ids=Object.keys(games);
    let id=null;
    if(CLEAN) id=ids.find(k=>games[k].clean===CLEAN);
    else if(picked) id=games[picked]?picked:null;
    else { const c=ids.filter(k=>!games[k].clean&&HAS_VIEW.includes(games[k].art));
      if(c.length===1){ id=c[0]; }
      else { hide(); if(!c.length) say('観戦画面','いま映せるゲームは動いていません。ゲームが始まるまで待っています…');
        else say('どのゲームを映しますか？','',`<div id="pick">${c.map(k=>`<button data-g="${k}">${games[k].n}</button>`).join('')}</div>`);
        msg.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ picked=b.dataset.g; location.search=location.search+(location.search?'&':'?')+'game='+encodeURIComponent(picked); });
        return; } }
    if(id&&games[id]){
      if(!HAS_VIEW.includes(games[id].art)){ hide(); say(games[id].n,'このゲームには、別の教室用の観戦画面はありません。'); return; }
      show(games[id]);
    }else{ hide(); say('観戦画面',CLEAN?'つぎのゲームが始まるまで待っています…':'ゲームが止まっています。始まるまで待っています…'); }
  });
  const b=document.createElement('button'); b.id='fs'; b.textContent='全画面'; b.onclick=()=>document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); document.body.appendChild(b);
})();
</script>
</body>
</html>
