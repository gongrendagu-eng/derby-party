<style>
/* ③ ワイドライン */
.th-wide{--body:linear-gradient(90deg,#4a2a14 0%,#7a4a24 18%,#9a6232 50%,#7a4a24 82%,#4a2a14 100%);--deck:linear-gradient(180deg,#3a2210,#5a3518);--lampA:#ffd84d;--lampB:#7fdcff;--led:#ffffff;--ledbox:#2a1a0c;--ledlbl:#ffd84d;--tray:linear-gradient(180deg,#2a1a0c,#4a2c14);background:#5a8fd0 url(assets/wl_bg.webp) center/cover no-repeat}

.th-wide .logo{font-family:var(--f-num);font-size:28px;letter-spacing:3px;white-space:nowrap;color:#ffd84d;-webkit-text-stroke:2px #5a2a00;text-shadow:0 4px 0 #3a1800,0 0 14px rgba(255,216,77,.6)}
.th-wide .bezel{border-radius:14px;background:linear-gradient(180deg,#f6d77a 0%,#b07a24 50%,#f6d77a 100%);padding:9px}

.th-wide .hl.wd{box-shadow:0 0 0 3px #ff6b6b,0 0 18px #ff6b6b}

.th-wide .side.l{margin-top:10px;padding:12px}

.th-wide .wpt svg{width:26px;height:26px}.th-wide .wpt b{font-family:var(--f-body);font-size:11px;color:#dfe6ff}

.th-wide .side.r .rpgw{padding:10px;display:flex;flex-direction:column;gap:7px}
.th-wide .side.r .dat{background:rgba(255,255,255,.1)}.th-wide .side.r .dat b{color:#ffd84d}
.th-wide .say{position:relative;font-size:12px;line-height:1.5;padding:8px 10px}
.th-wide .wmsg{position:absolute;left:10px;right:10px;top:10px;height:38px;border-radius:6px;background:#101a5c;border:3px solid #ffd84d;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:18px;z-index:5;pointer-events:none;animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
.th-wide .wmsg b{font-family:var(--f-num);font-weight:400;font-size:22px;color:#ffd84d}.th-wide .wmsg .w{padding:1px 8px;border-radius:999px;background:#c0392b;color:#fff}

.th-wide .cutin img{height:300px;animation:wlpop .5s cubic-bezier(.2,1.6,.4,1) both}

.th-wide .rwrap{position:relative;transform-origin:50% 0}
.dls-world,.dls-tint,.dls-rays,.dls-fx,.dls-flash,.dls-txt,.dls-actors{position:absolute;inset:0;pointer-events:none}

.dls-fx{width:100%;height:100%}
.dls-flash{opacity:0;background:#fff}
.dls-a{position:absolute;left:0;bottom:0;transform-origin:50% 100%;will-change:transform}
.dls-a .bd{position:relative;transform-origin:50% 100%}
.dls-a .spr{display:none;position:relative;overflow:hidden;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}

.dls-a.has-spr .spr{display:block}.dls-a.has-spr .bd>img{display:none}

.dls-a img{display:block;transform-origin:50% 100%;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}

.dls-shadow{position:absolute;left:0;bottom:0;border-radius:50%;background:rgba(10,20,50,.32)}
.dls-mark{position:absolute;left:0;bottom:0;z-index:9;font-family:var(--f-num);font-size:28px;color:#fff;-webkit-text-stroke:3px #c0392b;text-shadow:0 3px 0 #7a1f1f;white-space:nowrap}
.dls-b{position:absolute;left:50%;top:42%;z-index:9;white-space:nowrap;font-family:var(--f-num);letter-spacing:2px;color:#ffd84d;-webkit-text-stroke:3px #5a2a00;text-shadow:0 4px 0 #3a1800,0 0 16px rgba(255,216,77,.7)}

.th-wide .deck .auto{background:#101a5c;border-color:#fff;color:#fff}
/* 下の段(CREDIT/BET/WIN・BET・SPIN・メダル受け)を小さくして、演出画面を広げる */
.th-wide .cab{gap:7px}
.th-wide .leds{padding:4px 8px;gap:6px}
.th-wide .led{flex-direction:row;align-items:center;justify-content:space-between;padding:2px 10px}

.th-wide .betbox .bb.max{width:48px;font-size:12px}
.th-wide .betbox .bv{height:40px;min-width:76px;flex-direction:row;gap:6px}
.th-wide .betbox .bv b{font-size:20px}
.th-wide .tray{height:18px}
.th-wide .tray i{width:16px;height:8px}.th-wide .deck .auto.on{background:#ffd84d;color:#3a1800}
/* BETの枚数(どの機種も共通):−/＋/MAX と、数字を押すと入力 */
.betbox{display:flex;align-items:center;gap:6px;padding:6px;border-radius:14px;background:rgba(0,0,0,.28);flex-shrink:0}
.betbox .bb{width:46px;height:52px;border-radius:10px;background:linear-gradient(180deg,#fff,#e8e2da);color:#3a2a3f;font-size:24px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.4)}

.betbox .bv{min-width:92px;height:52px;padding:0 8px;border-radius:10px;background:#100a0c;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}

.betbox .bv b{font-family:var(--f-led);font-size:26px;font-weight:900;color:var(--led,#ff4a2e);text-shadow:0 0 8px var(--led,#ff4a2e)}
.betbox button:disabled{opacity:.45}
.auto.on::after{content:" ■"}
.betsel{width:58px;height:56px;border-radius:10px;font-family:var(--f-led);font-size:21px;font-weight:900;border:3px solid #c4a5ff;background:linear-gradient(180deg,#fff,#e3d2ff);color:#4c1d95;box-shadow:0 4px 0 #3b1f8a}
.betsel.sel{border-color:#fff;background:linear-gradient(180deg,#fff7c2,#ffcf3f);color:#33204f;box-shadow:0 0 12px #ffcf3f}

.rev{position:absolute;inset:0;z-index:7;overflow:hidden;animation:rev .35s ease-out both}
.rev img{width:100%;height:100%;object-fit:cover;display:block;animation:revz 3.5s ease-out both}
@keyframes rev{from{opacity:0}}@keyframes revz{from{transform:scale(1.18)}}
.rev.out{animation:revout .5s ease-in forwards}@keyframes revout{to{opacity:0}}
.gem{border-radius:18px;padding:5px;transition:transform .35s cubic-bezier(.3,1.4,.5,1),opacity .25s}
.gem>div{width:100%;height:100%;border-radius:13px;display:flex;align-items:center;justify-content:center}
.gem svg{width:72px;height:72px}

.combo{position:absolute;left:30px;width:332px;top:20px;text-align:center;font-family:var(--f-num);font-size:50px;color:#ffe66d;text-shadow:0 4px 0 #b3361f,0 0 18px rgba(255,230,109,.9);z-index:5;pointer-events:none;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.connect{position:absolute;left:250px;top:250px;padding:4px 12px;border-radius:10px;background:#ff5fa2;color:#fff;font-family:var(--f-num);font-size:18px;transform:rotate(-6deg);box-shadow:0 0 14px #ff5fa2;z-index:5;animation:pop .35s}
.push{width:64px;height:64px;border-radius:50%;border:4px solid #d8c8ff;background:radial-gradient(circle at 35% 30%,#fff 0%,#c9a8ff 25%,#8a4dff 70%,#3a1a8a 100%);color:#fff;font-size:11px;font-weight:800;text-shadow:0 1px 2px #2a0a6a}
.cutin{animation:cutin .45s cubic-bezier(.2,1.4,.4,1) both}@keyframes cutin{from{transform:translateX(-500px)}}

<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script src="../../mg-core.js"></script>
<script src="../sp-engine.js"></script>
<script>const ASSET='assets/', SP_LOBBY='../';</script>
<script src="../sp-pad.js"></script>
<script>
'use strict';
Object.assign(BGM,{wide:'bgm_wide.mp3',wide_fs:'bgm_wide_fs.mp3'});
// ワイドライン(モンスター)の絵柄は画像(${ASSET}wl_*.webp)。WILDだけ盾の上に文字をのせる
['wl_dragon','wl_mimic','wl_golem','wl_ghost','wl_skeleton','wl_mushroom','wl_bat','wl_fluff','wl_flower','wl_chick','wl_egg','wl_wild'].forEach(k=>{ SYM[k]=`<image href="${ASSET}${k}.webp" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid meet"/>`; });
SYM.wl_wild+='<text x="50" y="56.5" text-anchor="middle" font-family="Dela Gothic One,sans-serif" font-size="15" fill="#fff6d0" stroke="#5a0d0d" stroke-width="3" paint-order="stroke">WILD</text>';
const WM={seven:'wl_dragon',crown:'wl_mimic',gem:'wl_golem',bell:'wl_ghost',bar:'wl_skeleton',melon:'wl_mushroom',grape:'wl_bat',orange:'wl_fluff',cherry:'wl_flower',lemon:'wl_chick',star:'wl_egg',wild:'wl_wild'};

/* ---------- 演出画面(ステージ) ----------
   リールの上に出す予告のアニメ。期待度は 青<緑<赤<金<虹(画面に数字や名前は出さない。出てくるもので伝える)。
   動かすのは transform / opacity だけ(iPadでもなめらか)。新しい絵は使わず、今ある wl_*.webp だけで動く。
   途中でエラーが出てもゲームは止めない(DLS の関数はぜんぶ try/catch ずみ)。 */
const DLS_H=210, DLS_REEL_SCALE=.82; // 演出画面の高さ(px)／リールを何倍に縮めるか(1で今のまま)
const DLS=(()=>{
  const A=ASSET, TAU=Math.PI*2, ok=typeof Element!=='undefined'&&!!Element.prototype.animate;
  const wait=ms=>new Promise(r=>setTimeout(r,ms)), rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
  let root,world,actors,cv,cx,fl,tn,rays,txt,W=680,H=DLS_H,G=27,D=204,tok=0,raf=0,last=0,dpr=1,hero=null,boss=null,egg=null,pals=[],temp=[],strips=[],parts=[],sprites={};
  const live=t=>t===tok&&!!root&&root.isConnected;
  const tf=(x,y,s,r,sx)=>`translate(${x}px,${-y}px) translateX(-50%) rotate(${r||0}deg) scale(${(s==null?1:s)*(sx||1)},${s==null?1:s})`;
  const snd=n=>{ try{ if(typeof sfx!=='undefined'&&sfx[n]) sfx[n](); }catch(e){} };
  const an=(el,kf,o)=>{ try{ const a=el.animate(kf,Object.assign({duration:400,easing:'ease-out',fill:'both'},o)); return a.finished.then(()=>a,()=>a); }catch(e){ return Promise.resolve(); } };

  /* --- 背景(横にながれる草原・丘・お城・雲)。1枚の絵を2つ並べて、1画面ぶん動かすとつながる --- */
  const per=(w,h,base,amp,k,ph)=>{ let d=`M0,${h} L0,${(base+amp*Math.sin(ph)).toFixed(1)}`; for(let i=1;i<=48;i++) d+=` L${(w*i/48).toFixed(1)},${(base+amp*Math.sin(TAU*k*i/48+ph)).toFixed(1)}`; return d+` L${w},${h} Z`; };
  const castle=(x,y,s)=>{ const u=s/10; return `<g fill="#b9b4e0"><rect x="${x-5*u}" y="${y-5*u}" width="${10*u}" height="${5*u}"/><rect x="${x-6*u}" y="${y-8*u}" width="${3*u}" height="${8*u}"/><rect x="${x+3*u}" y="${y-8*u}" width="${3*u}" height="${8*u}"/><rect x="${x-1.5*u}" y="${y-10*u}" width="${3*u}" height="${10*u}"/></g><g fill="#a29cd2"><polygon points="${x-6.4*u},${y-8*u} ${x-4.5*u},${y-11*u} ${x-2.6*u},${y-8*u}"/><polygon points="${x+2.6*u},${y-8*u} ${x+4.5*u},${y-11*u} ${x+6.4*u},${y-8*u}"/><polygon points="${x-1.9*u},${y-10*u} ${x},${y-13.5*u} ${x+1.9*u},${y-10*u}"/></g>`; };

  function emit(n,mk){ n=Math.min(n,260-parts.length); for(let i=0;i<n;i++) parts.push(mk(i)); if(!raf&&root&&root.isConnected) raf=requestAnimationFrame(tick); }

  /* --- 結果(リールが止まったあと) --- */
  function settle(t){ if(!live(t)) return; tintTo('#000',0,600); raysTo(0,600); speed(1);
    setTimeout(()=>{ if(!live(t)) return; pose('wl_dragon_stand'); slide(hero,D,300); temp.forEach(e=>an(e,[{opacity:1},{opacity:0}],{duration:450})); setTimeout(()=>{ if(t===tok) clean(); },500); },500); }
  async function hatch(t,d){ // たまごがかえって、フリースピン確定
    if(!egg){ egg=spawn('wl_egg',{x:Math.round(W*.55),y:Math.round(H*.36),h:Math.round(H*.32),z:8,fly:1}); popIn(egg,300); await wait(300); if(!live(t)) return; }
    const e=egg, x=e._x, y=e._y, cy=H-(y+e._h/2); pose('wl_dragon_win');
    an(e,[{transform:tf(x,y,1,0)},{transform:tf(x,y,1.08,-14)},{transform:tf(x,y,1.1,12)},{transform:tf(x,y,1.12,-10)},{transform:tf(x,y,1.14,8)},{transform:tf(x,y,1.2,0)}],{duration:900,easing:'ease-in-out'});
    shake(2,900); sparks(x,cy,10,['#fff6c0','#ffd84d'],80);
    await wait(880); if(!live(t)) return;
    flashing(1,700,'#fff'); shake(9,450); e.remove(); egg=null; ring(x,cy,70,'#fff'); ring(x,cy,40,'#ffd84d'); confetti(70); sparks(x,cy,24,['#fff','#ffd84d','#6dd5ff'],200); heroJump(44,700);
    banner(`FREE SPIN ${d.fsAdd||''}回!`,{size:40,dur:1600,rb:true}); await wait(1500); }
  async function result(d,tier,B){ if(!ok||!root) return; const t=tok;
    if(d.fsStart){ await hatch(t,d); return settle(t); }
    if((d.pay||0)>0){ const r=(d.pay||0)/(B||1); pose('wl_dragon_win'); heroJump(30,520); sparks(hero._x,H*.5,12+Math.min(30,Math.round(r*3)),['#ffe27a','#fff'],140); if(r>=3) coins(Math.min(60,10+Math.round(r*4)));
      if(boss){ const b=boss; boss=null; flashing(.5,260,'#fff'); sparks(b._x,H*.45,18,['#fff','#ffd84d'],170); an(b,[{transform:tf(b._x,b._y),opacity:1},{transform:tf(b._x+60,b._y+H*.9,.5,480),opacity:0}],{duration:650,easing:'ease-in'}); }
      await wait(900); }
    else if(boss&&tier>=2){ const b=boss; boss=null; an(b,[{transform:tf(b._x,b._y)},{transform:tf(W+160,b._y)}],{duration:700,easing:'ease-in'}); mark(hero,'…'); slide(hero,D,300); await wait(700); }
    settle(t); }

  /* --- 期待度のえらび方：実際の結果に合わせて、強い予告ほど当たりやすい(ハズレでも赤・金が出ることがある) --- */
  function pickTier(d,B){ const r=Math.random()*100, w=a=>{ let s=0; for(let i=0;i<a.length;i++){ s+=a[i]; if(r<s) return i; } return a.length-1; }; // 青,緑,赤,金,虹
    if(d.fsStart) return (d.stars||0)>=5?4:w([0,0,15,50,35]);
    if(d.fsMore) return w([0,0,25,50,25]);
    if((d.pay||0)>=B*10) return w([0,5,35,40,20]);
    if((d.stars||0)===2) return w([20,35,30,15,0]);
    if((d.pay||0)>0) return w([35,40,20,5,0]);
    return w([62,26,10,2,0]); }

  /* --- 外から使う口 --- */
  function mount(el){ root=el; if(!ok||!root) return;
    try{ const st=document.getElementById('stage')||document.body, cab=root.closest('.cab'); if(cab){ let top=0; for(let e=cab;e&&e!==st;e=e.offsetParent) top+=e.offsetTop; const free=820-12-(top+cab.offsetHeight); if(free>0) root.style.height=(root.offsetHeight+free)+'px'; } }catch(e){} // 下の段を小さくしてあいたぶん、演出画面を高くする
    for(let n=0;n<4;n++){ let over=0; for(let e=root.parentElement;e&&e!==document.body&&e!==document.documentElement;e=e.parentElement) over=Math.max(over,e.scrollHeight-e.clientHeight); if(over<=1||root.offsetHeight<=120) break; root.style.height=Math.max(120,root.offsetHeight-over)+'px'; } // 画面からはみ出すぶんだけ低くする
    W=root.clientWidth||680; H=root.clientHeight||DLS_H; G=Math.round(H*.13); D=Math.round(W*.3); dpr=Math.min(2,window.devicePixelRatio||1);
    const S=Math.round(Math.max(W,H)*2.4);
    root.insertAdjacentHTML('afterbegin',`<div class="dls-world"><div class="dls-strip" data-s="clouds"></div><div class="dls-strip" data-s="far"></div><div class="dls-strip" data-s="near"></div><div class="dls-strip" data-s="grass"></div><div class="dls-rays"><i style="left:${Math.round(W*.5-S/2)}px;top:${Math.round(H*.62-S/2)}px;width:${S}px;height:${S}px"></i></div><div class="dls-actors"></div></div><div class="dls-tint"></div><canvas class="dls-fx"></canvas><div class="dls-flash"></div><div class="dls-txt"></div>`);
    world=root.querySelector('.dls-world'); actors=root.querySelector('.dls-actors'); tn=root.querySelector('.dls-tint'); rays=root.querySelector('.dls-rays'); fl=root.querySelector('.dls-flash'); txt=root.querySelector('.dls-txt'); cv=root.querySelector('.dls-fx');
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cx=cv.getContext('2d');
    const def={clouds:[H*.5,cloudSvg,150000],far:[H*.66,farSvg,95000],near:[H*.42,nearSvg,40000],grass:[G+18,grassSvg,9500]}; strips=[];
    world.querySelectorAll('.dls-strip').forEach(s=>{ const [hh,fn,dur]=def[s.dataset.s], h=Math.round(hh); s.style.width=2*W+'px'; s.style.height=h+'px'; s.innerHTML=fn(W,h)+fn(W,h);
      strips.push(s.animate([{transform:'translateX(0)'},{transform:`translateX(${-W}px)`}],{duration:dur,iterations:Infinity,easing:'linear'})); });
    paint(); temp=[]; boss=egg=null; mkHero(); }
  /* 絵の背景：assets/st_far.webp(つなぎ目なしの横長の風景)があればそれ、なければ wl_bg.webp を左右反転でつないで流す。
     assets/st_near.webp(地面・草の帯、透明)があれば、いちばん手前の草の帯のかわりに使う */
  function paint(){ const load=src=>new Promise(r=>{ const im=new Image(); im.onload=()=>r(im); im.onerror=()=>r(null); im.src=src; });
    const lay=(im,h,top,bottom,pxs,before)=>{ const tw=Math.round(h*im.naturalWidth/im.naturalHeight), d=document.createElement('div'); d.className='dls-paint'; d.style.height=h+'px'; if(bottom!=null) d.style.bottom=bottom+'px'; else d.style.top=top+'px';
      for(let i=0;i<4;i++){ const t=new Image(); t.src=im.src; t.alt=''; t.style.width=tw+'px'; t.style.height=h+'px'; if(i%2) t.className='fl'; d.appendChild(t); }
      world.insertBefore(d,before); const a=d.animate([{transform:'translateX(0)'},{transform:`translateX(${-2*tw}px)`}],{duration:Math.round(2*tw/pxs*1000),iterations:Infinity,easing:'linear'}); strips.push(a); return d; };
    load(A+'st_far.webp').then(im=>im?[im,1]:load(A+'wl_bg.webp').then(b=>b?[b,0]:null)).then(r=>{ if(!r||!world) return; const [im,own]=r, keep=s=>world.querySelector(`.dls-strip[data-s=${s}]`);
      const h=Math.round(own?H*1.04:H*1.5); lay(im,h,own?0:-Math.round(H*.2),null,own?14:12,keep('grass'));
      ['clouds','far','near'].forEach(s=>{ const e=keep(s); if(e){ const i=[...world.querySelectorAll('.dls-strip')].indexOf(e); e.remove(); } });
      strips=strips.filter(a=>a.effect&&a.effect.target&&a.effect.target.isConnected); })
    .then(()=>load(A+'st_near.webp')).then(im=>{ if(!im||!world) return; const g=world.querySelector('.dls-strip[data-s=grass]'); lay(im,Math.round(G*2.2),null,0,75,world.querySelector('.dls-rays')); if(g){ g.remove(); strips=strips.filter(a=>a.effect&&a.effect.target&&a.effect.target.isConnected); } }); }
  function begin(){ if(!ok||!root) return; tok++; clean(); tintTo('#000',0,200); raysTo(0,200); speed(1.7); parts.length=0; if(cx) cx.clearRect(0,0,W,H); txt.textContent=''; pose('wl_dragon_stand'); slide(hero,D,200); }
  async function yokoku(tier,fs){ if(!ok||!root) return; const t=tok; await SC[tier](t,fs?.55:1); }
  function reach(){ if(!ok||!root) return; mark(hero,'！'); flashing(.25,300,'#ffe7a0'); ring(W*.5,H*.4,44,'#ffd84d'); }
  function abort(){ if(ok&&root) settle(tok); }
  const safe=f=>function(){ try{ const r=f.apply(null,arguments); return (r&&r.catch)?r.catch(e=>console.warn('stage',e)):r; }catch(e){ console.warn('stage',e); } };
  return { on:()=>ok&&!!root, mount:safe(mount), begin:safe(begin), yokoku:safe(yokoku), reach:safe(reach), result:safe(result), abort:safe(abort), pick:pickTier };
})();

/* ---------- ③ ワイドライン ---------- */
MACH.wide={
  pool:['seven','crown','gem','bell','bar','melon','grape','orange','cherry','lemon','star'].map(k=>WM[k]),
  fsPool:['seven','crown','gem','bell','bar','melon','grape','orange','cherry','lemon','star','wild'].map(k=>WM[k]),
  open(){
    const W=SP.consts.W_PAY, N=SP.consts.W_FSN, f=v=>+v.toFixed(1);
    Object.values(WM).concat(['wl_dragon_stand','wl_dragon_win']).forEach(k=>{ const im=new Image(); im.src=`${ASSET}${k}.webp`; }); // 先に読みこむ
    screen('th-wide',
      `<div class="topper"><img src="${ASSET}wl_egg.webp" alt=""><div class="logo">DRAGON LEGION</div><img src="${ASSET}wl_egg.webp" alt=""></div>
       <div class="bezel"><div class="lcd" id="lcd"><div class="dlstage" id="dlstage"><div class="fsbar" id="fsbar"></div></div><div class="rwrap" id="rwrap"><div class="rrow" id="rw">${'<div class="reel"></div>'.repeat(5)}</div></div></div></div>
       ${ledsHtml([['CREDIT','ledCred',G.cred],['BET','ledBet',1],['WIN','ledWin',0]])}
       <div class="deck" style="height:66px;gap:9px">${betBox('wide')}<button class="auto" id="bAuto">AUTO</button><span style="flex:1"></span><button class="rbtn" id="bSpin" style="--b1:#ff9a6b;--b2:#e2452c;--b3:#8a1c0c;--glow:rgba(255,120,80,.9)" aria-label="スピン">SPIN</button></div>
       ${trayHtml(6)}`,
      `<h3>モンスターの配当</h3><p style="text-align:center">BETの何倍か</p><div class="wpt"><span></span><b>3体</b><b>4体</b><b>5体</b>${Object.keys(W).map(k=>`${sym(WM[k])}<span>${f(W[k][3])}</span><span>${f(W[k][4])}</span><span>${f(W[k][5])}</span>`).join('')}</div>
       <div class="row">${sym('wl_egg')}<span style="font-size:11px">3/4/5こ</span><span class="v">FREE ${N[3]}/${N[4]}/${N[5]}回</span></div><p>左のリールから、となりの列のどこかにいればつながる。同じ列に2体なら2通り分。フリースピン中は${sym('wl_wild',18)}WILDが出て、WILDを含む当たりは配当2倍。たまごで回数上乗せ。</p>`,
      `<img class="guide" id="wGuide" src="${ASSET}wl_dragon_stand.webp" alt=""><div class="rpgw say" id="wSay">たまごを3つあつめて、フリースピンだ！</div><div class="rpgw"><h3>フリースピン</h3><div id="fsd"></div></div>`);
    document.querySelector('.th-wide .side.l').classList.add('rpgw');
    this.reels=[...$('#rw').querySelectorAll('.reel')];
    this.reels.forEach((el,i)=>makeReel(el,88,126,80,[this.pool[(i+1)%11],this.pool[(i+4)%11],this.pool[(i+7)%11]]));
    // リールを少し縮めて演出画面の場所をつくる(縮めたぶんの空きは詰める)。そのあと演出画面を取りつける
    const rwp=$('#rwrap'); if(rwp&&DLS_REEL_SCALE<1){ const h=rwp.offsetHeight||264; rwp.style.transform=`scale(${DLS_REEL_SCALE})`; rwp.style.marginBottom=(-h*(1-DLS_REEL_SCALE))+'px'; }
    DLS.mount($('#dlstage'));
    bindBet('wide',()=>!!this.fs()||(G.busy&&this.wasFs));
    $('#bSpin').onclick=()=>this.spin(); $('#bAuto').onclick=()=>toggleAuto(this);
    this.upd();
  },
  say(t){ const e=$('#wSay'); if(e) e.textContent=t; },
  cutin(text){ const lcd=$('#lcd'); if(!lcd) return; const c=document.createElement('div'); c.className='cutin'; c.innerHTML=`<img src="${ASSET}wl_dragon_win.webp" alt=""><span>${text}</span>`; lcd.appendChild(c); setTimeout(()=>c.remove(),1900); },
  fs(){ return (G.st.wide||{}).fs||0; },
  restore(){ this.upd(); const scr=G.scr; if(this.fs()) setTimeout(()=>{ if(G.mid==='wide'&&G.scr===scr&&!G.busy&&!G.after&&this.fs()) this.spin(); },900); }, // フリースピンの続きは自動で
  upd(){ if(!$('#bSpin')) return; const fs=this.fs(), s=G.st.wide||{};
    updBet('wide',!!fs,fs?s.fsBet:(G.busy&&this.bet?this.bet:G.bet.wide));
    $('#bAuto').classList.toggle('on',G.auto); $('#bSpin').disabled=G.busy||(!fs&&G.cred<G.bet.wide);
    const bar=$('#fsbar'); bar.classList.toggle('on',!!fs);
    bar.innerHTML=fs?`<b>FREE SPIN</b><span>のこり ${fs}回</span><span style="padding:2px 10px;border-radius:999px;background:#ffd84d;color:#3a1800">WILDで配当 ×2</span>`:'<b>243 WAYS</b><span>たまごが3つでフリースピン</span>';
    if(G.mid==='wide') bgmPlay('wide');
    $('#fsd').innerHTML=`<div class="dat"><span>のこり</span><b>${fs}回</b></div><div class="dat"><span>獲得</span><b>+${s.fsWin||0}</b></div><p>たまご3こで10回・4こで15回・5こで20回。フリースピン中もたまごで上乗せ。BETは入ったときのまま。</p>`; },
  async spin(){
    if(G.busy) return; const fs=this.fs(), bet=G.bet.wide; if(!fs&&G.cred<bet){ G.auto=false; this.upd(); return toast('メダルが足りません'); }
    this.bet=fs?(G.st.wide||{}).fsBet:bet; this.wasFs=!!fs;
    begin(fs?0:bet); $('#ledWin').textContent=0; document.querySelectorAll('.hl').forEach(x=>x.remove()); this.upd(); sfx.spin();
    const pool=fs?this.fsPool:this.pool; spinStart(this.reels,pool); const t0=Date.now();
    DLS.begin();
    const d=await play('wide',{bet});
    if(!d){ DLS.abort(); this.reels.forEach(el=>{ drawCol(el,el._cur,0); el.classList.remove('blur'); }); G.busy=false; G.hold=false; G.cred=seatA()||0; updTop(); this.upd(); return; }
    await sleep(Math.max(0,450-(Date.now()-t0)));
    const B=d.free?(d.fsBet||bet):bet, tier=DLS.pick(d,B); // 期待度(0青 1緑 2赤 3金 4虹)
    if(DLS.on()) await DLS.yokoku(tier,!!fs); // 予告：リールが回っている間に演出画面で何かが起こる(強いほど長い)
    for(let i=0;i<5;i++){ const col=[0,1,2].map(r=>WM[d.grid[r][i]]||d.grid[r][i]);
      if(i===3&&d.starCells.filter(c=>c[1]<3).length>=2){ this.say('たまごが2つ…！あと1つ！'); DLS.reach(); }
      await spinStop(this.reels[i],col,pool,i===0?600:220+(i>=3&&d.starCells.filter(c=>c[1]<i).length>=2?700:0)); }
    const lcd=$('#lcd'), cellsSeen={}; // BIG WIN はこの回のBETの10倍以上(B は上で決めている)
    const stRes=DLS.on()?DLS.result(d,tier,B):null; // 演出画面の結果(当たりの喜び・ボスをたおす・たまごがかえる)。下のメッセージと同時に流れる
    const mark=(r,c)=>{ const k=r+','+c; if(cellsSeen[k]) return; cellsSeen[k]=1; const el=this.reels[c]; const d2=document.createElement('div'); d2.className='hl'+(d.grid[r][c]==='wild'?' wd':'');
      d2.style.left=el.offsetLeft+'px'; d2.style.top=(el.offsetTop+r*88)+'px'; d2.style.width='126px'; d2.style.height='88px'; (el.offsetParent||lcd).appendChild(d2);
      // そろった絵柄を動かす(モンスター=跳ねる、たまご=ゆれる、WILD=光る)
      const cell=el.querySelectorAll('.cell')[r], k2=d.grid[r][c]; if(cell) cell.classList.add(k2==='star'?'eg':k2==='wild'?'wd':'mv'); };
    d.wins.forEach(w=>w.cells.forEach(([r,c])=>mark(r,c))); if(d.stars>=3) d.starCells.forEach(([r,c])=>mark(r,c));
    if(d.pay>0){ $('#ledWin').textContent=d.pay; sfx.win(); }
    if(d.pay>=B*10&&!d.fsStart){ sfx.big(); this.cutin(`BIG WIN! +${d.pay}`); this.say('やったー！大当たりだ！'); await sleep(1600); }
    else if(d.pay>0&&d.wins.length){ const w=d.wins.slice().sort((a,b)=>b.x-a.x)[0]; const m=document.createElement('div'); m.className='wmsg'; m.innerHTML=`${sym(WM[w.sym],28)}<b>${w.n}体</b>${w.ways>1?`<span>×${w.ways}通り</span>`:''}${w.wild?'<span class="w">WILD ×2</span>':''}<b>+${d.pay}</b>`; lcd.appendChild(m); setTimeout(()=>m.remove(),1800); this.say(w.n>=5?'5体そろった！すごい！':w.n>=4?'4体つながった！いいぞ！':'モンスターがつながった！'); }
    else if(!fs) this.say(['つぎはいけるよ！','たまごを3つあつめよう！','ドキドキするね！'][Math.floor(Math.random()*3)]);
    if(d.fsStart){ sfx.big(); if(!DLS.on()) this.cutin(`FREE SPIN ${d.fsAdd}回!`); this.say('たまごがかえった！フリースピンだ！'); await (DLS.on()?stRes:sleep(1800)); } // 演出画面があれば、たまごがかえる演出がカットインのかわり
    if(d.fsMore){ sfx.big(); winText(lcd,`+${d.fsAdd}回 上乗せ!`,130); this.say(`+${d.fsAdd}回 上乗せ！まだまだいくぞ！`); await sleep(1100); }
    if(d.fsEnd){ winText(lcd,`フリースピン終了 +${d.fsWin}`,150); this.say(`フリースピンで +${d.fsWin}枚 ゲット！`); await sleep(1200); }
    await finish(d); this.upd();
    const scr=G.scr; if(this.fs()) setTimeout(()=>{ if(!G.busy&&!G.after&&G.mid==='wide'&&G.scr===scr) this.spin(); },d.fsStart?900:700); else autoNext(()=>this.spin());
  }
};


['wide'].forEach(k=>{ const M=MACH[k], f=M.spin; M.spin=async function(){ try{ return await f.apply(this,arguments); }catch(e){ DLS.abort(); recover(e); } }; });

/* ---------- はじめる ---------- */
// 台のページは iPad 専用。?mg= がないとき(先生のPCなど)は、ロビー(先生の稼働画面)のページへ
if(MG.qs.get('mg')){ G.mid='wide'; padMain(); } else location.replace(SP_LOBBY+location.search);
