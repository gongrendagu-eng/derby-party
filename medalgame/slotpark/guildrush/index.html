<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スロットパーク GUILD RUSH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Orbitron:wght@700;900&family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<link rel="stylesheet" href="../sp-pad.css">
<style>
/* ② 目押し */
.th-oshi{--body:linear-gradient(90deg,#111114 0%,#2c2c33 20%,#3a3a42 50%,#2c2c33 80%,#111114 100%);--deck:linear-gradient(180deg,#1a1a1f,#2c2c33);--led:#ffb02e;--ledbox:#0d0d10;--ledlbl:#b9b2a2;--tray:linear-gradient(180deg,#0d0d10,#26262c);background:#ece6da;--tb-line:#d9d1c2;--tb-ttl:#26262c;--tb-btnc:#26262c}
.th-oshi .cab{border-radius:16px 16px 8px 8px}
.th-oshi .topper{height:110px;border-radius:0;border:2px solid #b08a3e;background:linear-gradient(180deg,#f6ecd2,#e3cf9f);flex-direction:column;gap:4px}
.th-oshi .logo{font-family:var(--f-min);font-weight:800;font-size:38px;letter-spacing:10px;color:#26262c}
.th-oshi .rwin{border-radius:0;background:#0d0d10}
.th-oshi .reel{border-radius:0;background:#fffef9}
.th-oshi .side.l{background:#fbf8f1;border:1px solid #b08a3e;border-radius:0;margin-top:130px;font-family:var(--f-chic)}.th-oshi .side h3{font-family:var(--f-min);font-weight:800}
.th-oshi .side.r{background:#121215;border-top:4px solid #b08a3e;border-radius:0;color:#b9b2a2;margin-top:130px}.th-oshi .side.r .dat{background:#1e1e23;border-radius:0}.th-oshi .side.r .dat b{color:#ffb02e}
.golamp{display:flex;align-items:center;gap:8px;font-family:var(--f-min);font-weight:800;font-size:14px;letter-spacing:4px;color:#7a6a4a}
.golamp i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#999,#444);border:2px solid #b08a3e}
.golamp.on{color:#b3001b}.golamp.on i{background:radial-gradient(circle at 35% 30%,#fff 0%,#ff6b6b 30%,#d00 80%);box-shadow:0 0 18px #ff3b3b,0 0 40px #ff3b3b}
/* パチスロ共通 */
.lever{position:relative;width:70px;height:96px;flex-shrink:0}
.lever .stick{position:absolute;left:30px;top:30px;width:10px;height:62px;border-radius:5px;background:linear-gradient(90deg,#8a8d94,#e9ebef,#8a8d94)}
.lever button{position:absolute;left:11px;top:0;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#ff7a7a 25%,#c41e1e 70%,#6e0b0b 100%);box-shadow:0 4px 8px rgba(0,0,0,.5);transition:transform .12s}
.lever button:active:not(:disabled){transform:translateY(18px)}
.lever button:disabled{filter:grayscale(.6)}
.stopb{width:74px;height:74px;border-radius:50%;font-family:var(--f-min);font-weight:800;font-size:22px;border:3px solid #55555f;background:radial-gradient(circle at 35% 30%,#6a6a72,#2c2c33);color:#8a8780}
.stopb.on{border-color:#e6c37a;background:radial-gradient(circle at 35% 30%,#fff 0%,#ffe9a8 30%,#e0b23a 100%);color:#26262c;box-shadow:0 0 14px rgba(255,210,63,.8)}
@keyframes wlhop{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-9px) scale(.95,1.06)}55%{transform:translateY(0) scale(1,1)}70%{transform:translateY(0) scale(1.1,.88)}85%{transform:translateY(0) scale(.97,1.03)}100%{transform:translateY(0) scale(1,1)}}
.betbox{display:flex;align-items:center;gap:6px;padding:6px;border-radius:14px;background:rgba(0,0,0,.28);flex-shrink:0}
.betbox .bb{width:46px;height:52px;border-radius:10px;background:linear-gradient(180deg,#fff,#e8e2da);color:#3a2a3f;font-size:24px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.betbox .bb.max{width:56px;font-size:14px;background:linear-gradient(180deg,#fff3b0,#ffd23f);color:#4a3500}
.betbox .bb:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.betbox .bv{min-width:92px;height:52px;padding:0 8px;border-radius:10px;background:#100a0c;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.betbox .bv small{font-size:10px;font-weight:800;letter-spacing:2px;color:#d8c8cc}
.betbox .bv b{font-family:var(--f-led);font-size:26px;font-weight:900;color:var(--led,#ff4a2e);text-shadow:0 0 8px var(--led,#ff4a2e)}
.betbox button:disabled{opacity:.45}
.auto.on::after{content:" ■"}
.rev{position:absolute;inset:0;z-index:7;overflow:hidden;animation:rev .35s ease-out both}
.rev img{width:100%;height:100%;object-fit:cover;display:block;animation:revz 3.5s ease-out both}
@keyframes rev{from{opacity:0}}@keyframes revz{from{transform:scale(1.18)}}
.rev.out{animation:revout .5s ease-in forwards}@keyframes revout{to{opacity:0}}
.reach{position:absolute;right:16px;top:20px;padding:6px 18px;background:#e6c37a;color:#2e1a1d;font-family:var(--f-min);font-weight:800;font-size:26px;letter-spacing:6px;transform:rotate(6deg);box-shadow:0 4px 10px rgba(0,0,0,.5);z-index:4;animation:pop .3s}
.gem{border-radius:18px;padding:5px;transition:transform .35s cubic-bezier(.3,1.4,.5,1),opacity .25s}
.gem>div{width:100%;height:100%;border-radius:13px;display:flex;align-items:center;justify-content:center}
.gem svg{width:72px;height:72px}
.gem.hit{box-shadow:0 0 18px #ffe66d;animation:blink .25s steps(1) 4}
.gem.gone{transform:scale(.2);opacity:0}
.combo{position:absolute;left:30px;width:332px;top:20px;text-align:center;font-family:var(--f-num);font-size:50px;color:#ffe66d;text-shadow:0 4px 0 #b3361f,0 0 18px rgba(255,230,109,.9);z-index:5;pointer-events:none;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.connect{position:absolute;left:250px;top:250px;padding:4px 12px;border-radius:10px;background:#ff5fa2;color:#fff;font-family:var(--f-num);font-size:18px;transform:rotate(-6deg);box-shadow:0 0 14px #ff5fa2;z-index:5;animation:pop .35s}
/* ⑦ KAGUYA(シック・ネオン) */
.th-battle{--body:linear-gradient(90deg,#04050d 0%,#121736 18%,#1b2150 50%,#121736 82%,#04050d 100%);--deck:linear-gradient(180deg,#0a0d22,#151a3c);--led:#5ff3ff;--ledbox:#04050d;--ledlbl:#9fa8e0;--tray:linear-gradient(180deg,#04050d,#191e44);background:radial-gradient(ellipse at 50% 0%,#2b2166 0%,#0d1024 60%,#05060e 100%);--tb-line:#3a3f7a;--tb-ttl:#3b2a9a;--tb-btnc:#2b1f7a}
.th-battle .cab{padding:8px 24px 10px;border-radius:14px 14px 8px 8px;gap:6px;box-shadow:0 0 0 2px rgba(95,243,255,.35),0 0 34px rgba(150,100,255,.45),0 10px 24px rgba(0,0,0,.6)}
.ktop{height:28px;display:flex;align-items:center;justify-content:center;gap:16px;border-bottom:1px solid rgba(95,243,255,.25)}
.ktop .kl{font-family:var(--f-led);font-weight:900;font-size:25px;letter-spacing:12px;color:#f1eeff;text-shadow:0 0 8px #a46bff,0 0 18px #5ff3ff}
.ktop .ks{font-family:var(--f-min);font-weight:800;font-size:15px;letter-spacing:6px;color:#c9b8ff}
.ledbar{position:absolute;top:30px;bottom:60px;width:8px;border-radius:4px;background:linear-gradient(180deg,#5ff3ff,#a46bff 30%,#5ff3ff 60%,#a46bff);box-shadow:0 0 12px #a46bff}
.ledbar.hot{animation:flash .3s steps(2) infinite}
.lcdwrap{padding:7px;border-radius:10px;background:linear-gradient(180deg,#8a90b8 0%,#2a2f52 45%,#5a6090 55%,#1d2140 100%)}
.lcd2{position:relative;height:250px;border-radius:4px;overflow:hidden;background:#070a1c}
.th-battle .rwin{border-radius:0;background:#05060e;padding:6px}
.th-battle .reel{border-radius:0}
.th-battle .side.l{background:#0d1130;border:1px solid rgba(95,243,255,.4);border-radius:0;color:#cfd6ff;margin-top:50px;font-family:var(--f-chic)}
.th-battle .side.l h3{color:#5ff3ff;font-family:var(--f-chic);font-weight:700;font-size:14px;letter-spacing:2px}
.th-battle .side.r{background:#070915;border-top:3px solid #a46bff;border-radius:0;color:#9fa8e0;margin-top:50px}.th-battle .side.r .dat{background:#121633;border-radius:0}.th-battle .side.r .dat b{color:#5ff3ff}
.th-battle .side .row,.th-battle .side .dat{border-color:rgba(255,255,255,.1)}
.th-battle .stopb{border-color:#3a3f7a;background:radial-gradient(circle at 35% 30%,#3a3f6a,#12152e);color:#6a70a0}
.th-battle .stopb.on{border-color:#bff9ff;background:radial-gradient(circle at 35% 30%,#fff 0%,#9ff7ff 30%,#2fb5d6 100%);color:#08122a;box-shadow:0 0 16px rgba(95,243,255,.9)}
.push{width:64px;height:64px;border-radius:50%;border:4px solid #d8c8ff;background:radial-gradient(circle at 35% 30%,#fff 0%,#c9a8ff 25%,#8a4dff 70%,#3a1a8a 100%);color:#fff;font-size:11px;font-weight:800;text-shadow:0 1px 2px #2a0a6a}
.push.ready{animation:pushg .5s ease-in-out infinite alternate}
@keyframes pushg{to{box-shadow:0 0 26px #c9a8ff,0 0 50px #8a4dff;transform:scale(1.08)}}
/* KAGUYAの液晶 */
.kbg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 115%,#2c1f70 0%,#0b0d26 55%,#05060f 100%)}
.ktint{position:absolute;inset:0;opacity:.85}
.kmoon{position:absolute;right:64px;top:20px;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fffdf0 0%,#e9e3ff 55%,#a99cff 100%);box-shadow:0 0 34px #b9b0ff,0 0 80px #6a4cff;opacity:.92}
.kgrid{position:absolute;left:-30%;right:-30%;bottom:-6px;height:96px;background-image:linear-gradient(rgba(95,243,255,.45) 1px,transparent 1px),linear-gradient(90deg,rgba(164,107,255,.45) 1px,transparent 1px);background-size:44px 22px;transform:perspective(180px) rotateX(58deg);transform-origin:50% 100%}
@keyframes kgrid{to{background-position:0 22px}}
.kimg{position:absolute;pointer-events:none;-webkit-user-drag:none}
.breathe{animation:breathe 2.6s ease-in-out infinite alternate;transform-origin:50% 100%}@keyframes breathe{to{transform:scale(1.015) translateY(-2px)}}
.kslideL{animation:kslideL .45s cubic-bezier(.2,1.3,.4,1) both}@keyframes kslideL{from{transform:translateX(-110%);opacity:0}}
.kslideR{animation:kslideR .45s cubic-bezier(.2,1.3,.4,1) both}@keyframes kslideR{from{transform:translateX(110%);opacity:0}}
.kzoom{animation:kzoom .6s cubic-bezier(.2,1.4,.4,1) both}@keyframes kzoom{from{transform:scale(.4);opacity:0}}
.kface{position:absolute;width:142px;height:220px;border:3px solid #5ff3ff;overflow:hidden;transform:skewX(-7deg);box-shadow:0 0 18px rgba(95,243,255,.8);background:#000}
.kface img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;transform:skewX(7deg) scale(1.08)}
.kface.cut{animation:kface .4s cubic-bezier(.2,1.4,.4,1) both}@keyframes kface{from{transform:skewX(-7deg) translateX(-140%)}}
.klogo{position:absolute;font-family:var(--f-led);font-weight:900;font-size:34px;letter-spacing:10px;color:#f1eeff;text-shadow:0 0 8px #a46bff,0 0 22px #5ff3ff}
.ksub{position:absolute;font-family:var(--f-min);font-weight:800;font-size:16px;letter-spacing:8px;color:#c9b8ff}
.kflash{position:absolute;inset:0;background:#fff;animation:kflash .5s ease-out forwards;pointer-events:none;z-index:6}@keyframes kflash{to{opacity:0}}
.klunge{animation:klunge .3s cubic-bezier(.5,0,.8,1) forwards}@keyframes klunge{to{transform:translateX(-230px)}}
.khit{animation:khit .12s steps(2) 3;filter:brightness(2.2)}@keyframes khit{50%{transform:translateX(8px)}}
.krb{position:absolute;inset:0;background:linear-gradient(90deg,#ff4d6d,#ffd23f,#3ddc84,#3a86ff,#9d4edd,#ff4d6d);background-size:200% 100%;animation:krb 3s linear infinite}@keyframes krb{to{background-position:200% 0}}
.kdark{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(5,6,15,.92) 0%,rgba(5,6,15,.75) 40%,rgba(5,6,15,0) 75%)}
.sc .big.neon{text-shadow:0 0 10px #a46bff,0 0 24px #5ff3ff,0 4px 0 #1a0f4a}
.trust{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}.trust i{width:22px;height:22px;border-radius:6px;flex-shrink:0}
/* 液晶の演出 */
.sc{position:absolute;inset:0;overflow:hidden}
.sc .chr{position:absolute}
.sc .big{position:absolute;left:0;right:0;text-align:center;font-family:var(--f-num);color:#fff;z-index:3}
.sc .rays{position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(rgba(255,255,255,.22) 0 10deg,rgba(255,255,255,0) 10deg 30deg);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.walk{animation:walk 6s linear infinite}@keyframes walk{0%{transform:translateX(-160px)}100%{transform:translateX(760px)}}
.bob svg{animation:bob .5s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-8px)}}
.cloud{position:absolute;height:24px;border-radius:12px;background:#fff;animation:cloud 18s linear infinite}@keyframes cloud{from{transform:translateX(700px)}to{transform:translateX(-200px)}}
.shake{animation:shake .12s linear infinite}@keyframes shake{25%{transform:translate(3px,-2px)}75%{transform:translate(-3px,2px)}}
.knock{animation:knock .8s ease-in forwards}@keyframes knock{to{transform:translate(260px,-200px) rotate(540deg);opacity:0}}
.knockL{animation:knockL .8s ease-in forwards}@keyframes knockL{to{transform:translate(-260px,-200px) rotate(-540deg);opacity:0}}
.band{position:absolute;left:-60px;right:-60px;top:80px;height:110px;background:#1a1a1f;transform:rotate(-8deg);animation:band .35s ease-out both}@keyframes band{from{transform:rotate(-8deg) translateX(-110%)}}
.cutin{animation:cutin .45s cubic-bezier(.2,1.4,.4,1) both}@keyframes cutin{from{transform:translateX(-500px)}}
.hp{position:absolute;top:10px;height:12px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden;width:280px}
.hp i{display:block;height:100%;border-radius:6px;transition:width 1.2s ease}
.rainbow{background:linear-gradient(135deg,#ff4d6d 0%,#ffd23f 25%,#3ddc84 50%,#3a86ff 75%,#9d4edd 100%);background-size:200% 200%;animation:rb 2s linear infinite}@keyframes rb{to{background-position:200% 200%}}
.meter{position:absolute;left:14px;right:14px;bottom:10px;display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:13px;z-index:4}
.meter .bar{flex:1;height:12px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden}
.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,#3a86ff,#3ddc84,#ff4d6d,#ffd23f)}
/* KAGUYAのリール(暗い地に光る絵柄) */
.th-battle .reel{background:linear-gradient(180deg,#0b0f2c 0%,#171d4a 50%,#0b0f2c 100%)}
.th-battle .reel::after{background:linear-gradient(180deg,rgba(3,4,12,.7) 0%,rgba(3,4,12,0) 26%,rgba(3,4,12,0) 74%,rgba(3,4,12,.7) 100%)}
.th-battle .reel .cell{border-bottom:1px solid rgba(95,243,255,.08)}
/* 月夜の荒野(ふだんの液晶) */
.wsky{position:absolute;inset:0;background:linear-gradient(180deg,#07081f 0%,#1c1650 45%,#4a2c72 72%,#a8577a 92%,#d7807a 100%)}
.wstars{position:absolute;left:0;right:0;top:0;height:150px;background-image:radial-gradient(1.5px 1.5px at 40px 30px,#fff,transparent),radial-gradient(1px 1px at 130px 70px,#fff,transparent),radial-gradient(1.5px 1.5px at 220px 20px,#dfe6ff,transparent),radial-gradient(1px 1px at 300px 90px,#fff,transparent),radial-gradient(1.5px 1.5px at 390px 44px,#fff,transparent),radial-gradient(1px 1px at 470px 16px,#cfe0ff,transparent),radial-gradient(1px 1px at 560px 110px,#fff,transparent),radial-gradient(1.5px 1.5px at 640px 60px,#fff,transparent);animation:twinkle 3s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.45}}
.wlay{position:absolute;left:0;right:0;overflow:hidden;pointer-events:none}
.wtrack{display:flex;width:max-content;height:100%;will-change:transform}
.wtrack img{display:block;flex-shrink:0;-webkit-user-drag:none}
.wlay[data-l="near"]{z-index:3}
.wdust i{position:absolute;left:740px;width:3px;height:3px;border-radius:50%;background:rgba(255,214,200,.55);animation:wdust 3s linear infinite}
@keyframes wdust{to{transform:translate(-800px,-30px)}}
.kwalker{position:absolute;z-index:2}
.kwalker img{display:block;transform-origin:50% 100%}
.kshadow{position:absolute;left:18%;right:18%;bottom:-4px;height:14px;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(2px);animation:kshadow .34s ease-in-out infinite alternate}
@keyframes kshadow{to{transform:scaleX(.88);opacity:.75}}
.kwbob{animation:kwbob .34s ease-in-out infinite alternate}
.kwsheet{width:155px;height:237px;background-size:800% 100%;background-repeat:no-repeat;animation:kwsheet .96s steps(8) infinite}
@keyframes kwsheet{from{background-position:0 0}to{background-position:114.2857% 0}}
@keyframes kwbob{from{transform:translateY(0) rotate(.6deg)}to{transform:translateY(-6px) rotate(-.6deg)}}
/* 動きの部品 */
.kfx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.kline{position:absolute;left:0;height:2px;border-radius:1px;background:linear-gradient(90deg,rgba(255,255,255,0),var(--c));animation:kline .4s linear infinite}
@keyframes kline{from{transform:translateX(780px)}to{transform:translateX(-260px)}}
.kpetal{position:absolute;top:-16px;width:11px;height:8px;border-radius:70% 0 70% 0;background:#ffc4dc;box-shadow:0 0 4px rgba(255,180,210,.8);animation:kpetal 3.6s linear infinite}
@keyframes kpetal{from{translate:0 0;rotate:0deg}to{translate:-180px 290px;rotate:600deg}}
.kspark{position:absolute;bottom:-6px;width:4px;height:4px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c);animation:kspark 1.6s ease-out infinite}
@keyframes kspark{from{transform:translateY(0);opacity:1}to{transform:translate(-30px,-230px);opacity:0}}
.kquake{animation:kquake .45s linear}
@keyframes kquake{10%{transform:translate(-6px,3px)}25%{transform:translate(6px,-4px)}40%{transform:translate(-5px,2px)}55%{transform:translate(4px,-2px)}70%{transform:translate(-2px,1px)}}
.kpulse{animation:kpulse .7s ease-in-out infinite alternate}
@keyframes kpulse{to{filter:brightness(1.35);scale:1.04}}
.kbreath{animation:breathe 1.3s ease-in-out infinite alternate;transform-origin:50% 100%}
/* ⑦ GUILD RUSH(冒険者ギルドRPG・5ライン・大液晶) */
.th-guild{--led:#ffd84d;--ledbox:#120c06;--ledlbl:#e9c98a;background:#120b07 radial-gradient(ellipse at 50% 0%,#3a2414 0%,#140c07 70%);--tb-line:#7a5426;--tb-ttl:#7a3e12;--tb-btnc:#5a3410}
.th-guild .topbar{background:#fff8ec}
.gscr{position:absolute;left:0;right:0;top:52px;bottom:0;padding:8px 20px 0;display:flex;flex-direction:column;gap:8px}
.glcdw{position:relative;height:448px;flex-shrink:0;padding:6px;border-radius:12px;background:linear-gradient(180deg,#f3d995 0%,#9a6a24 45%,#ecc874 55%,#6a4416 100%);box-shadow:0 0 0 2px #2a1808,0 8px 20px rgba(0,0,0,.6)}
.glcd{position:relative;width:100%;height:100%;border-radius:7px;overflow:hidden;background:#05040a}
.gbgs,.gstage,.gfx{position:absolute;inset:0;overflow:hidden}
.gbg{position:absolute;inset:-3% -7%;background-size:cover;background-position:center;transition:opacity .7s;animation:gpan 26s ease-in-out infinite alternate}
@keyframes gpan{from{transform:translateX(-4%) scale(1.02)}to{transform:translateX(4%) scale(1.07)}}
.gstage{z-index:2}.gfx{z-index:6;pointer-events:none}
.gbon .ghud,.gbon .grank{display:none}
.gdim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(0,0,0,0) 30%,rgba(0,0,0,.55) 100%);pointer-events:none}
/* 左上:階層 右上:ギルドランク */
.ghud{position:absolute;left:12px;top:10px;z-index:7;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.gfloor{display:flex;align-items:baseline;gap:8px;padding:3px 14px 3px 10px;border-radius:8px;background:rgba(10,8,20,.72);border:2px solid rgba(255,216,77,.65);color:#fff;font-weight:800;font-size:15px;text-shadow:0 1px 2px #000}
.gfloor b{font-family:var(--f-led);font-weight:900;font-size:22px;color:#ffd84d}
.gprog{width:200px;height:7px;border-radius:4px;background:rgba(0,0,0,.6);overflow:hidden;border:1px solid rgba(255,216,77,.4)}

<script>const ASSET='assets/', SP_LOBBY='../';</script>

<script>
'use strict';
Object.assign(BGM,{battle:'bgm_guild.mp3',battle_bonus:'bgm_guild_bonus.mp3'});
/* ---- 旧KAGUYAの部品(パチスロの土台 pachi が参照する。いまは使われていない) ---- */
const KI=(n,st,cls)=>`<img class="kimg ${cls||''}" src="${ASSET}${n}.webp" alt="" style="${st}">`;
const KPRE=[], KOPT={}; function kPreload(){ if(KPRE.length) return; ['kg_stand','kg_ready','kg_special','kg_win','kg_lose','kg_bust','sg_ready','sg_bust','sg_attack','sg_lose','sg_win','kg_face1','kg_face2','kg_face3'].forEach(n=>{ const i=new Image(); i.src=ASSET+n+'.webp'; KPRE.push(i); });
  // あとから足せる絵(なければ、絵を使わない版で動く)。歩くコマを横に8つ並べた kg_walk_sheet(+まばたき kg_walk_sheet_blink)、歩く姿 kg_walk(+まばたき kg_walk_blink)、歩くコマ kg_walk1〜4、荒野の背景 bg_wild_far(遠くの岩山)・bg_wild_near(手前の地面)
  ['kg_walk_sheet','kg_walk_sheet_blink','kg_walk','kg_walk_blink','kg_walk1','kg_walk2','kg_walk3','kg_walk4','bg_wild_far','bg_wild_near'].forEach(n=>{ const i=new Image(); i.onload=()=>{ KOPT[n]=i; clearTimeout(KOPT._t); KOPT._t=setTimeout(()=>{ const M=MACH.battle; if(G.mid==='battle'&&!G.busy&&$('#lcd .kidle')) M.scene('normal'); },300); }; i.src=ASSET+n+'.webp'; KPRE.push(i); }); }
const kWalkN=()=>{ let n=0; while(n<4&&KOPT['kg_walk'+(n+1)]) n++; return n>=2?n:0; };
// 荒野の背景(絵がないときに使う線画)。左右反転してつなげるので、つなぎ目は気にしなくてよい
const svgUri=(w,h,body)=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${body}</svg>`);

  far:{w:800,h:130,src:svgUri(800,130,'<path d="M0 130V70L40 66L60 40L130 38L150 62L210 64L240 80L300 78L320 50L345 30L420 30L440 55L470 58L500 86L560 84L590 60L640 58L660 72L720 74L760 52L800 50V130Z" fill="#2b2160" stroke="#5a48b0" stroke-width="2"/><path d="M60 40L130 38L136 52L70 54Z M345 30L420 30L426 44L352 46Z" fill="#3a2d80"/>')},

/* ---------- ② 目押しチャレンジ(パチスロ。⑦ GUILD RUSH もこの作りを使う) ---------- */
const STRIP=SP.consts.P_STRIP, NS=STRIP.length, SPEED=13; // 1秒に13コマ
function pachi(mid){ return {
  mid, P:null,
  open(){
    const battle=mid==='battle';
    const reelsHtml=`<div class="${battle?'':'bezel gold'}" style="${battle?'padding:7px;background:linear-gradient(180deg,#2a2f60,#0b0d22);border-radius:6px;box-shadow:inset 0 0 0 1px rgba(95,243,255,.35)':''}"><div class="rwin" id="rw">${'<div class="reel"></div>'.repeat(3)}${battle?'':'<div class="glare"></div>'}</div></div>`;
    const deck=`<div class="deck" style="height:${battle?96:112}px;${battle?'padding:0 16px':''}">${betBox(mid)}
      <div class="lever"><div class="stick"></div><button id="bLever" aria-label="レバー" style="${battle?'background:radial-gradient(circle at 35% 30%,#fff 0%,#c9a8ff 25%,#6a3df0 70%,#2a1270 100%);box-shadow:0 0 14px rgba(164,107,255,.8)':''}"></button></div>
      ${battle?'<button class="push" id="bPush" aria-label="プッシュボタン">PUSH</button>':''}<span style="flex:1"></span>
      ${[0,1,2].map(i=>`<button class="stopb" data-s="${i}" aria-label="${i+1}番目のリールを止める">${battle?'':'止'}</button>`).join('')}</div>`;
    if(battle){
      screen('th-battle',
        `<div class="ledbar" style="left:6px"></div><div class="ledbar" style="right:6px"></div>
         <div class="ktop"><span class="kl">KAGUYA</span><span class="ks">輝夜</span></div>
         <div class="lcdwrap"><div class="lcd2" id="lcd"></div></div>${reelsHtml}
         <div class="ledrow">${ledsHtml([['CREDIT','ledCred',G.cred],['BET','ledBet',3],['GET','ledWin',0]])}<button class="auto" id="bAuto">AUTO</button></div>${deck}${trayHtml()}`,
        `<h3>配当</h3>${[['seven','BIG','紅月の7・30ゲーム'],['bar','REG','刀のBAR・12ゲーム'],['bell','鈴','8枚(BET3枚のとき)'],['cherry','桜','4枚(左リールに止める)'],['replay','三日月','リプレイ']].map(([k,n,dd])=>`<div class="row" style="gap:6px">${ksym(k)}<div style="display:flex;flex-direction:column"><b style="font-size:13px">${n}</b><span style="font-size:11px;color:#9fa8e0">${dd}</span></div></div>`).join('')}
         <div style="display:flex;justify-content:center;align-items:flex-end;gap:4px;margin-top:4px"><img src="${ASSET}kg_stand.webp" alt="" style="height:62px"><img src="${ASSET}sg_ready.webp" alt="" style="height:62px"></div><p style="text-align:center;color:#cfd6ff">KAGUYA と 宿敵シロガネ</p>
         <p style="color:#9fa8e0">レバーで回して、ボタンで止める。当たったら液晶の合図で7(BIG)かBAR(REG)をねらってそろえる。</p>`,
        `<h3 style="font-family:var(--f-body);font-weight:800;font-size:12px;letter-spacing:3px">DATA</h3><div id="data"></div><p>PUSHボタン:演出のあとに押すと結果がわかる</p>`);
    } else {
      screen('th-oshi',
        `<div class="topper"><div class="logo">目押し挑戦</div><div class="golamp" id="lamp"><i></i>チャンスランプ<i></i></div></div>
         ${reelsHtml}<div class="ledrow">${ledsHtml([['CREDIT','ledCred',G.cred],['BET','ledBet',3],['GET','ledWin',0]])}<button class="auto" id="bAuto" style="border-radius:4px">AUTO</button></div>${deck}${trayHtml(8)}`,
        `<h3>配当</h3>${[['seven','BIG','30ゲームのボーナス'],['bar','REG','12ゲームのボーナス'],['bell','ベル','8枚(BET3枚のとき)'],['cherry','チェリー','4枚(左リールに止める)'],['replay','リプレイ','もう1回']].map(([k,n,dd])=>`<div class="row" style="gap:6px">${sym(k)}<div style="display:flex;flex-direction:column"><b style="font-size:13px">${n}</b><span style="font-size:11px;color:#6b665c">${dd}</span></div></div>`).join('')}
         <p style="color:#6b665c">BETは3枚きざみ。6枚なら配当も2倍。ランプが光ったらボーナスが当たっている。7かBARをねらって止めよう(4コマまですべって止まる)。</p>`,
        `<h3 style="font-family:var(--f-chic);font-weight:700;font-size:12px;letter-spacing:3px;color:#e6c37a">DATA</h3><div id="data"></div><p style="color:#9a958a">自分のこの台での記録</p>`);
    }
    this.reels=[...$('#rw').querySelectorAll('.reel')];
    const w=battle?150:200, h=battle?62:92, ss=battle?54:80;
    this.P={pos:[Math.random()*NS,Math.random()*NS,Math.random()*NS],run:[false,false,false],goal:[null,null,null],res:null,w,h,ss,raf:0,last:0,fxHit:false,revealed:true,stopsSent:false};
    this.reels.forEach(el=>{ el.style.width=w+'px'; el.style.height=(h*3)+'px';
      // 3周ぶん、上から下に向かって番号が小さくなるように並べる
      const cells=[]; for(let j=0;j<NS*3;j++) cells.push(STRIP[((NS*3-1-j)%NS+NS)%NS]);
      const S=battle?ksym:sym; el.innerHTML=`<div class="col">${cells.map(k=>`<div class="cell" style="height:${h}px">${S(k,ss)}</div>`).join('')}</div>`; });
    this.draw();
    $('#bLever').onclick=()=>this.lever(); $('#bAuto').onclick=()=>toggleAuto(this); bindBet(mid,()=>this.P.run.some(x=>x)||!!this.betLock());
    document.querySelectorAll('.stopb').forEach(b=>b.onclick=()=>this.stop(+b.dataset.s));
    if(battle){ kPreload(); $('#bPush').onclick=()=>this.push(); this.scene('normal'); }
    this.upd(); this.drawData();
  },
  restore(){ const s=G.st[mid]||{}; this.lamp(!!s.lampOn); this.drawData();
    if(mid==='battle'){ if(s.bonus) this.scene('bonusGame',{left:s.bonus.left}); else if(s.held&&s.lampOn) this.scene('aim',{held:s.held}); } },
  lamp(on){ const l=$('#lamp'); if(l) l.classList.toggle('on',on); },
  drawData(){ const s=G.st[mid]||{}, c=s.count||{big:0,reg:0}, d=$('#data'); if(!d) return;
    d.innerHTML=[['ゲーム数',s.games||0,'#ffb02e'],['BIG',c.big||0,'#ff5a5a'],['REG',c.reg||0,'#6fb3ff'],['ボーナス中',s.bonus?'あと'+s.bonus.left:'—','#ffb02e']].map(([l,v,col])=>`<div class="dat"><span>${l}</span><b style="color:${col}">${v}</b></div>`).join(''); },
  draw(){ const P=this.P; this.reels.forEach((el,i)=>{ const p=((P.pos[i]%NS)+NS)%NS+NS; el.firstChild.style.transform=`translateY(${(p-(NS*3-2))*P.h}px)`; }); },
  center(i){ return ((Math.round(this.P.pos[i])%NS)+NS)%NS; },
  loop(t){ const P=this.P; const dt=Math.min(.05,(t-(P.last||t))/1000); P.last=t; let any=false;
    for(let i=0;i<3;i++){ if(!P.run[i]) continue; any=true; P.pos[i]+=SPEED*dt*(P.goal[i]!=null?1.6:1);
      if(P.goal[i]!=null&&P.pos[i]>=P.goal[i]){ P.pos[i]=P.goal[i]; P.run[i]=false; P.goal[i]=null; sfx.stop();
        const el=this.reels[i]; el.animate([{transform:'translateY(6px)'},{transform:'none'}],{duration:120}); if(P.run.every(x=>!x)) this.allStopped(); } }
    this.draw(); if(any) P.raf=requestAnimationFrame(x=>this.loop(x)); else P.raf=0; },
  // ボーナスが光っている・ボーナス中は、BETを当たったときの枚数で固定
  betLock(){ const s=G.st[mid]||{}, P=this.P; if(!s.hk) return 0; if(s.bonus) return 3*s.hk;
    if(s.held&&s.lampOn&&(mid!=='battle'||(P&&P.revealed))) return 3*s.hk; return 0; },
  upd(){ const P=this.P; if(!P||!$('#bLever')) return; const spinning=P.run.some(x=>x);
    const lk=this.betLock(); if(lk&&G.bet[mid]!==lk){ G.bet[mid]=lk; try{ localStorage.setItem('mg.slotpark.bet',JSON.stringify(G.bet)); }catch(e){} }
    const wait=mid==='battle'&&!P.revealed; // PUSH待ちのときは、レバーを引くとPUSHと同じ
    $('#bLever').disabled=G.busy||(!wait&&G.cred<G.bet[mid]); updBet(mid,spinning||!!lk,spinning&&P.bet?P.bet:G.bet[mid]);
    $('#bAuto').classList.toggle('on',G.auto);
    document.querySelectorAll('.stopb').forEach(b=>{ const i=+b.dataset.s; const on=P.run[i]&&P.goal[i]==null&&!(P.q||[]).includes(i); b.classList.toggle('on',on); b.disabled=!on; }); },
  hurry(){ const P=this.P; if(!P) return; [0,1,2].forEach(i=>this.stop(i)); },
  // AUTO:レバー → 3つ止める → (KAGUYAは)PUSH を自動で
  spin(){ const P=this.P; if(G.busy||P.run.some(x=>x)) return;
    if(mid==='battle'&&!P.revealed){ this.push(); setTimeout(()=>{ if(G.auto&&!G.busy&&G.mid===mid) this.lever(); },2600); return; }
    this.lever(); },
  autoStops(tok){ const P=this.P; [0,1,2].forEach((i,k)=>setTimeout(()=>{ if(G.auto&&P.tok===tok&&G.mid===mid) this.stop(i); },350+k*300)); },
  async lever(){
    const P=this.P; if(G.busy||P.run.some(x=>x)) return;
    if(mid==='battle'&&!P.revealed){ this.push(); return; }
    const bet=G.bet[mid]; if(G.cred<bet){ G.auto=false; this.upd(); return toast('メダルが足りません'); }
    P.bet=bet; begin(bet); $('#ledWin').textContent=0; P.res=null; P.q=[]; P.tok=(P.tok||0)+1; const tok=P.tok; P.stopsSent=false; sfx.spin();
    P.run=[true,true,true]; P.goal=[null,null,null]; P.last=0; if(!P.raf) P.raf=requestAnimationFrame(x=>this.loop(x)); this.upd();
    const d=await play(mid,{bet});
    if(!d){ P.q=[]; for(let i=0;i<3;i++){ P.goal[i]=Math.ceil(P.pos[i]); } setTimeout(()=>{ G.busy=false; G.hold=false; G.cred=seatA()||0; updTop(); this.upd(); },600); P.res={flag:'none',fail:true}; return; }
    P.res=d; this.held=d.held; this.lamp(!!d.lampOn);
    if(mid==='battle'&&d.fx) this.playFx(d);
    // ボーナスが光っているときはAUTOを止めて、自分でねらってもらう(KAGUYAは当たった回はPUSHのあとで)
    if(G.auto&&d.held&&d.lampOn&&d.flag!=='bonusGame'&&!(mid==='battle'&&d.newHit)){ G.auto=false; toast(`ボーナスが当たっています! ${d.held==='reg'?'BAR':'7'}をねらって止めよう`); }
    const q=P.q; P.q=[]; q.forEach(i=>this.stop(i)); // 結果が届く前に押されたボタン
    this.upd();
    if(G.auto) this.autoStops(tok);
  },
  // 止めるボタン:押した位置から最大4コマすべらせて、狙いの絵柄を止める
  stop(i){ const P=this.P; if(!P.run[i]||P.goal[i]!=null) return;
    if(!P.res){ if(!P.q.includes(i)){ P.q.push(i); sfx.stop(); this.upd(); } return; } // 結果が届いたらすぐ止める
    const c0=Math.ceil(P.pos[i]-1e-6), d=P.res, others=[0,1,2].filter(j=>j!==i&&!P.run[j]).map(j=>STRIP[this.center(j)]);
    const bonusSym=d.held==='big'?'seven':d.held==='reg'?'bar':null;
    let want=null;
    if(d.flag==='bonusGame'||d.flag==='bell') want='bell'; else if(d.flag==='replay') want='replay';
    else if(d.flag==='cherry'&&i===0) want='cherry';
    else if(bonusSym&&(d.flag==='none'||d.flag==='cherry')) want=bonusSym;
    const cand=[0,1,2,3,4].map(k=>c0+k), symAt=c=>STRIP[((c%NS)+NS)%NS];
    const ok=c=>{ const s=symAt(c);
      if(i===0&&s==='cherry'&&d.flag!=='cherry') return false;                       // チェリーは当たっていないと止まらない
      if(others.length===2&&others[0]===others[1]&&others[0]===s) return false;     // 勝手にそろわない
      if(bonusSym&&s===bonusSym&&want!==bonusSym) return false;
      return true; };
    let g=want?cand.find(c=>symAt(c)===want):undefined;
    if(g===undefined) g=cand.find(c=>ok(c)&&symAt(c)!==want)??cand.find(ok)??c0;
    P.goal[i]=g; this.upd(); },
  async allStopped(){
    const P=this.P, d=P.res; this.upd(); if(!d||d.fail||P.stopsSent) return; P.stopsSent=true;
    const c=[0,1,2].map(i=>STRIP[this.center(i)]);
    const bonusSym=d.held==='big'?'seven':d.held==='reg'?'bar':null;
    const cherryOk=d.flag==='cherry'&&c[0]==='cherry';
    const aligned=!!bonusSym&&c.every(s=>s===bonusSym)&&d.flag!=='bonusGame';
    let pay=d.pay||0, a=d.a;
    // レバーの時点で配当は確定済み。チェリーとボーナスのときだけ先生のPCに知らせる(待ち時間を減らす)
    const s=(cherryOk||aligned)?await play(mid,{type:'g:stop',cherryOk,aligned}):null;
    if(s){ pay+=s.pay||0; a=s.a; }
    if(pay>0){ $('#ledWin').textContent=pay; sfx.win(); }
    if(s&&s.bonusStart){ sfx.big(); this.lamp(false); winText($('#rw'),s.bonusStart==='big'?'BIG BONUS!':'REG BONUS!',60);
      if(mid==='battle') this.scene('bonusStart',{type:s.bonusStart}); }
    if(d.bonusEnd){ winText($('#rw'),`ボーナス終了 +${d.bonusGet}`,60); if(mid==='battle') this.scene('normal'); }
    if(mid==='battle'){ this.afterStop(d,s); }
    this.drawData();
    await finish({a}); this.upd();
    if(G.auto&&G.mid===mid) setTimeout(()=>{ if(G.auto&&!G.busy&&!G.after&&G.mid===mid) this.spin(); },mid==='battle'&&!P.revealed?1300:(s&&s.bonusStart?2400:450));
  },
  /* ---- 液晶(KAGUYAだけ) ---- */
  scene(name,o){ const L=$('#lcd'); if(!L) return; o=o||{}; let h='';
    const base=(t,moon)=>`<div class="kbg"></div>${t?`<div class="ktint" style="background:${t}"></div>`:''}${moon?'<div class="kmoon"></div>':''}<div class="kgrid"></div>`;
    const face=(n,st,cut)=>`<div class="kface${cut?' cut':''}" style="${st}"><img src="${ASSET}kg_face${n}.webp" alt=""></div>`;
    const rnd=(a,b)=>a+Math.random()*(b-a);
    // 動きの部品:流れる線・桜の花びら・火の粉
    const speed=(c,n)=>`<div class="kfx">${Array.from({length:n||14},()=>`<i class="kline" style="top:${rnd(4,240)|0}px;width:${rnd(80,220)|0}px;--c:${c};animation-duration:${rnd(.28,.5).toFixed(2)}s;animation-delay:-${rnd(0,.5).toFixed(2)}s"></i>`).join('')}</div>`;
    const petals=n=>`<div class="kfx">${Array.from({length:n||14},()=>`<i class="kpetal" style="left:${rnd(0,760)|0}px;animation-duration:${rnd(2.6,4.6).toFixed(2)}s;animation-delay:-${rnd(0,4).toFixed(2)}s;transform:scale(${rnd(.7,1.3).toFixed(2)})"></i>`).join('')}</div>`;
    const sparks=(c,n)=>`<div class="kfx">${Array.from({length:n||18},()=>`<i class="kspark" style="left:${rnd(0,700)|0}px;--c:${c};animation-duration:${rnd(1,2.2).toFixed(2)}s;animation-delay:-${rnd(0,2).toFixed(2)}s"></i>`).join('')}</div>`;
    if(name==='normal'){ // 月夜の荒野を歩く
      const wn=kWalkN(), one=!wn&&KOPT.kg_walk, src=wn?ASSET+'kg_walk1.webp':one?ASSET+'kg_walk.webp':ASSET+'kg_stand.webp', wh=wn||one?226:236;
      h=`<div class="wsky"></div><div class="wstars"></div><div class="kmoon" style="right:150px;top:16px;width:78px;height:78px"></div>
        <div class="wlay" data-l="far"></div><div class="wlay" data-l="mid"></div><div class="wlay" data-l="ground"></div>
        <div class="wdust">${Array.from({length:12},()=>`<i style="top:${rnd(150,240)|0}px;animation-duration:${rnd(2.4,4.2).toFixed(2)}s;animation-delay:-${rnd(0,4).toFixed(2)}s"></i>`).join('')}</div>
        ${KOPT.kg_walk_sheet?`<div class="kwalker kidle" style="left:107px;bottom:4px"><div class="kshadow" style="animation-duration:.24s;left:22%;right:14%"></div><div id="kWalkSheet" class="kwsheet" style="background-image:url(${KOPT.kg_walk_sheet.src})"></div></div>`
          :`<div class="kwalker kidle" style="left:120px;bottom:4px"><div class="kshadow"></div><img id="kWalkImg" class="kwbob" src="${src}" alt="" style="height:${wh}px"></div>`}
        <div class="wlay" data-l="near"></div>
        <div class="klogo" style="right:34px;top:104px;font-size:30px">KAGUYA</div><div class="ksub" style="right:50px;top:146px;font-size:14px">輝夜 ・ 月下の剣</div>`;
    }
    else if(name==='chance'){ o.quake=true; h=base('radial-gradient(ellipse at 25% 50%,rgba(176,77,255,.75) 0%,rgba(176,77,255,0) 70%)')+`<div class="kflash"></div><div class="rays"></div>`+speed('rgba(220,190,255,.8)')+petals(16)+face(1,'left:60px;top:16px',true)+`<div class="big neon kpulse" style="top:96px;left:240px;font-size:56px">CHANCE</div>`; }
    else if(name==='green') h=base('radial-gradient(ellipse at 30% 60%,rgba(47,179,107,.8) 0%,rgba(47,179,107,0) 70%)')+`<div class="rays"></div>`+speed('rgba(140,255,190,.85)',18)+KI('kg_ready','left:-24px;bottom:-8px;height:232px','kslideL')+`<div class="big neon" style="top:40px;left:330px;font-size:40px;text-shadow:0 0 12px #2fb36b,0 4px 0 #0b3a20">なにか来る…?</div>`;
    else if(name==='red'){ o.quake=true; h=base('radial-gradient(ellipse at 50% 40%,rgba(230,57,70,.85) 0%,rgba(230,57,70,.15) 75%)')+`<div class="rays"></div>`+speed('rgba(255,120,130,.9)',20)+sparks('#ff6a5a',14)+KI('sg_bust','left:-44px;bottom:-10px;height:262px','kslideL')+`<div class="big kpulse" style="top:26px;left:300px;font-size:60px;text-shadow:0 0 14px #ff3a4f,0 4px 0 #7a0f17">REACH!</div><div style="position:absolute;left:300px;right:0;bottom:26px;display:flex;justify-content:center;gap:10px">${ksym('seven',84)}${ksym('seven',84)}<span class="shake" style="width:84px;height:84px;border:4px dashed #fff;border-radius:12px"></span></div>`; }
    else if(name==='gold'){ o.quake=true; h=base('radial-gradient(ellipse at 70% 50%,rgba(224,178,58,.9) 0%,rgba(224,178,58,.2) 70%)')+`<div class="kflash"></div><div class="rays"></div><div class="band"></div>`+sparks('#ffd23f',26)+KI('kg_bust','right:-24px;bottom:-12px;height:272px','kslideR')+`<div class="big kpulse" style="top:96px;left:30px;right:auto;font-size:62px;color:#ffd23f;transform:rotate(-8deg);text-shadow:0 0 14px rgba(255,210,63,.9),0 4px 0 #5a3a00">激アツ!!</div>`; }

/* 5ライン:1=中段 2=上段 3=下段 4=右下がり 5=右上がり(行は 0=上 1=中 2=下) */
const GLINES=[[1,1,1],[0,0,0],[2,2,2],[0,1,2],[2,1,0]];
const GLC=['#ffd23f','#4aa8ff','#3ddc84','#ff4d6d','#c77dff'];
const GSTRIP=SP.consts.G_STRIP; // 5ライン用のリールの並び(長さは STRIP と同じ21コマ)
const gsAt=c=>GSTRIP[((c%NS)+NS)%NS];
const GCOL=[]; for(let c=0;c<NS;c++) GCOL.push([gsAt(c+1),gsAt(c),gsAt(c-1)]); // その位置で止まったときの 上・中・下
const gcol=c=>GCOL[((c%NS)+NS)%NS];
// その回にそろえる絵柄(want)と、ねらってよいボーナスの絵柄(bs)。当たった回はPUSHの前なのでそろえない
function gPrep(d){ if(d._p) return d._p;
  const want=(d.flag==='bell'||d.flag==='bonusGame')?'bell':d.flag==='replay'?'replay':null;
  const bs=(!d.newHit&&(d.flag==='none'||d.flag==='cherry'))?(d.held==='big'?'seven':d.held==='reg'?'bar':null):null;
  return d._p={want,bs}; }
function gLines(pos){ const a=gcol(pos[0]),b=gcol(pos[1]),c=gcol(pos[2]), out=[];
  for(let li=0;li<5;li++){ const L=GLINES[li], s=a[L[0]]; if(s===b[L[1]]&&s===c[L[2]]) out.push([li,s]); } return out; }
// ok=当たっていない絵柄がそろっていない hasW=そろえるべき絵柄がそろった aim=ボーナスの絵柄がそろった ch=左リールにチェリー
function gJudge(pos,d){ const {want,bs}=gPrep(d), L=gLines(pos); let ok=true, hasW=!want, aim=false;
  for(const [,s] of L){ if(s===want) hasW=true; else if(bs&&s===bs) aim=true; else ok=false; }
  const ch=gcol(pos[0]).includes('cherry'); if(ch&&d.flag!=='cherry') ok=false;
  return {ok,hasW,aim,ch,L}; }
