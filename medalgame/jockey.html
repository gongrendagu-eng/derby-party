<style>
/* ジョッキーダービー:学生が騎手になる競馬(メダルゲームにつながる版) */
:root{--f-num:"Dela Gothic One",sans-serif;--f-head:"Kaisei Decol","Hiragino Mincho ProN",serif;--f-body:"M PLUS 1p","Hiragino Sans","Meiryo",sans-serif;
  --gold:#ffc83d;--rail:#f4f4f0;--field:#3f8a33;--turf:#3f8a33;--turf2:#479639;--ink:#1e1a14;--soft:#6f6555;--line:#dccfb4;--warn:#d63c5e;--navy:#0f1e2e;--navy2:#16283a;--navy3:#23364a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--f-body);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sp{flex:1}
.no{display:inline-flex;align-items:center;justify-content:center;min-width:1.6em;height:1.6em;border-radius:.3em;font-weight:900;border:1px solid rgba(0,0,0,.45);flex-shrink:0}
/* ---- 先生のPC ---- */
body.host{background:#f5efe1}
.wrap{max-width:1500px;margin:0 auto;padding:14px 16px 40px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ttl{font-family:var(--f-num);font-size:26px}.ttl small{font-family:var(--f-body);font-size:14px;color:var(--soft);font-weight:800;margin-left:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:#1f9d4a}.chip.off .dot{background:var(--warn)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.scr{position:relative;aspect-ratio:4/3;background:#2e7d3b;border-radius:14px;overflow:hidden;max-height:calc(100vh - 90px)}
.scr canvas,.jscr canvas,.sscr canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;left:0;right:0;top:8%;text-align:center;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none}
.ov .big{font-family:var(--f-head);font-size:clamp(28px,5vw,60px);font-weight:700}.ov .sub{font-weight:800;font-size:clamp(14px,1.6vw,20px)}
.box{background:#fffaf0;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.box h2{margin:0 0 8px;font-size:18px}.box summary{font-weight:800;cursor:pointer}
.note{color:var(--soft);font-size:14px;line-height:1.7;margin:4px 0}
.btn{border:2px solid var(--line);background:#fffaf0;border-radius:10px;padding:8px 14px;font-weight:800}
.btn.pri{background:#1f6b3a;border-color:#1f6b3a;color:#fff}.btn.danger{background:#c8102e;border-color:#c8102e;color:#fff}.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th{font-size:11px;color:var(--soft);text-align:left;padding:2px 4px}.tb td{padding:3px 4px;border-top:1px dashed var(--line)}
.warn{color:var(--warn)}
.frm{display:grid;gap:6px;margin-top:8px}.frm label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700}
.frm input[type=number]{width:5em;border:2px solid var(--line);border-radius:8px;padding:3px 6px;text-align:right}.frm select{border:2px solid var(--line);border-radius:8px;padding:3px 6px}
ul.pl{list-style:none;margin:8px 0 0;padding:0;max-height:300px;overflow:auto}
ul.pl li{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line);font-weight:800;font-size:14px}
ul.pl li b{margin-left:auto;font-family:var(--f-num);font-weight:400}ul.pl li small{color:var(--soft);font-weight:500}
.tag{font-size:11px;background:#1f6b3a;color:#fff;border-radius:6px;padding:1px 6px}.tag.b{background:#8a5a00}
[data-snd].off{opacity:.5}.pbtn.snd{background:#16283a;border:1px solid #2a4560}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14213a;color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;z-index:99;max-width:90vw}
/* ---- iPad ---- */

.you{color:var(--gold);font-weight:800}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}.chipx{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--navy3)}

.plan{display:grid;gap:8px;margin:10px 0 16px}.plan div{display:grid;grid-template-columns:86px 1fr;gap:10px;font-size:14px}.plan em{font-style:normal;color:var(--gold);font-weight:800;font-size:13px}
/* レース:騎手 */
.jtop{display:flex;align-items:center;gap:16px;padding:6px 14px;background:#0a1622;font-size:13px;color:var(--soft)}.jtop .hn{font-size:18px;margin:0;color:#fff}.jtop .big{font-family:var(--f-num);font-weight:400;font-size:24px;color:var(--gold)}

.form{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:8px;background:rgba(10,22,34,.86);border-radius:10px;padding:6px 10px}.form small{font-size:10px;color:var(--soft);line-height:1.3}
.fl{display:flex;gap:4px}.fl span{width:24px;height:30px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;border-radius:5px;border:1px solid rgba(0,0,0,.5);opacity:.85}

.mnote{position:absolute;left:50%;top:22%;transform:translateX(-50%);padding:6px 16px;border-radius:10px;font-weight:900;font-size:17px;white-space:nowrap}.mnote.up{background:#1f9d4a}.mnote.dn{background:#c8102e}
.startb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(70%,460px);height:44%;border:6px solid #fff;border-radius:24px;background:rgba(20,30,50,.88);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.startb b{font-size:clamp(22px,3.4vw,34px);font-weight:900}.startb span{font-size:14px;color:var(--soft)}.startb.go{background:#c8102e;border-color:var(--gold)}
.jpan{flex:0 0 auto;display:grid;grid-template-columns:170px minmax(0,1fr) minmax(0,1.5fr) 150px;gap:10px;padding:10px;height:min(38vh,300px)}
.lanes,.gauges{background:var(--navy2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:0}
.lanes small,.lcol small{font-size:10px;color:var(--soft)}
.lr{display:flex;gap:10px;flex:1;min-height:0}.lb{display:flex;flex-direction:column;gap:8px;flex:1}.lb button{flex:1;border:0;border-radius:12px;background:#2a4560;color:#fff;font-weight:900;font-size:18px}.lb button:active{background:#3b6187}
.lcol{display:flex;flex-direction:column;align-items:center;gap:3px;justify-content:center}.lcol i{width:22px;flex:1;max-height:22px;border-radius:4px;background:#2a4560}.lcol i.c{background:#7f93a8}.lcol i.t{background:var(--gold)}
.gg{display:grid;grid-template-columns:58px 1fr 84px;gap:8px;align-items:center;font-size:13px;font-weight:700}.gg i{height:16px;border-radius:8px;background:#0a1622;overflow:hidden}.gg i b{display:block;height:100%;border-radius:8px;transition:width .2s}.gg em{font-style:normal;font-size:12px;text-align:right;white-space:nowrap}
.flags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}.flags span{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px}.flags .g{background:#127a8a}.flags .w{background:#5a2a20;color:#f7c9a8}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts .a,.whip{border:4px solid transparent;border-radius:18px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.acts .a b,.whip b{font-size:clamp(18px,2.6vw,26px);font-weight:900}.acts .a span,.whip span{font-size:12px;opacity:.85}
.a.hold{background:#2f5fbf}.a.none{background:#4a5a6c}.a.push{background:#1f8a4c}.acts .a{opacity:.55}.acts .a.on{opacity:1;border-color:#fff;box-shadow:0 0 0 3px var(--gold)}
.whip{background:#d9482e}.whip:active{background:#b8351f}.whip.hit{animation:hit .15s}
@keyframes hit{0%{transform:scale(.94)}100%{transform:scale(1)}}
/* レース:観戦 */
.sscr{position:relative;flex:1;min-height:0;background:#2e7d3b;overflow:hidden}
.camsw{position:absolute;left:10px;top:10px;display:flex;gap:4px;background:rgba(10,22,34,.82);border-radius:12px;padding:4px}.camsw button{height:40px;padding:0 14px;border:0;border-radius:9px;background:transparent;color:#fff;font-weight:800}.camsw button.on{background:#fff;color:#0f1e2e}
.ordl{position:absolute;right:10px;top:10px;width:240px;background:rgba(10,22,34,.85);border-radius:12px;padding:8px 10px;font-size:12px}
.ordl .oh{display:flex;justify-content:space-between;color:var(--soft);font-size:10px;margin-bottom:2px}
.ordl .o{display:grid;grid-template-columns:18px 22px minmax(0,1fr) auto;gap:5px;align-items:center;height:23px;border-radius:5px;padding:0 3px}.ordl .o.me{background:#22405c}
.ordl em{font-style:normal;font-weight:900;color:var(--gold);text-align:center}.ordl .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ordl .jn{font-size:11px;color:#bfd0e2}.ordl .jn.s{color:var(--gold);font-weight:800}
.myb{position:absolute;left:10px;top:62px;background:rgba(10,22,34,.82);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700}
/* 結果 */
.pres{flex:1;min-height:0;overflow:auto;padding:14px}
.win{display:flex;align-items:center;gap:16px;background:#1f6b3a;border-radius:18px;padding:14px 20px;margin-bottom:14px}.win .p1{font-family:var(--f-num);font-size:40px;color:#ffe08a}.win b{font-size:24px;display:block}.win small{color:#e4f1e7}
.rgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:14px}.rgrid>div:last-child{display:flex;flex-direction:column;gap:14px}

.or{display:grid;grid-template-columns:26px 28px minmax(0,1fr) auto 90px;gap:8px;align-items:center;height:36px;border-radius:8px;padding:0 6px;font-size:14px}.or.me{background:#22405c}.or em{font-style:normal;font-weight:900;color:var(--gold);font-size:17px}.or .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.or small{color:var(--soft);font-size:11px}.or .jn{text-align:right;font-size:12px}

.pmodal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}.pmodal .pc{width:min(480px,100%)}
.amt{display:flex;gap:10px;align-items:center;margin:12px 0}.amt input{flex:1;min-width:0;border:3px solid #1f9d4a;border-radius:16px;padding:8px 14px;font-family:var(--f-num);font-size:32px;text-align:right;color:#1b2430;background:#fff}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button{border:0;border-radius:12px;padding:12px 0;font-weight:800;background:#fff3c2;color:#3a2600}

<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script>
/* ===== ジョッキーダービー(メダルゲームにつながる版) =====
   学生が騎手になって馬を操る、1着当て(単勝)の競馬。レースの絵はG1ロード(版50)のリアル調をそのまま使う
   先生のPC:レースの計算・メダルの増減 / iPad:騎手は操作、ほかの人はBETして観戦 */
const {esc,yen}=MG, $=s=>document.querySelector(s), app=$('#app');
const CLEAN=MG.qs.get('clean')||'';   // 掃除モード(?clean=ID):掃除決めのメダルで遊び、最後にルーレットパークへ引き継ぐ
const GID=CLEAN?'jkclean':'jockey', NAME=CLEAN?'ジョッキーダービー(掃除決め)':'ジョッキーダービー', VERSION=4;
const now=()=>Date.now();
const LAP=1600, REAL=true, isPhone=()=>false;
let G=null, csCache={};
const RND=new Map(); const rnd=m=>{ let v=RND.get(m); if(v===undefined){ v=rkHash('r'+m); if(RND.size>20000) RND.clear(); RND.set(m,v); } return v; };
const WAKU=[['#ffffff','#1e1a14'],['#222222','#ffffff'],['#d62b2b','#ffffff'],['#2b5fd6','#ffffff'],['#f2c200','#1e1a14'],['#1f9d4a','#ffffff'],['#f07d1a','#1e1a14'],['#f28bb8','#1e1a14']];
function wakuIdx(no,n){ if(n<=8) return no-1; const extra=n-8; let c=0; for(let f=0;f<8;f++){ c+=f>=8-extra?2:1; if(no<=c) return f; } return 7; }
const curH=()=>S.H||10;
const wk=no=>WAKU[wakuIdx(no,curH())];
const hidePlace=()=>false;
const cs=v=>{ if(!(v in csCache)) csCache[v]=getComputedStyle(document.documentElement).getPropertyValue(v).trim(); return csCache[v]; };
let toastT=null; function toast(m){ if(!m) return; const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3500); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
const gaussR=()=>{ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
const rankL=v=>v>=9?'S':v>=8?'A':v>=7?'B':v>=6?'C':v>=5?'D':'E';
const MOODS=[[80,'絶好調','#1f9d4a'],[60,'ごきげん','#5cb85c'],[40,'ふつう','#8a94a3'],[20,'ふきげん','#e08a1e'],[0,'怒っている','#d63c3c']];
const moodOf=m=>MOODS.find(x=>m>=x[0])||MOODS[4];
const TEMPER=t=>t>0.75?'気が荒い(掛かりやすい)':t>0.45?'ふつう':'おとなしい';
const COND=m=>m>=68?'絶好調':m>=58?'好調':m>=50?'ふつう':'いまひとつ';

/* ===== 音(効果音はファイルを使わず Web Audio で合成。BGMは jd-assets/ のmp3。ファイルがなければ効果音だけで動く) ===== */
const SND=(()=>{
  const LS='mg.jockey.snd', isPad=!!MG.qs.get('mg'), DIR='jd-assets/', VOL=0.34;
  const FILES={paddock:'bgm_paddock.mp3',race:'bgm_race.mp3',final:'bgm_final.mp3',result:'bgm_result.mp3'}, FAN='jg_fanfare.mp3';
  let cfg={}; try{ cfg=JSON.parse(localStorage.getItem(LS))||{}; }catch(e){}

  const st={se:cfg.se!==0,bgm:cfg.bgm!=null?!!cfg.bgm:!isPad,key:null,tr:{},miss:{},lim:{}};

// ベルトの形を作る:直線と円弧の並び(数学の座標)
function beltPieces(cs){
  const n=cs.length, tan=[];
  for(let i=0;i<n;i++){ const [ax,ay,ra]=cs[i], [bx,by,rb]=cs[(i+1)%n];
    const dx=bx-ax, dy=by-ay, D=Math.hypot(dx,dy), ux=dx/D, uy=dy/D, k=(ra-rb)/D, h=Math.sqrt(Math.max(0,1-k*k));
    const nx=k*ux+h*uy, ny=k*uy-h*ux;          // 進行方向の右側(外側)の法線
    tan.push({a:[ax+ra*nx,ay+ra*ny], b:[bx+rb*nx,by+rb*ny], na:Math.atan2(ny,nx)}); }
  const pieces=[];
  for(let i=0;i<n;i++){ const t=tan[i], nxt=tan[(i+1)%n], [cx,cy,r]=cs[(i+1)%n];
    pieces.push({type:'line',p0:t.a,p1:t.b,len:Math.hypot(t.b[0]-t.a[0],t.b[1]-t.a[1]),idx:i});
    let a0=t.na, a1=nxt.na; while(a1<a0) a1+=Math.PI*2;
    pieces.push({type:'arc',c:[cx,cy],r,a0,a1,len:r*(a1-a0)}); }
  return pieces;
}
// 画面に合わせてコースを作る(サンプル点の表:位置・外向きの向き)
function buildCourse(crs,rh,W,H,pad,top,tw){

  const P=acc;

  const scr=pts.map(toScr), cum=[0]; for(let i=1;i<=scr.length;i++){ const a=scr[i-1], b=scr[i%scr.length]; cum.push(cum[i-1]+Math.hypot(b[0]-a[0],b[1]-a[1])); }

    else sg.lab=null; });

  const home=segs.find(sg=>sg.lab==='home');

  return {P,N,X,Y,NX,NY,segs,home0:home.s0,home1:home.s1,cx:(bx0+bx1)/2,cy:(by0+by1)/2,sc,bx0,bx1,by0,by1};

function fitGoal(){
  const g=G.g, P=G.P; G.lap=S&&S.crs?S.crs.lap:LAP;

  const fs=[]; for(let f=0.35;f<=0.971;f+=0.01) fs.push(f); fs.sort((a,b)=>Math.abs(a-0.78)-Math.abs(b-0.78));

// 写真判定中の表示(直線カメラ上)
/* ===== ここまで G1ロードの絵 ===== */
/* ===== レースの計算(先生のPCだけで動かす) =====
   馬: {no, style:'nige'|'senko'|'sashi'|'oikomi', spd, sta, kick(4〜10), temper(0.2〜1), mood0(0〜100)}
   騎手の操作: a='hold'(控える)|'push'(追う)|'none'(馬なり)、w=ムチの回数(累計)、ln=レーン(0内〜4外)、rt=スタートの反応(秒) */
const STY={
  nige:  {n:'逃げ',z:[0,0.15],spurt:470},
  senko: {n:'先行',z:[0.12,0.4],spurt:450},
  sashi: {n:'差し',z:[0.4,0.75],spurt:430},
  oikomi:{n:'追込',z:[0.7,1],spurt:410}
};
const SIM={
  ACC:3.2, DEC:4.5, LANE_V:0.4, LANES:6,
  ACT:{hold:0.94,none:0.975,push:1.0},
  DRAIN:{hold:0.32,none:0.72,push:1.22},
  WHIP_SPD:0.011, WHIP_DRAIN:0.42, WHIP_T:0.7,
  CORNER:0.03, FINAL:500
};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

function createRace(spec){
  const D=spec.D, V0=spec.V0, corner=spec.corner||(()=>false), N=spec.horses.length, rnd=spec.rnd||Math.random;
  const H=spec.horses.map((h,i)=>({
    i,no:h.no,h,style:h.style,
    x:0,v:0,l:(i/(Math.max(1,N-1))),lt:Math.round(i/(Math.max(1,N-1))*SIM.LANES)/SIM.LANES,
    st:100,k:0,m:h.mood0,
    a:'none',w:0,wq:[],ln:null,rt:null,go:null,
    fin:null,place:0,
    flags:{},ev:[],evT:0,last:{},
    // 振り返り用
    rv:{rt:null,zone:0,zoneT:0,draft:0,kak:0,spurtAt:null,bumps:0,whips:0,moodSum:0,moodN:0,endSt:null,early:0},
    chg:[],steady:0,blockT:0,bumpCD:0,toggleCD:0
  }));
  const R={D,V0,N,H,t:0,started:false,finN:0,events:[],lastSay:{}};
  const ev=(h,text,mood)=>{ h.ev.push({t:R.t,text,mood:mood||0}); if(h.ev.length>6) h.ev.shift(); };
  const say=(key,text,gap)=>{ const t0=R.lastSay[key]||-99; if(R.t-t0<(gap||6)) return; R.lastSay[key]=R.t; R.events.push(text); if(R.events.length>30) R.events.shift(); };

  // 騎手の操作を受け取る
  R.input=(i,inp)=>{ const h=H[i]; if(!h||h.fin!=null) return;
    if(inp.a&&inp.a!==h.a&&['hold','push','none'].includes(inp.a)){ h.a=inp.a; h.chg.push(R.t); }
    if(inp.w!=null&&inp.w>h.w){ const n=Math.min(6,inp.w-h.w); for(let k=0;k<n;k++) h.wq.push(R.t); h.w=inp.w; h.rv.whips+=n; whipTaps(h,n); }
    if(inp.ln!=null){ const ln=clamp(Math.round(inp.ln),0,SIM.LANES); if(ln/SIM.LANES!==h.lt){ h.lt=ln/SIM.LANES; h.laneMove=true; } }
    if(inp.rt!=null&&h.rt==null&&!R.started) h.rt=inp.rt;
    if(inp.rt!=null&&h.rt==null&&R.started&&h.go==null) h.rt=inp.rt;
  };
  R.setLane=(i,ln)=>R.input(i,{ln});
  function phase(h){ const rem=D-h.x; return h.x<D*0.22?'early':rem<=SIM.FINAL?'final':'mid'; }
  function whipTaps(h,n){
    const ph=phase(h), rate=h.wq.filter(t=>R.t-t<1).length;
    for(let k=0;k<n;k++){
      if(ph==='final'){ addMood(h,h.st<8?-1.6:-0.25); if(h.st<8) note(h,'ばてているのにムチを叩きすぎ','down'); }
      else { addMood(h,-1.4); h.k=clamp(h.k+7,0,100); note(h,'まだ早い!ムチで怒っている','down'); }
      if(rate>4){ addMood(h,-0.6); note(h,'ムチを叩きすぎ','down'); }
    }
  }
  function addMood(h,d){ h.m=clamp(h.m+d,0,100); }
  function note(h,text,kind){ if(h.last[text]&&R.t-h.last[text]<4) return; h.last[text]=R.t; ev(h,text,kind==='up'?1:-1); }
  const good=(h,ph)=>{ const s=h.style, a=h.a, wh=whipRate(h)>0;
    if(ph==='final') return a==='push'||wh;
    if(wh) return false;
    if(ph==='early') return (s==='nige'||s==='senko')?(a==='push'||a==='none'):(a==='hold'||a==='none');
    return a==='hold'||a==='none'; };
  const whipRate=h=>{ while(h.wq.length&&R.t-h.wq[0]>SIM.WHIP_T) h.wq.shift(); return Math.min(4,h.wq.length/SIM.WHIP_T); };

  R.start=()=>{ R.started=true; R.t0=R.t;
    H.forEach(h=>{ if(h.rt==null) h.rt=null; }); };

  R.step=(dt)=>{
    R.t+=dt;
    if(!R.started) return;
    const el=R.t-R.t0;
    // スタート:反応がない馬は1.5秒で自動で出る(出遅れ)
    H.forEach(h=>{ if(h.go!=null) return;
      if(h.rt!=null){ const r=h.rt, ts=r<0?0.9:Math.min(1.2,r); if(el<ts) return; h.go=ts; h.rv.rt=r; const late=Math.min(1.5,el-ts);
        h.v=Math.min(V0*0.9,SIM.ACC*late); h.x=0.5*SIM.ACC*late*late;
        if(r>=0&&r<=0.3){ h.v+=6; h.x+=6*late; note(h,'好スタート!','up'); addMood(h,4); } else if(r<0){ note(h,'あわてて出遅れた','down'); addMood(h,-5); } else if(r>0.7) note(h,'出遅れた','down'); }
      else if(el>1.6){ h.rt=1.6; h.go=1.2; h.rv.rt=null; h.v=SIM.ACC*0.4; note(h,'出遅れた','down'); } });
    // 並び(前から)
    const ord=H.slice().sort((a,b)=>b.x-a.x), rank=new Map(ord.map((h,k)=>[h,k])), lead=ord[0];
    H.forEach(h=>{
      if(h.go==null){ h.v=0; return; }
      if(h.fin!=null){ h.v=Math.max(V0*0.45,h.v-2*dt); h.x+=h.v*dt; return; }
      const ph=phase(h), f=N>1?rank.get(h)/(N-1):0, sty=STY[h.style], rem=D-h.x;
      const inZone=f>=sty.z[0]-0.001&&f<=sty.z[1]+0.001, zd=inZone?0:Math.min(Math.abs(f-sty.z[0]),Math.abs(f-sty.z[1]));
      // 前の馬(風よけ・前が壁)
      let draft=false, block=null;
      for(const o of H){ if(o===h||o.go==null) continue; const dx=o.x-h.x, dl=Math.abs(o.l-h.l);
        if(dx>0.6&&dx<5&&dl<0.18) draft=true;
        if(dx>0&&dx<2.6&&dl<0.13&&(!block||dx<block.dx)) block={o,dx}; }
      const wr=whipRate(h);
      // ---- 速さの目標 ----
      let act=SIM.ACT[h.a]||SIM.ACT.none;
      if(wr>0) act=Math.max(act,1.0)+SIM.WHIP_SPD*wr;
      if(ph==='final'&&(h.a==='push'||wr>0)){
        act+=0.0035*(h.h.kick-7);
        if(h.st>15) act+=({nige:0,senko:0.016,sashi:0.028,oikomi:0.038})[h.style];
      }
            const moodF=0.995+0.01*h.m/100, kakF=1+h.k*0.0005;
      const fat=h.st<=0?0.89:h.st<20?0.94+0.06*h.st/20:1;
      let target=V0*(1+0.02*(h.h.spd-7))*act*moodF*kakF*fat;
      if(ph!=='final'&&lead.x-h.x>24) target*=1.012;   // 離されすぎた馬は少し楽に追いつける(馬群がばらけすぎないように)
      if(block&&target>block.o.v){ target=Math.min(target,block.o.v+0.15); h.blockT+=dt; } else h.blockT=0;
      h.v+= (target>h.v?Math.min(SIM.ACC*dt,target-h.v):-Math.min(SIM.DEC*dt,h.v-target));
      // ---- 進む(コーナーの外側は距離が長い) ----
      const cf=corner(h.x)?1-SIM.CORNER*h.l:1;
      h.x+=h.v*dt*cf;
      // ---- レーン ----
      if(Math.abs(h.lt-h.l)>0.001){ const dir=Math.sign(h.lt-h.l); let hit=null;
        for(const o of H){ if(o===h||o.go==null||o.fin!=null) continue; const dx=Math.abs(o.x-h.x), side=(o.l-h.l)*dir; if(dx<1.7&&side>0&&side<0.15){ hit=o; break; } }
        if(hit&&h.bumpCD<=0){ h.bumpCD=1.5; h.lt=Math.round(h.l*SIM.LANES)/SIM.LANES; h.v*=0.97; hit.v*=0.98; addMood(h,-5); addMood(hit,-2); h.rv.bumps++;
          note(h,`${hit.no}番にぶつかった`,'down'); note(hit,`${h.no}番にぶつけられた`,'down'); say('bump'+h.no,`${h.no}番と${hit.no}番が接触!`,8); }
        else if(!hit){ h.l+=dir*Math.min(SIM.LANE_V*dt,Math.abs(h.lt-h.l)); }
      }
      h.bumpCD-=dt;
      // ---- スタミナ ----
      let dr=SIM.DRAIN[h.a]||SIM.DRAIN.none; if(wr>0) dr=Math.max(dr,SIM.DRAIN.push)+SIM.WHIP_DRAIN*wr;
      dr*=1-0.045*(h.h.sta-7);
      dr*=1.25-0.4*h.m/100;
      if(draft&&!block) dr*=0.7;
      dr*=1+h.k*0.009;
      if(inZone&&ph!=='final') dr*=0.92;
      if(rank.get(h)===0&&ph!=='final') dr*=h.style==='nige'?1.06:1.16;   // 先頭は風を受ける(逃げ馬は慣れている)
      h.st=Math.max(0,h.st-dr*dt);
      // ---- 掛かり ----
      if(ph==='final') h.k=Math.max(0,h.k-25*dt);
      else { let g=0; if(h.a==='hold') g=-10; else if(h.a==='push') g=h.h.temper*6; else g=h.h.temper*3; if(draft) g-=2.5; if(g>0) g*=1.5-h.m/100; h.k=clamp(h.k+g*dt,0,100); }
      // ---- 機嫌 ----
      let md=0;
      if(ph!=='final'&&h.x>D*0.15){ if(inZone) md+=0.45; else md-=0.12+zd*1.0; }
      md+=(h.h.mood0-h.m)*0.02;   // 少しずつ、もとの調子にもどる
      if(draft) md+=0.2;
      if(block&&h.blockT>0.5&&(h.a==='push'||wr>0)){ md-=1.2; note(h,'前が壁で走れずイライラ','down'); }
      if(h.k>60){ md-=0.6; note(h,'掛かっている!控えて落ち着かせよう','down'); }
      if(ph==='mid'&&h.a==='push'&&f<=sty.z[1]+0.001&&lead.x-h.x<12){ md-=0.8; note(h,'まだ追う場面じゃないと怒っている','down'); }
      if(ph==='final'&&h.a==='hold'){ md-=1.0; note(h,'もう行きたいのに止められている','down'); }
      h.chg=h.chg.filter(t=>R.t-t<3);
      if(h.chg.length>4&&h.toggleCD<=0){ addMood(h,-4); h.toggleCD=3; note(h,'手綱がバラバラで息が合わない','down'); }
      h.toggleCD-=dt;
      if(good(h,ph)){ h.steady+=dt; if(h.steady>3){ md+=0.5; if(h.steady>3&&h.steady<3+dt*1.5) note(h,'息が合っている','up'); } } else h.steady=0;
      if(inZone&&ph!=='final'&&f>=0) { if(!h.flags.zone) note(h,'得意な位置に入った','up'); }
      addMood(h,md*dt);
      // ---- 状態 ----
      h.flags={draft:draft&&!block,block:!!block&&h.blockT>0.3,zone:inZone,kak:h.k>50,bate:h.st<=0,ph,whip:wr>0,spurt:ph==='final'&&(h.a==='push'||wr>0)};
      // 振り返り
      if(ph!=='final'){ h.rv.zoneT+=dt; if(inZone) h.rv.zone+=dt; }
      if(draft&&!block) h.rv.draft+=dt;
      if(h.k>50) h.rv.kak+=dt;
      if(ph==='final'&&h.rv.spurtAt==null&&(h.a==='push'||wr>0)) h.rv.spurtAt=Math.round(rem/10)*10;
      if(h.rv.spurtAt==null&&ph==='mid'&&rem<SIM.FINAL+300&&wr>0) h.rv.early=1;
      h.rv.moodSum+=h.m*dt; h.rv.moodN+=dt;
      if(h.k>70) say('kak'+h.no,`${h.no}番、掛かり気味か`,12);
      if(h.st<=0) say('bate'+h.no,`${h.no}番、苦しくなった`,20);
      // ゴール
      if(h.x>=D){ const over=(h.x-D)/Math.max(1,h.v); h.fin=R.t-R.t0-over; h.rv.endSt=Math.round(h.st); R.finN++; h.place=R.finN; }
    });
    // 着順を、ゴールした時刻でそろえる(同じコマに入った馬)
    const fin=H.filter(h=>h.fin!=null).sort((a,b)=>a.fin-b.fin); fin.forEach((h,k)=>h.place=k+1);
  };
  R.order=()=>H.slice().sort((a,b)=>(a.fin!=null&&b.fin!=null)?a.fin-b.fin:(a.fin!=null?-1:b.fin!=null?1:b.x-a.x));
  R.done=()=>H.every(h=>h.fin!=null);
  return R;
}

/* ===== CPU騎手(ふつうの腕) ===== */
function cpuThink(R,i,mem){
  const h=R.H[i], D=R.D, rem=D-h.x, N=R.N, sty=STY[h.style];
  mem.t=(mem.t||0); if(R.t-mem.t<0.3) return null; mem.t=R.t;
  if(mem.spurt==null) mem.spurt=sty.spurt+((Math.random()*2-1)*70);
  if(mem.whipAt==null) mem.whipAt=({nige:250,senko:270,sashi:400,oikomi:460})[h.style]+Math.random()*80;
  if(mem.rate==null) mem.rate=({nige:1.5,senko:1.7,sashi:2.3,oikomi:2.8})[h.style]+Math.random()*0.8;
  const ord=R.H.slice().sort((a,b)=>b.x-a.x), f=N>1?ord.indexOf(h)/(N-1):0;
  const out={};
  if(rem>mem.spurt){
    if(h.k>45) out.a='hold';
    else if(f<sty.z[0]-0.06&&h.x>D*0.1) out.a='hold';
    else if(f>sty.z[1]+0.06) out.a=h.x<D*0.22?'push':(Math.random()<0.5?'push':'none');
    else out.a='none';
    { const k=ord.indexOf(h), gap=k>0?ord[k-1].x-h.x:0, toLead=ord[0].x-h.x, lim=({nige:5,senko:10,sashi:17,oikomi:23})[h.style];
      if(out.a==='hold'&&h.k<=45&&gap>3.5) out.a='none'; if(toLead>lim&&h.k<=45) out.a='push'; }
    // 内に寄る(空いていれば)。前が壁なら外へ
    const ln=Math.round(h.lt*SIM.LANES);
    if(rem<mem.spurt+160&&(h.style==='sashi'||h.style==='oikomi')&&ln<3) out.ln=ln+1;
    else if(h.flags.block&&h.blockT>1.2&&ln<SIM.LANES) out.ln=ln+1;
    else if(ln>0&&Math.random()<0.12&&!R.H.some(o=>o!==h&&Math.abs(o.x-h.x)<2.5&&o.l<h.l&&h.l-o.l<0.3)) out.ln=ln-1;
  } else {
    out.a='push';
    if(h.flags.block&&h.blockT>0.3){ const ln=Math.round(h.lt*SIM.LANES); if(ln<SIM.LANES) out.ln=ln+1; }
    if(rem<mem.whipAt&&h.st>6){ mem.wacc=(mem.wacc||0)+mem.rate*0.3; const n=Math.floor(mem.wacc); if(n>0){ mem.wacc-=n; out.w=h.w+n; } }
  }
  if(out.ln!=null){ const dir=Math.sign(out.ln/SIM.LANES-h.l); if(R.H.some(o=>o!==h&&o.fin==null&&Math.abs(o.x-h.x)<2.4&&(o.l-h.l)*dir>0&&(o.l-h.l)*dir<0.3)) delete out.ln; }
  return out;
}

function realCam(run,t){

}

/* ---------- 馬を作る ---------- */
function makeHorses(n,jk){
  const names=shuffle(NAMES).slice(0,n), sty=shuffle(['nige','senko','sashi','oikomi','nige','senko','sashi','oikomi','senko','sashi']).slice(0,n);
  return names.map((name,i)=>{ const T=Math.max(19,Math.min(23,Math.round(21+gaussR()))); const s=[4,4,4]; let left=T-12;
    while(left>0){ const k=Math.random()*3|0; if(s[k]<10){ s[k]++; left--; } }
    const sid=jk[i]; return {no:i+1,name,style:sty[i],spd:s[0],sta:s[1],kick:s[2],temper:+(0.2+Math.random()*0.8).toFixed(2),mood0:Math.round(48+Math.random()*24),coat:Math.random()*COATS.length|0,jn:sid?nm(sid):'CPU',js:sid?1:0}; });
}

/* ---------- レースの流れ ---------- */
function toWait(msg){ M.ph='wait'; M.msg=msg||''; M.jk={}; M.bets={}; M.R=null; M.resOrd=null; setPhase(); }
function setPhase(){ stDirty=panelDirty=true; }
function startPaddock(){
  if(!HOST||M.busy||!['wait','result'].includes(M.ph)) return;
  const c=people(); if(!c.length){ toWait('iPadでジョッキーダービーを開いている人がいません'); return; }
  const nh=Math.max(4,Math.min(10,C.nh)), nJ=Math.min(C.jmax,nh,c.length<=1?1:Math.max(1,Math.floor(c.length/2)));
  const fresh=shuffle(c.filter(s=>!M.lastJ.has(s))), old=shuffle(c.filter(s=>M.lastJ.has(s))), js=fresh.concat(old).slice(0,nJ);
  const slots=shuffle([...Array(nh).keys()]).slice(0,nJ); M.jk={}; js.forEach((s,k)=>M.jk[slots[k]]=s); M.lastJ=new Set(js);
  M.rid++; M.hs=makeHorses(nh,M.jk); M.bets={}; M.res={}; M.rv={}; M.R=null; M.mem=M.hs.map(()=>({})); M.inW={}; M.resOrd=null; M.said={}; M.tel=null; M.msg='';
  const keys=Object.keys(COURSES); M.ck=keys[Math.random()*keys.length|0]; const dir=COURSES[M.ck].dir; M.rh=dir==='right'||(dir==='mix'&&Math.random()<0.5); M.D=C.dist;
  setRaceScene(M.rid,M.hs,M.ck,M.rh,M.D); S.panel=true; S.follow=null;
  HOST.be.remove(JD+'/in').catch(()=>{}); IN={};
  M.ph='paddock'; M.dl=now()+C.betSec*1000; say(`第${M.rid}レース、${S.crs.full} 芝${M.D}m。パドックです`);
  members().forEach(writeMe); setPhase();
}
function closeBet(){
  if(M.ph!=='paddock') return;
  paint($('#cv'),gateRun());   // コースの形を確定させる(コーナーの判定に使う)
  const D=M.D, sec=D===1200?55:D===2000?85:70;
  M.R=createRace({D,V0:D/(sec-2.5),horses:M.hs,corner:x=>{ try{ const l=segOf(toS(x)); return l==='c12'||l==='c34'; }catch(e){ return false; } }});
  M.ph='gate'; M.gateAt=now()+6000+Math.random()*1800; M.dl=M.gateAt; say('各馬ゲートに入りました');
  members().forEach(writeMe); setPhase();
}
function openGate(){
  M.ph='race'; M.R.start(); S.gate={open:true}; M.finT=0; M.sayT=now()+2500; say('スタートしました!'); sfx.gate();
  M.hs.forEach((h,i)=>{ if(!h.js||!isHere(M.jk[i])) M.R.input(i,{rt:0.12+Math.random()*0.5}); });
  setPhase();
}
function applyInputs(){
  const R=M.R; if(!R||!['gate','race'].includes(M.ph)) return;
  Object.keys(M.jk).forEach(i=>{ const sid=M.jk[i], vk=vkOf(sid), v=vk&&IN[vk]; if(!v||v.r!==M.rid) return;
    const h=R.H[i], o={a:v.a,ln:v.ln}; const lw=M.inW[i]||0; if(v.w>lw){ o.w=h.w+Math.min(6,v.w-lw); M.inW[i]=v.w; }
    if(v.rt!=null&&h.rt==null) o.rt=+v.rt; R.input(+i,o); });
}
function say(t){ S.sayLog.push(t); if(S.sayLog.length>4) S.sayLog.shift(); }
function telop(text,sub){ sfx.telop(); if(text.startsWith('最後')) sfx.cheer(); M.telSeq++; M.tel={s:M.telSeq,text,sub,until:now()+3000}; S.fx.telop={text,sub,t0:performance.now()}; }
function commentary(){
  const R=M.R, t=now(), ord=R.order(), lead=ord[0], rem=Math.max(0,R.D-lead.x), nmH=h=>`${h.no}番 ${h.h.name}`;
  while(R.events.length) say(R.events.shift());
  if(!M.said.half&&rem<R.D*0.55){ M.said.half=1; say(`向こう正面。先頭は${nmH(lead)}、${ord[1]?`2番手に${ord[1].no}番`:''}`); }
  if(!M.said.k&&rem<=700){ M.said.k=1; telop('勝負どころ!',`残り${Math.round(rem/50)*50}m 各馬が動き出す`); say('勝負どころ!各馬が動き出す'); }
  if(!S.cam&&rem<=Math.min(G?G.sw:400,450)){ S.cam={}; telop('最後の直線!',`${S.crs.full} 直線 約${G?G.sw:400}m`); say(`最後の直線!先頭は${nmH(lead)}`); }
  if(t>=M.sayT&&lead.fin==null){ M.sayT=t+4500; const k=(M.said.n=(M.said.n||0)+1)%4;
    if(S.cam){ const ch=ord.slice(1,5).filter(h=>h.flags.spurt&&h.v>lead.v+0.15)[0]; say(ch?`${nmH(ch)}、${ch.h.js?ch.h.jn+'騎手が追って':''}外から伸びてくる!`:`先頭は${nmH(lead)}、粘る!`); }
    else if(k===0) say(`先頭は${nmH(lead)}${lead.h.js?'、'+lead.h.jn+'騎手':''}`);
    else if(k===1){ const m=ord[Math.floor(ord.length/2)]; say(`中団に${nmH(m)}`); }
    else if(k===2){ const l=ord[ord.length-1]; say(`最後方から${nmH(l)}、じっくり構える`); }
    else { const d=ord.find(h=>h.flags.draft&&h.h.js); say(d?`${d.no}番 ${d.h.jn}騎手、前の馬を風よけにしている`:`2番手は${nmH(ord[1]||lead)}`); } }
}
function tick(){
  if(!HOST) return;
  const t=now(), dt=Math.min(0.2,lastTick?(t-lastTick)/1000:0.05); lastTick=t;
  SND.scene(M.ph==='gate'?'gate':M.ph==='race'?(S.cam?'final':'race'):M.ph==='result'?'result':M.ph==='stop'?null:'paddock');
  if(M.ph==='paddock'&&t>=M.dl) closeBet();
  else if(M.ph==='gate'&&t>=M.gateAt) openGate();
  else if(M.ph==='result'&&!M.busy&&t>=M.dl){ if(C.auto&&people().length) startPaddock(); else toWait(''); }
  if(M.R&&(M.ph==='race'||M.ph==='result')){

          ${[['スピード',h.spd],['スタミナ',h.sta],['瞬発力',h.kick]].map(([n,x])=>`<div class="stat"><span>${n}</span><i><b style="width:${x*10}%"></b></i><em>${rankL(x)}</em></div>`).join('')}

        <div class="pc"><b>${sty.n}のおすすめの乗り方</b><div class="plan">${plan.map(([a,b])=>`<div><em>${a}</em><span>${b}</span></div>`).join('')}</div>
          <b>馬の機嫌</b><p class="note">機嫌がいいとスタミナが減りにくく、悪いと早くばてます。<br>よくなる:得意な位置を走る・場面に合った指示を続ける(息が合う)・風よけ<br>悪くなる:早い時期のムチ・ムチの叩きすぎ・指示をころころ変える・ほかの馬にぶつかる・前が壁なのに追う・掛かる</p></div></div></div>`;
    return; }
  if(mode==='raceJ'){
    const h=hs[role];
    app.innerHTML=`<div class="pfull race">
      <div class="jtop"><span class="hn">${noTag(h.no)}<b>${esc(h.name)}</b><span class="chipx">${STY[h.style].n}</span></span><span class="sp"></span><span>順位 <b class="big" id="jRank">-</b>/${hs.length}</span><span>残り <b class="big" id="jRem">-</b>m</span></div>
      <div class="jscr"><canvas id="cv"></canvas>
        <div class="form" id="form"></div><div class="hint" id="hint"></div><div class="mnote" id="mnote" hidden></div>

    document.querySelectorAll('.acts .a').forEach(b=>b.addEventListener('pointerdown',e=>{ e.preventDefault(); P.inp.a=b.dataset.a; sfx.tap(); sendIn(); updMode('raceJ'); }));
    $('#whip').addEventListener('pointerdown',e=>{ e.preventDefault(); if(P.st.ph!=='race') return; P.inp.w++; sfx.whip(); sendIn(); const w=$('#whip'); w.classList.remove('hit'); void w.offsetWidth; w.classList.add('hit'); });
    const mv=d=>{ const f=myF(); let ln=P.inp.ln; if(ln==null) ln=f?Math.round(f[1]/100*SIM.LANES):Math.round(role/Math.max(1,hs.length-1)*SIM.LANES); P.inp.ln=Math.max(0,Math.min(SIM.LANES,ln+d)); sfx.lane(); sendIn(); };
    $('#bIn').addEventListener('pointerdown',e=>{ e.preventDefault(); mv(-1); }); $('#bOut').addEventListener('pointerdown',e=>{ e.preventDefault(); mv(1); });

    $('#startb').addEventListener('pointerdown',e=>{ e.preventDefault(); if(P.inp.rt!=null) return; const st=P.st; if(!st||!st.gateAt&&st.ph==='gate') return;
      const g=P.gateLocal; if(g==null) return; P.inp.rt=+((now()-g)/1000).toFixed(3); if(P.inp.rt<0) P.inp.rt=-1; (P.inp.rt>=0&&P.inp.rt<=0.3?sfx.goodStart:P.inp.rt<0||P.inp.rt>0.7?sfx.badStart:sfx.tap)(); sendIn(true); });
    S.panel=false; S.follow=role; S.glow=new Set([h.no]); return; }
  if(mode==='raceS'){
    app.innerHTML=`<div class="pfull race"><div class="sscr"><canvas id="cv"></canvas>
      <div class="camsw" id="camsw"></div><div class="ordl" id="ordl"></div><div class="myb" id="myb"></div></div></div>`;
    $('#camsw').onclick=e=>{ const b=e.target.closest('[data-c]'); if(b){ P.cam=b.dataset.c; updMode('raceS'); } };
    S.panel=true; return; }
  if(mode==='res'){ app.innerHTML=`<div class="pfull">${headHtml(true)}<div class="pres" id="pres"></div></div><div id="mod"></div>`; bindHead(); P.resKey=''; return; }
}
function updMode(mode,force){
  const st=P.st||{}, hs=st.hs||[], me=meNow(), role=myIdx(), left=leftP(), med=$('#hMed');
  if(med) med.textContent=yen(myBal());

  const ri=$('#rInfo'); if(ri&&st.ck) ri.textContent=`第${st.r}レース ${COURSES[st.ck].full} 芝${st.D}m ${st.rh?'右':'左'}回り`;
  if(mode==='wait'){ const w=$('#wMsg'); if(w) w.textContent=st.msg||(st.ph==='wait'||!st.ph?'先生がレースを始めるまで待ってね':''); return; }
  const poolA=st.pool||{}, tot=st.tot||0, odds=no=>poolA[no]?Math.max(1,(1-st.rake/100)*tot/poolA[no]):0;
  if(mode==='padB'){
    const bets=me.bets||{}, k=JSON.stringify([poolA,bets,P.sel,availP()]);
    if(k===P.betKey&&!force) return; P.betKey=k;
    $('#rows').innerHTML=hs.map(h=>{ const o=odds(h.no); return `<tr data-no="${h.no}" class="${P.sel===h.no?'on':''}"><td>${noTag(h.no)}</td><td class="nm">${esc(h.name)}</td><td class="jn">${jkTag(h)}</td><td>${STY[h.style].n}</td><td>${rankL(h.spd)}</td><td>${rankL(h.sta)}</td><td>${rankL(h.kick)}</td><td>${COND(h.mood0)}</td><td class="od ${o&&o<5?'hot':''}">${o?o.toFixed(1):'—'}</td><td class="mine">${bets[h.no]?bets[h.no]+'枚':''}</td></tr>`; }).join('');
    const h=hs.find(x=>x.no===P.sel), box=$('#betBox'), total=Object.values(bets).reduce((a,b)=>a+b,0);
    box.innerHTML=h?`<small>選んでいる馬</small><div class="hn">${noTag(h.no)}<span>${esc(h.name)}</span></div><div class="jn">騎手 ${jkTag(h)}</div>
        <div class="q">${[1,5,10,50].map(n=>`<button data-q="${n}" ${n>availP()?'disabled':''}>+${n}</button>`).join('')}</div>
        <div class="ln"><span>この馬に</span><b>${bets[h.no]||0}枚</b></div><div class="ln"><span>当たれば(いまの倍率)</span><b class="gold">${bets[h.no]&&odds(h.no)?yen(Math.max(bets[h.no],Math.floor(bets[h.no]*odds(h.no)))):'—'}枚</b></div>`
      :'<p class="note">左の出馬表から、1着になると思う馬をタップしてください。</p>';
    box.innerHTML+=`<div class="ln"><span>BET合計</span><b>${total}枚</b></div><div class="ln"><span>使えるメダル</span><b>${yen(availP())}枚</b></div>${total?'<button class="pbtn sm" id="unbet">BETを全部取り消す</button>':''}<p class="perr" id="bErr"></p>`;
    box.querySelectorAll('[data-q]').forEach(b=>b.onclick=async()=>{ if(P.busy) return; P.busy=true; const r=await PAD.req('g:bet',{no:P.sel,amt:+b.dataset.q},GID); P.busy=false; if(r.ok) sfx.coin(); else { const e=$('#bErr'); if(e) e.textContent=r.msg; } });
    const u=$('#unbet'); if(u) u.onclick=async()=>{ const r=await PAD.req('g:unbet',{},GID); toast(r.msg); };
    return; }
  if(mode==='padJ'){ const h=hs[role]; if(!h) return;
    const rk=hs.slice().sort((a,b)=>(poolA[b.no]||0)-(poolA[a.no]||0)).findIndex(x=>x.no===h.no)+1, o=odds(h.no);
    $('#pRank').textContent=tot?rk+'番人気':'—'; $('#pOdds').textContent=o?`単勝 ${o.toFixed(1)}倍`:''; $('#pPool').textContent=yen(poolA[h.no]||0)+'枚';
    $('#pFee').textContent=`騎手報酬 ${Math.floor((poolA[h.no]||0)*st.rake/100)}枚 + 着順ボーナス(1着${st.bon[0]}・2着${st.bon[1]}・3着${st.bon[2]})`; return; }
  if(mode==='raceS'){
    const bets=me.bets||{}, mine=Object.keys(bets).filter(k=>bets[k]).map(Number); S.glow=new Set(mine);
    const fo=P.cam==='lead'?null:hs.findIndex(h=>h.no===+P.cam); S.follow=fo!=null&&fo>=0?fo:null;
    const k=JSON.stringify([P.cam,mine]); if(k!==P.camKey){ P.camKey=k; $('#camsw').innerHTML=`<button data-c="lead" class="${P.cam==='lead'?'on':''}">先頭集団</button>`+mine.map(no=>`<button data-c="${no}" class="${+P.cam===no?'on':''}">${no}番(自分の馬券)</button>`).join('');
      $('#myb').innerHTML=mine.length?'あなたの馬券 '+mine.map(no=>`${noTag(no)} ${bets[no]}枚`).join(' '):'このレースはBETしていません'; }
    return; }
  if(mode==='raceJ'){
    document.querySelectorAll('.acts .a').forEach(b=>b.classList.toggle('on',b.dataset.a===P.inp.a)); return; }
  if(mode==='res'){
    const res=st.res, k=JSON.stringify([res&&res.ord,me.res,me.rv,st.busy]); if(k===P.resKey) return; P.resKey=k;
    if(!res){ $('#pres').innerHTML='<div class="pc cen"><h2>着順を確認しています…</h2></div>'; return; }
    const w=hs[res.ord[0]], rv=me.rv, r=me.res;
    if(r&&P.resSnd!==st.r){ P.resSnd=st.r; setTimeout(r.net>0?sfx.win:r.net<0?sfx.lose:()=>{},600); }
    $('#pres').innerHTML=`<div class="win"><span class="p1">1着</span><div><b>${w.no}番 ${esc(w.name)}</b><small>騎手 ${w.js?esc(w.jn):'CPU'}${res.odds?` ・ 単勝 ${res.odds.toFixed(1)}倍`:''}</small></div></div>
      <div class="rgrid"><div class="pc"><b>着順</b>${res.ord.map((i,k2)=>{ const h=hs[i]; return `<div class="or ${i===role?'me':''}"><em>${k2+1}</em>${noTag(h.no)}<span class="nm">${esc(h.name)}</span><small>${(res.gap&&res.gap[k2])||''}</small><span class="jn">${h.js?esc(h.jn):'CPU'}</span></div>`; }).join('')}</div>
      <div><div class="pc"><b>あなたの結果</b>${r?`<div class="net ${r.net>0?'up':r.net<0?'dn':''}">${r.net>0?'+':''}${yen(r.net)}枚</div>${(r.lines||[]).map(l=>`<p class="note">${esc(l)}</p>`).join('')}`:(st.busy?'<p class="note">精算しています…</p>':'<p class="note">このレースはBETしていません。</p>')}</div>
      ${rv?`<div class="pc"><div class="rvh"><b>騎乗の振り返り(${rv.place}着)</b><span>評価 <em>${rv.grade}</em></span></div>${(Array.isArray(rv.L)?rv.L:Object.values(rv.L||{})).map(x=>`<div class="rv"><span>${esc(x[0])}</span><b>${esc(x[1])}</b><small class="${x[2]>0?'g':x[2]<0?'w':''}">${esc(x[3])}</small></div>`).join('')}</div>`:''}
      <p class="note cen">次のレースまで あと<span id="cd2">${left}</span>秒</p></div></div>`;
    return; }
}
// 毎コマの更新(騎手のゲージ・隊列・ヒント、観戦の順位)
let dynT=0;
function padDyn(){
  const t=now(); if(t-dynT<120) return; dynT=t;
  const st=P.st, f=P.f; if(!st||!st.hs) return; const hs=st.hs, role=myIdx();
  if(st.ph==='gate'&&st.gateAt) P.gateLocal=st.gateAt+(P.off||0);
  const mode=P.key.split(':')[0];
  if(mode!=='raceJ'&&mode!=='raceS') return;
  const ok=f&&f.r===st.r&&f.h.length===hs.length;
  const ord=ok?f.h.map((h,i)=>i).sort((a,b)=>{ const A=f.h[a],B=f.h[b]; return (A[6]&&B[6])?A[6]-B[6]:A[6]?-1:B[6]?1:B[0]-A[0]; }):hs.map((h,i)=>i);
  if(mode==='raceS'){
    const el=$('#ordl'); if(el) el.innerHTML='<div class="oh"><span>いまの順位</span><span>騎手</span></div>'+ord.map((i,k)=>{ const h=hs[i]; return `<div class="o ${S.glow&&S.glow.has(h.no)?'me':''}"><em>${k+1}</em>${noTag(h.no)}<span class="nm">${esc(h.name)}</span><span class="jn ${h.js?'s':''}">${h.js?esc(h.jn):'CPU'}</span></div>`; }).join('');
    return; }
  const h=hs[role]; if(!h) return; const sty=STY[h.style], me=ok?f.h[role]:null;
  const sb=$('#startb'), gateT=P.gateLocal, open=gateT!=null&&t>=gateT, racing=st.ph==='race'||(ok&&f.g);
  if(sb){ const show=(st.ph==='gate'||(st.ph==='race'&&P.inp.rt==null&&t-(gateT||t)<1600));
    sb.hidden=!show||P.inp.rt!=null&&open&&t-gateT>900;
    if(show){ sb.classList.toggle('go',open&&P.inp.rt==null); sb.firstChild.textContent=P.inp.rt!=null?(P.inp.rt<0?'早すぎた…出遅れ':P.inp.rt<=0.3?`好スタート! ${P.inp.rt.toFixed(2)}秒`:`スタート ${P.inp.rt.toFixed(2)}秒`):open?'スタート!タップ!':'ゲートが開いたらタップ!'; } }
  const rank=ord.indexOf(role)+1, N=hs.length, rem=me?Math.max(0,Math.round((st.D-me[0]/10)/10)*10):st.D;
  $('#jRank').textContent=me&&me[6]?me[6]:rank; $('#jRem').textContent=rem;
  // 隊列(左が先頭)
  const z0=Math.round(sty.z[0]*(N-1)), z1=Math.round(sty.z[1]*(N-1));
  $('#form').innerHTML=`<small>${sty.n}の<br>得意位置</small><div class="fl">${ord.map((i,k)=>`<span class="${k>=z0&&k<=z1?'z':''} ${i===role?'me':''}" style="background:${wk(hs[i].no)[0]};color:${wk(hs[i].no)[1]}">${hs[i].no}</span>`).join('')}</div><small>← 先頭</small>`;
  const ln=P.inp.ln!=null?P.inp.ln:me?Math.round(me[1]/100*SIM.LANES):Math.round(role/Math.max(1,N-1)*SIM.LANES), cur=me?me[1]/100*SIM.LANES:ln;
  $('#lcol').innerHTML='<small>内</small>'+Array.from({length:SIM.LANES+1},(_,k)=>`<i class="${k===ln?'t':''} ${Math.abs(k-cur)<0.5?'c':''}"></i>`).join('')+'<small>外</small>';
  if(!me) return;
  const stv=me[2], kv=me[3], mv=me[4], fl=me[5], md=moodOf(mv);
  $('#gSt').style.width=stv+'%'; $('#gSt').style.background=stv<20?'#e0523c':'#5cc46e'; $('#vSt').textContent=stv+'%';
  $('#gK').style.width=kv+'%'; $('#vK').textContent=kv>50?'掛かっている':kv+'%';
  $('#gM').style.width=mv+'%'; $('#gM').style.background=md[2]; $('#vM').textContent=md[1];
  const F=[]; if(fl&1) F.push(['風よけ中:スタミナが減りにくい','g']); if(fl&2) F.push(['前が壁:追っても伸びない','w']); if(fl&4&&rem>500) F.push(['得意な位置','g']); else if(rem>500&&racing&&me[0]>st.D*1.5) F.push(['得意な位置じゃない','w']); if(fl&8) F.push(['掛かっている','w']); if(fl&16) F.push(['ばてた','w']);
  $('#flags').innerHTML=F.map(x=>`<span class="${x[1]}">${x[0]}</span>`).join('');
  // 機嫌のお知らせ
  const n=f.n&&f.n[role]; if(n&&n[0]!==P.noteSeq){ P.noteSeq=n[0]; P.note={text:n[1],mood:n[2],until:t+2600}; (String(n[1]).includes('ぶつ')?sfx.bump:n[2]>0?sfx.moodUp:sfx.moodDown)(); }
  const mn=$('#mnote'); if(P.note&&P.note.until>t){ mn.hidden=false; mn.className='mnote '+(P.note.mood>0?'up':'dn'); mn.textContent=(P.note.mood>0?'機嫌↑ ':'機嫌↓ ')+P.note.text; } else mn.hidden=true;
  // ヒント
  let hint=''; const x=me[0]/10, D=st.D;
  if(st.ph==='gate') hint='ゲートが開いた瞬間に、まん中のボタンをタップ!';
  else if(me[6]) hint=`ゴール! ${me[6]}着`;
  else if(rem<=500) hint=(fl&16)?'ばてた…ムチは逆効果。追うだけにしよう':(fl&2)?'前が壁!内か外へ出そう':stv>25?'いまだ!「追う」とムチで仕上げ!':'「追う」で粘ろう。ムチはスタミナと相談';
  else if(fl&8) hint='掛かっている。「控える」で落ち着かせよう';
  else if(rem<=680) hint='もうすぐ仕掛けどころ(残り500m)。前を開けておこう';
  else if(x<D*0.22) hint=(h.style==='nige'||h.style==='senko')?'「追う」で前の位置を取ろう':'「控える」で後ろに下げよう';
  else if(fl&2) hint='前が壁。横へ出るか、そのまま風よけに';
  else if(!(fl&4)) hint=rank-1<z0?`前に行きすぎ。「控える」で${sty.n}の位置へ`:`後ろすぎ。少し「追う」で${sty.n}の位置へ`;
  else if(fl&1) hint='いい風よけ。このままスタミナを温存';
  else hint='いい位置。「馬なり」でスタミナを温存しよう';
  $('#hint').textContent=hint;
}
function amtModal(kind){
  const v=P.view, a=seatA(), max=kind==='add'?v.b||0:availP(); let amt=Math.min(kind==='add'?100:max,max);
  const box=$('#mod'); if(!box) return;
  const draw=()=>{ amt=Math.max(0,Math.min(max,Math.floor(+amt||0)));
    box.innerHTML=`<div class="pmodal"><div class="pc"><h2>${kind==='add'?'貯金から追加':'一部だけ貯金にもどす'}</h2><p class="note">${kind==='add'?`貯金 ${yen(max)}枚`:`もどせるメダル ${yen(max)}枚`}</p>
      <div class="amt"><input id="mIn" type="number" inputmode="numeric" value="${amt}"><span>枚</span></div>
      <div class="quick">${[10,50,100].map(n=>`<button data-q="${n}" ${n>max?'disabled':''}>${n}枚</button>`).join('')}<button data-q="${max}">全部</button></div>
      <p class="perr" id="mErr"></p><div class="mrow"><button class="pbtn" id="mNo">やめる</button><button class="pbtn go" id="mGo">${kind==='add'?'追加する':'もどす'}</button></div></div></div>`;
    $('#mIn').oninput=e=>{ amt=e.target.value; };
    box.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ amt=+b.dataset.q; draw(); });
    $('#mNo').onclick=()=>{ box.innerHTML=''; };
    $('#mGo').onclick=async()=>{ amt=Math.floor(+$('#mIn').value||0); if(amt<1) return; $('#mGo').disabled=true;
      try{ const r=await PAD.req(kind,{amt},GID); if(!r.ok){ $('#mErr').textContent=r.msg; return; } box.innerHTML=''; toast(r.msg); } finally { const g=$('#mGo'); if(g) g.disabled=false; } };
  }; draw();
}
