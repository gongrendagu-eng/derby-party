<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スロットパーク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Orbitron:wght@700;900&family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<script src="mg-core.js"></script>
<script>
/* スロットパーク：抽選と配当（先生のPCで動く。iPadは表示に使う定数だけ読む） */
(function (root) {
  'use strict';
  const R = () => Math.random();
  const ri = (n) => Math.floor(R() * n);
  const wpick = (list) => { // [[item, weight], ...]
    let t = 0; for (const x of list) t += x[1];
    let r = R() * t;
    for (const x of list) { r -= x[1]; if (r < 0) return x[0]; }
    return list[list.length - 1][0];
  };
  // 端数を持ち越して払う（還元率を正確に保つ）
  const payFrac = (st, v) => { const t = v + (st.frac || 0); const p = Math.floor(t + 1e-9); st.frac = t - p; return p; };

  const MACHINES = [
    // BETは min〜max を step きざみで自由に選べる。配当はBETに比例するので、還元率はBETに関係なく同じ
    { id: 'classic', name: 'フルーツクラシック', style: 'pop', bet: { min: 1, max: 100, step: 1, def: 1 } },
    { id: 'oshi', name: '目押しチャレンジ', style: 'chic', bet: { min: 3, max: 30, step: 3, def: 3 } },
    { id: 'wide', name: 'ワイドライン', style: 'pop', bet: { min: 1, max: 100, step: 1, def: 1 } },
    { id: 'rocket', name: '連チャンロケット', style: 'pop', bet: { min: 1, max: 100, step: 1, def: 2 } },
    { id: 'jackpot', name: 'ジャックポット777', style: 'chic', bet: { min: 5, max: 50, step: 5, def: 5 } },
    { id: 'drop', name: 'キラリドロップ', style: 'pop', bet: { min: 1, max: 100, step: 1, def: 1 } },
    // ⑦ は id を 'battle' のまま、中身を KAGUYA に差し替え(先生のPCに保存した台の状態をそのまま使うため)
    { id: 'battle', name: 'KAGUYA', style: 'chic', bet: { min: 3, max: 30, step: 3, def: 3 } }
  ];

  /* ---------- ① フルーツクラシック ---------- */
  const C_SYMS = ['seven', 'bar', 'bell', 'grape', 'lemon', 'cherry'];
  const C_OUT = [ // [結果, 倍率(BETに対して), 確率]
    ['seven', 100, 1 / 2000], ['bar', 30, 1 / 400], ['bell', 15, 1 / 70], ['grape', 8, 1 / 40],
    ['lemon', 6, 1 / 30], ['cherry3', 5, 1 / 100], ['cherry', 2, 1 / 12]
  ];
  const C_LINES = [1, 0, 2]; // ライン1=中段, 2=上段, 3=下段
  function classicGrid(out, lineIdx, bet) {
    for (let tries = 0; tries < 500; tries++) {
      const g = [0, 1, 2].map(() => [0, 1, 2].map(() => C_SYMS[ri(C_SYMS.length)]));
      if (out) {
        const r = C_LINES[lineIdx];
        if (out === 'cherry') { g[r][0] = 'cherry'; } else { const s = out === 'cherry3' ? 'cherry' : out; g[r] = [s, s, s]; }
      }
      let ok = true;
      for (let i = 0; i < bet; i++) {
        const row = g[C_LINES[i]];
        const win = out && i === lineIdx;
        if (win && out === 'cherry') { if (row[1] === 'cherry' || (row[1] === row[2] && row[1] === row[0])) ok = false; continue; }
        if (win) continue;
        if (row[0] === 'cherry' || (row[0] === row[1] && row[1] === row[2])) ok = false;
      }
      if (ok) return g;
    }
    return [['lemon', 'grape', 'bell'], ['grape', 'bell', 'lemon'], ['bell', 'lemon', 'grape']];
  }
  function classicSpin(st, bet) {
    let r = R(), out = null, mult = 0;
    for (const o of C_OUT) { if (r < o[2]) { out = o[0]; mult = o[1]; break; } r -= o[2]; }
    const lines = Math.min(bet, 3); // 光るラインは最大3本(BETが多いほど配当が大きい)
    const line = out ? ri(lines) : -1;
    const pay = mult * bet;
    return { pay, bet, out, line, lines, grid: classicGrid(out, line, lines) };
  }

  /* ---------- ② 目押し / ⑦ KAGUYA（パチスロ） ---------- */
  const P_STRIP = ['seven', 'bell', 'replay', 'lemon', 'bell', 'replay', 'cherry', 'bell', 'replay', 'bar', 'bell',
    'replay', 'lemon', 'bell', 'replay', 'cherry', 'bell', 'replay', 'lemon', 'bell', 'replay'];
  const P_PROB = { replay: 1 / 7.3, bell: 1 / 7.5, cherry: 1 / 36, big: 1 / 280, reg: 1 / 400 };
  const P_PAY = { replay: 3, bell: 8, cherry: 4, bonusGame: 12 };
  const P_GAMES = { big: 30, reg: 12 };
  function pachiLever(st, bet) {
    let k = Math.max(1, Math.round(bet / 3));
    // ボーナスが当たってから終わるまでは、当たったときのBETで固定(当たってからBETを上げて増やすのを防ぐ)
    if (st.held || st.bonus) { if (!st.hk) st.hk = k; k = st.hk; }
    st.k = k;
    const res = { bet: 3 * k, pay: 0, newHit: false, k };
    if (st.bonus) {
      st.bonus.left--; res.flag = 'bonusGame'; res.pay = P_PAY.bonusGame * k;
      res.bonus = { type: st.bonus.type, left: st.bonus.left };
      st.bonusGet = (st.bonusGet || 0) + res.pay - 3 * k;
      res.bonusGet = st.bonusGet;
      if (st.bonus.left <= 0) { res.bonusEnd = true; st.bonus = null; st.bonusGet = 0; if (!st.held) st.hk = null; }
      st.last = null; res.held = st.held || null; return res;
    }
    let r = R(), flag = 'none';
    for (const f of ['replay', 'bell', 'cherry']) { if (r < P_PROB[f]) { flag = f; break; } r -= P_PROB[f]; }
    if (!st.held) {
      const b = R();
      if (b < P_PROB.big) { st.held = 'big'; res.newHit = true; st.hk = k; }
      else if (b < P_PROB.big + P_PROB.reg) { st.held = 'reg'; res.newHit = true; st.hk = k; }
    }
    res.flag = flag; res.held = st.held || null;
    if (flag === 'replay') res.pay = P_PAY.replay * k;
    if (flag === 'bell') res.pay = P_PAY.bell * k;
    st.last = flag; st.games = (st.games || 0) + 1;
    return res;
  }
  function pachiStop(st, d) {
    const res = { bet: 0, pay: 0 };
    if (st.last === 'cherry' && d.cherryOk) res.pay = P_PAY.cherry * (st.k || 1);
    st.last = null;
    if (d.aligned && st.held && !st.bonus) {
      st.bonus = { type: st.held, left: P_GAMES[st.held] }; st.bonusGet = 0;
      st.count = st.count || { big: 0, reg: 0 }; st.count[st.held]++;
      res.bonusStart = st.held; st.held = null; st.games = 0; st.lampOn = false;
    }
    res.held = st.held || null;
    return res;
  }
  // 液晶演出（KAGUYA）。確率はメダまるバトルのときと同じ
  function battleEffect(res) {
    if (res.flag === 'bonusGame') return { scene: 'bonusGame' };
    if (res.newHit) return { scene: wpick([['gold', 30], ['red', 25], ['battleWin', 30], ['rainbow', 15]]), hit: true };
    const r = R();
    if (r < 0.05) return { scene: 'green' };
    if (r < 0.065) return { scene: 'red' };
    if (r < 0.075) return { scene: 'battleLose' };
    if (res.flag === 'cherry') return { scene: 'chance' };
    return { scene: 'normal' };
  }

  /* ---------- ③ ワイドライン（5リール・243ウェイ） ---------- */
  // 左のリールから、となりの列のどこかに同じ絵柄があればつながる(ラインなし)。同じ列に2つあれば2通り。
  // 1本のリールに同じ絵柄は1つまで。WILDはフリースピン中だけ2〜5列目に出て、ほし以外の代わりになり、WILDを含む当たりは配当2倍。
  // 配当表の数字は「BETに対して何倍か」。いちばん小さい当たりでもBETと同じ枚数(BET割れの当たりはない)。
  const W_SYMS = [['seven', 2], ['crown', 2.5], ['gem', 3], ['bell', 3.5], ['bar', 3.5], ['melon', 4], ['grape', 4], ['orange', 4], ['cherry', 4.5], ['lemon', 4.5], ['star', 1.4]];
  const W_FSYMS = [['seven', 2], ['crown', 2.5], ['gem', 3], ['bell', 3.5], ['bar', 3.5], ['melon', 4], ['grape', 4], ['orange', 4], ['cherry', 4.5], ['lemon', 4.5], ['star', 1.4], ['wild', 1.05]];
  const W_PAY = { // [_,_,_, 3つ, 4つ, 5つ]
    seven: [0, 0, 0, 3, 10, 50], crown: [0, 0, 0, 2, 5, 30], gem: [0, 0, 0, 2, 4, 20], bell: [0, 0, 0, 1.5, 3, 12], bar: [0, 0, 0, 1.5, 3, 12],
    melon: [0, 0, 0, 1, 3, 8], grape: [0, 0, 0, 1, 2, 6], orange: [0, 0, 0, 1, 2, 6], cherry: [0, 0, 0, 1, 1.5, 4], lemon: [0, 0, 0, 1, 1.5, 4]
  };
  const W_SCAT = [0, 0, 0, 2, 5, 20];   // ほしの数ごとの配当(どこに出てもよい)
  const W_FSN = [0, 0, 0, 10, 15, 20];  // ほしの数ごとのフリースピン回数(フリースピン中も上乗せ)
  const W_WILDX = 2;
  const W_FS = 10;
  function wideGrid(free) { // grid[row][reel]
    const g = [[], [], []];
    for (let c = 0; c < 5; c++) {
      const used = {};
      for (let r = 0; r < 3; r++) {
        let s; do { s = wpick(free && c > 0 ? W_FSYMS : W_SYMS); } while (used[s]);
        used[s] = 1; g[r][c] = s;
      }
    }
    return g;
  }
  function wideEval(g) {
    let m = 0; const wins = [];
    for (const s of Object.keys(W_PAY)) {
      let n = 0, ways = 1; const cells = [];
      for (let c = 0; c < 5; c++) {
        let k = 0;
        for (let r = 0; r < 3; r++) { const x = g[r][c]; if (x === s || (x === 'wild' && c > 0)) { k++; cells.push([r, c]); } }
        if (!k) break;
        n++; ways *= k;
      }
      const v = W_PAY[s][n] || 0;
      if (v > 0) {
        const wild = cells.some(([r, c]) => g[r][c] === 'wild');
        const mul = wild ? W_WILDX : 1;
        m += v * ways * mul;
        wins.push({ sym: s, n, ways, wild, x: v * ways * mul, cells });
      }
    }
    let stars = 0; const starCells = [];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 5; c++) if (g[r][c] === 'star') { stars++; starCells.push([r, c]); }
    m += W_SCAT[Math.min(stars, 5)] || 0;
    return { m, wins, stars, starCells };
  }
  function wideSpin(st, bet) {
    const free = st.fs > 0;
    if (free) { bet = st.fsBet; st.fs--; }
    const g = wideGrid(free); const ev = wideEval(g);
    const pay = payFrac(st, ev.m * bet);
    const res = { bet: free ? 0 : bet, pay, grid: g, wins: ev.wins, stars: ev.stars, starCells: ev.starCells, free };
    if (free) st.fsWin = (st.fsWin || 0) + pay;
    if (ev.stars >= 3) {
      if (!free) { st.fsBet = bet; st.fsWin = 0; }
      const add = W_FSN[Math.min(ev.stars, 5)];
      st.fs = (st.fs || 0) + add; res.fsStart = !free; res.fsAdd = add; res.fsMore = free;
    }
    res.fs = st.fs || 0; res.fsWin = st.fsWin || 0; res.fsBet = st.fsBet || bet;
    if (free && st.fs === 0) res.fsEnd = true;
    return res;
  }

  /* ---------- ④ 連チャンロケット ---------- */
  const K_LV = [0, 3, 4, 5, 6, 8, 10, 12, 15, 20, 50]; // レベルごとの配当（BETの倍）
  const K_CONT = 0.8;
  const K_OUT = [['rocket', 0, 1 / 61.5], ['bell', 5, 1 / 40], ['cherry', 2, 1 / 8]];
  const K_FILL = ['seven', 'star', 'gem', 'bell', 'cherry', 'lemon'];
  function rocketReels(sym) {
    let a, tries = 0;
    do { a = [0, 1, 2].map(() => K_FILL[ri(K_FILL.length)]); tries++; }
    while (tries < 200 && ((a[0] === a[1] && a[1] === a[2]) || a[0] === 'cherry'));
    if (sym === 'rocket') a = ['rocket', 'rocket', 'rocket'];
    else if (sym === 'bell') a = ['bell', 'bell', 'bell'];
    else if (sym === 'cherry') { a[0] = 'cherry'; if (a[1] === 'cherry') a[1] = 'lemon'; }
    else if (sym === 'miss') { a = ['rocket', 'rocket', K_FILL[ri(K_FILL.length)]]; }
    return a;
  }
  function rocketSpin(st, bet) {
    if (st.chain) { // 連チャン中（BETなし）
      const c = st.chain;
      if (R() < K_CONT && c.lv < 10) {
        c.lv++; const pay = K_LV[c.lv] * c.bet; c.win += pay;
        const res = { bet: 0, pay, chain: true, lv: c.lv, win: c.win, reels: rocketReels('rocket'), chainBet: c.bet };
        if (c.lv >= 10) { res.end = true; res.moon = true; st.best = Math.max(st.best || 0, c.lv); st.chain = null; }
        return res;
      }
      const res = { bet: 0, pay: 0, chain: true, end: true, lv: c.lv, win: c.win, reels: rocketReels('miss'), chainBet: c.bet };
      st.best = Math.max(st.best || 0, c.lv); st.last = c.lv; st.chain = null; return res;
    }
    let r = R(), out = null, mult = 0;
    for (const o of K_OUT) { if (r < o[2]) { out = o[0]; mult = o[1]; break; } r -= o[2]; }
    if (out === 'rocket') {
      st.chain = { lv: 1, bet, win: K_LV[1] * bet };
      return { bet, pay: K_LV[1] * bet, start: true, lv: 1, win: st.chain.win, reels: rocketReels('rocket'), chainBet: bet };
    }
    return { bet, pay: mult * bet, out, reels: rocketReels(out) };
  }

  /* ---------- ⑤ ジャックポット777 ---------- */
  const J_BET = 5, J_ADD = 1, J_SEED = 1000;
  const J_OUT = [['jp', 0, 1 / 5000], ['bar3', 10, 1 / 40], ['seven2', 4, 1 / 25], ['bar2', 2, 1 / 12], ['cherry', 1, 1 / 7]];
  const J_FILL = ['seven', 'bar', 'cherry', 'bell', 'lemon'];
  function jpReels(out) {
    let a, tries = 0;
    const bad = (x) => x[0] === 'cherry' || (x[0] === x[1] && (x[0] === 'seven' || x[0] === 'bar')) || (x[0] === x[1] && x[1] === x[2]) ||
      (x.filter((s) => s === 'seven').length >= 2) || (x.filter((s) => s === 'bar').length >= 2);
    do { a = [0, 1, 2].map(() => J_FILL[ri(J_FILL.length)]); tries++; } while (tries < 300 && bad(a));
    if (out === 'jp') a = ['seven', 'seven', 'seven'];
    if (out === 'bar3') a = ['bar', 'bar', 'bar'];
    if (out === 'seven2') a = ['seven', 'seven', ['bar', 'cherry', 'bell', 'lemon'][ri(4)]];
    if (out === 'bar2') a = ['bar', 'bar', ['cherry', 'bell', 'lemon'][ri(3)]];
    if (out === 'cherry') { a[0] = 'cherry'; }
    return a;
  }
  function jackpotSpin(st, bet, jp) {
    const k = Math.max(1, Math.round(bet / J_BET)); // BET5枚ごとに1倍:JPへの積み立てと7・7・7の当たりやすさがk倍
    jp.add(J_ADD * k);
    let r = R(), out = null, mult = 0;
    for (const o of J_OUT) { const pr = o[0] === 'jp' ? o[2] * k : o[2]; if (r < pr) { out = o[0]; mult = o[1]; break; } r -= pr; }
    let pay = mult * J_BET * k;
    if (out === 'jp') { pay = jp.take(); }
    const reach = !out && R() < 0.06; // 7・7のリーチ演出（ハズレ）
    const reels = jpReels(out);
    if (reach) { reels[0] = 'seven'; reels[1] = 'seven'; reels[2] = ['bell', 'lemon'][ri(2)]; }
    return { bet: J_BET * k, pay, out, reels, reach: reach || out === 'jp' || out === 'seven2', pool: jp.get() };
  }

  /* ---------- ⑥ キラリドロップ（3×3 連鎖） ---------- */
  const D_SYMS = [['seven', 1], ['bar', 2], ['star', 3], ['bell', 5], ['grape', 7], ['gem', 8], ['lemon', 11], ['cherry', 14]];
  const D_ODDS = { seven: 6, bar: 4, star: 2.5, bell: 1.8, grape: 1.2, gem: 1, lemon: 0.8, cherry: 0.6 };
  const D_COMBO = [1, 1, 2, 3, 4, 6, 8, 10, 15, 20, 30];
  const D_K = 2.05;
  const D_LINES = [[[0, 0], [0, 1], [0, 2]], [[1, 0], [1, 1], [1, 2]], [[2, 0], [2, 1], [2, 2]], [[0, 0], [1, 0], [2, 0]],
    [[0, 1], [1, 1], [2, 1]], [[0, 2], [1, 2], [2, 2]], [[0, 0], [1, 1], [2, 2]], [[0, 2], [1, 1], [2, 0]]];
  const dCombo = (k) => D_COMBO[Math.min(k, D_COMBO.length - 1)];
  function dropSpin(st, bet) {
    let g = [0, 1, 2].map(() => [0, 1, 2].map(() => wpick(D_SYMS)));
    const steps = []; let total = 0, k = 0;
    for (; ;) {
      const hit = [];
      D_LINES.forEach((ln, i) => { const s = g[ln[0][0]][ln[0][1]]; if (ln.every(([r, c]) => g[r][c] === s)) hit.push({ line: i, sym: s }); });
      if (!hit.length || k >= 30) { steps.push({ grid: g.map((r) => r.slice()), hit: [] }); break; }
      k++;
      const connect = hit.length;
      let m = 0; hit.forEach((h) => { m += D_ODDS[h.sym]; });
      const raw = m * dCombo(k) * connect * D_K * bet;
      const pay = payFrac(st, raw);
      total += pay;
      const clear = {}; hit.forEach((h) => D_LINES[h.line].forEach(([r, c]) => { clear[r + ',' + c] = 1; }));
      steps.push({ grid: g.map((r) => r.slice()), hit, combo: k, connect, pay });
      // 消して落とす
      const ng = [[], [], []];
      for (let c = 0; c < 3; c++) {
        const keep = []; for (let r = 2; r >= 0; r--) if (!clear[r + ',' + c]) keep.push(g[r][c]);
        while (keep.length < 3) keep.push(wpick(D_SYMS));
        for (let r = 2, i = 0; r >= 0; r--, i++) ng[r][c] = keep[i];
      }
      g = ng;
    }
    st.best = Math.max(st.best || 0, k);
    return { bet, pay: total, steps, combo: k };
  }

  /* ---------- まとめ ---------- */
  function play(mid, st, d, ctx) {
    const bet = d.bet | 0;
    const m = MACHINES.find((x) => x.id === mid);
    if (!m) throw new Error('機種がありません');
    const needBet = !(mid === 'wide' && st.fs > 0) && !(mid === 'rocket' && st.chain) && !(d.type === 'stop');
    const B = m.bet;
    if (needBet && (!(bet >= B.min && bet <= B.max) || bet % B.step)) throw new Error('BETは' + B.min + '〜' + B.max + '枚' + (B.step > 1 ? '(' + B.step + '枚きざみ)' : '') + 'で選んでください');
    switch (mid) {
      case 'classic': return classicSpin(st, bet);
      case 'wide': return wideSpin(st, bet);
      case 'rocket': return rocketSpin(st, bet);
      case 'jackpot': return jackpotSpin(st, bet, ctx.jp);
      case 'drop': return dropSpin(st, bet);
      case 'oshi': case 'battle': {
        if (d.type === 'stop') return pachiStop(st, d);
        const res = pachiLever(st, bet);
        if (mid === 'battle') { res.fx = battleEffect(res); if (res.newHit) res.lamp = true; }
        else if (res.newHit) res.lamp = R() < 0.6; // 目押し：告知ランプ（すぐ光る／あとで光る）
        if (mid === 'oshi' && !res.newHit && st.held && !st.lampOn) { if (R() < 0.35) res.lamp = true; }
        if (res.lamp) st.lampOn = true;
        if (!st.held) st.lampOn = false;
        res.lampOn = !!st.lampOn;
        return res;
      }
    }
  }
  // 何を払うのにいくら必要か（ゲーム前のチェック用）
  function cost(mid, st, d) {
    if (d.type === 'stop') return 0;
    if (mid === 'wide' && st.fs > 0) return 0;
    if (mid === 'rocket' && st.chain) return 0;
    if ((mid === 'oshi' || mid === 'battle') && (st.held || st.bonus) && st.hk) return 3 * st.hk;
    return d.bet | 0;
  }

  const API = {
    MACHINES, play, cost,
    consts: { C_LINES, P_STRIP, D_LINES, D_ODDS, D_COMBO, D_K, K_LV, K_CONT, J_SEED, C_OUT, P_PAY, P_GAMES, W_PAY, W_SCAT, W_FS, W_FSN, W_WILDX }
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = API; else root.SP = API;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<style>
/* =========================================================
   スロットパーク(7機種)。先生のPC=ホスト、iPad=パッド
   抽選と配当は sp-engine.js(先生のPCで計算)
   ========================================================= */
:root{--f-num:"Dela Gothic One",sans-serif;--f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;--f-led:"Orbitron",monospace;--f-min:"Shippori Mincho",serif;--f-chic:"Zen Kaku Gothic New",sans-serif}

body{font-family:var(--f-body);font-weight:500;color:#3a2a3f;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:3px solid #ffb02e;outline-offset:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b1f24;color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;z-index:99;max-width:90vw}

/* ---------- 先生のPC ---------- */
body.host{background:#fff7ec}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}
.htop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.htop .ttl{font-family:var(--f-num);font-size:28px;color:#e8436f}
.htop .ttl small{font-family:var(--f-body);font-size:14px;color:#6e5a72;font-weight:800;margin-left:6px}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid #f0e2d2;background:#fff;border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:#1f9d4a}.chip.off .dot{background:#d63c5e}
.box{background:#fff;border:2px solid #f0e2d2;border-radius:16px;padding:14px 16px;margin-bottom:14px}
.box h2{margin:0 0 8px;font-size:18px}
.note{color:#6e5a72;font-size:14px;line-height:1.7;margin:4px 0}
.btn{border:2px solid #f0e2d2;background:#fff;border-radius:10px;padding:8px 14px;font-weight:800}
.btn.danger{background:#c8102e;border-color:#c8102e;color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.stat{background:#fff;border:2px solid #f0e2d2;border-radius:14px;padding:12px 16px}
.stat small{display:block;color:#6e5a72;font-weight:800;font-size:13px}.stat b{font-family:var(--f-num);font-weight:400;font-size:28px}
ul.pl{list-style:none;margin:0;padding:0}
ul.pl li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed #f0e2d2;font-weight:800}
ul.pl li b{margin-left:auto;font-family:var(--f-num);font-weight:400;font-size:18px}
ul.pl li small{color:#6e5a72}
ul.pl .tag{font-size:12px;padding:2px 8px;border-radius:999px;background:#ffe3ec;color:#8c1d40}
.w{color:#0f8a66}

/* ---------- iPad:全体を 1180×820 で作って画面に合わせて縮める ---------- */
body.pad{background:#fff7ec;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:0;top:0;width:1180px;height:820px;transform-origin:0 0;overflow:hidden}
.msgbox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.msgbox .card{background:#fff;border-radius:26px;padding:30px 36px;max-width:640px;box-shadow:0 6px 0 #f0e2d2}
.msgbox h2{margin:0 0 10px;font-size:26px}
.pbtn{display:inline-block;border-radius:999px;padding:12px 26px;font-weight:800;font-size:17px;background:#ffe3ec;color:#8c1d40;text-decoration:none}
.pbtn.go{background:#ff5c8a;color:#fff}

.topbar{height:52px;display:flex;align-items:center;gap:10px;padding:0 20px;background:#fff;border-bottom:3px solid var(--tb-line,#ffd6e2)}
.topbar .t{font-family:var(--f-num);font-size:24px;color:var(--tb-ttl,#e8436f);letter-spacing:1px}
.topbar .nm{font-size:15px;color:#6e5a72}
.topbar .cred{display:flex;align-items:baseline;gap:6px;padding:4px 14px;border-radius:999px;background:#fff0c2;color:#6e5a1a;font-size:13px;font-weight:800}
.topbar .cred b{font-size:22px;color:#3a2a3f;font-weight:800}
.topbar .bank{font-size:13px;color:#6e5a72;font-weight:800}
.tbtn{height:40px;padding:0 16px;border-radius:999px;background:var(--tb-btn,#ffe3ec);color:var(--tb-btnc,#8c1d40);font-size:14px;font-weight:800}
.tbtn.gray{background:#efe9e2;color:#4a3f44}
.topbar>*{white-space:nowrap;flex-shrink:0}.topbar .t{font-size:22px;flex-shrink:1;overflow:hidden;text-overflow:ellipsis}.topbar .tbtn{padding:0 13px}
body.chic .topbar{font-family:var(--f-chic)}
body.chic .tbtn{border-radius:4px;border:1px solid var(--tb-btnc);background:#fff}
body.chic .topbar .cred{border-radius:0;background:transparent;border-bottom:2px solid #b08a3e}

/* ロビー */
.lobby{position:absolute;left:0;top:52px;right:0;bottom:0;padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.lobby h1{margin:0;font-size:26px;font-weight:800}.lobby h1 small{font-size:14px;color:#6e5a72;font-weight:700;margin-left:12px}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;flex:1}
.mcard{border-radius:22px;background:#fff;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 0 #f0e2d2;text-align:left;padding:0}
.mcard .hd{height:78px;display:flex;align-items:center;justify-content:center;gap:4px}
.mcard .hd svg{width:46px;height:46px}
.mcard .bd{padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.mcard .tag{align-self:flex-start;padding:1px 10px;border-radius:999px;font-size:11px;font-weight:800}
.mcard .tag.pop{background:#ffe3ec;color:#8c1d40}.mcard .tag.chic{background:#26262c;color:#f3efe6}
.mcard .nm{font-size:18px;font-weight:800;line-height:1.25}
.mcard .op{font-size:12px;color:#6e5a72}
.mcard .memo{font-size:12.5px;line-height:1.55;flex:1}
.mcard .wave{display:flex;align-items:center;gap:4px;font-size:12px;color:#6e5a72}
.mcard .wave i{width:12px;height:12px;border-radius:50%;background:#f1e6da}.mcard .wave i.on{background:#ff9f1c}
.mcard .jp{font-size:12.5px;font-weight:800;color:#7a1f2b;background:#f6efe3;padding:3px 8px;border-radius:8px}
.mcard .now{font-size:12px;font-weight:800;color:#0f8a66}
.mcard:active{transform:translateY(2px)}

/* 機種の画面(共通) */
.mscr{position:absolute;left:0;top:52px;right:0;bottom:0;display:flex;gap:20px;padding:12px 20px 0;align-items:flex-start}
.side{width:170px;flex-shrink:0;padding:12px;border-radius:14px;display:flex;flex-direction:column;gap:7px;font-size:12px}
.side h3{margin:0;text-align:center;font-family:var(--f-num);font-weight:400;font-size:15px}
.side .row{display:flex;align-items:center;gap:3px;padding-bottom:4px;border-bottom:1px dashed rgba(0,0,0,.12)}
.side .row svg{width:24px;height:24px;flex-shrink:0}
.side .row .v{margin-left:auto;font-family:var(--f-led);font-weight:900;font-size:13px}
.side .dat{display:flex;justify-content:space-between;align-items:baseline;padding:5px 7px;border-radius:6px}
.side .dat b{font-family:var(--f-led);font-weight:900;font-size:16px}
.side p{margin:0;line-height:1.55;font-size:11.5px}
.cab{position:relative;width:760px;flex-shrink:0;padding:14px;border-radius:30px 30px 14px 14px;display:flex;flex-direction:column;gap:9px;background:var(--body);box-shadow:0 10px 24px rgba(60,20,40,.3)}
.topper{position:relative;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px}
.lamps{position:absolute;left:10px;right:10px;display:flex;justify-content:space-between}
.lamps i{width:10px;height:10px;border-radius:50%;background:var(--lampA);box-shadow:0 0 6px var(--lampA)}
.lamps i:nth-child(even){background:var(--lampB);box-shadow:0 0 6px var(--lampB)}
.lamps.chase i{animation:chase 1s steps(1) infinite}.lamps.chase i:nth-child(even){animation-delay:.5s}
@keyframes chase{50%{opacity:.25}}
.bezel{padding:11px;border-radius:18px;background:linear-gradient(180deg,#fff 0%,#b9bdc6 45%,#eef0f3 55%,#a3a8b2 100%)}
.bezel.gold{border-radius:0;background:linear-gradient(180deg,#f3dc9e 0%,#9a7430 50%,#f3dc9e 100%)}
.rwin{position:relative;padding:8px;border-radius:10px;background:#1a1418;display:flex;gap:8px;justify-content:center;align-items:center}
.reel{position:relative;overflow:hidden;background:#fffaf3;border-radius:4px;flex-shrink:0}
.reel .col{position:absolute;left:0;top:0;width:100%;will-change:transform}
.reel .cell{display:flex;align-items:center;justify-content:center}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(15,10,15,.55) 0%,rgba(15,10,15,0) 28%,rgba(15,10,15,0) 72%,rgba(15,10,15,.55) 100%)}
.reel.blur .col{filter:blur(2.5px)}
.glare{position:absolute;top:8px;bottom:8px;left:70px;width:130px;background:rgba(255,255,255,.13);transform:skewX(-18deg);pointer-events:none}
.pline{position:absolute;left:46px;right:46px;height:4px;border-radius:2px;pointer-events:none;opacity:.15;background:#ff2d55}
.pline.on{opacity:.9;box-shadow:0 0 8px #ff2d55}
.pline.hit{opacity:1;animation:blink .35s steps(1) 6;box-shadow:0 0 14px #ffe66d;background:#ffe66d}
@keyframes blink{50%{opacity:.2}}
.lnum{width:28px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;align-self:stretch;padding:34px 0}
.lnum i{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--f-led);font-size:13px;font-weight:900;background:#3a2a30;color:#8a7078}
.lnum i.on{background:#ff2d55;color:#fff;box-shadow:0 0 8px #ff2d55}
.ledrow{display:flex;gap:8px;align-items:center}.ledrow>.leds{flex:1}
.leds{display:flex;gap:9px;padding:7px 10px;border-radius:12px;background:var(--ledbox,#2b1f24)}
.led{flex:1;padding:3px 12px;border-radius:6px;background:#100a0c;display:flex;flex-direction:column;align-items:flex-end}
.led small{font-size:10.5px;font-weight:800;letter-spacing:2px;color:var(--ledlbl,#f0c9d4)}
.led b{font-family:var(--f-led);font-size:26px;font-weight:900;color:var(--led,#ff4a2e);text-shadow:0 0 8px var(--led,#ff4a2e);line-height:1.1}
.deck{border-radius:14px;background:var(--deck);display:flex;align-items:center;gap:12px;padding:0 22px}
.tray{border-radius:10px 10px 20px 20px;background:var(--tray,linear-gradient(180deg,#3a2a30,#5a434b));display:flex;align-items:center;justify-content:center;gap:4px;height:34px;flex-shrink:0}
.tray i{width:24px;height:12px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff6c8 0%,#e0b23a 55%,#9a7414 100%)}
.tray i.drop{animation:coin .5s ease-in both}
@keyframes coin{from{transform:translateY(-30px);opacity:0}}
.kbtn{width:96px;height:60px;border:3px solid #e6e8ec;border-radius:10px;background:linear-gradient(180deg,#fff3b0,#ffd23f);box-shadow:0 5px 0 #8a6a00;color:#4a3500;font-size:14px;font-weight:800;line-height:1.15}
.kbtn.sel{box-shadow:0 0 14px #ffd23f,0 5px 0 #8a6a00;outline:3px solid #fff}
.kbtn.dim{background:linear-gradient(180deg,#fff,#e8e2da);color:#7a6a60;box-shadow:0 5px 0 #8a7a70}
.kbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #8a6a00}
.kbtn:disabled{opacity:.5}
.rbtn{width:104px;height:104px;border:6px solid #e6e8ec;border-radius:50%;color:#fff;font-family:var(--f-num);font-size:18px;box-shadow:0 6px 0 #6b6f78,0 0 18px var(--glow,rgba(126,224,168,.8));background:radial-gradient(circle at 35% 30%,#fff 0%,var(--b1,#7ee0a8) 22%,var(--b2,#2fb36b) 60%,var(--b3,#1b7a47) 100%);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.rbtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #6b6f78}
.rbtn:disabled{filter:grayscale(.7) brightness(.9);box-shadow:0 6px 0 #6b6f78}
.auto{width:72px;height:44px;border-radius:22px;border:3px solid #e6e8ec;background:#fff;color:#4a3f44;font-size:13px;font-weight:800}
.auto.on{background:#3ddc84;color:#0b2a17;box-shadow:0 0 12px #3ddc84}
.winmsg{position:absolute;left:0;right:0;text-align:center;font-family:var(--f-num);font-size:40px;color:#ffe66d;text-shadow:0 4px 0 #b3361f,0 0 18px rgba(255,230,109,.9);pointer-events:none;z-index:5;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.flash{animation:flash .5s steps(2) 4}
@keyframes flash{50%{filter:brightness(1.6)}}

/* ① フルーツクラシック */
.th-classic{--body:linear-gradient(90deg,#d93a63 0%,#ff5c8a 18%,#ff7aa2 50%,#ff5c8a 82%,#d93a63 100%);--deck:linear-gradient(180deg,#c22f56,#e8436f);--lampA:#ffd23f;--lampB:#ff7aa2;background:#dff3e8}
.th-classic .topper{height:96px;background:#fff6dc;border:6px solid #e6e8ec}
.th-classic .logo{font-family:var(--f-num);font-size:38px;color:#e8436f;letter-spacing:2px;text-shadow:3px 3px 0 #ffd166}
.th-classic .side.l{background:#fffaf0;border:4px solid #ffb8cd;margin-top:120px}.th-classic .side.l h3{color:#d6336c}.th-classic .side .v{color:#8c1d40}
.th-classic .side.r{background:#2b1f24;color:#f0c9d4;margin-top:120px}.th-classic .side.r .dat{background:#1a1418}.th-classic .side.r .dat b{color:#ffd23f}
/* ② 目押し */
.th-oshi{--body:linear-gradient(90deg,#111114 0%,#2c2c33 20%,#3a3a42 50%,#2c2c33 80%,#111114 100%);--deck:linear-gradient(180deg,#1a1a1f,#2c2c33);--led:#ffb02e;--ledbox:#0d0d10;--ledlbl:#b9b2a2;--tray:linear-gradient(180deg,#0d0d10,#26262c);background:#ece6da;--tb-line:#d9d1c2;--tb-ttl:#26262c;--tb-btnc:#26262c}
.th-oshi .cab{border-radius:16px 16px 8px 8px}
.th-oshi .topper{height:110px;border-radius:0;border:2px solid #b08a3e;background:linear-gradient(180deg,#f6ecd2,#e3cf9f);flex-direction:column;gap:4px}
.th-oshi .logo{font-family:var(--f-min);font-weight:800;font-size:38px;letter-spacing:10px;color:#26262c}
.th-oshi .rwin{border-radius:0;background:#0d0d10}
.th-oshi .reel{border-radius:0;background:#fffef9}
.th-oshi .side.l{background:#fbf8f1;border:1px solid #b08a3e;border-radius:0;margin-top:130px;font-family:var(--f-chic)}.th-oshi .side h3{font-family:var(--f-min);font-weight:800}
.th-oshi .side.r{background:#121215;border-top:4px solid #b08a3e;border-radius:0;color:#b9b2a2;margin-top:130px}.th-oshi .side.r .dat{background:#1e1e23;border-radius:0}.th-oshi .side.r .dat b{color:#ffb02e}
.golamp{display:flex;align-items:center;gap:8px;font-family:var(--f-min);font-weight:800;font-size:14px;letter-spacing:4px;color:#7a6a4a}
.golamp i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#999,#444);border:2px solid #b08a3e}
.golamp.on{color:#b3001b}.golamp.on i{background:radial-gradient(circle at 35% 30%,#fff 0%,#ff6b6b 30%,#d00 80%);box-shadow:0 0 18px #ff3b3b,0 0 40px #ff3b3b}
/* パチスロ共通 */
.lever{position:relative;width:70px;height:96px;flex-shrink:0}
.lever .stick{position:absolute;left:30px;top:30px;width:10px;height:62px;border-radius:5px;background:linear-gradient(90deg,#8a8d94,#e9ebef,#8a8d94)}
.lever button{position:absolute;left:11px;top:0;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#ff7a7a 25%,#c41e1e 70%,#6e0b0b 100%);box-shadow:0 4px 8px rgba(0,0,0,.5);transition:transform .12s}
.lever button:active:not(:disabled){transform:translateY(18px)}
.lever button:disabled{filter:grayscale(.6)}
.stopb{width:74px;height:74px;border-radius:50%;font-family:var(--f-min);font-weight:800;font-size:22px;border:3px solid #55555f;background:radial-gradient(circle at 35% 30%,#6a6a72,#2c2c33);color:#8a8780}
.stopb.on{border-color:#e6c37a;background:radial-gradient(circle at 35% 30%,#fff 0%,#ffe9a8 30%,#e0b23a 100%);color:#26262c;box-shadow:0 0 14px rgba(255,210,63,.8)}
/* ③ ワイドライン */
.th-wide{--body:linear-gradient(90deg,#4a2a14 0%,#7a4a24 18%,#9a6232 50%,#7a4a24 82%,#4a2a14 100%);--deck:linear-gradient(180deg,#3a2210,#5a3518);--lampA:#ffd84d;--lampB:#7fdcff;--led:#ffffff;--ledbox:#2a1a0c;--ledlbl:#ffd84d;--tray:linear-gradient(180deg,#2a1a0c,#4a2c14);background:#5a8fd0 url(sp-assets/wl_bg.webp) center/cover no-repeat}
.th-wide .topbar{background:rgba(255,255,255,.92)}
.th-wide .cab{border:6px solid #e0b04a;box-shadow:inset 0 0 0 3px #7a4a1c,0 0 0 3px #3a220c,0 12px 26px rgba(0,0,0,.45)}
.th-wide .cab::before,.th-wide .cab::after{content:"";position:absolute;top:10px;bottom:10px;width:10px;background:radial-gradient(circle,#ffe7a0 0 3px,#a8741c 3.5px 4.5px,transparent 5px) 0 0/10px 34px repeat-y}
.th-wide .cab::before{left:2px}.th-wide .cab::after{right:2px}
.th-wide .topper{height:84px;border-radius:14px;background:repeating-linear-gradient(0deg,#6b3d1e 0 13px,#5c3318 13px 14px),#6b3d1e;border:5px solid #e0b04a;box-shadow:inset 0 0 0 2px #3a220c}
.th-wide .topper img{width:58px;height:58px;object-fit:contain}
.th-wide .logo{font-family:var(--f-num);font-size:42px;letter-spacing:4px;color:#ffd84d;-webkit-text-stroke:2px #5a2a00;text-shadow:0 4px 0 #3a1800,0 0 14px rgba(255,216,77,.6)}
.th-wide .bezel{border-radius:14px;background:linear-gradient(180deg,#f6d77a 0%,#b07a24 50%,#f6d77a 100%);padding:9px}
.th-wide .lcd{position:relative;padding:10px;border-radius:8px;background:#0a1038;display:flex;flex-direction:column;gap:8px}
.th-wide .fsbar{height:38px;border-radius:6px;background:#101a5c;border:3px solid #fff;box-shadow:0 0 0 2px #0a1038;color:#fff;display:flex;align-items:center;justify-content:center;gap:14px;font-weight:800}
.th-wide .fsbar.on{background:#7a1f1f}
.th-wide .fsbar b{font-family:var(--f-num);font-weight:400;font-size:20px;letter-spacing:2px;color:#ffd84d}
.th-wide .rrow{display:flex;gap:6px;justify-content:center}
.th-wide .reel{background:linear-gradient(180deg,#0b1240 0%,#1a2670 50%,#0b1240 100%);border-radius:8px;box-shadow:inset 0 0 0 2px rgba(255,216,77,.35)}
.th-wide .reel::after{background:linear-gradient(180deg,rgba(5,8,30,.6),rgba(5,8,30,0) 22%,rgba(5,8,30,0) 78%,rgba(5,8,30,.6))}
.th-wide .reel .cell svg{filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.th-wide .hl{position:absolute;border-radius:8px;box-shadow:0 0 0 3px #ffd84d,0 0 16px #ffd84d;background:rgba(255,216,77,.18);pointer-events:none;animation:blink .4s steps(1) 4}
.th-wide .hl.wd{box-shadow:0 0 0 3px #ff6b6b,0 0 18px #ff6b6b}
.th-wide .rpgw{background:rgba(12,20,80,.94);border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 3px #0a1038,0 6px 14px rgba(0,0,0,.35);color:#fff}
.th-wide .side.l{margin-top:10px;padding:12px}
.th-wide .side h3{color:#ffd84d;font-family:var(--f-body);font-weight:800;font-size:15px;letter-spacing:2px}
.th-wide .side p{color:#dfe6ff}
.th-wide .side .row{border-color:rgba(255,255,255,.18)}.th-wide .side .v{color:#ffd84d}
.th-wide .wpt{display:grid;grid-template-columns:26px 1fr 1fr 1fr;align-items:center;gap:1px 2px;text-align:right;font-family:var(--f-led);font-weight:900;font-size:12px;color:#ffd84d}
.th-wide .wpt svg{width:26px;height:26px}.th-wide .wpt b{font-family:var(--f-body);font-size:11px;color:#dfe6ff}
.th-wide .side.l p svg{vertical-align:middle}
.th-wide .side.r{background:none;padding:0;margin-top:0;gap:8px}
.th-wide .side.r .guide{width:170px;height:190px;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35));transform-origin:50% 100%;animation:wlbob 2.4s ease-in-out infinite}
@keyframes wlbob{50%{transform:translateY(-6px)}}
.th-wide .side.r .rpgw{padding:10px;display:flex;flex-direction:column;gap:7px}
.th-wide .side.r .dat{background:rgba(255,255,255,.1)}.th-wide .side.r .dat b{color:#ffd84d}

.wstars{position:absolute;left:0;right:0;top:0;height:150px;background-image:radial-gradient(1.5px 1.5px at 40px 30px,#fff,transparent),radial-gradient(1px 1px at 130px 70px,#fff,transparent),radial-gradient(1.5px 1.5px at 220px 20px,#dfe6ff,transparent),radial-gradient(1px 1px at 300px 90px,#fff,transparent),radial-gradient(1.5px 1.5px at 390px 44px,#fff,transparent),radial-gradient(1px 1px at 470px 16px,#cfe0ff,transparent),radial-gradient(1px 1px at 560px 110px,#fff,transparent),radial-gradient(1.5px 1.5px at 640px 60px,#fff,transparent);animation:twinkle 3s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.45}}
.wlay{position:absolute;left:0;right:0;overflow:hidden;pointer-events:none}
.wtrack{display:flex;width:max-content;height:100%;will-change:transform}
.wtrack img{display:block;flex-shrink:0;-webkit-user-drag:none}
.wlay[data-l="near"]{z-index:3}
.wdust i{position:absolute;left:740px;width:3px;height:3px;border-radius:50%;background:rgba(255,214,200,.55);animation:wdust 3s linear infinite}
@keyframes wdust{to{transform:translate(-800px,-30px)}}
.kwalker{position:absolute;z-index:2}
.kwalker img{display:block;transform-origin:50% 100%}
.kshadow{position:absolute;left:18%;right:18%;bottom:-4px;height:14px;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(2px);animation:kshadow .34s ease-in-out infinite alternate}
@keyframes kshadow{to{transform:scaleX(.88);opacity:.75}}
.kwbob{animation:kwbob .34s ease-in-out infinite alternate}
.kwsheet{width:155px;height:237px;background-size:800% 100%;background-repeat:no-repeat;animation:kwsheet .96s steps(8) infinite}
@keyframes kwsheet{from{background-position:0 0}to{background-position:114.2857% 0}}
@keyframes kwbob{from{transform:translateY(0) rotate(.6deg)}to{transform:translateY(-6px) rotate(-.6deg)}}
/* 動きの部品 */
.kfx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.kline{position:absolute;left:0;height:2px;border-radius:1px;background:linear-gradient(90deg,rgba(255,255,255,0),var(--c));animation:kline .4s linear infinite}
@keyframes kline{from{transform:translateX(780px)}to{transform:translateX(-260px)}}
.kpetal{position:absolute;top:-16px;width:11px;height:8px;border-radius:70% 0 70% 0;background:#ffc4dc;box-shadow:0 0 4px rgba(255,180,210,.8);animation:kpetal 3.6s linear infinite}
@keyframes kpetal{from{translate:0 0;rotate:0deg}to{translate:-180px 290px;rotate:600deg}}
.kspark{position:absolute;bottom:-6px;width:4px;height:4px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c);animation:kspark 1.6s ease-out infinite}
@keyframes kspark{from{transform:translateY(0);opacity:1}to{transform:translate(-30px,-230px);opacity:0}}

  else if(mood==='surprise') f=`<circle cx="40" cy="55" r="6" fill="#fff" stroke="#3a2a10" stroke-width="2.5"/><circle cx="60" cy="55" r="6" fill="#fff" stroke="#3a2a10" stroke-width="2.5"/><circle cx="40" cy="55" r="2.5" fill="#3a2a10"/><circle cx="60" cy="55" r="2.5" fill="#3a2a10"/><ellipse cx="50" cy="71" rx="5" ry="6" fill="#3a2a10"/>`;

/* ---------- 効果音(小さく) ---------- */
let AC=null; const snd={on:true};
function tone(f,d,type,vol,delay){ if(!snd.on) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(vol||.04,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02);}catch(e){} }
const sfx={
  spin:()=>tone(520,.08,'square',.03),
  stop:()=>tone(180,.06,'triangle',.08),
  win:()=>[660,880,990,1320].forEach((f,i)=>tone(f,.12,'square',.035,i*.08)),
  big:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.18,'square',.04,i*.12)),
  coin:()=>tone(1500,.04,'square',.02),
  push:()=>tone(300,.3,'sawtooth',.05)
};

/* ---------- 絵と音のファイル(medalgame/sp-assets/) ---------- */
const ASSET='sp-assets/';
// 機種ごとのBGM(lobby=機種選びの画面)
const BGM={classic:'bgm_classic.mp3',oshi:'bgm_oshi.mp3',wide:'bgm_wide.mp3',rocket:'bgm_rocket.mp3',jackpot:'bgm_jackpot.mp3',battle:'bgm_kaguya.mp3',drop:'bgm_drop.mp3',lobby:'bgm_lobby.mp3'};
const BGM_VOL=0.35; // 小さめ
const bgm={on:(()=>{ try{ return localStorage.getItem('mg.slotpark.bgm')!=='0'; }catch(e){ return true; } })(),el:null,file:null};
function acx(){ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume().catch(()=>{}); return AC; }
// iPadは画面にさわったときでないと音が出ないので、さわるたびに音の準備を確かめる
document.addEventListener('pointerdown',()=>{ try{ if(AC&&AC.state==='suspended') AC.resume(); if(bgm.el&&bgm.on&&bgm.el.paused&&!document.hidden) bgm.el.play().catch(()=>{}); }catch(e){} },true);
function bgmPlay(mid){
  const f=BGM[mid]; if(!f||!bgm.on){ bgmStop(); return; }
  if(bgm.file===f&&bgm.el){ if(bgm.el.paused&&!document.hidden) bgm.el.play().catch(()=>{}); return; }
  bgmStop();
  const a=new Audio(ASSET+f); a.loop=true; a.preload='auto';
  // iPadは音量の指定がきかないので、Web Audio を通して小さくする
  try{ const ctx=acx(), src=ctx.createMediaElementSource(a), g=ctx.createGain(); g.gain.value=BGM_VOL; src.connect(g); g.connect(ctx.destination); }catch(e){ a.volume=BGM_VOL; }
  bgm.el=a; bgm.file=f; a.play().catch(()=>{});
}
function bgmStop(){ if(bgm.el){ try{ bgm.el.pause(); bgm.el.removeAttribute('src'); bgm.el.load(); }catch(e){} } bgm.el=null; bgm.file=null; }
function bgmToggle(){ bgm.on=!bgm.on; try{ localStorage.setItem('mg.slotpark.bgm',bgm.on?'1':'0'); }catch(e){}
  if(bgm.on) bgmPlay(G.mid||'lobby'); else bgmStop(); const b=$('#tBgm'); if(b){ b.textContent=bgm.on?'♪ ON':'♪ OFF'; b.classList.toggle('gray',!bgm.on); } }
document.addEventListener('visibilitychange',()=>{ if(!bgm.el) return; if(document.hidden) bgm.el.pause(); else if(bgm.on) bgm.el.play().catch(()=>{}); });

const LSK=()=>'mg.slotpark.'+(MG.LOCAL?'local.':'');
let ST={}, JP=0, saveT=null;
function loadHostData(){ try{ ST=JSON.parse(localStorage.getItem(LSK()+'st'))||{}; }catch(e){ ST={}; }
  JP=+localStorage.getItem(LSK()+'jp')||SP.consts.J_SEED; }
function saveHostData(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(LSK()+'st',JSON.stringify(ST)); localStorage.setItem(LSK()+'jp',String(JP)); }catch(e){} },300); }
const jpCtx={jp:{add(n){JP+=n},take(){const p=JP;JP=SP.consts.J_SEED;return p},get(){return JP}}};
const stOf=(sid,m)=>{ ST[sid]=ST[sid]||{}; ST[sid][m]=ST[sid][m]||{}; return ST[sid][m]; };
const locks={};
async function withLock(sid,fn){ while(locks[sid]) await locks[sid]; let done; locks[sid]=new Promise(r=>done=r); try{ return await fn(); } finally { delete locks[sid]; done(); } }
function pubState(m,st){
  if(m==='oshi'||m==='battle') return {bonus:st.bonus||null,held:st.held||null,lampOn:!!st.lampOn,games:st.games||0,count:st.count||{big:0,reg:0},hk:st.hk||0};
  if(m==='wide') return {fs:st.fs||0,fsWin:st.fsWin||0,fsBet:st.fsBet||0};
  if(m==='rocket') return {chain:st.chain||null,best:st.best||0,last:st.last||0};
  if(m==='drop') return {best:st.best||0};
  return {};
}
async function hostReq(sid,r){
  const m=String(r.m||''); if(!MBY[m]) return {ok:false,msg:'その機種はありません'};
  if(r.type==='g:info') return {ok:true,d:{jp:JP,st:pubState(m,stOf(sid,m))}};
  if(r.type!=='g:spin'&&r.type!=='g:stop') return {ok:false,msg:'その操作はできません'};
  return withLock(sid,async()=>{
    const a=HOST.acc()[sid], st=stOf(sid,m), d={type:r.type==='g:stop'?'stop':'spin',bet:Math.floor(+r.bet||0),cherryOk:!!r.cherryOk,aligned:!!r.aligned};
    const need=SP.cost(m,st,d);
    if(!a.seat||a.seat.g!==GID) return {ok:false,msg:'このゲームには入っていません'};
    if((a.seat.a||0)<need) return {ok:false,msg:'メダルが足りません。「貯金から追加」で足してください',d:{short:true}};
    const backup=JSON.stringify(st), jp0=JP;
    let res; try{ res=SP.play(m,st,d,jpCtx); }catch(e){ return {ok:false,msg:e.message}; }
    const delta=(res.pay||0)-(res.bet||0);
    let na=a.seat.a;
    try{ if(delta) na=await HOST.change(sid,delta); }
    catch(e){ ST[sid][m]=JSON.parse(backup); JP=jp0; return {ok:false,msg:e.message}; }
    saveHostData();
    if((res.pay||0)>=50||res.bonusStart||res.out==='jp'){ feed.unshift({n:a.n,m:MBY[m].name,pay:res.pay,bs:res.bonusStart,jp:res.out==='jp',t:Date.now()}); feed.length=Math.min(feed.length,15); }
    hostRender();
    return {ok:true,d:{...res,a:na,jp:JP,st:pubState(m,st)}};
  });
}

async function play(m,data){
  const r=await PAD.req(data&&data.type||'g:spin',{m,...(data||{})},GID);
  if(!r.ok){
    if(r.timeout){ G.fail++;
      if(G.fail>=2||!G.auto){ G.auto=false; G.fail=0; toast('通信が遅れています。少し待ってから、もう一度回してください'); }
      else { const mid=G.mid; setTimeout(()=>{ if(G.auto&&!G.busy&&!G.after&&G.mid===mid&&MACH[mid].spin) MACH[mid].spin(); },1500); }
    } else { toast(r.msg); G.auto=false; }

async function countUp(to){ const from=G.cred; if(to<=from){ G.cred=to; updTop(); return; }

  const t=$('#tray'); if(t){ t.querySelectorAll('i').forEach((c,i)=>{ c.classList.remove('drop'); void c.offsetWidth; c.style.animationDelay=(i*60)+'ms'; c.classList.add('drop'); }); } }

function makeReel(el,h,w,ss,syms){ el.style.width=w+'px'; el.style.height=(h*3)+'px'; el._h=h; el._ss=ss; el._cur=syms; drawCol(el,syms,0); }
function drawCol(el,list,ty){ el.innerHTML=`<div class="col" style="transform:translateY(${ty}px)">${list.map(k=>`<div class="cell" style="height:${el._h}px">${sym(k,el._ss)}</div>`).join('')}</div>`; }
function spinStart(els,pool){ els.forEach(el=>{ const list=[]; for(let i=0;i<24;i++) list.push(pool[Math.floor(Math.random()*pool.length)]);
  drawCol(el,list.concat(el._cur),-(list.length)*el._h); el.classList.add('blur');
  const col=el.firstChild; col.animate([{transform:`translateY(${-(list.length)*el._h}px)`},{transform:`translateY(${-(list.length-12)*el._h}px)`}],{duration:380,iterations:Infinity}); }); }
function spinStop(el,fin,pool,ms){ return new Promise((res0,rej)=>{ let done=false; const res=()=>{ if(done) return; done=true; gone()?rej(ABORT):res0(); };
  const fill=[]; for(let i=0;i<14;i++) fill.push(pool[Math.floor(Math.random()*pool.length)]);
  const list=fin.concat(fill).concat(el._cur.slice(0,3)); drawCol(el,list,-(list.length-3)*el._h); el.classList.add('blur');
  const col=el.firstChild; const a=col.animate([{transform:`translateY(${-(list.length-3)*el._h}px)`},{transform:'translateY(10px)',offset:.88},{transform:'translateY(0px)'}],{duration:ms,easing:'cubic-bezier(.25,.6,.35,1)',fill:'forwards'});
  setTimeout(()=>el.classList.remove('blur'),ms*.7);
  const end=()=>{ if(done) return; el._cur=fin; drawCol(el,fin,0); el.classList.remove('blur'); sfx.stop(); res(); };
  a.onfinish=end; setTimeout(end,ms+400); }); }
function winText(parent,text,top){ const d=document.createElement('div'); d.className='winmsg'; d.style.top=(top||120)+'px'; d.textContent=text; parent.appendChild(d); setTimeout(()=>d.remove(),2200); }

  // ボーナスが光っている・ボーナス中は、BETを当たったときの枚数で固定
  betLock(){ const s=G.st[mid]||{}, P=this.P; if(!s.hk) return 0; if(s.bonus) return 3*s.hk;
    if(s.held&&s.lampOn&&(mid!=='battle'||(P&&P.revealed))) return 3*s.hk; return 0; },
  upd(){ const P=this.P; if(!P||!$('#bLever')) return; const spinning=P.run.some(x=>x);
    const lk=this.betLock(); if(lk&&G.bet[mid]!==lk){ G.bet[mid]=lk; try{ localStorage.setItem('mg.slotpark.bet',JSON.stringify(G.bet)); }catch(e){} }
    const wait=mid==='battle'&&!P.revealed; // PUSH待ちのときは、レバーを引くとPUSHと同じ

  async lever(){
    const P=this.P; if(G.busy||P.run.some(x=>x)) return;
    if(mid==='battle'&&!P.revealed){ this.push(); return; }
    const bet=G.bet[mid]; if(G.cred<bet){ G.auto=false; this.upd(); return toast('メダルが足りません'); }
    P.bet=bet; begin(bet); $('#ledWin').textContent=0; P.res=null; P.q=[]; P.tok=(P.tok||0)+1; const tok=P.tok; P.stopsSent=false; sfx.spin();

  // 止めるボタン:押した位置から最大4コマすべらせて、狙いの絵柄を止める
  stop(i){ const P=this.P; if(!P.run[i]||P.goal[i]!=null) return;

    if(d.flag==='bonusGame'||d.flag==='bell') want='bell'; else if(d.flag==='replay') want='replay';

  playFx(d){ const P=this.P, f=d.fx||{scene:'normal'}; P.fxHit=!!f.hit; P.revealed=true; P.fx=f.scene;

    $('#bSpin').disabled=G.busy||G.cred<G.bet.drop; $('#bAuto').classList.toggle('on',G.auto);
    const mult=CB[Math.min(k+1,CB.length-1)];
    $('#odds').innerHTML=`<div class="h">NEXT ODDS ${k?'COMBO '+(k+1):''}</div>`+Object.keys(O).map((s,i)=>`<div class="o ${i===0?'now':''}"><span>${sym(s)}${sym(s)}${sym(s)}</span><span>${(v=>v>=10?Math.round(v):Math.round(v*10)/10)(O[s]*mult*KK*bet)}</span></div>`).join('');
    const s=G.st.drop||{}; $('#ddat').innerHTML=[['いま',k?k+'連鎖':'—'],['最高',s.best?s.best+'連鎖':'—'],['今日の最高',this.today?'+'+this.today:'—']].map(([l,v])=>`<div class="dat"><span>${l}</span><b>${v}</b></div>`).join('')+'<p>オッズは「BET×連鎖の倍率」。同時に何本もそろうと、その本数倍。</p>'; },
  async spin(){
    if(G.busy) return; const bet=G.bet.drop; if(G.cred<bet){ G.auto=false; this.upd(); return toast('メダルが足りません'); }
    this.bet=bet;
    begin(bet); this.k=0; $('#ledWin').textContent=0; $('#tw').textContent=0; this.upd(); sfx.spin();
    document.querySelectorAll('#dg .gem').forEach((e,i)=>{ e.style.transitionDelay=(i%3)*40+'ms'; e.classList.add('gone'); });
    const t0=Date.now(); const d=await play('drop',{bet});
    if(!d){ this.drawGrid(this.g); G.busy=false; G.hold=false; G.cred=seatA()||0; updTop(); this.upd(); return; }
    await sleep(Math.max(0,350-(Date.now()-t0)));
    const all={}; for(let r=0;r<3;r++) for(let c=0;c<3;c++) all[r+','+c]=1;
    let tw=0, prev=null; const lcd=$('#lcd'), f=G.auto?0.55:1;
    for(let si=0;si<d.steps.length;si++){
      const st=d.steps[si];
      if(si===0) this.drawGrid(st.grid,all);
      else { const fall={}; for(let c=0;c<3;c++){ let n=0; for(let r=0;r<3;r++) if(prev[r+','+c]) n++; for(let r=0;r<n;r++) fall[r+','+c]=1; } this.drawGrid(st.grid,fall); }
      sfx.stop(); await sleep((si===0?520:480)*f);
      if(!st.hit.length) break;
      const cells=$('#dg').children, clear={};
      st.hit.forEach(h=>SP.consts.D_LINES[h.line].forEach(([r,c])=>{ clear[r+','+c]=1; cells[r*3+c].classList.add('hit'); }));
      this.k=st.combo; tw+=st.pay; $('#tw').textContent=tw; $('#ledWin').textContent=tw; this.upd(); sfx.win();
      const cb=document.createElement('div'); cb.className='combo'; cb.textContent=`COMBO ${st.combo}`; cb.style.top='130px'; lcd.appendChild(cb);
      if(st.connect>1){ const cn=document.createElement('div'); cn.className='connect'; cn.textContent=`CONNECT ×${st.connect}`; lcd.appendChild(cn); setTimeout(()=>cn.remove(),1100); }
      await sleep(900*f); cb.remove();
      Object.keys(clear).forEach(k=>{ const [r,c]=k.split(',').map(Number); cells[r*3+c].classList.add('gone'); });
      await sleep(280*f); prev=clear;
    }
    this.g=d.steps[d.steps.length-1].grid;
    if(d.combo>=3){ sfx.big(); winText(lcd,`${d.combo}連鎖!! +${d.pay}`,170); }
    this.today=Math.max(this.today||0,d.pay);
    await finish(d); this.k=0; this.upd(); autoNext(()=>this.spin());
  }
};

/* ---------- どの機種も:回の途中のエラー・画面の切りかえで止まらないように ---------- */
['classic','wide','rocket','jackpot','drop'].forEach(k=>{ const M=MACH[k], f=M.spin; M.spin=async function(){ try{ return await f.apply(this,arguments); }catch(e){ recover(e); } }; });
['oshi','battle'].forEach(k=>{ const M=MACH[k]; ['lever','allStopped'].forEach(n=>{ const f=M[n]; M[n]=async function(){ try{ return await f.apply(this,arguments); }catch(e){ recover(e); } }; }); });

/* ---------- はじめる ---------- */
if(MG.qs.get('mg')) padMain(); else hostMain();
</script>
