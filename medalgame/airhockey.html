<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>エアホッケー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<script src="mg-core.js"></script>
<style>
/* エアホッケー(メダルゲームにつながる版)
   先生のPC:試合の計算・プロジェクター表示・出場者決め・BET・おじゃまアイテム・メダルの精算
   iPad   :観戦(先生のPCから位置を受け取ってなめらかに描く)・立候補・BET・アイテム・出場者は操作 */
:root{--f-num:"Dela Gothic One",sans-serif;--f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;--gold:#f2b705;--ink:#173b33;--soft:#5d7c74;--mint-d:#12a37a;--line:#d5efe5;--warn:#d63c5e;--blue:#2f7bff;--red:#ff4d6d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:var(--f-body);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
body.host{background:#e9f1fb;--ink:#14213a;--soft:#5b6b85;--line:#c9d7ec}
body.pad{background:linear-gradient(180deg,#dcecff,#cfe3fb 60%,#c2daf7);background-attachment:fixed;min-height:100vh}
html.padmode,html.padmode *{touch-action:manipulation}
canvas{display:block;width:100%;height:auto}
.wrap{max-width:1500px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right,0px)) 50px max(14px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ttl{font-family:var(--f-num);font-size:26px}
.ttl small{font-family:var(--f-body);font-size:14px;color:var(--soft);font-weight:800;margin-left:6px}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:#1f9d4a}.chip.off .dot{background:var(--warn)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:1100px){.grid{grid-template-columns:1fr}}
.rink{background:#fff;border-radius:18px;padding:10px;border:2px solid var(--line)}
.box{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.box h2{margin:0 0 8px;font-size:18px}
.note{color:var(--soft);font-size:14px;line-height:1.7;margin:4px 0}
.btn{border:2px solid var(--line);background:#f6f9ff;border-radius:10px;padding:8px 14px;font-weight:800}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.big{font-size:20px;padding:12px 18px;width:100%}
.btn.danger{background:#c8102e;border-color:#c8102e;color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.frm{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-weight:800;font-size:14px}
.frm input,.frm select{border:2px solid var(--line);border-radius:8px;padding:5px 8px;width:100%}
.seg{display:flex;gap:6px}.seg button{flex:1;border:2px solid var(--line);background:#f6f9ff;border-radius:8px;padding:6px;font-weight:800}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;font-weight:800}
.vs .b{color:var(--blue)}.vs .r{color:var(--red)}.vs .nm{font-size:20px}.vs small{display:block;color:var(--soft);font-size:13px}
.big-n{font-family:var(--f-num);font-size:34px;line-height:1.1}
ul.pl{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
ul.pl li{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line);font-weight:800;font-size:14px}
ul.pl li b{margin-left:auto;font-family:var(--f-num);font-weight:400;font-size:16px}
ul.pl li small{color:var(--soft)}
.tag{font-size:12px;border-radius:6px;padding:1px 6px;color:#fff}.tag.b{background:var(--blue)}.tag.r{background:var(--red)}.tag.e{background:#888}
/* iPad */
.pc{background:#fff;border-radius:24px;padding:16px;box-shadow:0 6px 0 rgba(47,123,255,.15)}
.pc+.pc{margin-top:12px}
.pwrap{max-width:1100px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right,0px)) 40px max(12px,env(safe-area-inset-left,0px))}
.pbtn{border:0;border-radius:999px;padding:12px 22px;font-weight:800;font-size:17px;background:#eaf2ff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.pbtn:active{transform:translateY(2px)}.pbtn:disabled{opacity:.4}
a.pbtn{color:var(--ink);text-decoration:none;display:inline-block}
.pbtn.go{background:var(--mint-d);color:#fff}.pbtn.gold{background:linear-gradient(#ffd84a,var(--gold));color:#3a2600}
.pbtn.b{background:var(--blue);color:#fff}.pbtn.r{background:var(--red);color:#fff}
.inbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.inbar .num{font-family:var(--f-num);font-size:clamp(32px,6vw,46px);color:#8a5a00;line-height:1}
.inbar .num small{font-size:.4em}
.inbar .lbl{color:var(--soft);font-weight:800;font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.phase{font-family:var(--f-num);font-size:24px;text-align:center;margin:2px 0 10px}
.cv{border-radius:16px;overflow:hidden;background:#f3f8ff}
.cv.ctl{outline:4px solid var(--gold)}
html.padmode .cv.ctl,html.padmode .cv.ctl canvas{touch-action:none}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sides button{border:4px solid transparent;border-radius:20px;padding:12px;font-weight:800;font-size:20px;color:#fff}
.sides button small{display:block;font-size:14px;opacity:.9}
.sides button.b{background:var(--blue)}.sides button.r{background:var(--red)}
.sides button.on{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,183,5,.35)}
.sides button:disabled{opacity:.35}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin:12px 0}
.chips button{width:58px;height:58px;border-radius:50%;border:4px dashed rgba(255,255,255,.8);color:#fff;font-family:var(--f-num);font-size:17px;opacity:.6}
.chips button.on{opacity:1;box-shadow:0 0 0 4px var(--gold)}
.chips input{width:6em;border:3px solid var(--line);border-radius:14px;padding:6px;font-family:var(--f-num);font-size:22px;text-align:right}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.items button{border:0;border-radius:16px;padding:12px 6px;font-weight:800;font-size:15px;background:#f1f5ff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08);line-height:1.35}
.items button .ic{font-size:26px;display:block}
.items button.b{background:#e3eeff;color:#1d4fb8}.items button.r{background:#ffe5ea;color:#b81d3c}
.items button:disabled{opacity:.4}
.perr{color:var(--warn);font-weight:800;min-height:1.4em;margin:6px 0 0;text-align:center}
.center{text-align:center}
.pmodal{position:fixed;inset:0;background:rgba(20,33,58,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.pmodal .pc{width:min(520px,100%)}
.pmodal h2{margin:0 0 6px}
.amt{display:flex;gap:10px;align-items:center;margin:12px 0}
.amt input{flex:1;min-width:0;border:3px solid var(--mint-d);border-radius:18px;padding:8px 14px;font-family:var(--f-num);font-size:34px;text-align:right}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border:0;border-radius:14px;padding:12px 0;font-weight:800;background:#fff3c2}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14213a;color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;z-index:99}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script>
const GID='airhockey', NAME='エアホッケー', {esc,yen}=MG, $=s=>document.querySelector(s), app=$('#app');
let toastT=null; function toast(m){ if(!m) return; const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3500)}
const now=()=>Date.now();

/* ---------- 盤面(先生のPCとiPadで同じ描き方) ---------- */
const W=1000,H=560,TOP=84,CW=1000,CH=TOP+H;      // 論理サイズ(上の84pxは点数の帯)
const PR=18, MR=34, MR_S=20, GW=180, GW_B=300;     // パック・マレット・ゴールの大きさ
const BUMP=[[W/2,150],[W/2,H-150]], BR=34;          // ジャマ玉の位置
const SIDE={b:'青',r:'赤'}, COL={b:'#2f7bff',r:'#ff4d6d'};
const ITEMS={
  sb:{n:'青のマレットを小さく',e:'青のマレットが小さくなった',ic:'🔹',s:'b',sec:8},
  sr:{n:'赤のマレットを小さく',e:'赤のマレットが小さくなった',ic:'🔻',s:'r',sec:8},
  gb:{n:'青のゴールを広く',e:'青のゴールが広がった',ic:'🥅',s:'b',sec:8},
  gr:{n:'赤のゴールを広く',e:'赤のゴールが広がった',ic:'🥅',s:'r',sec:8},
  sp:{n:'パックを速く',e:'パックが速くなった',ic:'⚡',s:'',sec:6},
  wl:{n:'ジャマ玉を出す',e:'ジャマ玉が出た',ic:'🪨',s:'',sec:8}
};
const ITEM_MAX=3; // 1試合に1人が使える回数

function setupCanvas(cv){ const dpr=Math.min(2,window.devicePixelRatio||1); cv.width=CW*dpr; cv.height=CH*dpr; const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); return c; }
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
/* s = {q:[x,y]|null, b:[x,y,r], r:[x,y,r], g:[青のゴール幅,赤のゴール幅], w:ジャマ玉, sp:速い, sc:[青,赤], tm:のこり秒, gg:延長}
   o = {nb,nr:名前, big:真ん中の大きな字, sub:小さな字, ev:お知らせ, ghost:[x,y,side], me:'b'|'r'} */
function drawScene(c,s,o){
  o=o||{};
  c.clearRect(0,0,CW,CH);
  // 点数の帯
  c.fillStyle='#14213a'; rr(c,0,0,CW,TOP-8,16); c.fill();
  c.textBaseline='middle'; c.font='800 24px "M PLUS Rounded 1c",sans-serif';
  c.fillStyle=COL.b; c.textAlign='left'; c.fillText(o.nb||'青',22,TOP/2-4);
  c.fillStyle=COL.r; c.textAlign='right'; c.fillText(o.nr||'赤',CW-22,TOP/2-4);
  const sc=s.sc||[0,0];
  c.textAlign='center'; c.font='52px "Dela Gothic One",sans-serif';
  c.fillStyle=COL.b; c.fillText(sc[0],CW/2-90,TOP/2-2); c.fillStyle=COL.r; c.fillText(sc[1],CW/2+90,TOP/2-2);
  c.fillStyle='#fff'; c.font='800 22px "M PLUS Rounded 1c",sans-serif';
  c.fillText(s.gg?'延長':(s.tm!=null?`${Math.floor(s.tm/60)}:${String(Math.max(0,Math.floor(s.tm%60))).padStart(2,'0')}`:'—'),CW/2,TOP/2-4);
  // リンク
  c.save(); c.translate(0,TOP);
  c.fillStyle=s.sp?'#fff6db':'#f3f8ff'; rr(c,0,0,W,H,26); c.fill();
  c.lineWidth=6; c.strokeStyle='#14213a'; rr(c,0,0,W,H,26); c.stroke();
  c.strokeStyle='rgba(255,77,109,.55)'; c.lineWidth=4; c.beginPath(); c.moveTo(W/2,8); c.lineTo(W/2,H-8); c.stroke();
  c.beginPath(); c.arc(W/2,H/2,70,0,7); c.stroke();
  c.strokeStyle='rgba(47,123,255,.25)'; c.beginPath(); c.arc(0,H/2,120,-Math.PI/2,Math.PI/2); c.stroke();
  c.strokeStyle='rgba(255,77,109,.25)'; c.beginPath(); c.arc(W,H/2,120,Math.PI/2,Math.PI*1.5); c.stroke();
  const g=s.g||[GW,GW];
  c.fillStyle=COL.b; rr(c,-6,H/2-g[0]/2,14,g[0],6); c.fill();
  c.fillStyle=COL.r; rr(c,W-8,H/2-g[1]/2,14,g[1],6); c.fill();
  if(s.w){ BUMP.forEach(([x,y])=>{ c.fillStyle='#7a6a55'; c.beginPath(); c.arc(x,y,BR,0,7); c.fill(); c.fillStyle='#a99779'; c.beginPath(); c.arc(x-8,y-8,BR*.45,0,7); c.fill(); }); }
  const mal=(m,col)=>{ if(!m) return; const [x,y,r]=m; c.fillStyle='rgba(0,0,0,.12)'; c.beginPath(); c.arc(x+3,y+5,r,0,7); c.fill();
    c.fillStyle=col; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); c.fillStyle='rgba(255,255,255,.45)'; c.beginPath(); c.arc(x,y,r*.55,0,7); c.fill();
    c.fillStyle=col; c.beginPath(); c.arc(x,y,r*.32,0,7); c.fill(); };
  mal(s.b,COL.b); mal(s.r,COL.r);
  if(o.ghost){ const [x,y,sd]=o.ghost; c.strokeStyle=COL[sd]; c.lineWidth=4; c.setLineDash([8,6]); c.beginPath(); c.arc(x,y,(sd==='b'?s.b:s.r)?.[2]||MR,0,7); c.stroke(); c.setLineDash([]); }
  if(s.q){ const [x,y]=s.q; c.fillStyle='rgba(0,0,0,.15)'; c.beginPath(); c.arc(x+2,y+4,PR,0,7); c.fill();
    c.fillStyle=s.sp?'#e07b00':'#14213a'; c.beginPath(); c.arc(x,y,PR,0,7); c.fill(); }
  if(o.me){ c.fillStyle=COL[o.me]; c.font='800 22px "M PLUS Rounded 1c",sans-serif'; c.textAlign='center';
    c.fillText('あなたの陣地',o.me==='b'?W/4:W*3/4,H-24); }
  if(o.big){ c.fillStyle='rgba(255,255,255,.78)'; rr(c,W/2-330,H/2-80,660,160,24); c.fill();
    c.fillStyle=o.bigc||'#14213a'; c.textAlign='center'; c.font='64px "Dela Gothic One",sans-serif'; c.fillText(o.big,W/2,H/2-(o.sub?16:0));
    if(o.sub){ c.font='800 24px "M PLUS Rounded 1c",sans-serif'; c.fillStyle='#14213a'; c.fillText(o.sub,W/2,H/2+46); } }
  if(o.ev){ c.font='800 26px "M PLUS Rounded 1c",sans-serif'; const tw=c.measureText(o.ev).width+40;
    c.fillStyle='rgba(20,33,58,.85)'; rr(c,W/2-tw/2,H-70,tw,48,24); c.fill(); c.fillStyle='#ffd84a'; c.textAlign='center'; c.fillText(o.ev,W/2,H-46); }
  c.restore();
}

if(MG.qs.get('mg')) padMain(); else hostMain();

/* =========================================================================
   先生のPC(このタブが開いている間「稼働中」)
   ========================================================================= */
let HOST=null, CTX=null, AH='';
const CFG_KEY='mg.airhockey.cfg';
const C=Object.assign({mode:'vol',fee:30,goals:5,tlim:120,entSec:20,betSec:20,cost:10,auto:false},(()=>{try{return JSON.parse(localStorage.getItem(CFG_KEY))||{}}catch(e){return{}}})());
const saveCfg=()=>{try{localStorage.setItem(CFG_KEY,JSON.stringify(C))}catch(e){}};
// 試合の状態
const M={ph:'lobby',mid:'',pl:{b:'',r:''},fee:{},ent:new Set(),bets:{},used:{},dl:0,msg:'',win:'',sc:[0,0],gg:false,tEnd:0,res:{},ev:null,evSeq:0,cool:0,busy:false};
// 物理
const S={q:{x:W/2,y:H/2,vx:0,vy:0},m:{b:{x:120,y:H/2,vx:0,vy:0,tx:120,ty:H/2},r:{x:W-120,y:H/2,vx:0,vy:0,tx:W-120,ty:H/2}},fx:{sb:0,sr:0,gb:0,gr:0,sp:0,wl:0},pause:0,hide:false};
let HERE=new Set(), stDirty=true, panelDirty=true, lastSt=0, lastF=0, lastTick=0;

const sideOf=sid=>M.pl.b===sid?'b':M.pl.r===sid?'r':'';
const reserved=sid=>(M.fee[sid]||0)+((M.bets[sid]&&M.bets[sid].a)||0);
const hSeatA=sid=>{const a=HOST.acc()[sid];return a&&a.seat&&a.seat.g===GID?a.seat.a||0:0};
const avail=sid=>hSeatA(sid)-reserved(sid);
const nm=sid=>{const a=HOST.acc()[sid];return a?a.n:''};
const isHere=sid=>{const a=HOST.acc()[sid];return !!(a&&a.vk&&HERE.has(a.vk))};
const eligible=sid=>isHere(sid)&&avail(sid)>=C.fee;
const candidates=()=>HOST.seated().filter(eligible);
const fx=k=>S.fx[k]>now();
const malR=sd=>fx('s'+sd)?MR_S:MR;
const goalW=sd=>fx('g'+sd)?GW_B:GW;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

async function hostMain(){
  document.body.className='host';
  if(!MG.keys.get()){ app.innerHTML=`<div class="wrap"><div class="box"><h2>まだ準備ができていません</h2><p class="note">先に、このPCで <a href="${esc(MG.indexUrl())}">メダルゲームの管理画面</a> を開いて「鍵」を作ってください。</p></div></div>`; return; }
  app.innerHTML='<div class="wrap"><p class="note">接続しています…</p></div>';
  try{
    HOST=await MG.startHost({gid:GID,name:NAME,art:'hockey',hooks:{
      reserved:sid=>reserved(sid),
      beforeQuit:sid=>{ if(M.ent.has(sid)){ M.ent.delete(sid); writeMe(sid); stDirty=panelDirty=true; } return reserved(sid)>0?'later':true; },
      onLeave(sid){ onLeave(sid); },
      async onReq(sid,r){ return padReq(sid,r); }
    }});
  }catch(e){ app.innerHTML=`<div class="wrap"><div class="box"><h2>つながりませんでした</h2><p class="note">${esc(e.message)}</p></div></div>`; return; }
  AH=HOST.P+'/ah';
  await HOST.be.remove(AH).catch(()=>{});
  app.innerHTML=`<div class="wrap"><div class="top"><div class="ttl">${NAME}<small>先生のPC</small></div><span class="sp"></span>
      <span class="chip" id="conn"><i class="dot"></i><span>稼働中</span></span><button class="btn danger" id="stop">停止する(全員を精算)</button></div>
    <div class="grid"><div class="rink"><canvas id="cv"></canvas></div>
      <div><div class="box" id="ctl"></div>
        <div class="box"><h2>設定</h2><div class="frm" id="cfg"></div><p class="note">試合中は変えられません。</p></div>
        <details class="box"><summary style="font-weight:800">遊んでいる人(<span id="nseat">0</span>人)</summary><ul class="pl" id="pl"></ul></details>
      </div></div></div>`;
  CTX=setupCanvas($('#cv'));
  cfgRender();
  HOST.onAcc(()=>{ panelDirty=true; });
  HOST.onConn(ok=>{ const c=$('#conn'); c.classList.toggle('off',!ok); c.lastChild.textContent=ok?'稼働中':'通信が切れています'; });
  HOST.be.on(AH+'/here',v=>{ HERE=new Set(Object.keys(v||{})); panelDirty=true; });
  HOST.be.on(AH+'/in',v=>{ v=v||{}; const acc=HOST.acc();
    ['b','r'].forEach(sd=>{ const sid=M.pl[sd]; if(!sid||!acc[sid]) return; const i=v[acc[sid].vk]; if(!i) return; S.m[sd].tx=+i.x||0; S.m[sd].ty=+i.y||0; }); });
  $('#stop').onclick=async()=>{ const n=HOST.seated().length;
    if(!confirm(`停止しますか?\n遊んでいる ${n}人 のメダルを、全員貯金にもどします。${['bet','ready','play'].includes(M.ph)?'\n(いまの試合は中止になり、BETと参戦料は払われません)':''}`)) return;
    $('#stop').disabled=true; M.ph='stop'; M.fee={}; M.bets={};
    await HOST.stop(); await HOST.be.remove(AH).catch(()=>{}); HOST=null;
    app.innerHTML=`<div class="wrap"><div class="box"><h2>停止しました</h2><p class="note">${n}人を精算しました。このタブは閉じてかまいません。</p></div></div>`; };
  addEventListener('beforeunload',e=>{ if(HOST&&HOST.seated().length){ e.preventDefault(); e.returnValue=''; } });
  document.addEventListener('pointerdown',()=>sfx.unlock(),{once:true});
  resetField(); stDirty=true;
  // 裏のタブでも止まらないように Web Worker の時計で動かす
  try{ const w=new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),16)'],{type:'text/javascript'}))); w.onmessage=tick; }catch(e){ setInterval(tick,16); }
  const draw=()=>{ if(HOST&&CTX) drawScene(CTX,snap(),hostOverlay()); requestAnimationFrame(draw); }; requestAnimationFrame(draw);
}

/* ---------- 試合の流れ ---------- */
function newMatch(){ M.mid=now().toString(36); M.pl={b:'',r:''}; M.fee={}; M.ent=new Set(); M.bets={}; M.used={}; M.res={}; M.win=''; M.msg=''; M.sc=[0,0]; M.gg=false; M.ev=null;
  S.fx={sb:0,sr:0,gb:0,gr:0,sp:0,wl:0}; HOST.be.remove(AH+'/me').catch(()=>{}); HOST.be.remove(AH+'/in').catch(()=>{}); resetField(); }
function startSelect(){
  if(!['lobby','result'].includes(M.ph)) return;
  newMatch();
  if(C.mode==='vol'){ M.ph='entry'; M.dl=now()+C.entSec*1000; }
  else{ const c=shuffle(candidates()); if(c.length<2){ toLobby('出場できる人が2人いません'); return; } assign(c[0],c[1]); }
  setPhase();
}
function closeEntry(){
  const c=shuffle([...M.ent].filter(eligible));
  if(c.length<2){ const was=M.ent; M.ent=new Set(); was.forEach(writeMe); toLobby(`立候補が2人に届きませんでした(${c.length}人)`); return; }
  const was=M.ent; M.ent=new Set(); assign(c[0],c[1]); was.forEach(writeMe); setPhase();
}
function assign(a,b){
  if(Math.random()<.5) [a,b]=[b,a];
  M.pl={b:a,r:b}; M.fee={[a]:C.fee,[b]:C.fee};   // 参戦料は試合が終わるまで「賭けている枚数」として預かる
  M.ph='bet'; M.dl=now()+C.betSec*1000; resetField(); writeMe(a); writeMe(b);
  sfx.ding();
}
function closeBet(){ M.ph='ready'; M.dl=now()+3000; resetField(); setPhase(); }
function startPlay(){ M.ph='play'; M.tEnd=now()+C.tlim*1000; serve(Math.random()<.5?'b':'r',true); setPhase(); }
function toLobby(msg){ M.ph='lobby'; M.msg=msg||''; M.pl={b:'',r:''}; M.fee={}; M.bets={}; M.ent=new Set(); setPhase(); }
function setPhase(){ stDirty=panelDirty=true; cfgRender(); }
function cancelMatch(msg){
  const inv=[M.pl.b,M.pl.r,...Object.keys(M.bets)].filter(Boolean);
  M.tLeft=M.ph==='play'?Math.max(0,(M.tEnd-now())/1000):C.tlim;
  M.fee={}; M.bets={}; M.ph='result'; M.win=''; M.msg=msg; M.dl=now()+8000;
  inv.forEach(s=>{ M.res[s]={net:0,t:'試合は中止。BETと参戦料はもとのままです'}; writeMe(s); });
  setPhase(); afterResult();
}
async function finish(win){
  if(M.ph!=='play') return;
  M.tLeft=Math.max(0,(M.tEnd-now())/1000);
  M.ph='result'; M.win=win; M.busy=true; S.hide=true; M.dl=now()+12000;
  const lose=win==='b'?'r':'b', wn=nm(M.pl[win]), pool=betPool(), tot=pool.b+pool.r, wt=pool[win];
  M.msg=`${SIDE[win]}(${wn})の勝ち! ${M.sc[0]}-${M.sc[1]}`;
  setPhase(); sfx.win();
  const ch={};   // 学籍番号 → 増減
  const add=(s,d,t)=>{ ch[s]=(ch[s]||0)+d; M.res[s]={net:ch[s],t}; };
  add(M.pl[win],M.fee[M.pl[win]]||0,`勝ち! 参戦料 ${C.fee}枚 × 2 をもらいました`);
  add(M.pl[lose],-(M.fee[M.pl[lose]]||0),`負け… 参戦料 ${C.fee}枚 を払いました`);
  Object.entries(M.bets).forEach(([s,bt])=>{
    if(!wt) add(s,0,'当たった人がいないので、BETはもどしました');
    else if(bt.s===win){ const pay=Math.floor(bt.a*tot/wt); add(s,pay-bt.a,`当たり! ${bt.a}枚 → ${pay}枚`); }
    else add(s,-bt.a,`はずれ… ${bt.a}枚`);
  });
  for(const [s,d] of Object.entries(ch)){ if(d) await HOST.change(s,d).catch(e=>{ console.warn(e); M.res[s]={net:0,t:'精算できませんでした(もうゲームにいません)'}; }); }
  M.fee={}; M.bets={}; M.busy=false; M.dl=now()+12000;
  Object.keys(ch).forEach(writeMe); setPhase(); afterResult();
}
async function afterResult(){ // 「勝負が終わってからやめる」にした人を精算
  const acc=HOST.acc();
  for(const s of HOST.seated()){ if(acc[s].seat&&acc[s].seat.leave) await HOST.settle(s).catch(()=>{}); }
}
function onLeave(sid){
  if(M.ent.delete(sid)) stDirty=panelDirty=true;
  if(sideOf(sid)&&['bet','ready','play'].includes(M.ph)){ cancelMatch(`${SIDE[sideOf(sid)]}の出場者がぬけたので、試合は中止です(BETと参戦料はもとのまま)`); return; }
  if(M.bets[sid]){ delete M.bets[sid]; stDirty=true; }
  panelDirty=true;
}
function betPool(){ const p={b:0,r:0,nb:0,nr:0}; Object.values(M.bets).forEach(x=>{p[x.s]+=x.a;p['n'+x.s]++}); return p; }
function odds(p,s){ const t=p.b+p.r; return p[s]?'×'+(t/p[s]).toFixed(2):'—'; }

/* ---------- iPadからの申請 ---------- */
async function padReq(sid,r){
  const t=r.type, sd=sideOf(sid);
  if(t==='g:hello'){ writeMe(sid); return {ok:true}; }
  if(t==='g:entry'){
    if(M.ph!=='entry') return {ok:false,msg:'いまは立候補の時間ではありません'};
    if(!r.on){ M.ent.delete(sid); writeMe(sid); stDirty=panelDirty=true; return {ok:true,msg:'立候補を取り消しました'}; }
    if(avail(sid)<C.fee) return {ok:false,msg:`参戦料 ${C.fee}枚 が足りません`};
    M.ent.add(sid); writeMe(sid); stDirty=panelDirty=true; return {ok:true,msg:'立候補しました!'};
  }
  if(t==='g:bet'){
    if(M.ph!=='bet') return {ok:false,msg:'いまはBETできません'};
    if(sd) return {ok:false,msg:'出場者はBETできません'};
    const s=r.s==='r'?'r':'b', amt=Math.floor(+r.amt||0), cur=M.bets[sid];
    if(amt<1||amt>9999) return {ok:false,msg:'1〜9999枚でBETしてください'};
    if(cur&&cur.s!==s) return {ok:false,msg:`もう${SIDE[cur.s]}にBETしています`};
    if(avail(sid)<amt) return {ok:false,msg:`メダルが足りません(使えるのは ${yen(avail(sid))}枚)`};
    M.bets[sid]={s,a:(cur?cur.a:0)+amt}; writeMe(sid); stDirty=panelDirty=true; sfx.coin();
    return {ok:true,msg:`${SIDE[s]}に${amt}枚BETしました(合計 ${M.bets[sid].a}枚)`};
  }
  if(t==='g:item'){
    const it=ITEMS[r.k]; if(!it) return {ok:false,msg:'そのアイテムはありません'};
    if(M.ph!=='play'||S.pause>now()) return {ok:false,msg:'いまは使えません'};
    if(sd) return {ok:false,msg:'出場者はアイテムを使えません'};
    const u=M.used[sid]||0; if(u>=ITEM_MAX) return {ok:false,msg:`この試合ではもう${ITEM_MAX}回使いました`};
    if(M.cool>now()) return {ok:false,msg:'ほかの人が使ったばかりです。少し待ってね'};
    if(fx(r.k)) return {ok:false,msg:'いま効いているところです'};
    if(avail(sid)<C.cost) return {ok:false,msg:`メダルが足りません(${C.cost}枚 必要)`};
    await HOST.change(sid,-C.cost);
    M.used[sid]=u+1; M.cool=now()+1500; S.fx[r.k]=now()+it.sec*1000;
    if(r.k==='sp'){ S.q.vx*=1.5; S.q.vy*=1.5; }
    if(r.k==='wl') pushOutOfBumpers();
    notice(`おじゃま! ${it.e}`);
    writeMe(sid); sfx.item();
    return {ok:true,msg:`${it.n}!(のこり${ITEM_MAX-u-1}回)`};
  }
  return {ok:false,msg:'その操作はできません'};
}
function notice(text){ M.evSeq++; M.ev={s:M.evSeq,t:text,until:now()+2500}; }
// 本人だけが見る情報(役割・BET・結果)
function writeMe(sid){
  if(!HOST) return; const a=HOST.acc()[sid]; if(!a||!a.vk) return;
  HOST.be.set(AH+'/me/'+a.vk,{mid:M.mid,role:sideOf(sid),ent:M.ent.has(sid),bet:M.bets[sid]||null,used:M.used[sid]||0,rsv:reserved(sid),res:M.res[sid]||null,t:now()}).catch(()=>{});
}

/* ---------- 物理 ---------- */
function resetField(){
  S.q={x:W/2,y:H/2,vx:0,vy:0}; S.hide=false;
  S.m.b=Object.assign(S.m.b,{x:110,y:H/2,vx:0,vy:0,tx:110,ty:H/2});
  S.m.r=Object.assign(S.m.r,{x:W-110,y:H/2,vx:0,vy:0,tx:W-110,ty:H/2});
}
function serve(to,first){ // to の側にパックを置く(点を取られた側から再開)
  S.q={x:to==='b'?W/2-160:W/2+160,y:H/2,vx:0,vy:0}; S.hide=false;
  if(first){ S.q.x=W/2; S.q.vx=(to==='b'?-1:1)*220; S.q.vy=(Math.random()-.5)*200; }
  S.pause=now()+(first?300:1200);
}
function pushOutOfBumpers(){ BUMP.forEach(([x,y])=>{ const dx=S.q.x-x,dy=S.q.y-y,d=Math.hypot(dx,dy)||1; if(d<BR+PR){ S.q.x=x+dx/d*(BR+PR+1); S.q.y=y+dy/d*(BR+PR+1); } }); }
function step(dt){
  const t=now();
  ['b','r'].forEach(sd=>{ const m=S.m[sd], r=malR(sd);
    const x0=sd==='b'?r:W/2+r, x1=sd==='b'?W/2-r:W-r;
    const tx=Math.max(x0,Math.min(x1,m.tx)), ty=Math.max(r,Math.min(H-r,m.ty));
    let dx=tx-m.x, dy=ty-m.y; const d=Math.hypot(dx,dy), mx=1900*dt;
    if(d>mx){ dx*=mx/d; dy*=mx/d; }
    m.x+=dx; m.y+=dy; m.vx=dx/dt; m.vy=dy/dt; });
  if(M.ph!=='play'||S.pause>t||S.hide) return;
  const q=S.q, fast=fx('sp'), vmax=fast?2100:1500;
  q.x+=q.vx*dt; q.y+=q.vy*dt;
  const k=Math.pow(fast?0.85:0.62,dt); q.vx*=k; q.vy*=k;
  if(fast){ const v=Math.hypot(q.vx,q.vy); if(v>1&&v<500){ q.vx*=500/v; q.vy*=500/v; } }
  const e=0.9;
  if(q.y<PR){ q.y=PR; q.vy=Math.abs(q.vy)*e; sfx.wall(); }
  if(q.y>H-PR){ q.y=H-PR; q.vy=-Math.abs(q.vy)*e; sfx.wall(); }
  const gb=goalW('b'), gr=goalW('r'), inB=Math.abs(q.y-H/2)<gb/2-PR*.3, inR=Math.abs(q.y-H/2)<gr/2-PR*.3;
  if(q.x<PR){ if(inB){ if(q.x<-PR){ goal('r'); return; } } else { q.x=PR; q.vx=Math.abs(q.vx)*e; sfx.wall(); } }
  if(q.x>W-PR){ if(inR){ if(q.x>W+PR){ goal('b'); return; } } else { q.x=W-PR; q.vx=-Math.abs(q.vx)*e; sfx.wall(); } }
  ['b','r'].forEach(sd=>{ const m=S.m[sd], r=malR(sd); hitCircle(m.x,m.y,r,m.vx,m.vy,0.95,true); });
  if(fx('wl')) BUMP.forEach(([x,y])=>hitCircle(x,y,BR,0,0,0.95,false));
  const v=Math.hypot(q.vx,q.vy); if(v>vmax){ q.vx*=vmax/v; q.vy*=vmax/v; }
}
function hitCircle(cx,cy,r,mvx,mvy,e,mallet){
  const q=S.q, dx=q.x-cx, dy=q.y-cy, d=Math.hypot(dx,dy), min=r+PR;
  if(d>=min) return;
  const nx=d?dx/d:1, ny=d?dy/d:0;
  q.x=cx+nx*min; q.y=cy+ny*min;
  const rvx=q.vx-mvx, rvy=q.vy-mvy, vn=rvx*nx+rvy*ny;
  if(vn<0){ q.vx-=(1+e)*vn*nx; q.vy-=(1+e)*vn*ny; if(mallet) sfx.hit(Math.min(1,-vn/1200)); else sfx.wall(); }
  // 壁とマレットにはさまれたとき、外へ逃がす
  q.x=Math.max(-PR*3,Math.min(W+PR*3,q.x)); q.y=Math.max(PR,Math.min(H-PR,q.y));
}
function goal(by){
  if(M.ph!=='play'){ S.hide=true; return; }
  M.sc[by==='b'?0:1]++; S.hide=true; sfx.goal();
  const need=C.goals, [a,b]=M.sc;
  if(M.gg||a>=need||b>=need){ notice(`${SIDE[by]}のゴール!`); finish(by); return; }
  notice(`${SIDE[by]}のゴール! ${a}-${b}`); stDirty=true;
  setTimeout(()=>{ if(M.ph==='play') serve(by==='b'?'r':'b'); },900);
  S.pause=now()+2100;
}

/* ---------- 時計 ---------- */
function tick(){
  if(!HOST) return;
  const t=now(), dt=Math.min(0.05,lastTick?(t-lastTick)/1000:0.016); lastTick=t;
  if(M.ph==='entry'&&t>=M.dl) closeEntry();
  else if(M.ph==='bet'&&t>=M.dl) closeBet();
  else if(M.ph==='ready'&&t>=M.dl) startPlay();
  else if(M.ph==='result'&&!M.busy&&C.auto&&t>=M.dl){ toLobby(''); startSelect(); }
  if(['bet','ready','play','result'].includes(M.ph)){
    const n=Math.max(1,Math.ceil(dt/(1/240))); for(let i=0;i<n;i++) step(dt/n);
    if(M.ph==='play'&&!M.gg&&t>=M.tEnd&&!S.hide){ const [a,b]=M.sc; if(a===b){ M.gg=true; notice('時間切れ! 次の1点で決着'); stDirty=true; } else finish(a>b?'b':'r'); }
  }
  // iPadへ:位置は1秒に15回、状態は変わったときだけ(4回/秒まで)
  if(['bet','ready','play','result'].includes(M.ph)&&t-lastF>=66){ lastF=t; HOST.be.set(AH+'/f',snap(true)).catch(()=>{}); }
  if(stDirty&&t-lastSt>=250){ stDirty=false; lastSt=t; HOST.be.set(AH+'/st',stDoc()).catch(()=>{}); }
  if(panelDirty||Math.floor(t/500)!==Math.floor((t-dt*1000)/500)){ panelDirty=false; ctlRender(); }
}
const R=v=>Math.round(v);
function snap(net){
  const t=now(), s={t,sc:M.sc.slice(),gg:M.gg?1:0,g:[goalW('b'),goalW('r')],w:fx('wl')?1:0,sp:fx('sp')?1:0,
    tm:M.ph==='play'?Math.max(0,(M.tEnd-t)/1000):M.ph==='result'?M.tLeft:M.ph==='lobby'||M.ph==='entry'?null:C.tlim,
    b:[R(S.m.b.x),R(S.m.b.y),malR('b')],r:[R(S.m.r.x),R(S.m.r.y),malR('r')],q:S.hide?null:[R(S.q.x),R(S.q.y)]};
  if(net&&M.ev&&M.ev.until>t) s.e=[M.ev.s,M.ev.t];
  return s;
}
function stDoc(){
  const p=betPool();
  return {ph:M.ph,mid:M.mid,mode:C.mode,fee:C.fee,goals:C.goals,tlim:C.tlim,cost:C.cost,left:Math.max(0,(M.dl-now())/1000),
    ent:M.ent.size,pool:[p.b,p.r],nb:[p.nb,p.nr],win:M.win,msg:M.ph==='result'||M.ph==='lobby'?M.msg:'',busy:M.busy?1:0,t:now()};
}
function hostOverlay(){
  const t=now(), o={nb:nm(M.pl.b)||'青',nr:nm(M.pl.r)||'赤'}, left=Math.max(0,Math.ceil((M.dl-t)/1000));
  if(M.ph==='lobby'){ o.big='エアホッケー'; o.sub=M.msg||'iPadでエアホッケーを開いて待っててね'; }
  else if(M.ph==='entry'){ o.big=`立候補 ${left}`; o.sub=`出場したい人はiPadで「出場する」(参戦料 ${C.fee}枚)・いま${M.ent.size}人`; }
  else if(M.ph==='bet'){ const p=betPool(); o.big=`BET ${left}`; o.sub=`青 ${yen(p.b)}枚(${odds(p,'b')}) / 赤 ${yen(p.r)}枚(${odds(p,'r')})`; }
  else if(M.ph==='ready'){ o.big=String(left||'GO!'); o.sub='出場者はiPadの上で指を動かしてね'; }
  else if(M.ph==='result'){ o.big=M.win?`${SIDE[M.win]}の勝ち!`:'中止'; o.bigc=M.win?COL[M.win]:'#14213a'; o.sub=M.win?nm(M.pl[M.win])||'':''; }
  if(M.ev&&M.ev.until>t) o.ev=M.ev.t;
  return o;
}

/* ---------- 効果音(先生のPCだけ) ---------- */
const sfx=(()=>{ let ac=null, last=0;
  const tone=(f,d,type,vol,slide)=>{ if(!ac) return; const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(vol||.1,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d); };
  const lim=f=>(...a)=>{ const t=now(); if(t-last<40) return; last=t; f(...a); };
  return { unlock(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); ac.resume(); }catch(e){} },
    hit:lim(v=>tone(320+400*v,.08,'triangle',.08+.12*v)), wall:lim(()=>tone(180,.05,'square',.03)),
    goal:()=>{ tone(523,.15,'square',.08); setTimeout(()=>tone(784,.3,'square',.08),140); },
    win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.1),i*130)),
    ding:()=>tone(880,.25,'sine',.1), coin:()=>tone(1320,.08,'square',.04), item:()=>tone(300,.3,'sawtooth',.06,900) };
})();

/* =========================================================================
   iPad
   ========================================================================= */
let PAD=null, PCTX=null;
const G={view:undefined,live:true,st:null,stAt:0,me:{},buf:[],off:null,touch:null,sent:'',side:'b',bet:10,busy:false,hold:null,lastEv:0,ev:null,here:null,resMid:''};
async function padMain(){
  document.body.className='pad'; document.documentElement.classList.add('padmode');
  document.querySelector('meta[name=viewport]').content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';
  app.innerHTML='<div class="pwrap"><div class="pc">接続しています…</div></div>';
  try{ PAD=await MG.startPad(); }catch(e){ app.innerHTML=`<div class="pwrap"><div class="pc">つながりません:${esc(e.message)}</div></div>`; return; }
  if(!PAD.vk()){ location.href=PAD.indexUrl(); return; }
  const AHp=PAD.P+'/ah', vk=PAD.vk();
  PAD.onView(v=>{ if(!v){ location.href=PAD.indexUrl(); return; } G.view=v; herePresence(); padRender(); });
  PAD.onGames(g=>{ G.live=!!g[GID]; padRender(); });
  PAD.be.on(AHp+'/st',v=>{ G.st=v; G.stAt=now(); padRender(); });
  PAD.be.on(AHp+'/me/'+vk,v=>{ G.me=v||{}; padRender(); });
  PAD.be.on(AHp+'/f',v=>{ if(!v) return; const t=now(), o=t-v.t; G.off=G.off==null||o<G.off?o:G.off+(o-G.off)*0.002; // 一番速く届いた時を基準にする
    G.buf.push(v); if(G.buf.length>30) G.buf.shift();
    if(v.e&&v.e[0]!==G.lastEv){ G.lastEv=v.e[0]; G.ev={t:v.e[1],until:t+2500}; } });
  // 出場者の指の位置を送る(1秒に20回まで)
  setInterval(()=>{ if(!G.me.role||!G.touch) return; const j=G.touch[0]+','+G.touch[1]; if(j===G.sent) return; G.sent=j;
    PAD.be.set(AHp+'/in/'+vk,{x:G.touch[0],y:G.touch[1],t:now()}).catch(()=>{}); },50);
  const loop=()=>{ if(PCTX) drawScene(PCTX,interp(),padOverlay()); requestAnimationFrame(loop); }; requestAnimationFrame(loop);
  setInterval(padTick,250);
}
function herePresence(){ // エアホッケーの画面を開いている印(ランダムの出場者はこの人たちから選ぶ)
  const inGame=seatA()!==null;
  if(inGame&&!G.here){ G.here=PAD.be.presence(PAD.P+'/ah/here/'+PAD.vk(),{t:now()}); PAD.req('g:hello',{},GID); }
  else if(!inGame&&G.here){ G.here(); G.here=null; }
}
const seatA=()=>{const s=G.view&&G.view.seat;return s&&s.g===GID?s.a||0:null};
const availP=()=>Math.max(0,(seatA()||0)-((G.me&&G.me.mid===(G.st&&G.st.mid))?G.me.rsv||0:0));
const meNow=()=>G.me&&G.st&&G.me.mid===G.st.mid?G.me:{};
const leftP=()=>G.st?Math.max(0,Math.ceil(G.st.left-(now()-G.stAt)/1000)):0;
function interp(){
  const b=G.buf; if(!b.length) return {sc:[0,0],b:[110,H/2,MR],r:[W-110,H/2,MR],q:null};
  const rt=now()-(G.off||0)-110;   // 少し遅らせて、2つの間をつなぐ
  let i=b.length-1; while(i>0&&b[i-1].t>rt) i--;
  const a=b[Math.max(0,i-1)], c=b[i];
  if(!a||a===c||rt>=c.t) return c;
  const k=Math.max(0,Math.min(1,(rt-a.t)/(c.t-a.t||1))), L=(x,y)=>x+(y-x)*k, lp=(p,q)=>p&&q?[L(p[0],q[0]),L(p[1],q[1]),q[2]]:q;
  const s=Object.assign({},c,{b:lp(a.b,c.b),r:lp(a.r,c.r),q:a.q&&c.q&&Math.hypot(a.q[0]-c.q[0],a.q[1]-c.q[1])<200?lp(a.q,c.q):c.q});
  if(c.tm!=null&&a.tm!=null) s.tm=L(a.tm,c.tm);
  return s;
}
function padOverlay(){
  const st=G.st||{}, me=meNow(), o={nb:me.role==='b'?'青(あなた)':'青',nr:me.role==='r'?'赤(あなた)':'赤'}, left=leftP();
  if(me.role) o.me=me.role;
  if(me.role&&G.touch) o.ghost=[G.touch[0],G.touch[1],me.role];
  if(st.ph==='lobby'||!st.ph){ o.big='待っています'; o.sub='先生が試合を始めるまで待ってね'; }
  else if(st.ph==='entry'){ o.big=`立候補 ${left}`; o.sub=`いま${st.ent||0}人`; }
  else if(st.ph==='bet'){ o.big=`BET ${left}`; o.sub=me.role?'あなたは出場者です。指を置いて準備しよう':'下でBETしてね'; }
  else if(st.ph==='ready'){ o.big=String(left||'GO!'); }
  else if(st.ph==='result'){ o.big=st.win?`${SIDE[st.win]}の勝ち!`:'中止'; o.bigc=st.win?COL[st.win]:'#14213a'; }
  if(G.ev&&G.ev.until>now()) o.ev=G.ev.t;
  return o;
}
let lastKey='';
function padTick(){ const k=JSON.stringify([G.st&&G.st.ph,leftP(),meNow().role]); if(k!==lastKey){ lastKey=k; padRender(); } }
function padRender(){
  const v=G.view; if(v===undefined) return;
  const a=seatA(), top=PAD.indexUrl();
  if(a===null){ PCTX=null; app.innerHTML=`<div class="pwrap"><div class="pc"><h2>${NAME}にはまだ入っていません</h2><p class="note">メダルゲームのトップで、持ち込む枚数を選んでから入ってください。</p><div class="mrow" style="justify-content:flex-start"><a class="pbtn go" href="${esc(top)}">トップへ</a></div></div></div>`; return; }
  if(!G.live){ PCTX=null; app.innerHTML=`<div class="pwrap"><div class="pc"><h2>${NAME}は止まりました</h2><p class="note">先生がゲームを止めました。メダルは貯金にもどっています(もどっていないときは、トップで「貯金にもどす」を押してください)。</p><div class="mrow" style="justify-content:flex-start"><a class="pbtn go" href="${esc(top)}">トップへ</a></div></div></div>`; return; }
  if(!$('#pcv')){
    app.innerHTML=`<div class="pwrap">
      <div class="pc inbar"><div><div class="lbl">${esc(v.n)} さん ・ ${NAME}のメダル</div><div class="num" id="num"></div><div class="lbl" id="bank"></div></div>
        <div class="tools"><button class="pbtn" id="tAdd">貯金から追加</button><button class="pbtn" id="tBack">一部もどす</button><button class="pbtn gold" id="tQuit">やめる</button></div></div>
      <div class="pc"><div class="cv" id="cvw"><canvas id="pcv"></canvas></div></div>
      <div class="pc" id="act"></div>
      <div class="center" style="margin-top:12px"><a href="${esc(top)}" class="pbtn" style="font-size:14px">トップへ(メダルは預けたまま)</a></div>
      <div id="mod"></div></div>`;
    PCTX=setupCanvas($('#pcv'));
    const cv=$('#pcv');
    const pos=e=>{ const me=meNow(); if(!me.role) return; const r=cv.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width*CW, y=(e.clientY-r.top)/r.height*CH-TOP;
      G.touch=[Math.round(Math.max(0,Math.min(W,x))),Math.round(Math.max(0,Math.min(H,y)))]; };
    cv.addEventListener('pointerdown',e=>{ if(meNow().role){ e.preventDefault(); cv.setPointerCapture(e.pointerId); pos(e); } });
    cv.addEventListener('pointermove',e=>{ if(meNow().role){ e.preventDefault(); pos(e); } });
    $('#tAdd').onclick=()=>amtModal('add'); $('#tBack').onclick=()=>amtModal('back');
    $('#tQuit').onclick=async()=>{ if(!confirm(`やめますか?\n${yen(seatA())}枚を貯金にもどします。${meNow().rsv?'\n(試合が終わってから、自動で貯金にもどします)':''}`)) return;
      const r=await PAD.req('quit',{},GID); toast(r.msg); if(r.ok&&!(r.d&&r.d.later)) setTimeout(()=>location.href=top,700); };
  }
  const me=meNow(), st=G.st||{};
  $('#num').innerHTML=`${yen(a)}<small>枚</small>`;
  $('#bank').textContent=`貯金 ${yen(v.b)}枚${me.rsv?` ・ 賭けている ${yen(me.rsv)}枚`:''}`;
  $('#cvw').classList.toggle('ctl',!!me.role&&['bet','ready','play'].includes(st.ph));
  actRender();
}
function actRender(){
  const box=$('#act'); if(!box) return;
  const st=G.st||{}, me=meNow(), left=leftP(), ph=st.ph||'lobby', av=availP(), pool=st.pool||[0,0], tot=pool[0]+pool[1];
  const od=i=>pool[i]?'×'+(tot/pool[i]).toFixed(2):'—';
  const key=JSON.stringify([ph,me,st.ent,pool,st.win,st.busy,av,G.side,G.bet,G.busy,st.mid]);
  if(box.dataset.k===key&&!['entry','bet'].includes(ph)) { return; }
  if(box.dataset.k===key){ const l=$('#left'); if(l) l.textContent=left; return; }
  const keepFocus=document.activeElement&&document.activeElement.id==='bIn';
  box.dataset.k=key;
  let h='';
  if(ph==='lobby'){ h=`<div class="phase">つぎの試合を待っています</div><p class="note center">${esc(st.msg||'')}</p><p class="note center">出場者は${st.mode==='rand'?'<b>ランダム</b>で決まります(参戦料 '+st.fee+'枚 を持っている人から)':'<b>立候補</b>で決まります'}。</p>`; }
  else if(ph==='entry'){
    h=`<div class="phase">立候補 受付中(あと<span id="left">${left}</span>秒)</div>
      <p class="note center">出場すると参戦料 <b>${st.fee}枚</b>。勝つと2人分(${st.fee*2}枚)がもらえます。${st.goals}点先取。</p>
      <div class="center">${me.ent?`<button class="pbtn" id="ent" data-on="0">立候補を取り消す</button><p class="note">立候補しました!締め切りで抽選します</p>`:`<button class="pbtn go" id="ent" data-on="1" style="font-size:22px;padding:16px 50px" ${av<st.fee?'disabled':''}>出場する</button>${av<st.fee?'<p class="perr">メダルが足りません</p>':''}`}</div>`;
  }
  else if(me.role&&['bet','ready','play'].includes(ph)){
    h=`<div class="phase" style="color:${COL[me.role]}">あなたは ${SIDE[me.role]} で出場!</div>
      <p class="note center">上の盤面の<b>${me.role==='b'?'左':'右'}半分</b>を指でなぞると、マレットが動きます(点線の丸が指の位置)。プロジェクターの画面を見ながら動かすと、ずれが少なくなります。</p>`;
  }
  else if(ph==='bet'){
    const cur=me.bet;
    h=`<div class="phase">どっちが勝つ?(あと<span id="left">${left}</span>秒)</div>
      <div class="sides"><button class="b ${G.side==='b'?'on':''}" data-s="b" ${cur&&cur.s!=='b'?'disabled':''}>青<small>${yen(pool[0])}枚 ・ ${od(0)}</small></button><button class="r ${G.side==='r'?'on':''}" data-s="r" ${cur&&cur.s!=='r'?'disabled':''}>赤<small>${yen(pool[1])}枚 ・ ${od(1)}</small></button></div>
      <div class="chips">${[[10,'#c02c64'],[30,'#2456c9'],[50,'#7a3fc0'],[100,'#1f8a4c']].map(([n,c])=>`<button data-b="${n}" style="background:${c}" class="${G.bet===n?'on':''}">${n}</button>`).join('')}<input id="bIn" type="number" inputmode="numeric" min="1" value="${G.bet}" aria-label="BETする枚数"><span>枚</span></div>
      <div class="center"><button class="pbtn go" id="betGo" style="font-size:20px;padding:14px 46px" ${G.busy||G.bet<1||G.bet>av?'disabled':''}>${SIDE[G.side]}に BETする</button></div>
      <p class="note center">${cur?`いま <b style="color:${COL[cur.s]}">${SIDE[cur.s]}に${yen(cur.a)}枚</b> BET中(足すこともできます)`:'当たると、BETの合計を当たった人で分けます(×の数字が目安)'}</p><p class="perr" id="err"></p>`;
  }
  else if(ph==='ready'||ph==='play'){
    const used=me.used||0, cost=st.cost||10, rest=3-used;
    h=`<div class="phase">${ph==='ready'?'まもなく開始!':'おじゃまアイテム'} <small style="font-size:15px;font-family:var(--f-body)">1回 ${cost}枚・のこり${rest}回</small></div>
      <div class="items">${Object.entries(ITEMS).map(([k,it])=>`<button data-it="${k}" class="${it.s}" ${ph!=='play'||rest<=0||av<cost||G.busy?'disabled':''}><span class="ic">${it.ic}</span>${it.n}</button>`).join('')}</div>
      ${me.bet?`<p class="note center">あなたのBET:<b style="color:${COL[me.bet.s]}">${SIDE[me.bet.s]}に${yen(me.bet.a)}枚</b></p>`:''}<p class="perr" id="err"></p>`;
  }
  else if(ph==='result'){
    const r=me.res;
    h=`<div class="phase" style="color:${st.win?COL[st.win]:'inherit'}">${st.win?SIDE[st.win]+'の勝ち!':'試合は中止'}</div>
      ${st.busy?'<p class="note center">メダルを精算しています…</p>':r?`<p class="center" style="font-weight:800;font-size:20px">${esc(r.t)}</p><p class="center big-n" style="color:${r.net>0?'var(--mint-d)':r.net<0?'var(--warn)':'var(--soft)'}">${r.net>0?'+':''}${r.net}枚</p>`:'<p class="note center">つぎの試合を待ってね</p>'}`;
  }
  box.innerHTML=h;
  const on=(sel,f)=>box.querySelectorAll(sel).forEach(x=>x.onclick=()=>f(x));
  on('#ent',async x=>{ if(G.busy) return; G.busy=true; const r=await PAD.req('g:entry',{on:x.dataset.on==='1'},GID); G.busy=false; toast(r.msg); actRender(); });
  on('[data-s]',x=>{ G.side=x.dataset.s; actRender(); });
  on('[data-b]',x=>{ G.bet=+x.dataset.b; actRender(); });
  const bi=$('#bIn'); if(bi){ bi.oninput=e=>{ G.bet=Math.floor(+e.target.value||0); const g=$('#betGo'); if(g) g.disabled=G.busy||G.bet<1||G.bet>availP(); }; if(keepFocus) bi.focus(); }
  on('#betGo',async()=>{ if(G.busy) return; G.busy=true; actRender(); const r=await PAD.req('g:bet',{s:G.side,amt:G.bet},GID); G.busy=false; actRender(); if(r.ok) toast(r.msg); else { const e=$('#err'); if(e) e.textContent=r.msg; } });
  on('[data-it]',async x=>{ if(G.busy) return; G.busy=true; actRender(); const r=await PAD.req('g:item',{k:x.dataset.it},GID); G.busy=false; actRender(); if(r.ok) toast(r.msg); else { const e=$('#err'); if(e) e.textContent=r.msg; } });
}
function amtModal(kind){
  const v=G.view, a=seatA(), max=kind==='add'?v.b||0:availP(); let amt=Math.min(kind==='add'?100:max,max);
  const box=$('#mod');
  const draw=()=>{ amt=Math.max(0,Math.min(max,Math.floor(+amt||0)));
    box.innerHTML=`<div class="pmodal"><div class="pc"><h2>${kind==='add'?'貯金から追加':'一部だけ貯金にもどす'}</h2><p class="note">${kind==='add'?`貯金 ${yen(max)}枚`:`もどせるのは ${yen(max)}枚(賭けている分はもどせません)`}</p>
      <div class="amt"><input id="mIn" type="number" inputmode="numeric" value="${amt}"><span>枚</span></div>
      <div class="quick">${[10,50,100].map(n=>`<button data-q="${n}" ${n>max?'disabled':''}>${n}枚</button>`).join('')}<button data-q="${max}">全部</button></div>
      <p class="perr" id="mErr"></p><div class="mrow"><button class="pbtn" id="mNo">やめる</button><button class="pbtn go" id="mGo">${kind==='add'?'追加する':'もどす'}</button></div></div></div>`;
    $('#mIn').oninput=e=>{amt=e.target.value};
    box.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{amt=+b.dataset.q;draw()});
    $('#mNo').onclick=()=>{box.innerHTML=''};
    $('#mGo').onclick=async()=>{ amt=Math.floor(+$('#mIn').value||0); if(amt<1) return; $('#mGo').disabled=true;
      const r=await PAD.req(kind,{amt},GID); if(!r.ok){ $('#mErr').textContent=r.msg; $('#mGo').disabled=false; return; } box.innerHTML=''; toast(r.msg); };
  }; draw();
}
