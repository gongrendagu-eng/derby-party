<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>エアホッケー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<script src="mg-core.js"></script>
<style>
/* エアホッケー(メダルゲームにつながる版)
   先生のPC:試合の計算・プロジェクター表示・出場者決め・BET・おじゃまアイテム・メダルの精算
   iPad   :観戦(先生のPCから位置を受け取ってなめらかに描く)・立候補・BET・アイテム・出場者は操作 */
:root{--f-num:"Dela Gothic One",sans-serif;--f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;--gold:#f2b705;--ink:#173b33;--soft:#5d7c74;--mint-d:#12a37a;--line:#d5efe5;--warn:#d63c5e;--blue:#2f7bff;--red:#ff4d6d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:var(--f-body);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
body.host{background:#e9f1fb;--ink:#14213a;--soft:#5b6b85;--line:#c9d7ec}
body.pad{background:linear-gradient(180deg,#dcecff,#cfe3fb 60%,#c2daf7);background-attachment:fixed;min-height:100vh}
html.padmode,html.padmode *{touch-action:manipulation}
canvas{display:block;width:100%;height:auto}
.wrap{max-width:1500px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right,0px)) 50px max(14px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ttl{font-family:var(--f-num);font-size:26px}
.ttl small{font-family:var(--f-body);font-size:14px;color:var(--soft);font-weight:800;margin-left:6px}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:#1f9d4a}.chip.off .dot{background:var(--warn)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:1100px){.grid{grid-template-columns:1fr}}
.rink{background:#fff;border-radius:18px;padding:10px;border:2px solid var(--line)}
.box{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.box h2{margin:0 0 8px;font-size:18px}
.note{color:var(--soft);font-size:14px;line-height:1.7;margin:4px 0}
.btn{border:2px solid var(--line);background:#f6f9ff;border-radius:10px;padding:8px 14px;font-weight:800}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.big{font-size:20px;padding:12px 18px;width:100%}
.btn.danger{background:#c8102e;border-color:#c8102e;color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.frm{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-weight:800;font-size:14px}
.frm input,.frm select{border:2px solid var(--line);border-radius:8px;padding:5px 8px;width:100%}
.seg{display:flex;gap:6px}.seg button{flex:1;border:2px solid var(--line);background:#f6f9ff;border-radius:8px;padding:6px;font-weight:800}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;font-weight:800}
.vs .b{color:var(--blue)}.vs .r{color:var(--red)}.vs .nm{font-size:20px}.vs small{display:block;color:var(--soft);font-size:13px}
.big-n{font-family:var(--f-num);font-size:34px;line-height:1.1}
ul.pl{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
ul.pl li{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line);font-weight:800;font-size:14px}
ul.pl li b{margin-left:auto;font-family:var(--f-num);font-weight:400;font-size:16px}
ul.pl li small{color:var(--soft)}
.tag{font-size:12px;border-radius:6px;padding:1px 6px;color:#fff}.tag.b{background:var(--blue)}.tag.r{background:var(--red)}.tag.e{background:#888}
/* iPad */
.pc{background:#fff;border-radius:24px;padding:16px;box-shadow:0 6px 0 rgba(47,123,255,.15)}
.pc+.pc{margin-top:12px}
.pwrap{max-width:1100px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right,0px)) 40px max(12px,env(safe-area-inset-left,0px))}
.pbtn{border:0;border-radius:999px;padding:12px 22px;font-weight:800;font-size:17px;background:#eaf2ff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.pbtn:active{transform:translateY(2px)}.pbtn:disabled{opacity:.4}
a.pbtn{color:var(--ink);text-decoration:none;display:inline-block}
.pbtn.go{background:var(--mint-d);color:#fff}.pbtn.gold{background:linear-gradient(#ffd84a,var(--gold));color:#3a2600}
.pbtn.b{background:var(--blue);color:#fff}.pbtn.r{background:var(--red);color:#fff}
.inbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.inbar .num{font-family:var(--f-num);font-size:clamp(32px,6vw,46px);color:#8a5a00;line-height:1}
.inbar .num small{font-size:.4em}
.inbar .lbl{color:var(--soft);font-weight:800;font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.phase{font-family:var(--f-num);font-size:24px;text-align:center;margin:2px 0 10px}
.cv{border-radius:16px;overflow:hidden;background:#f3f8ff}
.cv.ctl{outline:4px solid var(--gold)}
html.padmode .cv.ctl,html.padmode .cv.ctl canvas{touch-action:none}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sides button.g{background:#18a865}.sides button.y{background:#e09a00}
.items button.g{background:#dff6ea;color:#0e7a47}.items button.y{background:#fff1cc;color:#9a6a00}
.tag.g{background:#18a865}.tag.y{background:#e09a00}
.vs4{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center;font-weight:800}
.vs4 div{border:2px solid var(--line);border-radius:10px;padding:6px}
.vs4 small{display:block;color:var(--soft);font-size:13px}
.sides button{border:4px solid transparent;border-radius:20px;padding:12px;font-weight:800;font-size:20px;color:#fff}
.sides button small{display:block;font-size:14px;opacity:.9}
.sides button.b{background:var(--blue)}.sides button.r{background:var(--red)}
.sides button.on{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,183,5,.35)}
.sides button:disabled{opacity:.35}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin:12px 0}
.chips button{width:58px;height:58px;border-radius:50%;border:4px dashed rgba(255,255,255,.8);color:#fff;font-family:var(--f-num);font-size:17px;opacity:.6}
.chips button.on{opacity:1;box-shadow:0 0 0 4px var(--gold)}
.chips input{width:6em;border:3px solid var(--line);border-radius:14px;padding:6px;font-family:var(--f-num);font-size:22px;text-align:right}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.items button{border:0;border-radius:16px;padding:12px 6px;font-weight:800;font-size:15px;background:#f1f5ff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08);line-height:1.35}
.items button .ic{font-size:26px;display:block}
.items button.b{background:#e3eeff;color:#1d4fb8}.items button.r{background:#ffe5ea;color:#b81d3c}
.items button:disabled{opacity:.4}
.perr{color:var(--warn);font-weight:800;min-height:1.4em;margin:6px 0 0;text-align:center}
.center{text-align:center}
.pmodal{position:fixed;inset:0;background:rgba(20,33,58,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.pmodal .pc{width:min(520px,100%)}
.pmodal h2{margin:0 0 6px}
.amt{display:flex;gap:10px;align-items:center;margin:12px 0}
.amt input{flex:1;min-width:0;border:3px solid var(--mint-d);border-radius:18px;padding:8px 14px;font-family:var(--f-num);font-size:34px;text-align:right}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border:0;border-radius:14px;padding:12px 0;font-weight:800;background:#fff3c2}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14213a;color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;z-index:99}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script>
/* エアホッケー(メダルゲームにつながる版)
   形式:1対1・2対2・4人バトル
   モード:フリーモード(貯金のメダルを持ち込む)/掃除モード(?clean=ID。掃除決めのメダルで遊び、最後にルーレットパークへ引き継ぐ) */
const {esc,yen}=MG, $=s=>document.querySelector(s), app=$('#app');
const CLEAN=MG.qs.get('clean')||'';
const GID=CLEAN?'ahclean':'airhockey', NAME=CLEAN?'エアホッケー(掃除決め)':'エアホッケー';
let toastT=null; function toast(m){ if(!m) return; const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3500)}
const now=()=>Date.now();

/* ---------- 形式と盤面 ---------- */
const CW=1000, TOP=84, RH=560, CH=TOP+RH;   // 論理サイズ(上の84pxは点数の帯)
const PR=18, MR=34, MR_S=20;                 // パック・マレット
const CUT=100, DEP=175;                      // 4人バトル:角の斜め・陣地の深さ
const FM={
  '1v1':{n:'1対1',need:2,w:1000,h:RH,gw:180,gwb:300,teams:['b','r']},
  '2v2':{n:'2対2',need:4,w:1000,h:RH,gw:200,gwb:320,teams:['b','r']},
  'ffa':{n:'4人バトル',need:4,w:RH,h:RH,gw:170,gwb:260,teams:['b','r','g','y']}
};
const TEAM={b:'青',r:'赤',g:'緑',y:'黄'}, COL={b:'#2f7bff',r:'#ff4d6d',g:'#18a865',y:'#e09a00'};
const WALL={b:'L',r:'R',g:'T',y:'B'};       // その色のゴールがある壁
const ox=fm=>(CW-FM[fm].w)/2;
function slotsOf(fm){
  const {w,h}=FM[fm];
  if(fm==='1v1') return [{id:'b',t:'b',z:[0,w/2,0,h],home:[110,h/2]},{id:'r',t:'r',z:[w/2,w,0,h],home:[w-110,h/2]}];
  if(fm==='2v2') return [{id:'b1',t:'b',z:[0,w/2,0,h/2],home:[150,h/4],nm:'上'},{id:'b2',t:'b',z:[0,w/2,h/2,h],home:[150,h*3/4],nm:'下'},
                         {id:'r1',t:'r',z:[w/2,w,0,h/2],home:[w-150,h/4],nm:'上'},{id:'r2',t:'r',z:[w/2,w,h/2,h],home:[w-150,h*3/4],nm:'下'}];
  return [{id:'b',t:'b',z:[0,DEP,CUT,h-CUT],home:[60,h/2]},{id:'r',t:'r',z:[w-DEP,w,CUT,h-CUT],home:[w-60,h/2]},
          {id:'g',t:'g',z:[CUT,w-CUT,0,DEP],home:[w/2,60]},{id:'y',t:'y',z:[CUT,w-CUT,h-DEP,h],home:[w/2,h-60]}];
}
const bumpsOf=fm=>{ const {w,h}=FM[fm]; return fm==='ffa'?[[w/2,h/2,38]]:[[w/2,150,34],[w/2,h-150,34]]; };
function itemsOf(fm){
  const L=[]; FM[fm].teams.forEach(t=>{
    L.push({k:'s'+t,t,n:`${TEAM[t]}のマレットを小さく`,e:`${TEAM[t]}のマレットが小さくなった`,ic:'🔻',sec:8});
    L.push({k:'g'+t,t,n:`${TEAM[t]}のゴールを広く`,e:`${TEAM[t]}のゴールが広がった`,ic:'🥅',sec:8}); });
  L.push({k:'sp',t:'',n:'パックを速く',e:'パックが速くなった',ic:'⚡',sec:6});
  L.push({k:'wl',t:'',n:'ジャマ玉を出す',e:'ジャマ玉が出た',ic:'🪨',sec:8});
  return L;
}
const ITEM_MAX=3;
const slotName=(fm,id)=>{ const s=slotsOf(fm).find(x=>x.id===id); return s?TEAM[s.t]+(s.nm?`(${s.nm})`:''):''; };

function setupCanvas(cv){ const dpr=Math.min(2,window.devicePixelRatio||1); cv.width=CW*dpr; cv.height=CH*dpr; const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); return c; }
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const fmtT=s=>s==null?'—':`${Math.floor(s/60)}:${String(Math.max(0,Math.floor(s%60))).padStart(2,'0')}`;
/* s = {fm, m:[[x,y,r,色]...], q:[x,y]|null, g:{色:ゴール幅(0=閉じた)}, w:ジャマ玉, sp, sc:{色:点}, lv:{色:ライフ}, out:[色], tm, gg}
   o = {names:{色:名前}, big, bigc, sub, ev, ghost:[x,y,色], zone:[x0,x1,y0,y1,色]} */
function drawScene(c,s,o){
  o=o||{}; const fm=s.fm||'1v1', F=FM[fm], w=F.w, h=F.h, X=ox(fm), nm=o.names||{};
  c.clearRect(0,0,CW,CH);
  c.fillStyle='#14213a'; rr(c,0,0,CW,TOP-8,16); c.fill();
  c.textBaseline='middle';
  if(fm==='ffa'){
    const ts=F.teams, cw=(CW-160)/4;
    ts.forEach((t,i)=>{ const x=20+i*cw+(i>=2?160:0), out=(s.out||[]).includes(t);
      c.globalAlpha=out?.35:1; c.fillStyle=COL[t]; c.textAlign='left'; c.font='800 20px "M PLUS Rounded 1c",sans-serif';
      c.fillText((nm[t]||TEAM[t]).slice(0,7),x,24);
      const lv=(s.lv||{})[t]||0; c.font='22px sans-serif'; c.fillText(out?'脱落':'♥'.repeat(Math.max(0,lv)),x,54); c.globalAlpha=1; });
    c.fillStyle='#fff'; c.textAlign='center'; c.font='800 24px "M PLUS Rounded 1c",sans-serif'; c.fillText(s.gg?'延長':fmtT(s.tm),CW/2,TOP/2-4);
  }else{
    c.font='800 22px "M PLUS Rounded 1c",sans-serif';
    c.fillStyle=COL.b; c.textAlign='left'; c.fillText(nm.b||'青',22,TOP/2-4);
    c.fillStyle=COL.r; c.textAlign='right'; c.fillText(nm.r||'赤',CW-22,TOP/2-4);
    const sc=s.sc||{}; c.textAlign='center'; c.font='52px "Dela Gothic One",sans-serif';
    c.fillStyle=COL.b; c.fillText(sc.b||0,CW/2-90,TOP/2-2); c.fillStyle=COL.r; c.fillText(sc.r||0,CW/2+90,TOP/2-2);
    c.fillStyle='#fff'; c.font='800 22px "M PLUS Rounded 1c",sans-serif'; c.fillText(s.gg?'延長':fmtT(s.tm),CW/2,TOP/2-4);
  }
  c.save(); c.translate(X,TOP);
  // リンクの形
  const shape=()=>{ if(fm==='ffa'){ c.beginPath(); c.moveTo(CUT,0); c.lineTo(w-CUT,0); c.lineTo(w,CUT); c.lineTo(w,h-CUT); c.lineTo(w-CUT,h); c.lineTo(CUT,h); c.lineTo(0,h-CUT); c.lineTo(0,CUT); c.closePath(); } else rr(c,0,0,w,h,26); };
  c.fillStyle=s.sp?'#fff6db':'#f3f8ff'; shape(); c.fill();
  if(o.zone){ const [x0,x1,y0,y1,t]=o.zone; c.fillStyle=COL[t]+'22'; c.fillRect(x0,y0,x1-x0,y1-y0); }
  c.lineWidth=6; c.strokeStyle='#14213a'; shape(); c.stroke();
  c.lineWidth=4;
  if(fm==='ffa'){ c.strokeStyle='rgba(20,33,58,.18)'; c.beginPath(); c.arc(w/2,h/2,80,0,7); c.stroke();
    F.teams.forEach(t=>{ const [x0,x1,y0,y1]=slotsOf(fm).find(q=>q.t===t).z; c.strokeStyle=COL[t]+'55'; c.setLineDash([10,8]); c.strokeRect(x0+3,y0+3,x1-x0-6,y1-y0-6); c.setLineDash([]); }); }
  else{ c.strokeStyle='rgba(255,77,109,.55)'; c.beginPath(); c.moveTo(w/2,8); c.lineTo(w/2,h-8); c.stroke(); c.beginPath(); c.arc(w/2,h/2,70,0,7); c.stroke();
    if(fm==='2v2'){ c.strokeStyle='rgba(20,33,58,.15)'; c.setLineDash([10,10]); c.beginPath(); c.moveTo(10,h/2); c.lineTo(w-10,h/2); c.stroke(); c.setLineDash([]); } }
  // ゴール
  F.teams.forEach(t=>{ const gw=(s.g||{})[t]; c.fillStyle=gw?COL[t]:'#9aa6b8'; const L=gw||F.gw;
    const wl=WALL[t]; if(!gw&&fm!=='ffa') return;
    if(wl==='L') rr(c,-6,h/2-L/2,14,L,6); else if(wl==='R') rr(c,w-8,h/2-L/2,14,L,6);
    else if(wl==='T') rr(c,w/2-L/2,-6,L,14,6); else rr(c,w/2-L/2,h-8,L,14,6);
    c.fill(); });
  if(s.w) bumpsOf(fm).forEach(([x,y,r])=>{ c.fillStyle='#7a6a55'; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); c.fillStyle='#a99779'; c.beginPath(); c.arc(x-8,y-8,r*.45,0,7); c.fill(); });
  (s.m||[]).forEach(([x,y,r,t])=>{ c.fillStyle='rgba(0,0,0,.12)'; c.beginPath(); c.arc(x+3,y+5,r,0,7); c.fill();
    c.fillStyle=COL[t]; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); c.fillStyle='rgba(255,255,255,.45)'; c.beginPath(); c.arc(x,y,r*.55,0,7); c.fill();
    c.fillStyle=COL[t]; c.beginPath(); c.arc(x,y,r*.32,0,7); c.fill(); });
  if(o.ghost){ const [x,y,t]=o.ghost; c.strokeStyle=COL[t]; c.lineWidth=4; c.setLineDash([8,6]); c.beginPath(); c.arc(x,y,MR,0,7); c.stroke(); c.setLineDash([]); }
  if(s.q){ const [x,y]=s.q; c.fillStyle='rgba(0,0,0,.15)'; c.beginPath(); c.arc(x+2,y+4,PR,0,7); c.fill();
    c.fillStyle=s.sp?'#e07b00':'#14213a'; c.beginPath(); c.arc(x,y,PR,0,7); c.fill(); }
  c.restore();
  // 文字は盤面の真ん中(リンクの幅に関係なく)
  c.save(); c.translate(0,TOP);
  if(o.big){ c.fillStyle='rgba(255,255,255,.8)'; rr(c,CW/2-330,RH/2-80,660,160,24); c.fill();
    c.fillStyle=o.bigc||'#14213a'; c.textAlign='center'; c.font='60px "Dela Gothic One",sans-serif'; c.fillText(o.big,CW/2,RH/2-(o.sub?16:0));
    if(o.sub){ c.font='800 22px "M PLUS Rounded 1c",sans-serif'; c.fillStyle='#14213a'; c.fillText(o.sub,CW/2,RH/2+46); } }
  if(o.ev){ c.font='800 26px "M PLUS Rounded 1c",sans-serif'; const tw=c.measureText(o.ev).width+40;
    c.fillStyle='rgba(20,33,58,.85)'; rr(c,CW/2-tw/2,RH-70,tw,48,24); c.fill(); c.fillStyle='#ffd84a'; c.textAlign='center'; c.fillText(o.ev,CW/2,RH-46); }
  c.restore();
}

/* =========================================================================
   先生のPC(このタブが開いている間「稼働中」)
   ========================================================================= */
let HOST=null, CTX=null, AH='', SESS=null, CB={};
const CFG_KEY='mg.airhockey.cfg';
const C=Object.assign({fm:'1v1',mode:'vol',fee:30,goals:5,lives:3,tlim:120,entSec:20,betSec:20,cost:10,auto:false},(()=>{try{return JSON.parse(localStorage.getItem(CFG_KEY))||{}}catch(e){return{}}})());
if(!FM[C.fm]) C.fm='1v1';
const saveCfg=()=>{try{localStorage.setItem(CFG_KEY,JSON.stringify(C))}catch(e){}};
const M={ph:'lobby',mid:'',fm:C.fm,pl:{},fee:{},ent:new Set(),bets:{},used:{},dl:0,msg:'',win:'',sc:{},lv:{},out:new Set(),gg:false,tEnd:0,tLeft:null,res:{},ev:null,evSeq:0,cool:0,busy:false};
const S={q:{x:0,y:0,vx:0,vy:0},m:{},fx:{},pause:0,hide:false};
let HERE=new Set(), stDirty=true, panelDirty=true, lastSt=0, lastF=0, lastTick=0;

const curSlots=()=>slotsOf(M.fm);
const slotOf=sid=>Object.keys(M.pl).find(k=>M.pl[k]===sid)||'';
const teamOf=sid=>{ const k=slotOf(sid); return k?k[0]:''; };
const reserved=sid=>(M.fee[sid]||0)+((M.bets[sid]&&M.bets[sid].a)||0);
const hSeatA=sid=>{const a=HOST.acc()[sid];return a&&a.seat&&a.seat.g===GID?a.seat.a||0:0};
const bal=sid=>CLEAN?(CB[sid]||0):hSeatA(sid);
const avail=sid=>bal(sid)-reserved(sid);
const people=()=>CLEAN?Object.keys(SESS.m||{}).sort((a,b)=>a.localeCompare(b,'ja',{numeric:true})):HOST.seated();
const nm=sid=>{const a=HOST.acc()[sid];return a?a.n:''};
const isHere=sid=>{const a=HOST.acc()[sid];return !!(a&&a.vk&&HERE.has(a.vk))};
const eligible=sid=>isHere(sid)&&avail(sid)>=C.fee;
const candidates=()=>people().filter(eligible);
const fx=k=>(S.fx[k]||0)>now();
const malR=t=>fx('s'+t)?MR_S:MR;
const goalW=t=>M.out.has(t)?0:(fx('g'+t)?FM[M.fm].gwb:FM[M.fm].gw);
const teamNames=()=>{ const o={}; FM[M.fm].teams.forEach(t=>{ o[t]=curSlots().filter(s=>s.t===t).map(s=>nm(M.pl[s.id])).filter(Boolean).join('・')||TEAM[t]; }); return o; };
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- 試合の流れ ---------- */
function newMatch(){ M.mid=now().toString(36); M.fm=C.fm; M.pl={}; M.fee={}; M.ent=new Set(); M.bets={}; M.used={}; M.res={}; M.win=''; M.msg=''; M.gg=false; M.ev=null; M.tLeft=null;
  M.sc={}; M.lv={}; M.out=new Set(); FM[M.fm].teams.forEach(t=>{M.sc[t]=0;M.lv[t]=C.lives;});
  S.fx={}; HOST.be.remove(AH+'/in').catch(()=>{}); resetField(); }
function startSelect(){
  if(!['lobby','result'].includes(M.ph)) return;
  newMatch();
  if(C.mode==='vol'){ M.ph='entry'; M.dl=now()+C.entSec*1000; people().forEach(writeMe); }
  else{ const c=shuffle(candidates()); if(c.length<FM[M.fm].need){ toLobby(`出場できる人が${FM[M.fm].need}人いません`); return; } assign(c.slice(0,FM[M.fm].need)); }
  setPhase();
}
function closeEntry(){
  const need=FM[M.fm].need, c=shuffle([...M.ent].filter(eligible));
  if(c.length<need){ M.ent=new Set(); people().forEach(writeMe); toLobby(`立候補が${need}人に届きませんでした(${c.length}人)`); return; }
  M.ent=new Set(); assign(c.slice(0,need)); setPhase();
}
function assign(list){
  list=shuffle(list); M.pl={}; M.fee={};
  curSlots().forEach((s,i)=>{ M.pl[s.id]=list[i]; M.fee[list[i]]=C.fee; });  // 参戦料は試合が終わるまで「預かり」
  M.ph='bet'; M.dl=now()+C.betSec*1000; resetField(); people().forEach(writeMe); sfx.ding();
}
function closeBet(){ M.ph='ready'; M.dl=now()+3000; resetField(); setPhase(); }
function startPlay(){ M.ph='play'; M.tEnd=now()+C.tlim*1000; serve(null,true); setPhase(); }
function toLobby(msg){ M.ph='lobby'; M.msg=msg||''; M.fm=C.fm; M.pl={}; M.fee={}; M.bets={}; M.ent=new Set(); M.out=new Set(); resetField(); setPhase(); }
function setPhase(){ stDirty=panelDirty=true; cfgRender(); }
function cancelMatch(msg){
  const inv=[...Object.values(M.pl),...Object.keys(M.bets)];
  M.tLeft=M.ph==='play'?Math.max(0,(M.tEnd-now())/1000):C.tlim;
  M.fee={}; M.bets={}; M.ph='result'; M.win=''; M.msg=msg; M.dl=now()+8000; S.hide=true;
  inv.forEach(s=>{ M.res[s]={net:0,t:'試合は中止。BETと参戦料はもとのままです'}; });
  people().forEach(writeMe); setPhase(); afterResult();
}
async function finish(win){
  if(M.ph!=='play') return;
  M.tLeft=Math.max(0,(M.tEnd-now())/1000);
  M.ph='result'; M.win=win; M.busy=true; S.hide=true; M.dl=now()+12000;
  const names=teamNames(), pool=betPool();
  M.msg=M.fm==='ffa'?`${TEAM[win]}(${names[win]})の勝ち!`:`${TEAM[win]}(${names[win]})の勝ち! ${M.sc.b}-${M.sc.r}`;
  setPhase(); sfx.win();
  const ch={}, add=(s,d,t)=>{ ch[s]=(ch[s]||0)+d; M.res[s]={net:ch[s],t}; };
  const players=Object.keys(M.pl), winners=players.filter(k=>k[0]===win).map(k=>M.pl[k]);
  const pot=players.reduce((a,k)=>a+(M.fee[M.pl[k]]||0),0), share=winners.length?Math.floor(pot/winners.length):0;
  players.forEach(k=>{ const s=M.pl[k], f=M.fee[s]||0;
    if(k[0]===win) add(s,share-f,`勝ち! 参戦料 ${pot}枚 ${winners.length>1?`を${winners.length}人で分けて ${share}枚`:'をもらいました'}`);
    else add(s,-f,`負け… 参戦料 ${f}枚 を払いました`); });
  Object.entries(M.bets).forEach(([s,bt])=>{
    if(!pool.a[win]) add(s,0,'当たった人がいないので、BETはもどしました');
    else if(bt.s===win){ const pay=Math.floor(bt.a*pool.tot/pool.a[win]); add(s,pay-bt.a,`当たり! ${bt.a}枚 → ${pay}枚`); }
    else add(s,-bt.a,`はずれ… ${bt.a}枚`);
  });
  for(const [s,d] of Object.entries(ch)){ if(d) await addBal(s,d).catch(e=>{ console.warn(e); M.res[s]={net:0,t:'精算できませんでした(もうゲームにいません)'}; }); }
  M.fee={}; M.bets={}; M.busy=false; M.dl=now()+12000;
  people().forEach(writeMe); setPhase(); afterResult();
}
async function afterResult(){ // 「勝負が終わってからやめる」にした人を精算(フリーモード)
  if(CLEAN) return; const acc=HOST.acc();
  for(const s of HOST.seated()){ if(acc[s].seat&&acc[s].seat.leave) await HOST.settle(s).catch(()=>{}); }
}
function onLeave(sid){
  if(M.ent.delete(sid)) stDirty=panelDirty=true;
  const k=slotOf(sid);
  if(k&&['bet','ready','play'].includes(M.ph)){ cancelMatch(`${slotName(M.fm,k)}の出場者がぬけたので、試合は中止です(BETと参戦料はもとのまま)`); return; }

/* ---------- 物理 ---------- */
function resetField(){
  const {w,h}=FM[M.fm];
  S.q={x:w/2,y:h/2,vx:0,vy:0}; S.hide=false; S.m={};
  slotsOf(M.fm).forEach(s=>{ S.m[s.id]={x:s.home[0],y:s.home[1],vx:0,vy:0,tx:s.home[0],ty:s.home[1]}; });

function serve(conceded,first){
  const {w,h}=FM[M.fm];
  S.hide=false;
  if(M.fm==='ffa'){ const alive=FM.ffa.teams.filter(t=>!M.out.has(t)), t=alive[Math.random()*alive.length|0]||'b';
    const dir={b:[-1,0],r:[1,0],g:[0,-1],y:[0,1]}[t], a=(Math.random()-.5)*.8, sp=320;
    S.q={x:w/2,y:h/2,vx:(dir[0]*Math.cos(a)-dir[1]*Math.sin(a))*sp,vy:(dir[0]*Math.sin(a)+dir[1]*Math.cos(a))*sp}; }
  else if(first){ const s=Math.random()<.5?-1:1; S.q={x:w/2,y:h/2,vx:s*220,vy:(Math.random()-.5)*200}; }
  else S.q={x:conceded==='b'?w/2-160:w/2+160,y:h/2,vx:0,vy:0};
  S.pause=now()+(first?300:1200);
}
function pushOutOfBumpers(){ bumpsOf(M.fm).forEach(([x,y,r])=>{ const dx=S.q.x-x,dy=S.q.y-y,d=Math.hypot(dx,dy)||1; if(d<r+PR){ S.q.x=x+dx/d*(r+PR+1); S.q.y=y+dy/d*(r+PR+1); } }); }
function step(dt){
  const t=now(), F=FM[M.fm], w=F.w, h=F.h;
  slotsOf(M.fm).forEach(sl=>{ const m=S.m[sl.id]; if(!m) return; const r=malR(sl.t), z=sl.z;
    if(M.out.has(sl.t)) return;
    const tx=Math.max(Math.max(r,z[0]+r),Math.min(Math.min(w-r,z[1]-r),m.tx)), ty=Math.max(Math.max(r,z[2]+r),Math.min(Math.min(h-r,z[3]-r),m.ty));
    let dx=tx-m.x, dy=ty-m.y; const d=Math.hypot(dx,dy), mx=1900*dt;
    if(d>mx){ dx*=mx/d; dy*=mx/d; }
    m.x+=dx; m.y+=dy; m.vx=dx/dt; m.vy=dy/dt; });
  if(M.ph!=='play'||S.pause>t||S.hide) return;
  const q=S.q, fast=fx('sp'), vmax=fast?2100:1500, ffa=M.fm==='ffa';
  q.x+=q.vx*dt; q.y+=q.vy*dt;
  const k=Math.pow(fast?0.85:ffa?0.8:0.62,dt); q.vx*=k; q.vy*=k;
  const vmin=fast?500:ffa?260:0;   // 4人バトルは真ん中で止まらないように、いつも少し動かす
  if(vmin){ const v=Math.hypot(q.vx,q.vy); if(v<vmin){ if(v<1){ const a=Math.random()*7; q.vx=Math.cos(a); q.vy=Math.sin(a); } const v2=Math.hypot(q.vx,q.vy); q.vx*=vmin/v2; q.vy*=vmin/v2; } }
  const e=0.9, open=(tm,pos,len)=>tm&&!M.out.has(tm)&&Math.abs(pos-len/2)<goalW(tm)/2-PR*.3;
  const owner=wl=>F.teams.find(tm=>WALL[tm]===wl);
  // 左右
  if(q.x<PR){ if(open(owner('L'),q.y,h)){ if(q.x<-PR){ goal(owner('L')); return; } } else { q.x=PR; q.vx=Math.abs(q.vx)*e; sfx.wall(); } }
  if(q.x>w-PR){ if(open(owner('R'),q.y,h)){ if(q.x>w+PR){ goal(owner('R')); return; } } else { q.x=w-PR; q.vx=-Math.abs(q.vx)*e; sfx.wall(); } }
  // 上下
  if(q.y<PR){ if(open(owner('T'),q.x,w)){ if(q.y<-PR){ goal(owner('T')); return; } } else { q.y=PR; q.vy=Math.abs(q.vy)*e; sfx.wall(); } }
  if(q.y>h-PR){ if(open(owner('B'),q.x,w)){ if(q.y>h+PR){ goal(owner('B')); return; } } else { q.y=h-PR; q.vy=-Math.abs(q.vy)*e; sfx.wall(); } }
  // 4人バトルの角(斜めの壁)
  if(ffa){ const R2=Math.SQRT1_2;
    [[1,1,0,0],[-1,1,w,0],[1,-1,0,h],[-1,-1,w,h]].forEach(([sx,sy,cx,cy])=>{
      const d=((q.x-cx)*sx+(q.y-cy)*sy-CUT)*R2;
      if(d<PR){ const nx=sx*R2, ny=sy*R2, push=PR-d; q.x+=nx*push; q.y+=ny*push; const vn=q.vx*nx+q.vy*ny; if(vn<0){ q.vx-=(1+e)*vn*nx; q.vy-=(1+e)*vn*ny; sfx.wall(); } } }); }
  slotsOf(M.fm).forEach(sl=>{ if(M.out.has(sl.t)) return; const m=S.m[sl.id]; hitCircle(m.x,m.y,malR(sl.t),m.vx,m.vy,0.95,true,w,h); });
  if(fx('wl')) bumpsOf(M.fm).forEach(([x,y,r])=>hitCircle(x,y,r,0,0,0.95,false,w,h));
  const v=Math.hypot(q.vx,q.vy); if(v>vmax){ q.vx*=vmax/v; q.vy*=vmax/v; }
}
function hitCircle(cx,cy,r,mvx,mvy,e,mallet,w,h){
  const q=S.q, dx=q.x-cx, dy=q.y-cy, d=Math.hypot(dx,dy), min=r+PR;
  if(d>=min) return;
  const nx=d?dx/d:1, ny=d?dy/d:0;
  q.x=cx+nx*min; q.y=cy+ny*min;
  const rvx=q.vx-mvx, rvy=q.vy-mvy, vn=rvx*nx+rvy*ny;
  if(vn<0){ q.vx-=(1+e)*vn*nx; q.vy-=(1+e)*vn*ny; if(mallet) sfx.hit(Math.min(1,-vn/1200)); else sfx.wall(); }
  q.x=Math.max(-PR*3,Math.min(w+PR*3,q.x)); q.y=Math.max(-PR*3,Math.min(h+PR*3,q.y));
}
// conceded = ゴールを入れられた色
function goal(conceded){
  if(M.ph!=='play'){ S.hide=true; return; }

    notice(`${TEAM[by]}のゴール! ${M.sc.b}-${M.sc.r}`);

function timeUp(){
  if(M.fm==='ffa'){
    const alive=FM.ffa.teams.filter(t=>!M.out.has(t)), mx=Math.max(...alive.map(t=>M.lv[t]||0));

    const rest=FM.ffa.teams.filter(t=>!M.out.has(t));
    if(rest.length===1){ finish(rest[0]); return; }
    M.gg=true; notice('時間切れ! 次に入れられた人が脱落'); stDirty=true; return;
  }
  if(M.sc.b===M.sc.r){ M.gg=true; notice('時間切れ! 次の1点で決着'); stDirty=true; }
  else finish(M.sc.b>M.sc.r?'b':'r');
}

function tick(){
  if(!HOST) return;

  if(M.ph==='entry'&&t>=M.dl) closeEntry();

  if(['bet','ready','play','result'].includes(M.ph)){
    const n=Math.max(1,Math.ceil(dt/(1/240))); for(let i=0;i<n;i++) step(dt/n);
    if(M.ph==='play'&&!M.gg&&t>=M.tEnd&&!S.hide) timeUp();
  }
  if(['bet','ready','play','result'].includes(M.ph)&&t-lastF>=66){ lastF=t; HOST.be.set(AH+'/f',snap(true)).catch(()=>{}); }
  if(stDirty&&t-lastSt>=250){ stDirty=false; lastSt=t; HOST.be.set(AH+'/st',stDoc()).catch(()=>{}); }
  if(panelDirty||Math.floor(t/500)!==Math.floor((t-dt*1000)/500)){ panelDirty=false; ctlRender(); }
}

  const tone=(f,d,type,vol,slide)=>{ if(!ac) return; const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(vol||.1,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d); };
  const lim=f=>(...a)=>{ const t=now(); if(t-last<40) return; last=t; f(...a); };
  return { unlock(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); ac.resume(); }catch(e){} },

  const st=G.st||{}, me=meNow(), fm=curFm(), o={names:{}}, left=leftP();
  FM[fm].teams.forEach(t=>o.names[t]=TEAM[t]);
  if(me.role){ const t=me.role[0], sl=slotsOf(fm).find(s=>s.id===me.role); o.names[t]=TEAM[t]+'(あなた)'; if(sl) o.zone=[...sl.z,t]; if(G.touch) o.ghost=[G.touch[0],G.touch[1],t]; }
  if(st.ph==='lobby'||!st.ph){ o.big='待っています'; o.sub='先生が試合を始めるまで待ってね'; }
  else if(st.ph==='entry'){ o.big=`立候補 ${left}`; o.sub=`${FM[fm].n}・いま${st.ent||0}人`; }
  else if(st.ph==='bet'){ o.big=`BET ${left}`; o.sub=me.role?'あなたは出場者です。色のついた場所に指を置こう':'下でBETしてね'; }
  else if(st.ph==='ready'){ o.big=String(left||'GO!'); }
  else if(st.ph==='result'){ o.big=st.win?`${TEAM[st.win]}の勝ち!`:'中止'; o.bigc=st.win?COL[st.win]:'#14213a'; }
  if(G.ev&&G.ev.until>now()) o.ev=G.ev.t;
  return o;
}
let lastKey='';
function padTick(){ const k=JSON.stringify([G.st&&G.st.ph,leftP(),meNow().role]); if(k!==lastKey){ lastKey=k; padRender(); } }
function padMsg(t,m,btn){ PCTX=null; app.innerHTML=`<div class="pwrap"><div class="pc"><h2>${t}</h2><p class="note">${m}</p><div class="mrow" style="justify-content:flex-start">${btn||''}<a class="pbtn" href="${esc(PAD.indexUrl())}">トップへ</a></div></div></div>`; }
function padRender(){
  const v=G.view; if(v===undefined) return;
  if(CLEAN){
    if(v.cl!==CLEAN) return padMsg('この掃除決めには参加していません','先生に確認してください。');
    if(!G.live){ // エアホッケーが終わった:ルーレットパークへ
      const id=Object.keys(G.games).find(k=>G.games[k].clean===CLEAN);
      if(id){ const u=new URL(G.games[id].url); u.searchParams.set('mg',PAD.pub); if(MG.LOCAL) u.searchParams.set('local','1');
        return padMsg(`${esc(G.games[id].n)}が始まりました`,'エアホッケーのメダルを、そのまま引き継いでいます。',`<a class="pbtn go" href="${esc(u.href)}">${esc(G.games[id].n)}へ</a>`); }
      return padMsg('エアホッケーは終わりました','先生がつぎのゲーム(ルーレットパーク)を開くまで待ってね。');
    }
  }else{
    if(seatA()===null) return padMsg(`${NAME}にはまだ入っていません`,'メダルゲームのトップで、持ち込む枚数を選んでから入ってください。','');
    if(!G.live) return padMsg(`${NAME}は止まりました`,'先生がゲームを止めました。メダルは貯金にもどっています(もどっていないときは、トップで「貯金にもどす」を押してください)。');
  }
  const top=PAD.indexUrl();
  if(!$('#pcv')){
    app.innerHTML=`<div class="pwrap">
      <div class="pc inbar"><div><div class="lbl">${esc(v.n)} さん ・ ${CLEAN?'掃除決めのメダル':NAME+'のメダル'}</div><div class="num" id="num"></div><div class="lbl" id="bank"></div></div>
        ${CLEAN?'':'<div class="tools"><button class="pbtn" id="tAdd">貯金から追加</button><button class="pbtn" id="tBack">一部もどす</button><button class="pbtn gold" id="tQuit">やめる</button></div>'}</div>
      <div class="pc"><div class="cv" id="cvw"><canvas id="pcv"></canvas></div></div>
      <div class="pc" id="act"></div>
      <div class="center" style="margin-top:12px"><a href="${esc(top)}" class="pbtn" style="font-size:14px">トップへ${CLEAN?'':'(メダルは預けたまま)'}</a></div>
      <div id="mod"></div></div>`;
    PCTX=setupCanvas($('#pcv'));
    const cv=$('#pcv');
    const pos=e=>{ const me=meNow(); if(!me.role) return; const r=cv.getBoundingClientRect(), fm=curFm(), F=FM[fm];
      const x=(e.clientX-r.left)/r.width*CW-ox(fm), y=(e.clientY-r.top)/r.height*CH-TOP;
      G.touch=[Math.round(Math.max(0,Math.min(F.w,x))),Math.round(Math.max(0,Math.min(F.h,y)))]; };
    cv.addEventListener('pointerdown',e=>{ if(meNow().role){ e.preventDefault(); cv.setPointerCapture(e.pointerId); pos(e); } });
    cv.addEventListener('pointermove',e=>{ if(meNow().role){ e.preventDefault(); pos(e); } });
    if(!CLEAN){
      $('#tAdd').onclick=()=>amtModal('add'); $('#tBack').onclick=()=>amtModal('back');
      $('#tQuit').onclick=async()=>{ if(!confirm(`やめますか?\n${yen(seatA())}枚を貯金にもどします。${meNow().rsv?'\n(試合が終わってから、自動で貯金にもどします)':''}`)) return;
        const r=await PAD.req('quit',{},GID); toast(r.msg); if(r.ok&&!(r.d&&r.d.later)) setTimeout(()=>location.href=top,700); };
    }
  }
  const me=meNow(), st=G.st||{};
  $('#num').innerHTML=`${yen(myBal())}<small>枚</small>`;
  $('#bank').textContent=CLEAN?(me.rsv?`賭けている ${yen(me.rsv)}枚`:'この日だけのメダル(あとでルーレットパークへ)'):`貯金 ${yen(v.b)}枚${me.rsv?` ・ 賭けている ${yen(me.rsv)}枚`:''}`;
  $('#cvw').classList.toggle('ctl',!!me.role&&['bet','ready','play'].includes(st.ph));
  actRender();
}
function actRender(){
  const box=$('#act'); if(!box) return;
  const st=G.st||{}, me=meNow(), left=leftP(), ph=st.ph||'lobby', av=availP(), fm=curFm(), T=FM[fm].teams, pool=st.pool||{}, tot=st.tot||0, np=st.np||{};
  if(!T.includes(G.side)) G.side=T[0];
  const od=t=>pool[t]?'×'+(tot/pool[t]).toFixed(2):'—';
  const key=JSON.stringify([ph,me,st.ent,pool,st.win,st.busy,av,G.side,G.bet,G.busy,st.mid,st.out,fm]);
  if(box.dataset.k===key){ const l=$('#left'); if(l) l.textContent=left; return; }
  const keepFocus=document.activeElement&&document.activeElement.id==='bIn';
  box.dataset.k=key;
  let h='';
  const prize=fm==='2v2'?`勝ったチームの2人で${st.fee*4}枚を分けます(1人${st.fee*2}枚)`:`勝つと${st.fee*FM[fm].need}枚がもらえます`;
  if(ph==='lobby'){ h=`<div class="phase">つぎの試合を待っています</div><p class="note center">${esc(st.msg||'')}</p><p class="note center">出場者は${st.mode==='rand'?'<b>ランダム</b>で決まります(参戦料 '+st.fee+'枚 を持っている人から)':'<b>立候補</b>で決まります'}。</p>`; }
  else if(ph==='entry'){
    h=`<div class="phase">${FM[fm].n} 立候補 受付中(あと<span id="left">${left}</span>秒)</div>
      <p class="note center">出場すると参戦料 <b>${st.fee}枚</b>。${prize}。${fm==='ffa'?`ライフ${st.lives}、最後の1人が勝ち`:`${st.goals}点先取`}。</p>
      <div class="center">${me.ent?`<button class="pbtn" id="ent" data-on="0">立候補を取り消す</button><p class="note">立候補しました!締め切りで抽選します</p>`:`<button class="pbtn go" id="ent" data-on="1" style="font-size:22px;padding:16px 50px" ${av<st.fee?'disabled':''}>出場する</button>${av<st.fee?'<p class="perr">メダルが足りません</p>':''}`}</div>`;
  }
  else if(me.role&&['bet','ready','play'].includes(ph)){
    const t=me.role[0];
    h=`<div class="phase" style="color:${COL[t]}">あなたは ${slotName(fm,me.role)} で出場!</div>
      <p class="note center">上の盤面の<b>色のついた場所</b>を指でなぞると、マレットが動きます(点線の丸が指の位置)。プロジェクターの画面を見ながら動かすと、ずれが少なくなります。${fm==='2v2'?'味方と上下で分かれて守ります。':fm==='ffa'?'自分の前のゴールを守ろう。入れられるとライフが減ります。':''}</p>`;
  }
  else if(ph==='bet'){
    const cur=me.bet;
    h=`<div class="phase">${T.length>2?'どれ':'どっち'}が勝つ?(あと<span id="left">${left}</span>秒)</div>
      <div class="sides">${T.map(t=>`<button class="${t} ${G.side===t?'on':''}" data-s="${t}" ${cur&&cur.s!==t?'disabled':''}>${TEAM[t]}<small>${yen(pool[t]||0)}枚 ・ ${np[t]||0}人 ・ ${od(t)}</small></button>`).join('')}</div>
      <div class="chips">${[[10,'#c02c64'],[30,'#2456c9'],[50,'#7a3fc0'],[100,'#1f8a4c']].map(([n,c])=>`<button data-b="${n}" style="background:${c}" class="${G.bet===n?'on':''}">${n}</button>`).join('')}<input id="bIn" type="number" inputmode="numeric" min="1" value="${G.bet}" aria-label="BETする枚数"><span>枚</span></div>
      <div class="center"><button class="pbtn go" id="betGo" style="font-size:20px;padding:14px 46px" ${G.busy||G.bet<1||G.bet>av?'disabled':''}>${TEAM[G.side]}に BETする</button></div>
      <p class="note center">${cur?`いま <b style="color:${COL[cur.s]}">${TEAM[cur.s]}に${yen(cur.a)}枚</b> BET中(足すこともできます)`:'当たると、BETの合計を当たった人で分けます(×の数字が目安)'}</p><p class="perr" id="err"></p>`;
  }
  else if(ph==='ready'||ph==='play'){
    const used=me.used||0, cost=st.cost||10, rest=ITEM_MAX-used, out=st.out||[];
    h=`<div class="phase">${ph==='ready'?'まもなく開始!':'おじゃまアイテム'} <small style="font-size:15px;font-family:var(--f-body)">1回 ${cost}枚・のこり${rest}回</small></div>
      <div class="items">${itemsOf(fm).map(it=>`<button data-it="${it.k}" class="${it.t}" ${ph!=='play'||rest<=0||av<cost||G.busy||(it.t&&out.includes(it.t))?'disabled':''}><span class="ic">${it.ic}</span>${it.n}</button>`).join('')}</div>
      ${me.bet?`<p class="note center">あなたのBET:<b style="color:${COL[me.bet.s]}">${TEAM[me.bet.s]}に${yen(me.bet.a)}枚</b></p>`:''}<p class="perr" id="err"></p>`;
  }
  else if(ph==='result'){
    const r=me.res;
    h=`<div class="phase" style="color:${st.win?COL[st.win]:'inherit'}">${st.win?TEAM[st.win]+'の勝ち!':'試合は中止'}</div>
      ${st.busy?'<p class="note center">メダルを精算しています…</p>':r?`<p class="center" style="font-weight:800;font-size:20px">${esc(r.t)}</p><p class="center big-n" style="color:${r.net>0?'var(--mint-d)':r.net<0?'var(--warn)':'var(--soft)'}">${r.net>0?'+':''}${r.net}枚</p>`:'<p class="note center">つぎの試合を待ってね</p>'}`;
  }
  box.innerHTML=h;
  const on=(sel,f)=>box.querySelectorAll(sel).forEach(x=>x.onclick=()=>f(x));
  on('#ent',async x=>{ if(G.busy) return; G.busy=true; const r=await PAD.req('g:entry',{on:x.dataset.on==='1'},GID); G.busy=false; toast(r.msg); actRender(); });
  on('[data-s]',x=>{ G.side=x.dataset.s; actRender(); });
  on('[data-b]',x=>{ G.bet=+x.dataset.b; actRender(); });
  const bi=$('#bIn'); if(bi){ bi.oninput=e=>{ G.bet=Math.floor(+e.target.value||0); const g=$('#betGo'); if(g) g.disabled=G.busy||G.bet<1||G.bet>availP(); }; if(keepFocus) bi.focus(); }
  on('#betGo',async()=>{ if(G.busy) return; G.busy=true; actRender(); const r=await PAD.req('g:bet',{s:G.side,amt:G.bet},GID); G.busy=false; actRender(); if(r.ok) toast(r.msg); else { const e=$('#err'); if(e) e.textContent=r.msg; } });
  on('[data-it]',async x=>{ if(G.busy) return; G.busy=true; actRender(); const r=await PAD.req('g:item',{k:x.dataset.it},GID); G.busy=false; actRender(); if(r.ok) toast(r.msg); else { const e=$('#err'); if(e) e.textContent=r.msg; } });
}
function amtModal(kind){
  const v=G.view, max=kind==='add'?v.b||0:availP(); let amt=Math.min(kind==='add'?100:max,max);
  const box=$('#mod');
  const draw=()=>{ amt=Math.max(0,Math.min(max,Math.floor(+amt||0)));
    box.innerHTML=`<div class="pmodal"><div class="pc"><h2>${kind==='add'?'貯金から追加':'一部だけ貯金にもどす'}</h2><p class="note">${kind==='add'?`貯金 ${yen(max)}枚`:`もどせるのは ${yen(max)}枚(賭けている分はもどせません)`}</p>
      <div class="amt"><input id="mIn" type="number" inputmode="numeric" value="${amt}"><span>枚</span></div>
      <div class="quick">${[10,50,100].map(n=>`<button data-q="${n}" ${n>max?'disabled':''}>${n}枚</button>`).join('')}<button data-q="${max}">全部</button></div>
      <p class="perr" id="mErr"></p><div class="mrow"><button class="pbtn" id="mNo">やめる</button><button class="pbtn go" id="mGo">${kind==='add'?'追加する':'もどす'}</button></div></div></div>`;
    $('#mIn').oninput=e=>{amt=e.target.value};
    box.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{amt=+b.dataset.q;draw()});
    $('#mNo').onclick=()=>{box.innerHTML=''};
    $('#mGo').onclick=async()=>{ amt=Math.floor(+$('#mIn').value||0); if(amt<1) return; $('#mGo').disabled=true;
      const r=await PAD.req(kind,{amt},GID); if(!r.ok){ $('#mErr').textContent=r.msg; $('#mGo').disabled=false; return; } box.innerHTML=''; toast(r.msg); };
  }; draw();
}
</script>
