<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>メダルゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="mg-core.js"></script>
<style>
:root{
  --f-num:"Dela Gothic One","Hiragino Sans",sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --gold:#f2b705;--gold-d:#a86f00;--gold-l:#ffe38a;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--f-body);font-weight:500;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.medal{display:inline-block;flex:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b2b27;color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;z-index:99;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* ===================== 先生のPC(管理画面) ===================== */
body.admin{--bg:#f5efe1;--paper:#fffaf0;--ink:#1e1a14;--soft:#6f6555;--line:#dccfb4;--acc:#0f8a66;--acc-l:#dff4ea;--warn:#c8102e;background:var(--bg);color:var(--ink)}
.a-wrap{max-width:1240px;margin:0 auto;padding:18px 20px 60px}
.a-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.a-title{display:flex;align-items:center;gap:10px;font-family:var(--f-num);font-size:28px;letter-spacing:.04em}
.a-title small{font-family:var(--f-body);font-size:14px;color:var(--soft);font-weight:700}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;background:#1f9d4a}
.chip.off .dot{background:var(--warn)}
.chip.try{background:#fff1b8;border-color:#e0b84a}
.btn{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;font-weight:800;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--soft)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold-d);color:#3a2600}
.btn.danger{color:var(--warn);border-color:#e9b3bd}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.tabs{display:flex;gap:6px;border-bottom:3px double var(--ink);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:2px solid var(--line);border-bottom:0;background:var(--bg);border-radius:10px 10px 0 0;padding:8px 18px;font-weight:800;color:var(--soft)}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);border-color:var(--ink)}
.tabs .cnt{display:inline-block;margin-left:6px;background:var(--acc);color:#fff;border-radius:999px;padding:0 8px;font-size:12px}
.box{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.box+.box{margin-top:14px}
.box h2{margin:0 0 10px;font-size:18px}
.note{color:var(--soft);font-size:14px;line-height:1.7;margin:6px 0 0}
.note.warn{color:var(--warn);font-weight:800}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 16px;min-width:150px}
.stat small{display:block;color:var(--soft);font-weight:800;font-size:12px}
.stat b{font-family:var(--f-num);font-weight:400;font-size:24px}
.stat.bad b{color:var(--warn)}
.tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tool label{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px}
.tool input,.tool select,.fld input,.fld select{border:2px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px}
.tbl{overflow:auto;border:2px solid var(--ink);border-radius:12px;background:#fff;max-height:66vh}
table{width:100%;border-collapse:collapse;font-size:15px}
th{position:sticky;top:0;background:var(--ink);color:var(--paper);font-size:13px;text-align:left;padding:7px 10px;white-space:nowrap;z-index:1}
td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
td.nm{font-weight:800}
tr:hover td{background:#fffbe9}
.pin-ok{color:#1f8a4a;font-weight:800}
.pin-no{color:var(--warn);font-weight:800;background:#fde8ec;border-radius:6px;padding:1px 8px}
.where{display:inline-block;background:var(--acc-l);color:#0c5d45;border-radius:999px;padding:1px 10px;font-weight:800;font-size:13px}
.where.stop{background:#fde8ec;color:var(--warn)}
.where.lv{background:#fff1b8;color:#7a5a00}
.ops{display:flex;gap:4px;justify-content:flex-end}
.bank{font-family:var(--f-num);font-weight:400;font-size:17px}
textarea{width:100%;border:2px solid var(--line);border-radius:10px;padding:10px;background:#fff;line-height:1.6;font-size:15px;resize:vertical}
.st-new{color:#0f8a66;font-weight:800}.st-up{color:#b37400;font-weight:800}.st-err{color:var(--warn);font-weight:800}.st-same{color:var(--soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
.gcard{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:12px 14px}
.gcard h3{margin:0 0 8px;display:flex;align-items:center;gap:10px;font-size:18px}
.gcard h3 .art{width:44px;height:44px}
.gcard ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.gcard li{display:flex;align-items:center;gap:8px;border-bottom:1px dashed var(--line);padding:4px 0}
.gcard li .bank{margin-left:auto}
.keyline{font-family:ui-monospace,Menlo,monospace;background:#fff;border:2px dashed var(--line);border-radius:8px;padding:8px 10px;word-break:break-all;font-size:14px}
pre.rules{background:#1e1a14;color:#f5efe1;border-radius:10px;padding:12px;overflow:auto;font-size:13px;line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mcard{background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:20px 22px;width:min(560px,100%);max-height:90vh;overflow:auto}
.mcard.wide{width:min(820px,100%)}
.mcard h2{margin:0 0 12px;font-size:20px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-weight:800;font-size:14px}
.fld input{font-size:17px}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.qrbig{display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:center}
#qrBox{background:#fff;padding:14px;border-radius:12px;border:2px solid var(--ink);line-height:0}
.loglist{list-style:none;margin:0;padding:0;font-size:14px}
.loglist li{display:grid;grid-template-columns:9.5em 1fr auto auto;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.loglist .d.p{color:#0f8a66;font-weight:800}.loglist .d.m{color:var(--warn);font-weight:800}
.cl-wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media (max-width:980px){.cl-wrap{grid-template-columns:1fr}}
.cl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:10px}
.cl-p{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-weight:700;background:#fffaf0;border:2px dashed var(--line);color:var(--soft);cursor:pointer}
.cl-p.on{background:#fff1b8;border:2px solid #d19a00;color:var(--ink)}
.cl-p.dis{opacity:.5;cursor:not-allowed}
.cl-p input{width:20px;height:20px}
.cl-p .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-p .od{font-size:12px;color:var(--line)}.cl-p .od.y{color:#1f9a4a}
.cl-p small{font-size:11px;color:var(--warn)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-weight:800}
.seg button[aria-pressed="true"]{border:3px solid var(--ink);background:var(--gold)}
.cl-side{display:flex;flex-direction:column;gap:12px}
.cl-side .fld{margin:0}
.cl-side .fld input,.cl-side .fld select{font-size:18px}
.cl-go{min-height:60px;border-radius:12px;border:0;background:#c8102e;color:#fff;font-family:var(--f-num);font-size:22px}
.cl-go:disabled{opacity:.4}
.ses{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.ses .st{font-weight:800;border-radius:999px;padding:2px 12px;font-size:13px;background:var(--acc-l);color:#0c5d45}
.ses .st.done{background:#fff1b8;color:#7a5a00}.ses .st.ready{background:#e8eefc;color:#2a4a9a}
a.btn{text-decoration:none;color:inherit;display:inline-block}a.btn.pri{color:#fff}
.res-wrap{display:grid;grid-template-columns:400px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.res-wrap{grid-template-columns:1fr}}
.res-dark{background:#1e1a14;color:#fffaf0;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}
.res-dark h3{margin:0;font-family:var(--f-num);font-weight:400;font-size:26px;color:#ffcf3a}
.res-c{display:flex;align-items:center;gap:12px;background:#3a2a20;border:2px solid #c8102e;border-radius:10px;padding:10px 14px}
.res-c span{color:#ffb3c0;font-weight:800;width:3em;font-size:14px}.res-c b{flex:1;font-size:22px}.res-c em{font-style:normal;font-weight:800;color:#ffb13a;font-size:20px}
.res-all{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.res-all div{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.res-all div.c{background:#fde3e6;border:2px solid #c8102e}
.res-all span{color:var(--soft);font-size:13px;width:2.2em;flex:none}.res-all i{flex:1;min-width:0;font-style:normal;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bankbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fff1b8;border:2px solid #d19a00;border-radius:12px;padding:14px 18px;margin-top:14px}
.bankbar div{flex:1;min-width:240px;line-height:1.6}
.setup{max-width:720px;margin:6vh auto;padding:0 20px}
.setup .box{padding:22px 24px}

/* ===================== iPad ===================== */
body.pad{--ink:#173b33;--soft:#5d7c74;--mint:#bff0dc;--mint-d:#12a37a;--card:#fff;--line:#d5efe5;--warn:#d63c5e;
  background:radial-gradient(circle at 10% 0,#e9fff6 0,transparent 50%),linear-gradient(180deg,#d4f7e8,#bdeedb 60%,#a9e6cf);background-attachment:fixed;color:var(--ink);min-height:100vh}
html.padmode,html.padmode *{touch-action:manipulation}
.p-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.p-logo{display:flex;align-items:center;gap:8px;font-family:var(--f-num);font-size:22px;color:var(--mint-d)}
.p-who{font-weight:800}
.p-net{background:var(--warn);color:#fff;text-align:center;font-weight:800;padding:6px}
.p-main{max-width:960px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.pc{background:var(--card);border-radius:28px;padding:22px;box-shadow:0 8px 0 rgba(18,163,122,.18),0 14px 30px rgba(23,59,51,.08)}
.pc+.pc{margin-top:16px}
.pbtn{border:0;border-radius:999px;padding:14px 26px;font-weight:800;font-size:18px;background:#eaf8f2;color:var(--ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.pbtn:active{transform:translateY(2px)}
.pbtn:disabled{opacity:.4}
.pbtn.go{background:var(--mint-d);color:#fff}
.pbtn.gold{background:linear-gradient(#ffd84a,var(--gold));color:#3a2600}
.pbtn.sm{padding:8px 16px;font-size:15px}
.pbtn.ghost{background:transparent;box-shadow:none;color:var(--soft);text-decoration:underline}
.login{max-width:520px;margin:4vh auto 0;text-align:center}
.login h1{font-family:var(--f-num);font-weight:400;font-size:clamp(30px,6vw,44px);margin:10px 0 4px;color:var(--mint-d)}
.login p{color:var(--soft);margin:4px 0 14px;line-height:1.7}
.flds{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.pf{display:flex;align-items:center;gap:12px;border:3px solid var(--line);border-radius:18px;padding:10px 16px;background:#f7fdfa;text-align:left;cursor:pointer}
.pf.on{border-color:var(--mint-d);background:#fff;box-shadow:0 0 0 4px rgba(18,163,122,.15)}
.pf small{width:5.5em;color:var(--soft);font-weight:800;font-size:14px}
.pf .v{flex:1;font-family:var(--f-num);font-size:28px;letter-spacing:.12em;min-height:1.3em}
.pf input{flex:1;border:0;background:transparent;font-family:var(--f-num);font-size:26px;letter-spacing:.08em;min-width:0}
.pf input:focus{outline:none}
.dots{display:flex;gap:12px}
.dots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--mint-d)}
.dots i.f{background:var(--mint-d)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.keys button{border:0;border-radius:18px;padding:16px 0;font-family:var(--f-num);font-size:28px;background:#eaf8f2;color:var(--ink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.08)}
.keys button.al{background:#fff3c2;color:#8a5a00}
.keys button.w2{grid-column:span 2}
.keys button.fn{font-family:var(--f-body);font-weight:800;font-size:17px}
.keys button:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.perr{color:var(--warn);font-weight:800;min-height:1.6em;margin:6px 0 0}
.bankcard{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.bankcard .lbl{color:var(--soft);font-weight:800}
.bankcard .num{font-family:var(--f-num);font-size:clamp(44px,8vw,64px);line-height:1.05;color:#8a5a00}
.bankcard .num small{font-size:.4em;margin-left:4px}
.hi{font-size:20px;font-weight:800}
.seatbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(90deg,#fff6cf,#fffbe8);border:3px solid var(--gold);border-radius:22px;padding:14px 18px}
.seatbar .art{width:64px;height:64px}
.seatbar .t{flex:1;min-width:220px;font-weight:800;font-size:18px;line-height:1.5}
.seatbar .t b{font-family:var(--f-num);font-weight:400;font-size:26px;color:#8a5a00}
.sec{font-weight:800;font-size:20px;margin:22px 4px 10px;display:flex;align-items:baseline;gap:10px}
.sec small{color:var(--soft);font-size:14px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.game{background:var(--card);border-radius:26px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 8px 0 rgba(18,163,122,.18)}
.game .art{width:120px;height:120px}
.game b{font-size:20px}
.game small{color:var(--soft);font-weight:700;min-height:1.4em}
.game .pbtn{width:100%}
.empty{text-align:center;color:var(--soft);font-weight:800;padding:26px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:10px;padding:8px 2px;border-bottom:2px dashed var(--line);font-weight:700}
.hist li span:first-child{color:var(--soft);width:6em;flex:none}
.hist li b{margin-left:auto;font-family:var(--f-num);font-weight:400}
.hist .p{color:var(--mint-d)}.hist .m{color:var(--warn)}
.pmodal{position:fixed;inset:0;background:rgba(23,59,51,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.pmodal .pc{width:min(560px,100%);max-height:94vh;overflow:auto}
.bring h2{margin:0 0 4px;display:flex;align-items:center;gap:10px;font-size:22px}
.bring h2 .art{width:52px;height:52px}
.bring .have{color:var(--soft);font-weight:800}
.amt{display:flex;align-items:center;gap:10px;margin:14px 0 8px}
.amt input{flex:1;min-width:0;border:3px solid var(--mint-d);border-radius:18px;padding:8px 14px;font-family:var(--f-num);font-size:40px;text-align:right;background:#fff}
.amt span{font-weight:800}
.steps,.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.steps button,.quick button{border:0;border-radius:14px;padding:12px 0;font-weight:800;font-size:17px;background:#eaf8f2;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.quick button{background:#fff3c2}
.quick button.all{background:var(--gold);color:#3a2600}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@media (max-width:600px){.keys button{padding:12px 0;font-size:24px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script>
const {esc,yen,normSid}=MG;
const $=s=>document.querySelector(s);
const app=$('#app');
let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3800)}
const fmtT=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`};
const medalSvg=(s=56)=>`<svg class="medal" width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#f2b705" stroke="#a86f00" stroke-width="3"/><circle cx="32" cy="32" r="22.5" fill="#ffd23a" stroke="#ffe9a0" stroke-width="2.5" stroke-dasharray="3 3"/><text x="32" y="43.5" text-anchor="middle" font-family="Dela Gothic One,sans-serif" font-size="29" fill="#8a5a00">M</text></svg>`;
// ゲームのイラスト(ゲームが art で名前を指定する)
const ART={

function parseRoster(t){
  const out=[], seen=new Set();
  String(t||'').split(/\r?\n/).forEach((line,i)=>{
    const raw=line.replace(/　/g,' ').trim(); if(!raw) return;
    let cols=raw.split('\t'); if(cols.length<2) cols=raw.split(/\s*[,，]\s*|\s{2,}|\s+/);
    cols=cols.map(c=>c.trim());
    const sid=normSid(cols[0]), n=(cols[1]||'').replace(/\s+/g,' ').trim().slice(0,20), c=(cols[2]||'').trim().slice(0,20);
    if(i===0&&/学籍|番号|ID/i.test(cols[0])) return;
    if(!sid||!n){ out.push({err:'読めません',raw}); return; }
    if(seen.has(sid)){ out.push({err:'学籍番号が重なっています',raw,sid}); return; }
    seen.add(sid); out.push({sid,n,c,raw});
  });
  return out;
}

function parseScores(t){
  const acc=HOST.acc(), byName={}; Object.keys(acc).forEach(s=>{ byName[String(acc[s].n).replace(/\s+/g,'')]=s; });
  const out={}, bad=[];

    const m=raw.match(/^(.+?)[\t ,，]+(-?\d+(?:\.\d+)?)\s*点?\s*$/); if(!m){ bad.push(raw); return; }

  }
}</pre><p class="note">"mg" の中は「場所の名前を知っている人だけ」読めます(一覧は見られません)。</p></div>`;
  $('#kShow').onclick=()=>{$('#kv').textContent=kt};
  $('#kCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(kt); toast('コピーしました'); }catch(e){ $('#kv').textContent=kt; toast('表示した鍵を選んでコピーしてください'); } };
  $('#kOut').onclick=()=>confirmModal('このPCから鍵を消しますか?','データは消えません。鍵を控えていないと、このPCから名簿に入れなくなります。','鍵を消す',async()=>{ MG.keys.clear(); location.reload(); });
  $('#bSave').onclick=async()=>{ const d=await HOST.admin.exportAll(); const blob=new Blob([JSON.stringify(d)],{type:'application/json'}), u=URL.createObjectURL(blob), el=document.createElement('a');
    const t=new Date(); el.href=u; el.download=`メダルゲーム_${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}.json`; document.body.appendChild(el); el.click(); el.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); };
  $('#bLoad').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ let d=null; try{ d=JSON.parse(r.result); }catch(x){}
    if(!d||!d.acc) return toast('メダルゲームのバックアップではないようです');
    confirmModal('バックアップを読み込みますか?',`${Object.keys(d.acc).length}人分。いまの名簿・貯金・履歴は、ファイルの内容に置きかわります。`,'読み込む',async()=>{ await HOST.admin.importAll(d); toast('読み込みました'); }); }; r.readAsText(f); e.target.value=''; };
}

/* =========================================================
   iPad
   ========================================================= */
let PAD=null;
const U={step:'sid',sid:'',pin:'',pin1:'',kb:false,err:'',busy:false,view:undefined,games:{},bring:null,lost:false};
async function padMain(){
  document.body.className='pad'; document.documentElement.classList.add('padmode');
  const vp=document.querySelector('meta[name=viewport]'); vp.content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';
  app.innerHTML=`<header class="p-top"><div class="p-logo">${medalSvg(34)}メダルゲーム</div><span class="sp"></span><span class="p-who" id="pWho"></span></header>
    <div class="p-net" id="pNet" hidden>通信が切れています。Wi-Fiを確認してください</div><main class="p-main" id="pm"><div class="pc empty">接続しています…</div></main>`;
  try{ PAD=await MG.startPad(); }catch(e){ $('#pm').innerHTML=`<div class="pc empty">つながりません。ページを読み込みなおしてください<br><small>${esc(e.message)}</small></div>`; return; }
  PAD.onConn(ok=>{ $('#pNet').hidden=ok; });
  PAD.onGames(g=>{ U.games=g; if(U.view) padRender(); });
  watchView();
}
let viewOff=null;
function watchView(){
  if(viewOff) viewOff(); U.view=undefined;
  if(!PAD.vk()){ U.view=null; padRender(); return; }
  let first=true;
  viewOff=PAD.onView(v=>{
    if(!v){ if(first){ setTimeout(()=>{ if(U.view===undefined){ PAD.logout(); U.view=null; padRender(); } },3000); first=false; return; }
      PAD.logout(); U.view=null; U.lost=true; U.step='sid'; padRender(); return; }
    first=false; U.view=v; padRender(); });
}
function padRender(){
  const m=$('#pm'); if(!m) return;
  const v=U.view;
  $('#pWho').innerHTML=v?`${esc(v.n)} さん <button class="pbtn sm ghost" id="lo">ログアウト</button>`:'';
  if(v){ const lo=$('#lo'); lo.onclick=()=>{ if(confirm('ログアウトしますか?')){ PAD.logout(); U.step='sid'; U.sid='';U.pin=''; watchView(); } }; }
  if(v===undefined){ m.innerHTML='<div class="pc empty">読み込み中…</div>'; return; }
  if(!v) return renderLogin(m);
  renderHome(m);
}
/* ---- ログイン ---- */
function renderLogin(m){
  const st=U.step, pinStep=st!=='sid';
  const title={sid:'ログイン',pin:'ログイン',set1:'合言葉を決めよう',set2:'もう一度入れてください'}[st];
  const lead={sid:'学籍番号を入れて「次へ」を押してください。',pin:'4桁の合言葉を入れてください。',
    set1:'はじめてのログインです。自分で4桁の数字を決めてください。忘れないようにしてね。',set2:'確認のため、同じ4桁をもう一度入れてください。'}[st];
  const val=pinStep?(st==='set2'?U.pin1b||'':st==='set1'?U.pin1||'':U.pin):U.sid;
  const dots=`<div class="dots">${[0,1,2,3].map(i=>`<i class="${i<val.length?'f':''}"></i>`).join('')}</div>`;
  m.innerHTML=`<div class="login"><div>${medalSvg(84)}</div><h1>${title}</h1><p>${lead}</p><div class="pc">
    ${U.lost?'<p class="perr">合言葉がリセットされたので、ログインしなおしてください</p>':''}
    <div class="flds">
      <div class="pf ${!pinStep?'on':''}" id="fSid"><small>学籍番号</small>${!pinStep&&U.kb?`<input id="sidIn" value="${esc(U.sid)}" autocomplete="off" autocapitalize="characters" spellcheck="false">`:`<span class="v">${esc(U.sid)}</span>`}</div>
      ${pinStep?`<div class="pf on"><small>合言葉</small>${dots}</div>`:''}
    </div>
    <div class="keys" ${!pinStep&&U.kb?'hidden':''}>${!pinStep?'<button class="al" data-k="N">N</button><button class="al" data-k="A">A</button><button class="fn" data-k="c">けす</button>':''}${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}${pinStep?'<button class="fn" data-k="c">けす</button><button data-k="0">0</button>':'<button data-k="0" class="w2">0</button>'}<button class="fn" data-k="b">1文字<br>もどす</button></div>
    <p class="perr">${esc(U.err)}</p>
    <div class="mrow" style="justify-content:space-between">${pinStep?'<button class="pbtn sm" id="bk">もどる</button>':`<button class="pbtn sm ghost" id="kb">${U.kb?'数字キーで入力':'ほかの英字はこちら'}</button>`}
      ${!pinStep?`<button class="pbtn go" id="nx" ${U.busy?'disabled':''}>${U.busy?'確認中…':'次へ'}</button>`:''}</div></div></div>`;
  m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>key(b.dataset.k));
  const nx=$('#nx'); if(nx) nx.onclick=checkSid;
  const kb=$('#kb'); if(kb) kb.onclick=()=>{U.kb=!U.kb;padRender();const i=$('#sidIn');if(i)i.focus()};
  const si=$('#sidIn'); if(si){ si.oninput=e=>{U.sid=normSid(e.target.value)}; si.onkeydown=e=>{if(e.key==='Enter')checkSid()}; }
  const bk=$('#bk'); if(bk) bk.onclick=()=>{U.step='sid';U.pin='';U.pin1='';U.pin1b='';U.err='';padRender()};
}
function key(k){
  if(U.busy) return; U.err=''; U.lost=false;
  const st=U.step, f=st==='sid'?'sid':st==='pin'?'pin':st==='set1'?'pin1':'pin1b';
  let v=U[f]||'';
  if(k==='c') v=''; else if(k==='b') v=v.slice(0,-1); else if(st==='sid'){ if(v.length<20) v+=k; } else if(v.length<4) v+=k;
  U[f]=v; padRender();
  if(st!=='sid'&&v.length===4) setTimeout(pinDone,150);
}
async function checkSid(){
  U.sid=normSid(U.sid); if(!U.sid){ U.err='学籍番号を入れてください'; return padRender(); }
  U.busy=true; padRender();
  const r=await PAD.req('check',{sid:U.sid}); U.busy=false;
  if(!r.ok){ U.err=r.msg; return padRender(); }
  U.step=r.d&&r.d.ps?'pin':'set1'; U.pin='';U.pin1='';U.pin1b=''; padRender();
}
async function pinDone(){
  if(U.step==='set1'){ U.step='set2'; return padRender(); }
  if(U.step==='set2'&&U.pin1b!==U.pin1){ U.err='1回目とちがいます。最初から入れなおしてください'; U.step='set1'; U.pin1='';U.pin1b=''; return padRender(); }
  const pin=U.step==='pin'?U.pin:U.pin1;
  U.busy=true; padRender();
  const r=await PAD.req('login',{sid:U.sid,pin,set:U.step==='set2'}); U.busy=false;
  if(!r.ok){ U.err=r.msg; if(r.d&&r.d.needSet){ U.step='set1'; } U.pin='';U.pin1='';U.pin1b=''; return padRender(); }
  PAD.setVk(r.d.vk); U.step='sid'; U.pin='';U.pin1='';U.pin1b=''; U.err='';
  if(r.msg) toast(r.msg); watchView();
}
/* ---- ホーム(貯金と稼働中のゲーム) ---- */
function goGame(gid){ const g=U.games[gid]; if(!g) return toast('このゲームはいま止まっています');
  const u=new URL(g.url); u.searchParams.set('mg',PAD.pub); if(MG.LOCAL) u.searchParams.set('local','1'); location.href=u.href; }
function renderHome(m){
  const v=U.view, s=v.seat, games=U.games, ids=Object.keys(games).filter(id=>!games[id].clean).sort((a,b)=>(games[a].t||0)-(games[b].t||0));
  const clId=v.cl?Object.keys(games).find(id=>games[id].clean===v.cl):null;
  const live=s&&games[s.g];
  let seat='';
  if(s) seat=`<div class="seatbar">${medalSvg(52)}<div class="t">${esc(s.gn)}に <b>${yen(s.a)}</b>枚 あります${s.leave?'<br><small>払い戻しが終わったら、自動で貯金にもどります</small>':live?'':'<br><small>このゲームはいま止まっています</small>'}</div>
    ${live&&!s.leave?`<button class="pbtn go" id="sGo">続ける</button>`:''}${s.leave?'':`<button class="pbtn gold" id="sBack">貯金にもどす</button>`}</div>`;
  const cards=ids.map(id=>{ const g=games[id], here=s&&s.g===id, block=s&&!here||!!v.cl;
    return `<div class="game">${art(g.art)}<b>${esc(g.n)}</b><small>${here?`${yen(s.a)}枚 持ち込み中`:block?(v.cl?'掃除決めに参加中':'ほかのゲームで遊んでいます'):'稼働中'}</small>
      <button class="pbtn ${here?'go':'gold'}" data-g="${esc(id)}" ${block||(here&&s.leave)?'disabled':''}>${here?'続ける':'遊ぶ'}</button></div>`; }).join('');
  const lg=(v.lg||[]).map(x=>`<li><span>${fmtT(x.t)}</span><span>${esc(x.w)}</span><b class="${x.d>0?'p':x.d<0?'m':''}">${x.d>0?'+':''}${yen(x.d)}</b></li>`).join('');
  m.innerHTML=`<div class="pc bankcard">${medalSvg(96)}<div><div class="hi">${esc(v.n)} さん</div><div class="lbl">貯金</div><div class="num">${yen(v.b)}<small>枚</small></div></div></div>
    ${seat?`<div style="margin-top:16px">${seat}</div>`:''}
    ${v.cl?`<div style="margin-top:16px" class="seatbar">${art(clId?games[clId].art:'roulette')}<div class="t">掃除決めに参加します${clId?`<br><small>${esc(games[clId].n)}が始まっています</small>`:'<br><small>先生がゲームを開くまで待ってね</small>'}</div>${clId?'<button class="pbtn go" id="clGo">参加する</button>':''}</div>`:''}
    <div class="sec">稼働中のゲーム<small>同時に遊べるのは1つだけ</small></div>
    ${ids.length?`<div class="games">${cards}</div>`:'<div class="pc empty">いま動いているゲームはありません<br><small>先生がゲームを始めると、ここに出ます</small></div>'}
    ${lg?`<div class="sec">さいきんの記録</div><div class="pc"><ul class="hist">${lg}</ul></div>`:''}
    <div id="pmod"></div>`;
  m.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ const id=b.dataset.g; if(s&&s.g===id) goGame(id); else openBring(id); });
  const sg=$('#sGo'); if(sg) sg.onclick=()=>goGame(s.g);
  const cg=$('#clGo'); if(cg) cg.onclick=()=>goGame(clId);
  const sb=$('#sBack'); if(sb) sb.onclick=async()=>{ if(!confirm(`${s.gn}の ${yen(s.a)}枚 を貯金にもどしますか?`)) return;
    sb.disabled=true; const r=await PAD.req('quit',{},live?s.g:'*'); toast(r.msg||(r.ok?'もどしました':'できませんでした')); sb.disabled=false; };
  if(U.bring) renderBring();
}
/* ---- 持ち込む枚数 ---- */
function openBring(gid){ U.bring={gid,amt:Math.min(100,U.view.b||0)}; renderBring(); }
function renderBring(){
  const B=U.bring, g=U.games[B.gid], v=U.view, box=$('#pmod'); if(!box) return;
  if(!g){ U.bring=null; box.innerHTML=''; return; }
  const max=v.b||0; B.amt=Math.max(0,Math.min(max,Math.floor(+B.amt||0)));
  box.innerHTML=`<div class="pmodal"><div class="pc bring"><h2>${art(g.art)}${esc(g.n)}</h2><div class="have">貯金 ${yen(max)}枚 ・ 持ち込む枚数を選んでください</div>
    <div class="amt"><input id="bIn" type="number" inputmode="numeric" min="0" max="${max}" value="${B.amt}" aria-label="持ち込む枚数"><span>枚</span></div>
    <div class="steps">${[-100,-10,10,100].map(d=>`<button data-d="${d}">${d>0?'+':'−'}${Math.abs(d)}</button>`).join('')}</div>
    <div class="quick">${[100,300,500].map(n=>`<button data-q="${n}" ${n>max?'disabled':''}>${n}枚</button>`).join('')}<button class="all" data-q="${max}">全部</button></div>
    ${max<1?'<p class="perr">貯金がありません。掃除モードやほかのゲームでメダルをためよう</p>':''}
    <p class="perr" id="bErr"></p>
    <div class="mrow"><button class="pbtn" id="bNo">やめる</button><button class="pbtn go" id="bGo" ${B.amt<1?'disabled':''}>${yen(B.amt)}枚 持ち込んで遊ぶ</button></div></div></div>`;
  const inp=$('#bIn');
  inp.oninput=()=>{ B.amt=Math.max(0,Math.min(max,Math.floor(+inp.value||0))); $('#bGo').textContent=`${yen(B.amt)}枚 持ち込んで遊ぶ`; $('#bGo').disabled=B.amt<1; };
  inp.onblur=()=>{ inp.value=B.amt; };
  box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ B.amt+= +b.dataset.d; renderBring(); });
  box.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ B.amt= +b.dataset.q; renderBring(); });
  $('#bNo').onclick=()=>{ U.bring=null; box.innerHTML=''; };
  $('#bGo').onclick=async()=>{ const go=$('#bGo'); go.disabled=true; go.textContent='持ち込んでいます…';
    const r=await PAD.req('enter',{amt:B.amt},B.gid);
    if(!r.ok){ $('#bErr').textContent=r.msg; go.disabled=false; go.textContent=`${yen(B.amt)}枚 持ち込んで遊ぶ`; return; }
    const gid=B.gid; U.bring=null; goGame(gid); };
}
</script>
