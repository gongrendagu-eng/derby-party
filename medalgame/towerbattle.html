<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>タワーバトル チーム戦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<script src="mg-core.js"></script>
<script src="tb-assets/sprites.js"></script>
<script src="tb-assets/tb-sim.js"></script>
<style>
/* タワーバトル チーム戦(掃除決め専用・メダルゲームにつながる版)
   先生のPC:試合の計算・プロジェクター表示・チーム分け・参加料と配当
   iPad   :役割(前線・後衛・工兵・司令塔)と3枠を選び、自分の役割の操作をする */
:root{--f-num:"Dela Gothic One",sans-serif;--f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;--gold:#f2b705;--ink:#14213a;--soft:#5b6b85;--line:#c9d7ec;--warn:#d63c5e;
  --t0:#ff4d88;--t1:#3d8bff;--t2:#3fc45f;--t3:#ffb020}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:var(--f-body);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
body.host{background:#e9f1fb}
.wrap{max-width:1700px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right,0px)) 40px max(12px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.ttl{font-family:var(--f-num);font-size:26px}
.ttl small{font-family:var(--f-body);font-size:14px;color:var(--soft);font-weight:800;margin-left:6px}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:#1f9a4a}.chip.off .dot{background:#d63c5e}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:12px;align-items:start}
@media (max-width:1100px){.grid{grid-template-columns:1fr}}
.stage{background:#0b0e15;border-radius:16px;padding:6px;position:relative}
.stage canvas{display:block;width:100%;height:auto;border-radius:12px}
.box{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.box h2{margin:0 0 8px;font-size:17px}
.btn{border:2px solid var(--line);background:#f6f9ff;border-radius:10px;padding:7px 12px;font-weight:800}
.btn.pri{background:#14213a;border-color:#14213a;color:#fff}.btn.big{font-size:19px;padding:12px;width:100%}
.btn.sm{padding:3px 8px;font-size:13px}
.note{font-size:13px;color:var(--soft);line-height:1.6;margin:6px 0}
.frm{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-weight:800;font-size:14px}
.frm input,.frm select{border:2px solid var(--line);border-radius:8px;padding:5px 8px;width:100%}
.seg{display:flex;gap:6px}.seg button{flex:1;border:2px solid var(--line);background:#f6f9ff;border-radius:8px;padding:6px;font-weight:800}
.seg button[aria-pressed=true]{background:#14213a;color:#fff;border-color:#14213a}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcard{border:3px solid;border-radius:12px;padding:8px 10px;background:#fff;min-height:84px}
.tcard h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tcard ul{list-style:none;margin:0;padding:0;font-size:13px;font-weight:800}
.tcard li{display:flex;gap:6px;align-items:center;padding:2px 0}
.rl{font-size:11px;border-radius:6px;padding:0 5px;color:#fff;background:#888;min-width:3.4em;text-align:center}
.rl.front{background:#d9485f}.rl.back{background:#2f6fd6}.rl.eng{background:#c48a00}.rl.cmd{background:#1f9a4a}
.od{color:#c9d0dc;font-size:12px}.od.y{color:#1f9a4a}
ul.pl{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto}
ul.pl li{display:flex;gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line);font-weight:800;font-size:13px}
ul.pl li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsel{display:flex;gap:3px}.tsel button{width:30px;height:26px;border-radius:6px;border:2px solid var(--line);background:#fff;font-size:12px;font-weight:800;padding:0}
.tsel button[aria-pressed=true]{color:#fff}
.res{width:100%;border-collapse:collapse;font-size:14px}.res td{padding:4px 6px;border-bottom:1px dashed var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14213a;color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;z-index:99;max-width:90vw}
/* ---- iPad ---- */
body.pad{background:#0f1420;color:#eef2ff;min-height:100vh;overscroll-behavior:none}
html.padmode,html.padmode *{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.pwrap{max-width:1000px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-right,0px)) 40px max(14px,env(safe-area-inset-left,0px))}
.pc{background:#1b2333;border-radius:20px;padding:16px;margin-bottom:12px;border:2px solid #2c3850}
.pc h2{margin:0 0 8px;font-size:22px}
.pc .note{color:#a9b4cc}
.pbtn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;font-size:17px;background:#2c3850;color:#fff;text-decoration:none;display:inline-block}
.pbtn.go{background:#f2b705;color:#2a1d00}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.role{border:3px solid #2c3850;border-radius:16px;background:#141b29;color:#fff;padding:12px;text-align:left}
.role b{font-size:20px;display:block}.role small{color:#a9b4cc;font-size:13px;line-height:1.5;display:block;margin-top:4px}
.role.me{border-color:#f2b705;background:#2b2410}.role.taken{opacity:.45}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.card{border:3px solid #2c3850;border-radius:14px;background:#141b29;color:#fff;padding:6px;text-align:center;position:relative}
.card img{height:58px;max-width:100%;object-fit:contain;display:block;margin:0 auto}
.card b{display:block;font-size:14px}.card i{font-style:normal;color:#ffd86b;font-weight:800;font-size:13px}
.card small{display:block;color:#a9b4cc;font-size:11px;line-height:1.35;margin-top:2px}
.card.on{border-color:#f2b705;background:#2b2410}
.card .no{position:absolute;top:4px;left:6px;background:#f2b705;color:#2a1d00;border-radius:50%;width:22px;height:22px;font-weight:800;font-size:13px;line-height:22px}
/* playing screen */
body.playing{overflow:hidden;height:100vh}
.play{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr);background:#0b0e15}
@media (orientation:portrait){.play{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}}
.phead{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top,0px));background:#141b29;font-weight:800;font-size:14px;flex-wrap:wrap}
.phead .tm{border-radius:8px;padding:2px 8px;color:#fff}
.hpb{display:flex;gap:4px;align-items:center}
.hpb span{display:inline-block;width:46px;height:12px;border-radius:4px;background:#333;overflow:hidden;position:relative}
.hpb span i{position:absolute;left:0;top:0;bottom:0}
.pmap{position:relative;min-height:0;min-width:0}
.pmap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.pmap .vbtn{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.pmap .vbtn button{border:0;border-radius:10px;padding:6px 10px;font-weight:800;background:rgba(20,27,41,.85);color:#fff}
.pmap .vbtn button[aria-pressed=true]{background:#f2b705;color:#2a1d00}
.pmap .hint{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:800;pointer-events:none}
.pside{background:#141b29;overflow:auto;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
@media (orientation:portrait){.pside{max-height:42vh}}
.money{display:flex;justify-content:space-between;align-items:baseline;background:#0f1420;border-radius:12px;padding:6px 10px;margin-bottom:8px}
.money b{font-family:var(--f-num);font-size:26px;color:#ffd86b}
.pside .cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pside .card{padding:4px}.pside .card img{height:46px}
.pside h4{margin:8px 2px 4px;font-size:13px;color:#a9b4cc}
.give{display:grid;grid-template-columns:auto 1fr repeat(3,auto);gap:5px;align-items:center;margin-bottom:5px;font-weight:800;font-size:14px}
.give button{border:0;border-radius:10px;padding:8px 9px;font-weight:800;background:#2c3850;color:#fff}
.give .w{color:#ffd86b;text-align:right}
.tgts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tgts button{border:3px solid transparent;border-radius:12px;padding:8px 4px;font-weight:800;color:#fff}
.tgts button.on{border-color:#fff}
.wide{width:100%;border:0;border-radius:12px;padding:10px;font-weight:800;background:#2c3850;color:#fff;margin-top:6px}
.wide.go{background:#f2b705;color:#2a1d00}
.selm{background:#0f1420;border-radius:12px;padding:8px;margin-top:8px}
.ptoast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:rgba(20,33,58,.95);color:#fff;padding:10px 18px;border-radius:14px;font-weight:800;z-index:99;pointer-events:none}
/* viewer */
body.view{background:#0b0e15;margin:0;overflow:hidden}
body.view canvas{position:fixed;inset:0;width:100vw;height:100vh}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script>
'use strict';
const {esc,yen}=MG, $=s=>document.querySelector(s), app=$('#app');
const SIM=TBSIM, {TT,TRAPS,UT,MINE,ITEMS,ITEM,MAPS,MAP_ORDER,CELL,STEP,ROLES,ROLE_NAMES:RN,TEAM_COLORS:TC,TEAM_NAMES:TN,TEAM_CFG,COURIER}=SIM;
const CLEAN=MG.qs.get('clean')||'';
const GID='tbclean_'+CLEAN, NAME='タワーバトル(掃除決め)';
const now=()=>Date.now();
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ROLE_DESC={front:'攻撃キャラを出撃させて、相手のクリスタルをこわす',back:'防御タワーを自陣に置いて、クリスタルを守る',eng:'罠をしかける。壁・障害物で敵の道をふさぐ',cmd:'チーム金庫のゴールドを配る。金鉱・狙う相手・アイテム回収'};
const PAY=[60,30,10,0];              // 順位ごとの配当(参加料の総額に対する%)
const UNIT_KEYS=Object.keys(UT);
let toastT=null; function toast(m){ if(!m) return; const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3500)}
const fmtTime=t=>{ t=Math.max(0,Math.ceil(t)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };
const REASON={gold:'ゴールドが足りません',prep:'準備中はできません',zone:'自分のチームの陣地にだけ置けます',blocked:'そこには置けません(障害物があります)',occupied:'もう何か置いてあります',
  crystal:'クリスタルのすぐ近くには置けません',deck:'そのカードは持っていません',mmax:'金鉱はもう最大(4つ)です',mfar:'金鉱は陣地の前のほう(赤くないところ)にだけ置けます',over:'試合は終わりました',
  dead:'クリスタルがこわれたので操作できません',wait:'狙う相手はまだ変えられません',noitem:'いまアイテムは出ていません',already:'回収隊はもう向かっています',bad:'そのチームは狙えません',range:'そこには置けません',
  x:'できませんでした',type:'できませんでした',tcap:'これ以上タワーを置けません'};

/* =========================================================
   描画(先生のPC・iPad・観戦で共通)
   R = 描画用の状態。先生のPCではゲームの G そのもの、iPad・観戦では届いたデータから作る
   ========================================================= */
const FONT='"M PLUS Rounded 1c","Hiragino Sans","Noto Sans JP",sans-serif';
const SPR={}; let sprVer=0;
(function(){ const d=window.SPRITE_DATA||{}; for(const k in d){ const im=new Image(); im.onload=()=>{sprVer++;}; im.src=d[k]; SPR[k]=im; } })();
const sprOK=k=>{ const im=SPR[k]; return !!(im&&im.complete&&im.naturalWidth>0); };
const sprSrc=k=>(window.SPRITE_DATA||{})[k]||'';
function rr(c,x,y,w,h,r){ r=Math.min(r,w/2,h/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function txt(c,s,x,y,sz,col,al,bold){ c.font=(bold?'bold ':'')+sz+'px '+FONT; c.fillStyle=col; c.textAlign=al||'left'; c.textBaseline='middle'; c.fillText(s,x,y); }
function otxt(c,s,x,y,sz,col,al){ c.font='bold '+sz+'px '+FONT; c.textAlign=al||'center'; c.textBaseline='middle'; c.lineWidth=Math.max(3,sz/6); c.strokeStyle='rgba(0,0,0,.85)'; c.strokeText(s,x,y); c.fillStyle=col; c.fillText(s,x,y); }
function obsBase(it){ return it.t==='cliff'?it.y+it.h+4:it.y+it.r*0.8; }
function drawObs(c,map,it){
  const key='ob_'+map+'_'+it.k, im=SPR[key];
  if(!sprOK(key)){ c.fillStyle='#6b6b66'; c.strokeStyle='#333'; c.lineWidth=2;
    if(it.t==='cliff'){ rr(c,it.x,it.y,it.w,it.h,8); c.fill(); c.stroke(); } else { c.beginPath(); c.arc(it.x,it.y,it.r,0,7); c.fill(); c.stroke(); } return; }
  const nw=im.naturalWidth, nh=im.naturalHeight; let w,h,cx,by;
  if(it.t==='cliff'){ if(it.k==='hw'){ w=it.w*1.25; h=w*nh/nw; } else { h=it.h*1.4; w=h*nw/nh; if(w>90){ w=90; h=w*nh/nw; } } cx=it.x+it.w/2; by=it.y+it.h+4; }
  else { const K={sm:2.0,md:1.9,lg:1.8,ct:1.5}[it.k]||1.8; w=it.r*2*K; h=w*nh/nw; cx=it.x; by=obsBase(it); }
  c.save(); c.translate(cx,by); if((((it.x*13+it.y*7)|0)&1)&&it.k!=='ct') c.scale(-1,1); c.drawImage(im,-w/2,-h,w,h); c.restore();
}
// 地面・陣地・障害物(静的な部分)は一度だけ描いておく
let TER={key:'',img:null,obs:[]};
function terrainFor(R){
  const key=R.map+':'+R.seed+':'+sprVer;
  if(TER.key===key) return TER;
  const W=R.W,H=R.H,mp=MAPS[R.map]||MAPS.forest, cvs=document.createElement('canvas'); cvs.width=W; cvs.height=H;
  const c=cvs.getContext('2d'), tk='gr_'+R.map;
  if(sprOK(tk)){ const S=560,tile=SPR[tk]; for(let j=0;j*S<H;j++) for(let i=0;i*S<W;i++){ c.save(); c.translate(i*S+(i&1?S:0),j*S+(j&1?S:0)); c.scale(i&1?-1:1,j&1?-1:1); c.drawImage(tile,0,0,S,S); c.restore(); } }
  else { c.fillStyle='#5a7a48'; c.fillRect(0,0,W,H); }
  R.zones.forEach((z,ti)=>{ const col=TC[ti];
    c.fillStyle=col+'2b'; c.fillRect(z.x0,z.y0,z.x1-z.x0,z.y1-z.y0);
    c.strokeStyle='rgba(255,255,255,.16)'; c.lineWidth=1; c.beginPath();
    for(let x=z.x0;x<=z.x1+1;x+=CELL){ c.moveTo(x,z.y0); c.lineTo(x,z.y1); } for(let y=z.y0;y<=z.y1+1;y+=CELL){ c.moveTo(z.x0,y); c.lineTo(z.x1,y); } c.stroke();
    c.save(); c.setLineDash([14,10]); c.strokeStyle=col; c.lineWidth=3; c.strokeRect(z.x0+1.5,z.y0+1.5,z.x1-z.x0-3,z.y1-z.y0-3); c.restore(); });
  R.teams.forEach(t=>{ const cr=t.crystal; c.fillStyle=TC[t.id]+'33'; c.beginPath(); c.arc(cr.x,cr.y,78,0,7); c.fill(); c.strokeStyle=TC[t.id]; c.lineWidth=3; c.setLineDash([8,8]); c.beginPath(); c.arc(cr.x,cr.y,78,0,7); c.stroke(); c.setLineDash([]); });
  const obs=[];
  for(const it of R.items){ if(mp.flat&&it.k==='ct'){ drawObs(c,R.map,it); continue; } obs.push({it,by:obsBase(it),cx:it.t==='cliff'?it.x+it.w/2:it.x}); }
  obs.sort((a,b)=>a.by-b.by);
  TER={key,img:cvs,obs}; return TER;
}
function drawSpr(c,key,cx,by,h,o){
  o=o||{}; const ok=sprOK(key), im=SPR[key], w=ok?im.naturalWidth*h/im.naturalHeight:h*0.8;
  if(!o.fly){ c.fillStyle='rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(cx,by-2,w*.36,6,0,0,7); c.fill(); }
  else { c.fillStyle='rgba(0,0,0,.2)'; c.beginPath(); c.ellipse(cx,by+20,w*.28,5,0,0,7); c.fill(); }
  if(o.ring){ c.strokeStyle=o.ring; c.lineWidth=3; c.beginPath(); c.ellipse(cx,by-2,Math.max(w*.4,14),7,0,0,7); c.stroke(); }
  c.save(); c.globalAlpha=o.alpha==null?1:o.alpha; const yb=o.fly?by-16:by;
  if(ok){ c.translate(cx,yb); if(o.flip) c.scale(-1,1); c.drawImage(im,-w/2,-h,w,h); }
  else { c.fillStyle=o.ring||'#888'; rr(c,cx-w/2,yb-h,w,h,8); c.fill(); }
  c.restore();
}
function bar(c,cx,y,w,f,col){ c.fillStyle='rgba(0,0,0,.7)'; c.fillRect(cx-w/2-1,y-1,w+2,6); c.fillStyle=col; c.fillRect(cx-w/2,y,w*clamp(f,0,1),4); }
const flipOf=(nf,face)=>nf!==0&&nf!==undefined?face!==nf:false;
function drawCrystal(c,R,t){
  const cr=t.crystal, col=TC[t.id], dead=!t.alive, key='crystal_'+(t.id%4), H=150, by=cr.y+42;
  if(sprOK(key)){ const im=SPR[key], w=im.naturalWidth*H/im.naturalHeight; c.save();
    if(dead) c.filter='grayscale(1) brightness(.55)'; else { const p=1+Math.sin(R.t*3+t.id)*0.012; c.translate(cr.x,by); c.scale(p,p); c.translate(-cr.x,-by); }
    c.drawImage(im,cr.x-w/2,by-H,w,H); c.restore(); }
  else { c.fillStyle=dead?'#666':col; c.beginPath(); c.moveTo(cr.x,by-110); c.lineTo(cr.x+30,by-50); c.lineTo(cr.x,by-10); c.lineTo(cr.x-30,by-50); c.closePath(); c.fill(); }
  if(!dead){ bar(c,cr.x,by-H-6,80,cr.hp/cr.max,col);
    if(cr.hp<cr.max&&R.t-(cr.lastHit||-9)<1){ c.strokeStyle='rgba(255,80,60,.8)'; c.lineWidth=4; c.beginPath(); c.arc(cr.x,cr.y-30,62,0,7); c.stroke(); } }
}
function drawMinePlaceholder(c,x,by,col){
  c.fillStyle='rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(x,by-2,24,7,0,0,7); c.fill(); c.strokeStyle=col; c.lineWidth=3; c.stroke();
  c.fillStyle='#8a6a48'; c.strokeStyle='#4a3622'; c.lineWidth=2; c.beginPath(); c.moveTo(x-26,by-2); c.quadraticCurveTo(x-20,by-40,x,by-42); c.quadraticCurveTo(x+20,by-40,x+26,by-2); c.closePath(); c.fill(); c.stroke();
}
function drawStruct(c,R,s){
  const col=TC[s.team];
  if(s.kind==='tower'){
    if(s.type==='block'){ const k='ob_'+R.map+'_sm'; c.fillStyle='rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(s.x,s.y+14,20,6,0,0,7); c.fill();
      c.strokeStyle=col; c.lineWidth=3; c.beginPath(); c.ellipse(s.x,s.y+14,20,7,0,0,7); c.stroke();
      if(sprOK(k)){ const im=SPR[k], w=40, h=w*im.naturalHeight/im.naturalWidth; c.drawImage(im,s.x-w/2,s.y+16-h,w,h); } else { c.fillStyle='#777'; c.beginPath(); c.arc(s.x,s.y,16,0,7); c.fill(); } }

async function startMatch(){
  if(M.ph!=='lobby'||M.busy) return;
  const fee=Math.max(0,Math.floor(+C.fee||0)), inT=people().filter(s=>M.team[s]>=0);
  if(!inT.length) return toast('チームに入っている人がいません');
  const noRole=inT.filter(s=>!M.role[s]);
  if(!confirm(`試合をはじめますか?\n${inT.length}人 から参加料 ${fee}枚 ずつ集めます(足りない人は持っている分だけ)。${noRole.length?`\n役割を選んでいない ${noRole.length}人 には、空いている役割を割り当てます。`:''}`)) return;
  M.busy=true;
  try{
    // 役割を割り当てて、スロット(チーム×4+役割)を決める
    for(const t of [0,1,2,3]){ const ms=membersOf(t), used=new Set(ms.map(s=>M.role[s]).filter(Boolean));
      ms.filter(s=>!M.role[s]).forEach(s=>{ const r=ROLES.find(x=>!used.has(x)); if(r){ M.role[s]=r; used.add(r); } }); }
    const decks=[], humans=[]; M.slot={};
    people().forEach(s=>{ const t=M.team[s]; if(t>=0&&M.role[s]){ const slot=t*4+ROLES.indexOf(M.role[s]); M.slot[s]=slot; humans[slot]=true; decks[slot]=M.deck[s]||null; } });
    // 参加料
    M.paid={}; M.pool=0; M.got={};
    inT.forEach(s=>{ const p=Math.min(fee,CB[s]||0); M.paid[s]=p; CB[s]=(CB[s]||0)-p; M.pool+=p; });
    await saveCB({tb:{fee:M.paid,at:now()}});
    G=SIM.newGame({mode:'team',map:M.map,seed:M.seed,prep:TEAM_CFG.prep,cpuLevel:clamp(+C.cpu||0,0,2),decks,humans});
    G.zones=[0,4,8,12].map(i=>G.L.zones[i]);
    M.ph='play'; M.res=null; acc=0; lastMsgT=-1;
    people().forEach(writeMe); HOST.be.set(TB+'/st',stDoc()).catch(()=>{}); lobbyDirty=panelDirty=true;
  }finally{ M.busy=false; }
}
function computePayout(){
  const r=G.result, pool=M.pool, ranks=r.ranks.slice();
  const humanTeams=ranks.filter(x=>membersOf(x.team).some(s=>M.slot[s]!=null));
  const k=humanTeams.length, pct=PAY.slice(0,k), tot=pct.reduce((a,b)=>a+b,0)||1;
  let shares=humanTeams.map((x,i)=>Math.floor(pool*pct[i]/tot));
  if(r.winner<0&&k>=2){ const s=Math.floor((shares[0]+shares[1])/2); shares[0]=s; shares[1]=s; }
  const got={}; let paid=0;
  humanTeams.forEach((x,i)=>{ const ms=membersOf(x.team).filter(s=>M.slot[s]!=null), each=Math.floor(shares[i]/ms.length); ms.forEach(s=>{ got[s]=each; paid+=each; }); });
  // 割り切れなかった分は、上の順位のチームの人から1枚ずつ
  let rest=pool-paid; const order=[]; humanTeams.forEach(x=>membersOf(x.team).filter(s=>M.slot[s]!=null).forEach(s=>order.push(s)));
  for(let i=0;rest>0&&order.length;i=(i+1)%order.length){ got[order[i]]=(got[order[i]]||0)+1; rest--; }
  const out=ranks.map(x=>{ const ms=membersOf(x.team).filter(s=>M.slot[s]!=null), sh=ms.reduce((a,s)=>a+(got[s]||0),0);
    return {team:x.team,rank:x.rank,n:ms.length,share:sh,each:ms.length?Math.floor(sh/ms.length):0,frac:Math.round(x.frac*100)}; });
  return {got,ranks:out,pool,reason:r.reason};
}

async function padReq(sid,r){
  if(!(SESS.m&&SESS.m[sid]!=null)) return {ok:false,msg:'この掃除決めには参加していません'};
  const t=r.type, tm=M.team[sid]!=null?M.team[sid]:-1;
  if(t==='g:hello'){ writeMe(sid); return {ok:true}; }
  if(t==='g:role'){
    if(M.ph!=='lobby') return {ok:false,msg:'試合中は変えられません'};
    if(tm<0) return {ok:false,msg:'あなたは観戦です'};
    if(!ROLES.includes(r.r)) return {ok:false,msg:'その役割はありません'};
    const who=membersOf(tm).find(s=>s!==sid&&M.role[s]===r.r); if(who) return {ok:false,msg:'その役割はほかの人が選びました'};
    if(M.role[sid]!==r.r) delete M.deck[sid];
    M.role[sid]=r.r; writeMe(sid); lobbyDirty=panelDirty=true; return {ok:true,msg:`${RN[r.r]}になりました`};
  }
  if(t==='g:deck'){
    if(M.ph!=='lobby') return {ok:false,msg:'試合中は変えられません'};
    const role=M.role[sid]; if(!role||role==='cmd') return {ok:false,msg:'先に役割を選んでください'};
    if(!SIM.roleDeckOK(role,r.k)) return {ok:false,msg:'カードを3枚選んでください'};
    M.deck[sid]=r.k.slice(); writeMe(sid); panelDirty=true; return {ok:true,msg:'3枠を決めました'};
  }
  if(M.ph!=='play'||!G) return {ok:false,msg:'いまは試合中ではありません'};
  const slot=M.slot[sid]; if(slot==null) return {ok:false,msg:'あなたは観戦です'};
  const p=G.players[slot]; let why='x';
  if(t==='g:send'){ if(p.role!=='front') return {ok:false,msg:'出撃は前線の仕事です'}; why=SIM.sendUnit(p,r.k); }
  else if(t==='g:build'){ if(p.role==='front') return {ok:false,msg:'前線は建物を置けません'}; why=SIM.buildStruct(p,r.k,Math.floor(+r.cx),Math.floor(+r.cy)); }
  else if(t==='g:give') why=SIM.giveGold(p,r.r,r.a);
  else if(t==='g:target') why=SIM.setTarget(p,+r.tg);
  else if(t==='g:courier') why=SIM.sendCourier(p);
  else if(t==='g:up'||t==='g:sell'){ const s=G.structs.find(x=>x.id===+r.id&&!x.dead); if(!s||s.owner!==slot) return {ok:false,msg:'自分の建物ではありません'};
    why=t==='g:up'?SIM.upgradeStruct(p,s):SIM.sellStruct(p,s); if(why==='x') return {ok:false,msg:t==='g:up'?'これ以上強くできません':'売れません'}; }
  else return {ok:false,msg:'その操作はできません'};
  lobbyDirty=true;   // チームのゴールドをすぐ送り直す
  if(why) return {ok:false,msg:REASON[why]||'できませんでした'};
  return {ok:true};
}

  const F=P.F[P.F.length-1];
  if(F){ const g=F.g, pre=g<(st.prep||30); $('#ptime').textContent=pre?'準備 '+fmtTime((st.prep||30)-g):'残り '+fmtTime((st.tl||360)-g);
    [0,1,2,3].forEach(t=>{ const e=$('#hp'+t); if(e) e.style.width=((F.al>>t)&1?F.c[t]||0:0)+'%'; }); }
  const wal=$('#wal'); let gold=0;
  if(wal&&role){ gold=role==='cmd'?(tm.bank||0):((tm.w||{})[role]||0); wal.textContent=yen(gold); }
  app.querySelectorAll('[data-c]').forEach(b=>{ const k=b.dataset.c, cost=k==='mine'?(tm.mc||MINE.cost):(TT[k]||TRAPS[k]||UT[k]).cost;
    b.classList.toggle('on',P.sel===k); b.style.opacity=gold>=cost?1:.5; if(k==='mine'){ const i=b.querySelector('[data-cost]'); if(i) i.textContent=(tm.mn||0)>=4?'最大':cost+'G'; } });
  if(role==='cmd'){
    ['front','back','eng'].forEach(r=>{ const e=$('#w_'+r); if(e) e.textContent=yen((tm.w||{})[r]||0)+'G'+((tm.hu||{})[r]?'':'(CPU)'); });
    app.querySelectorAll('[data-g]').forEach(b=>b.disabled=(tm.bank||0)<+b.dataset.a);
    app.querySelectorAll('[data-tg]').forEach(b=>{ b.classList.toggle('on',+b.dataset.tg===tm.tg); b.disabled=!((F?F.al:15)>>+b.dataset.tg&1)||(tm.tn>0&&+b.dataset.tg!==tm.tg); });
    const cd=$('#tgtCd'); if(cd) cd.textContent=tm.tn>0?`(あと${tm.tn}秒で変えられる)`:'(いま変えられる)';
    const it=$('#incT'); if(it) it.textContent=`収入 ${tm.inc||0}G/秒 ・ 金鉱 ${tm.mn||0}/4`;
    const cb=$('#cour'); if(cb){ cb.disabled=!(F&&F.it)||!!tm.cour||(tm.bank||0)<COURIER.cost; cb.textContent=tm.cour?'回収隊が向かっています':F&&F.it?`アイテムに回収隊を送る(${COURIER.cost}G)`:'アイテムが出たら回収隊を送れます'; }
  }
  if(role==='front'){ const ti=$('#tgtInfo'); if(ti) ti.innerHTML=tm.tg>=0?`狙う相手:<b style="color:${TC[tm.tg]}">${TN[tm.tg]}チーム</b>(司令塔が決める)`:''; }
  const sb=$('#selBox');
  if(sb){ const s=P.selS!=null&&R?R.structs.find(x=>x.id===P.selS):null;
    if(s){ const info=s.kind==='mine'?MINE:(TT[s.type]||TRAPS[s.type]), up=s.kind==='tower'&&!TT[s.type].noAtk&&s.lvl<3?Math.round(TT[s.type].cost*(s.lvl===1?0.7:1.0)):0;
      const k='sel:'+s.id+':'+s.lvl+':'+up;
      if(sb.dataset.k!==k){ sb.dataset.k=k; sb.innerHTML=`<div class="selm"><b>${esc(info.name)}</b>${s.kind==='tower'&&!TT[s.type].noAtk?` Lv${s.lvl}`:''}<div style="display:flex;gap:6px;margin-top:6px">${up?`<button class="wide go" id="sUp" style="margin:0">強化 ${up}G</button>`:''}<button class="wide" id="sSell" style="margin:0">売る</button></div></div>`;
        const u=$('#sUp'); if(u) u.onclick=()=>act('g:up',{id:s.id}); $('#sSell').onclick=()=>act('g:sell',{id:s.id}).then(r=>{ if(r&&r.ok){ P.selS=null; updPlay(); } }); } }
    else if(sb.dataset.k){ sb.dataset.k=''; sb.innerHTML=''; } }
  const h=$('#hint'); if(h){ const pre=F&&F.g<(st.prep||30); let m='';
    if(P.sel) m=P.sel==='mine'?'金鉱:陣地の赤くないところをタップ':'置きたいマスをタップ(もう一度カードを押すとやめる)';
    else if(role==='front'&&pre) m='準備中:もうすぐ出撃できます';
    else if(tm.al===0) m='クリスタルがこわれました…';
    h.hidden=!m; h.textContent=m; }
}
function padDraw(){
  const c=P.ctx, R=P.R; if(!c||!R||!$('#pcv')) return;
  c.setTransform(c.D,0,0,c.D,0,0);
  frameR(R,P.F,P.off);
  const v=padView(), t=P.me?P.me.team:-1;
  const sel=P.selS!=null?R.structs.find(x=>x.id===P.selS):null;
  drawWorld(c,R,v,c.W,c.H,{hi:t>=0?t:null,mineLine:P.sel==='mine'?t:null,sel});
  const ms=(P.st&&P.st.ms||[]).filter(m=>R.t-m.t<4).slice(-2); let y=22; for(const m of ms){ otxt(c,m.text,c.W/2,y,15,m.col||'#fff'); y+=22; }
  if(P.st&&P.st.ph==='play'&&P.F.length&&P.F[P.F.length-1].g<(P.st.prep||30)){ otxt(c,'準備 '+fmtTime((P.st.prep||30)-P.F[P.F.length-1].g)+' ・ いまのうちに置こう',c.W/2,c.H-70,26,'#ffd23f'); }
}
function resultRender(){
  P.ctx=null; document.body.classList.remove('playing');
  const me=P.me, res=P.st.res; if(!res) return padMsg('結果を待っています…','');
  const mine=res.ranks.find(r=>r.team===me.team);
  app.innerHTML=`<div class="pwrap"><div class="pc"><h2>${mine?`${TN[me.team]}チームは ${mine.rank}位!`:'試合が終わりました'}</h2>
    <p class="note">${me.slot>=0?`参加料 ${yen(me.paid)}枚 → 配当 ${yen(me.got)}枚`:'観戦でした'} ・ いまのメダル <b style="color:#ffd86b;font-size:20px">${yen(me.b)}枚</b></p>
    ${res.ranks.map(r=>`<div style="display:flex;justify-content:space-between;background:${TC[r.team]};border-radius:12px;padding:8px 12px;margin:6px 0;font-weight:800"><span>${r.rank}位 ${TN[r.team]}チーム</span><span>${r.n?`1人 ${yen(r.each)}枚`:'CPU'}</span></div>`).join('')}
    <p class="note">先生がつぎに進むまで待ってね。</p></div></div>`;
}
</script>
</body>
</html>
