<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ローマ字タイピングバトル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+1+Code:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1020; --bg2:#141933; --panel:#181e3a; --panel2:#1f2648; --line:#2c3561;
  --ink:#eef1ff; --mut:#8e96c2; --dim:#5b6390;
  --acc:#ffd23f; --acc-ink:#1a1400; --you:#3ee0c8; --cpu:#ff8a4c; --bad:#ff5577; --good:#7cf29c;
  --r:16px;
  --f-head:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Consolas",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;
  background-image:radial-gradient(1200px 600px at 80% -10%,#2a2470 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#0d4a55 0%,transparent 55%),
  linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:auto,auto,32px 32px,32px 32px;background-attachment:fixed;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;max-width:1100px;margin:0 auto}
.logo{font-family:var(--f-head);font-size:18px;letter-spacing:.06em;cursor:pointer;user-select:none}
.logo span{color:var(--acc)}
.netst{margin-left:auto;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
.dot.warn{background:var(--acc)}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:15px}
main{max-width:1100px;margin:0 auto;padding:8px 20px 40px}
.screen{display:none;animation:fade .25s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* タイトル */
.hero{text-align:center;padding:28px 0 18px}
.hero h1{font-family:var(--f-head);font-weight:400;font-size:clamp(34px,6vw,64px);line-height:1.15;margin:0;letter-spacing:.02em}
.hero h1 em{font-style:normal;color:var(--acc);text-shadow:0 0 24px rgba(255,210,63,.35)}
.hero .keys{display:flex;justify-content:center;gap:6px;margin:14px 0 0}
.kc{font-family:var(--f-mono);font-weight:700;font-size:15px;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:var(--panel2);border:1px solid var(--line);border-bottom-width:4px;color:var(--mut)}
.kc.hl{color:var(--acc-ink);background:var(--acc);border-color:#b8921a}
.namebox{max-width:440px;margin:6px auto 22px;text-align:center}
.namebox label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.namebox input{width:100%;text-align:center;font-size:22px;font-weight:700;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg2);color:var(--ink);outline:none}
.namebox input:focus{border-color:var(--acc)}
.namebox small{display:block;margin-top:6px;color:var(--dim);font-size:12px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:760px;margin:0 auto}
.mbtn{display:flex;align-items:center;gap:14px;text-align:left;padding:20px 20px;border-radius:var(--r);background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);transition:transform .12s,border-color .12s}
.mbtn:hover{transform:translateY(-2px);border-color:var(--acc)}
.mbtn .ic{font-size:34px;line-height:1}
.mbtn b{display:block;font-size:20px;font-weight:900}
.mbtn small{display:block;color:var(--mut);font-size:13px;margin-top:3px}
.foot{text-align:center;color:var(--dim);font-size:12px;margin-top:26px}

/* 共通パネル */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;max-width:760px;margin:0 auto}
.panel h2{font-family:var(--f-head);font-weight:400;font-size:26px;margin:0 0 4px}
.panel .sub{color:var(--mut);font-size:14px;margin:0 0 18px}
.field{margin:16px 0}
.field>label{display:block;font-size:13px;color:var(--mut);margin-bottom:8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-weight:700;font-size:15px}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chip small{font-weight:500;opacity:.75;margin-left:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:13px 22px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:900;font-size:16px}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.spacer{flex:1}
.hint{color:var(--dim);font-size:12px}

/* ゲーム */
#s-game{max-width:960px;margin:0 auto;position:relative}
.hud{display:flex;gap:10px;align-items:stretch;margin-bottom:14px}
.hbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:96px}
.hbox .l{font-size:11px;color:var(--mut);letter-spacing:.08em}
.hbox .v{font-family:var(--f-mono);font-weight:700;font-size:24px;line-height:1.2}
.hbox.big .v{font-size:30px;color:var(--acc)}
.hbox.combo .v{color:var(--you)}
.tbar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin:-6px 0 14px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#ff8a4c);transition:width .2s linear}
.pcard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:26px 28px 24px;text-align:center;position:relative;overflow:hidden}
.pcard.miss{animation:missf .22s}
@keyframes missf{0%{box-shadow:inset 0 0 0 3px var(--bad)}100%{box-shadow:inset 0 0 0 0 transparent}}
.pmeta{font-size:12px;color:var(--mut);margin-bottom:8px;letter-spacing:.06em}
.disp{font-weight:900;font-size:clamp(26px,4.4vw,44px);line-height:1.3;margin-bottom:8px;word-break:break-all}
.kana{font-size:clamp(16px,2.2vw,21px);color:var(--mut);margin-bottom:14px;letter-spacing:.04em;word-break:break-all}
.kana .d{color:var(--you)}
.kana .c{color:var(--ink);text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:5px}
.roma{font-family:var(--f-mono);font-size:clamp(20px,3vw,30px);letter-spacing:.04em;word-break:break-all;line-height:1.5}
.roma .d{color:var(--you);opacity:.55}
.roma .n{background:var(--acc);color:var(--acc-ink);border-radius:4px;padding:0 1px}
.roma .n.bad{background:var(--bad);color:#fff}
.roma .r{color:var(--ink)}
.next{font-size:13px;color:var(--dim);text-align:center;margin:10px 0 0;min-height:18px}
.pop{position:absolute;right:22px;top:16px;font-family:var(--f-head);font-size:22px;color:var(--acc);pointer-events:none;animation:popup .9s ease forwards}
.pop.perfect{color:var(--good)}
@keyframes popup{0%{opacity:0;transform:translateY(8px) scale(.9)}20%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-22px)}}
.bars{margin-top:18px;display:grid;gap:10px}
.bar{display:grid;grid-template-columns:130px 1fr 74px;gap:12px;align-items:center}
.bar .nm{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .nm small{color:var(--mut);font-weight:500}
.bar .tr{height:22px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;position:relative}
.bar .fl{height:100%;border-radius:11px;background:var(--mut);transition:width .25s ease}
.bar.me .fl{background:linear-gradient(90deg,#1fb5a1,var(--you))}
.bar.cpu .fl{background:linear-gradient(90deg,#d9612c,var(--cpu))}
.bar.op .fl{background:linear-gradient(90deg,#6b6fd6,#9fa3ff)}
.bar .tx{font-family:var(--f-mono);font-size:14px;text-align:right;color:var(--mut)}
.bar.fin .tx{color:var(--acc);font-weight:700}
.ghint{text-align:center;color:var(--dim);font-size:12px;margin-top:16px}
.overlay{position:absolute;inset:-10px;display:none;place-items:center;background:rgba(13,16,32,.72);backdrop-filter:blur(3px);border-radius:20px;z-index:5}
.overlay.on{display:grid}
.cd{font-family:var(--f-head);font-size:120px;color:var(--acc);animation:cdp .9s ease}
.cd.sm{font-size:30px;color:var(--ink)}
.cd.go{color:var(--good)}
.waitmsg{text-align:center}
.waitmsg b{display:block;font-family:var(--f-head);font-size:40px;color:var(--acc);font-weight:400}
.waitmsg span{color:var(--mut)}
@keyframes cdp{0%{transform:scale(1.6);opacity:0}30%{transform:scale(1);opacity:1}100%{opacity:.85}}
#keyIn{position:absolute;opacity:0;width:1px;height:1px;left:50%;top:40%;border:0;padding:0;pointer-events:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2b1730;border:1px solid var(--bad);color:#ffd7df;padding:12px 18px;border-radius:12px;font-size:15px;z-index:50;max-width:92vw;display:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{display:block;animation:fade .2s}
.toast.info{background:#132b30;border-color:var(--you);color:#d4fff8}

/* 結果 */
.res{text-align:center}
.res .tag{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.res .big{font-family:var(--f-head);font-size:clamp(54px,9vw,88px);color:var(--acc);line-height:1.1;margin:10px 0 0}
.res .big.win{color:var(--good)}
.res .big.lose{color:var(--bad)}
.res .unit{color:var(--mut);font-size:14px}
.res .title{font-size:20px;font-weight:900;margin:8px 0 2px}
.res .best{color:var(--good);font-weight:900;margin-top:8px;min-height:22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat .l{font-size:12px;color:var(--mut)}
.stat .v{font-family:var(--f-mono);font-weight:700;font-size:22px}
.places{display:grid;gap:8px;margin:18px 0;text-align:left}
.place{display:grid;grid-template-columns:52px 1fr auto auto;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.place.me{border-color:var(--you)}
.place .p{font-family:var(--f-head);font-size:22px;text-align:center}
.place .n{font-weight:900}
.place .t,.place .k{font-family:var(--f-mono);color:var(--mut);font-size:14px}

/* ランキング */
.tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.rk{width:100%;border-collapse:collapse}
.rk th{font-size:12px;color:var(--mut);text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.rk td{padding:9px 8px;border-bottom:1px solid rgba(44,53,97,.5);font-size:15px}
.rk td.num{font-family:var(--f-mono);text-align:right}
.rk th.num{text-align:right}
.rk tr.me td{background:rgba(62,224,200,.08)}
.rk .pos{font-family:var(--f-head);font-size:18px;width:52px}
.rk .nm{font-weight:900}
.rk .del{background:none;border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:2px 8px;font-size:12px}
.empty{color:var(--mut);text-align:center;padding:30px 0}

/* ロビー */
.lobby{display:grid;grid-template-columns:1fr 260px;gap:16px;max-width:960px;margin:0 auto}
.blist{display:grid;gap:10px}
.bitem{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.bitem .bn{font-weight:900}
.bitem .bm{color:var(--mut);font-size:13px}
.bitem.racing{opacity:.55}
.onl{display:flex;flex-wrap:wrap;gap:6px}
.onl span{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.onl span.me{border-color:var(--you);color:var(--you)}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:16px 0}
.mem{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;font-weight:900;font-size:17px}
.mem small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.mem.me{border-color:var(--you)}
.mem.empty2{border-style:dashed;color:var(--dim);font-weight:500}
.notice{background:rgba(255,210,63,.08);border:1px solid rgba(255,210,63,.35);color:#ffe9a6;border-radius:12px;padding:10px 14px;font-size:13px;margin:0 auto 14px;max-width:960px}

@media (max-width:760px){
  .menu{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .lobby{grid-template-columns:1fr}
  .bar{grid-template-columns:90px 1fr 60px}
  .hbox{min-width:0;flex:1;padding:6px 10px}
  .hbox .v{font-size:19px}
  .hbox.big .v{font-size:22px}
  .pcard{padding:20px 14px}
  main{padding:8px 16px 32px}
  .top{padding:10px 16px}
}
/* B: ノート（方眼紙と蛍光ペン） */
:root{
  --bg:#ffffff; --bg2:#fbfcff; --panel:#ffffff; --panel2:#ffffff; --line:#d3dbe7;
  --ink:#27313f; --mut:#66738a; --dim:#9aa5b6;
  --acc:#ffec3d; --acc-ink:#27313f; --you:#0fae8f; --cpu:#ff5f99; --bad:#f2385a; --good:#0fae8f;
  --hl:#fff176; --pink:#ff7aa8; --mint:#7fe3cc; --blue:#8fc2ff;
  --f-head:"Yusei Magic","Hiragino Maru Gothic ProN",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --f-mono:"M PLUS 1 Code","Consolas",monospace;
}
body{background-color:#fff;background-image:linear-gradient(#e4eefa 1px,transparent 1px),linear-gradient(90deg,#e4eefa 1px,transparent 1px);background-size:24px 24px,24px 24px;background-attachment:fixed}
body::before{content:"";position:fixed;top:0;bottom:0;left:56px;width:2px;background:#ffb3c7;z-index:-1}
.logo{font-family:var(--f-head);color:var(--ink);letter-spacing:.02em}
.logo span{color:var(--ink);background:linear-gradient(transparent 55%,var(--hl) 55%)}
.iconbtn{background:#fff;border-color:var(--line)}
.hero h1{font-family:var(--f-head);color:var(--ink);line-height:1.35}
.hero h1 .hl{background:linear-gradient(transparent 60%,var(--hl) 60%,var(--hl) 92%,transparent 92%);padding:0 .12em}
.hero .keys .kc{background:#fff;border:2px solid var(--ink);border-bottom-width:4px;color:var(--ink);border-radius:6px}
.hero .keys .kc.hl{background:var(--pink);color:#fff;border-color:var(--ink)}
.namebox input{background:#fff;border:0;border-bottom:3px solid var(--ink);border-radius:0;font-family:var(--f-head);font-size:26px}
.namebox input:focus{border-bottom-color:var(--pink);background:linear-gradient(transparent 60%,#fff8b0 60%)}
.menu{gap:22px}
.mbtn{border:0;border-radius:4px;box-shadow:0 10px 18px rgba(39,49,63,.12),0 2px 0 rgba(39,49,63,.08);background:#fff8a8;transform:rotate(-1.2deg)}
.mbtn:nth-child(2){background:#ffd3e1;transform:rotate(1deg)}
.mbtn:nth-child(3){background:#c9f3e8;transform:rotate(.8deg)}
.mbtn:nth-child(4){background:#d6e8ff;transform:rotate(-.9deg)}
.mbtn:hover{transform:rotate(0) translateY(-3px);border-color:transparent}
.mbtn b{font-family:var(--f-head);font-weight:400;font-size:22px}
.mbtn small{color:#56607a}
.panel{background:#fff;border:2px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 #e7edf6}
.panel h2{font-family:var(--f-head)}
.chip{background:#fff;border:2px solid var(--ink);border-radius:6px}
.chip.on{background:var(--hl);color:var(--ink);border-color:var(--ink)}
.btn{background:#fff;border:2px solid var(--ink);border-radius:6px}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{filter:none;background:#3a4658}
.hbox{background:#fff;border:2px solid var(--ink);border-radius:6px}
.hbox .l{color:var(--mut)}
.hbox .v{font-family:var(--f-head);font-weight:400}
.hbox.big .v{color:var(--ink);background:linear-gradient(transparent 55%,var(--hl) 55%);display:inline-block}
.hbox.combo .v{color:var(--you)}
.tbar{background:#eef2f8;height:8px;border-radius:0}
.tbar i{background:var(--pink)}
.pcard{background:#fff;border:2px solid var(--ink);border-radius:6px;box-shadow:8px 8px 0 #e7edf6;background-image:linear-gradient(#fff 0 44px,transparent 44px),repeating-linear-gradient(#fff 0 38px,#dbe7f6 38px 40px)}
.pcard::before{content:"";position:absolute;left:0;right:0;top:44px;height:2px;background:#ffb3c7}
.pmeta{color:var(--mut)}
.disp{font-family:var(--f-head);font-weight:400;margin-top:10px}
.kana{color:var(--mut)}
.kana .d{color:var(--ink);background:linear-gradient(transparent 60%,var(--mint) 60%)}
.kana .c{text-decoration-color:var(--pink)}
.roma .d{color:var(--ink);opacity:1;background:linear-gradient(transparent 52%,var(--hl) 52%)}
.roma .n{background:none;color:var(--ink);border-bottom:4px solid var(--pink);border-radius:0;padding:0}
.roma .n.bad{background:var(--bad);color:#fff}
.roma .r{color:var(--dim)}
.pop{font-family:var(--f-head);color:var(--pink)}
.pop.perfect{color:var(--you)}
.bar .nm{font-family:var(--f-head);font-weight:400}
.bar .tr{background:transparent;border:0;border-bottom:2px solid var(--ink);border-radius:0;height:26px}
.bar .fl{border-radius:3px 14px 14px 3px;opacity:.9}
.bar.me .fl{background:var(--hl)}
.bar.cpu .fl{background:var(--pink)}
.bar.op .fl{background:var(--blue)}
.bar .tx{font-family:var(--f-head);color:var(--ink)}
.bar.fin .tx{color:var(--pink)}
.overlay{background:rgba(255,255,255,.86);backdrop-filter:none}
.cd{font-family:var(--f-head);color:var(--ink)}
.cd.go{color:var(--pink)}
.waitmsg b{font-family:var(--f-head);color:var(--ink)}
.res .big{font-family:var(--f-head);color:var(--ink);background:linear-gradient(transparent 60%,var(--hl) 60%);display:inline-block;padding:0 .15em}
.res .big.win{color:var(--you)}
.res .big.lose{color:var(--bad)}
.stat,.place,.bitem,.mem,.onl span{background:#fff;border:2px solid var(--line);border-radius:6px}
.rk tr.me td{background:#fff8b0}
.notice{background:#fff8b0;border:2px dashed #d6b800;color:#5c4b00}
.toast{background:#fff;color:var(--ink);border:2px solid var(--bad);border-radius:6px}
.toast.info{border-color:var(--you)}

/* そのほかの画面もノート調に */
body{font-weight:500}
.netst{color:var(--mut)}
.dot.on{background:var(--you);box-shadow:none}
.dot.warn{background:#f2c200}
.hint,.foot,.ghint{color:var(--mut)}
.panel .sub{color:var(--mut)}
.field>label{color:var(--ink)}
.chip small{opacity:.65}
.btn.danger{background:#fff;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.35}
.bar .nm small{color:var(--mut)}
.res .tag{display:table;margin:0 auto 4px;background:#fff;border:2px solid var(--line);border-radius:6px;color:var(--mut)}
.res .unit{color:var(--mut)}
.res .best{color:var(--you)}
.stat .l{color:var(--mut)}
.place .p{font-family:var(--f-head)}
.place.me,.mem.me{border-color:var(--ink);background:#fff8b0}
.mem small{color:var(--mut)}

<script>
// ===== ローマ字入力エンジン =====
const KT = {
  'あ':['a'],'い':['i','yi'],'う':['u','wu','whu'],'え':['e'],'お':['o'],
  'か':['ka','ca'],'き':['ki'],'く':['ku','cu','qu'],'け':['ke'],'こ':['ko','co'],
  'さ':['sa'],'し':['shi','si','ci'],'す':['su'],'せ':['se','ce'],'そ':['so'],
  'た':['ta'],'ち':['chi','ti'],'つ':['tsu','tu'],'て':['te'],'と':['to'],
  'な':['na'],'に':['ni'],'ぬ':['nu'],'ね':['ne'],'の':['no'],
  'は':['ha'],'ひ':['hi'],'ふ':['fu','hu'],'へ':['he'],'ほ':['ho'],
  'ま':['ma'],'み':['mi'],'む':['mu'],'め':['me'],'も':['mo'],
  'や':['ya'],'ゆ':['yu'],'よ':['yo'],
  'ら':['ra'],'り':['ri'],'る':['ru'],'れ':['re'],'ろ':['ro'],
  'わ':['wa'],'を':['wo'],
  'が':['ga'],'ぎ':['gi'],'ぐ':['gu'],'げ':['ge'],'ご':['go'],
  'ざ':['za'],'じ':['ji','zi'],'ず':['zu'],'ぜ':['ze'],'ぞ':['zo'],
  'だ':['da'],'ぢ':['di'],'づ':['du'],'で':['de'],'ど':['do'],
  'ば':['ba'],'び':['bi'],'ぶ':['bu'],'べ':['be'],'ぼ':['bo'],
  'ぱ':['pa'],'ぴ':['pi'],'ぷ':['pu'],'ぺ':['pe'],'ぽ':['po'],
  'ぁ':['xa','la'],'ぃ':['xi','li'],'ぅ':['xu','lu'],'ぇ':['xe','le'],'ぉ':['xo','lo'],
  'ゃ':['xya','lya'],'ゅ':['xyu','lyu'],'ょ':['xyo','lyo'],'ゎ':['xwa','lwa'],
  'ゔ':['vu'],'ー':['-'],'、':[','],'。':['.'],'！':['!'],'？':['?'],'・':['/'],
};
const KT2 = {};
(function(){
  const y = (k, base, extra) => { // きゃ行など
    const sm = ['ゃ','ぃ','ゅ','ぇ','ょ'], v = ['a','i','u','e','o'];
    sm.forEach((s,i)=>{ KT2[k+s] = base.map(b=>b+v[i]); });
    if (extra) for (const s in extra) KT2[k+s] = extra[s].concat(KT2[k+s]||[]);
  };
  y('き',['ky']); y('に',['ny']); y('ひ',['hy']); y('み',['my']); y('り',['ry']);
  y('ぎ',['gy']); y('ぢ',['dy']); y('び',['by']); y('ぴ',['py']);
  y('し',['sy'],{'ゃ':['sha'],'ゅ':['shu'],'ぇ':['she'],'ょ':['sho']});
  y('ち',['ty','cy'],{'ゃ':['cha'],'ゅ':['chu'],'ぇ':['che'],'ょ':['cho']});
  y('じ',['zy','jy'],{'ゃ':['ja'],'ゅ':['ju'],'ぇ':['je'],'ょ':['jo']});
  Object.assign(KT2,{
    'ふぁ':['fa'],'ふぃ':['fi','fyi'],'ふぇ':['fe','fye'],'ふぉ':['fo'],'ふゅ':['fyu'],
    'てぃ':['thi'],'てゅ':['thu'],'でぃ':['dhi'],'でゅ':['dhu'],
    'うぃ':['wi','whi'],'うぇ':['we','whe'],'うぉ':['who'],
    'ゔぁ':['va'],'ゔぃ':['vi'],'ゔぇ':['ve'],'ゔぉ':['vo'],
    'つぁ':['tsa'],'とぅ':['twu'],'どぅ':['dwu'],'くぁ':['qa','kwa'],'ぐぁ':['gwa'],'いぇ':['ye'],
  });
})();
const CONS = /^[bcdfghjklmpqrstvwxyz]/;
function toHira(s){ return s.replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60)); }
function uniq(a){ return [...new Set(a)]; }
function parseKana(kana){
  kana = toHira(kana);
  const raw = [];
  for (let i=0; i<kana.length; ){
    const two = kana.substr(i,2);
    if (KT2[two]) {
      const cart = [];
      for (const a of KT[two[0]]) for (const b of KT[two[1]]) cart.push(a+b);
      raw.push({k:two, c:uniq([...KT2[two], ...cart])}); i+=2; continue;
    }
    const ch = kana[i];
    if (ch==='っ' || ch==='ん') raw.push({k:ch, sp:ch});
    else raw.push({k:ch, c:KT[ch] ? KT[ch].slice() : [ch.toLowerCase()]});
    i++;
  }
  const out = [];
  for (let j=0; j<raw.length; j++){
    const u = raw[j];
    if (u.sp==='っ'){
      const nx = raw[j+1];
      const small = ['xtu','ltu','xtsu','ltsu'];
      if (nx && !nx.sp && CONS.test(nx.c[0])){
        const cs = [];
        for (const c of nx.c) if (CONS.test(c) && c[0]!=='n'){ cs.push(c[0]+c); if (c.startsWith('ch')) cs.push('t'+c); }
        for (const p of small) for (const c of nx.c) cs.push(p+c);
        out.push({k:'っ'+nx.k, c:uniq(cs)}); j++; continue;
      }
      out.push({k:'っ', c:small}); continue;
    }
    out.push(u);
  }
  for (let j=0; j<out.length; j++){
    const u = out[j];
    if (u.sp!=='ん') continue;
    const nx = out[j+1];
    const ok1 = !!(nx && !nx.sp && nx.c.some(c=>!/^[aiueoyn]/.test(c)));
    const pref1 = ok1 && !/^[aiueoyn]/.test(nx.c[0]);
    u.c = ok1 ? (pref1 ? ['n','nn','xn',"n'"] : ['nn','n','xn',"n'"]) : ['nn','xn',"n'"];
  }
  return out;
}
class Typer {
  constructor(kana){ this.units = parseKana(kana); this.i = 0; this.buf = ''; this.typed = ''; }
  done(){ return this.i >= this.units.length; }
  key(k){
    if (this.done()) return 'miss';
    const u = this.units[this.i], nb = this.buf + k;
    if (u.c.some(c=>c.startsWith(nb))){
      this.buf = nb; this.typed += k;
      if (u.c.includes(nb) && !u.c.some(c=>c.length>nb.length && c.startsWith(nb))){ this.i++; this.buf=''; }
      return this.done() ? 'done' : 'ok';
    }
    if (this.buf && u.c.includes(this.buf) && !(u.sp==='ん' && this.buf==='n' && /[aiueoyn']/.test(k))){
      const save = {i:this.i, buf:this.buf, typed:this.typed};
      this.i++; this.buf='';
      const r = this.key(k);
      if (r==='miss'){ Object.assign(this, save); }
      return r;
    }
    return 'miss';
  }
  cur(){ const u=this.units[this.i]; return u ? (u.c.find(c=>c.startsWith(this.buf))||u.c[0]) : ''; }
  rest(){
    let s = '';
    for (let j=this.i; j<this.units.length; j++){
      const u = this.units[j];
      s += j===this.i ? this.cur().slice(this.buf.length) : u.c[0];
    }
    return s;
  }
  frac(){
    if (!this.units.length) return 1;
    const c = this.cur();
    return (this.i + (this.buf && c ? this.buf.length/c.length : 0)) / this.units.length;
  }
  romaLen(){ return this.units.reduce((a,u)=>a+u.c[0].length,0); }
}

権者を保護するしくみの1つ。","p":"13"},{"ch":2,"sec":"1 貸借対照表のしくみ","k":"記述","q":"ある一定時点の、企業の財政状態を表す財務諸表は？","a":"貸借対照表","y":"たいしゃくたいしょうひょう","alt":[],"o":[],"ex":"貸借対照表は「ある時点」の財政状態。「一定期間」の経営成績を表すのは損益計算書。","p":"18"},{"ch":2,"sec":"1 貸借対照表のしくみ","k":"4択","q":"貸借対照表の右側（負債・純資産）が表しているものは？","a":"資金の調達源泉","y":"しきんのちょうたつげんせん","alt":[],"o":[["資金の運用形態","しきんのうんようけいたい"],["経営成績","けいえいせいせき"],["収益と費用","しゅうえきとひよう"]],"ex":"右側は「どこから資金を集めたか」、左側の資産は「どう使っているか（運用形態）」を表す。","p":"18"},{"ch":2,"sec":"1 貸借対照表のしくみ","k":"記述","q":"株主以外から調達した、返済が必要な資金は？","a":"負債","y":"ふさい","alt":["たにんしほん"],"o":[],"ex":"負債は返済が必要なため「他人資本」とも呼ばれる。","p":"18"},{"ch":2,"sec":"1 貸借対照表のしくみ","k":"記述","q":"株主から調達した、原則として返済不要な資金は？","a":"純資産","y":"じゅんしさん","alt":["じこしほん"],"o":[],"ex":"純資産は返済不要で「自己資本」とも呼ばれる。","p":"18"},{"ch":2,"sec":"1 貸借対照表のしくみ","k":"穴うめ","q":"資産合計は、負債合計と【純資産合計】を足した額に等しい","a":"純資産合計","y":"しさんごうけいは、ふさいごうけいと【じゅんしさんごうけい】をたしたがくにひとしい","alt":[],"o":[],"ex":"資産合計＝負債合計＋純資産合計。計算問題で逆算に使うので必ずおさえる。","p":"19"},{"ch":2,"sec":"1 貸借対照表のしくみ","k":"4択","q":"資産を左側、負債と純資産を右側に並べる貸借対照表の様式は？","a":"勘定式","y":"かんじょうしき","alt":[],"o":[["報告式","ほうこくしき"],["流動性配列法","りゅうどうせいはいれつほう"],["固定性配列法","こていせいはいれつほう"]],"ex":"左右に並べるのが勘定式、上から順に並べるのが報告式。","p":"19"},{"ch":2,"sec":"1 貸借対照表のしくみ","k":"記述","q":"資産・負債・純資産を左右に分けず、上から順に並べる様式は？","a":"報告式","y":"ほうこくしき","alt":[],"o":[],"ex":"貸借対照表の様式は勘定式と報告式の2つ。","p":"19"},{"ch":2,"sec":"2 表示のルール①（流動と固定）","k":"穴うめ","q":"資産は流動資産、固定資産、【繰延資産】の3つに区分される","a":"繰延資産","y":"しさんはりゅうどうしさん、こていしさん、【くりのべしさん】の3つにくぶんされる","alt":[],"o":[],"ex":"負債は流動負債と固定負債の2つ。「繰延負債」という区分はない。","p":"20"},{"ch":2,"sec":"2 表示のルール①（流動と固定）","k":"記述","q":"仕入れ→販売→代金回収という営業のサイクルの中にあれば、流動とする基準は？","a":"正常営業循環基準","y":"せいじょうえいぎょうじゅんかんきじゅん","alt":[],"o":[],"ex":"営業サイクルの中にある売掛金や商品などは、期間に関係なく流動になる。","p":"21"},{"ch":2,"sec":"2 表示のルール①（流動と固定）","k":"記述","q":"決算日から1年以内に期限が来るかどうかで、流動と固定を分ける基準は？","a":"ワンイヤールール","y":"わんいやーるーる","alt":[],"o":[],"ex":"1年以内なら流動、1年を超えれば固定。","p":"21"},{"ch":2,"sec":"2 表示のルール①（流動と固定）","k":"穴うめ","q":"流動と固定の区分は、まず【正常営業循環基準】を使い、次にワンイヤールールを使う","a":"正常営業循環基準","y":"りゅうどうとこていのくぶんは、まず【せいじょうえいぎょうじゅんかんきじゅん】をつかい、つぎにわんいやーるーるをつかう","alt":[],"o":[],"ex":"適用する順番が問われる。ワンイヤールールが先ではない。","p":"21"},{"ch":2,"sec":"2 表示のルール①（流動と固定）","k":"4択","q":"1年を超えて保有する予定の商品は、どの区分？","a":"流動資産","y":"りゅうどうしさん","alt":[],"o":[["固定資産","こていしさん"],["投資その他の資産","とうしそのたのしさん"],["繰延資産","くりのべしさん"]],"ex":"商品は営業サイクルの中にあるので、正常営業循環基準で流動資産になる。期間は関係ない。","p":"21"},{"ch":2,"sec":"2 表示のルール①（流動と固定）","k":"4択","q":"決算日の翌日から2年後に返済期限が来る借入金は、どの区分？","a":"固定負債","y":"こていふさい","alt":[],"o":[["流動負債","りゅうどうふさい"],["投資その他の資産","とうしそのたのしさん"],["株主資本","かぶぬししほん"]],"ex":"借入金は営業サイクルの外なので、ワンイヤールールで判断する。1年超なので固定負債（長期借入金）。","p":"21"},{"ch":2,"sec":"3 表示のルール②（配列と原則）","k":"記述","q":"資金にかえやすいもの（流動性の高いもの）から順に並べる方法は？","a":"流動性配列法","y":"りゅうどうせいはいれつほう","alt":[],"o":[],"ex":"日本では一般にこの方法が使われる。","p":"22"},{"ch":2,"sec":"3 表示のルール②（配列と原則）","k":"4択","q":"電力会社やガス会社などで使われる、固定項目を先に並べる方法は？","a":"固定性配列法","y":"こていせいはいれつほう","alt":[],"o":[["流動性配列法","りゅうどうせいはいれつほう"],["勘定式","かんじょうしき"],["報告式","ほうこくしき"]],"ex":"固定性配列法でも、流動項目の中は流動性の高い順に並べる。","p":"22"},{"ch":2,"sec":"3 表示のルール②（配列と原則）","k":"4択","q":"流動資産の中で、いちばん最初に表示される科目は？","a":"現金及び預金","y":"げんきんおよびよきん","alt":[],"o":[["売掛金","うりかけきん"],["棚卸資産","たなおろししさん"],["有価証券","ゆうかしょうけん"]],"ex":"現金及び預金→受取手形→売掛金→有価証券→棚卸資産の順。","p":"22"},{"ch":2,"sec":"3 表示のルール②（配列と原則）","k":"記述","q":"資産と負債を相殺せず、総額で表示するという原則は？","a":"総額主義の原則","y":"そうがくしゅぎのげんそく","alt":["そうがくしゅぎ"],"o":[],"ex":"相殺すると資金の調達と運用の関係がわからなくなるため。","p":"23"},{"ch":2,"sec":"3 表示のルール②（配列と原則）","k":"記述","q":"重要でない項目は、簡便な方法で処理・表示してよいという原則は？","a":"重要性の原則","y":"じゅうようせいのげんそく","alt":[],"o":[],"ex":"重要なものは詳しく、重要でないものはまとめて簡潔に表示できる。","p":"23"},{"ch":2,"sec":"4 資産とは","k":"穴うめ","q":"固定資産は、有形固定資産、無形固定資産、【投資その他の資産】の3つに分かれる","a":"投資その他の資産","y":"こていしさんは、ゆうけいこていしさん、むけいこていしさん、【とうしそのたのしさん】の3つにわかれる","alt":[],"o":[],"ex":"この3区分のどこに入るかがよく問われる。","p":"24"},{"ch":2,"sec":"4 資産とは","k":"記述","q":"生産や販売など、本来の営業活動に使う資産（事業用資産）の評価基準は？","a":"取得原価","y":"しゅとくげんか","alt":[],"o":[],"ex":"取得したときに支払った金額。客観的で信頼性が高い。","p":"25"},{"ch":2,"sec":"4 資産とは","k":"記述","q":"余剰資金の運用のために持っている資産を何という？","a":"金融資産","y":"きんゆうしさん","alt":[],"o":[],"ex":"金融資産は時価で評価する。","p":"25"},{"ch":2,"sec":"4 資産とは","k":"4択","q":"金融資産の原則的な評価基準は？","a":"時価","y":"じか","alt":[],"o":[["取得原価","しゅとくげんか"],["帳簿価額","ちょうぼかがく"],["残存価額","ざんぞんかがく"]],"ex":"期末時点の市場価格を反映できるのが長所。","p":"25"},{"ch":2,"sec":"4 資産とは","k":"穴うめ","q":"売買目的有価証券は、金融資産なので【時価】で評価される","a":"時価","y":"ばいばいもくてきゆうかしょうけんは、きんゆうしさんなので【じか】でひょうかされる","alt":[],"o":[],"ex":"3級では「売買目的有価証券＝時価」をおさえておけばよい。","p":"25"},{"ch":2,"sec":"5 流動資産","k":"記述","q":"商品・サービスを販売した代金のうち、まだ受け取っていない額は？","a":"売掛金","y":"うりかけきん","alt":[],"o":[],"ex":"本業の販売代金の未回収分。","p":"26"},{"ch":2,"sec":"5 流動資産","k":"記述","q":"土地の売却など、本業以外の取引から生じた代金の未回収額は？","a":"未収入金","y":"みしゅうにゅうきん","alt":["みしゅうきん"],"o":[],"ex":"未収金ともいう。本業の売上代金なら売掛金。","p":"26"},{"ch":2,"sec":"5 流動資産","k":"記述","q":"商品や原材料を買うために、先に支払った代金は？","a":"前渡金","y":"まえわたしきん","alt":["まえばらいきん"],"o":[],"ex":"前払金とも呼ばれる。流動資産。","p":"26"},{"ch":2,"sec":"5 流動資産","k":"記述","q":"家賃など、続けて受けるサービスの代金のうち、まだ受けていない分を先に払ったものは？","a":"前払費用","y":"まえばらいひよう","alt":[],"o":[],"ex":"決算日から1年を超える分は長期前払費用（投資その他の資産）。","p":"26"},{"ch":2,"sec":"5 流動資産","k":"記述","q":"サービスを提供済みだが、まだ対価を受け取っていない分（貸付金の利息など）は？","a":"未収収益","y":"みしゅうしゅうえき","alt":[],"o":[],"ex":"流動資産。前受収益（負債）と混同しないこと。","p":"26"},{"ch":2,"sec":"5 流動資産","k":"記述","q":"でんさいネットを通じて回収する、販売代金の債権は？","a":"電子記録債権","y":"でんしきろくさいけん","alt":[],"o":[],"ex":"手形にかわる新しい決済手段。","p":"26"},{"ch":2,"sec":"5 流動資産","k":"記述","q":"商品・製品・仕掛品・貯蔵品・原材料をまとめて何という？","a":"棚卸資産","y":"たなおろししさん","alt":[],"o":[],"ex":"販売や製造のために持っている資産の総称。","p":"27"},{"ch":2,"sec":"5 流動資産","k":"記述","q":"製造業で、販売するために製造している途中の未完成品は？","a":"仕掛品","y":"しかかりひん","alt":[],"o":[],"ex":"完成すると製品になる。","p":"26"},{"ch":2,"sec":"5 流動資産","k":"記述","q":"消耗工具や切手、印紙など、まだ使っていない物品は？","a":"貯蔵品","y":"ちょぞうひん","alt":[],"o":[],"ex":"棚卸資産に含まれる。","p":"26"},{"ch":2,"sec":"5 流動資産","k":"記述","q":"顧客に財やサービスを渡したことで得た、対価への権利（債権を除く）は？","a":"契約資産","y":"けいやくしさん","alt":[],"o":[],"ex":"請求できるようになったら売掛金に振り替える。","p":"26"},{"ch":2,"sec":"5 流動資産","k":"4択","q":"決算日から1年以内に満期が来る、満期保有目的の債券の区分は？","a":"流動資産","y":"りゅうどうしさん","alt":[],"o":[["投資その他の資産","とうしそのたのしさん"],["有形固定資産","ゆうけいこていしさん"],["無形固定資産","むけいこていしさん"]],"ex":"1年以内なら流動資産（有価証券）、1年超なら投資その他の資産（投資有価証券）。","p":"27"},{"ch":2,"sec":"5 流動資産","k":"4択","q":"子会社株式・関連会社株式は、どの区分？","a":"投資その他の資産","y":"とうしそのたのしさん","alt":[],"o":[["流動資産","りゅうどうしさん"],["株主資本","かぶぬししほん"],["無形固定資産","むけいこていしさん"]],"ex":"売ることが目的ではないので固定資産（投資その他の資産）。","p":"27"},{"ch":2,"sec":"6 固定資産①","k":"記述","q":"建物などを建設中に支払った金額を、完成まで集めておく科目は？","a":"建設仮勘定","y":"けんせつかりかんじょう","alt":[],"o":[],"ex":"完成したら「建物」などに振り替える。有形固定資産。","p":"28"},{"ch":2,"sec":"6 固定資産①","k":"4択","q":"建設仮勘定は、どの区分？","a":"有形固定資産","y":"ゆうけいこていしさん","alt":[],"o":[["無形固定資産","むけいこていしさん"],["投資その他の資産","とうしそのたのしさん"],["繰延資産","くりのべしさん"]],"ex":"形のある資産をつくるための支出なので有形固定資産。","p":"28"},{"ch":2,"sec":"6 固定資産①","k":"4択","q":"次のうち、有形固定資産はどれ？","a":"土地","y":"とち","alt":[],"o":[["特許権","とっきょけん"],["投資有価証券","とうしゆうかしょうけん"],["開発費","かいはつひ"]],"ex":"特許権は無形固定資産、投資有価証券は投資その他の資産、開発費は繰延資産。","p":"28"},{"ch":2,"sec":"6 固定資産①","k":"4択","q":"次のうち、無形固定資産はどれ？","a":"商標権","y":"しょうひょうけん","alt":[],"o":[["建設仮勘定","けんせつかりかんじょう"],["長期前払費用","ちょうきまえばらいひよう"],["創立費","そうりつひ"]],"ex":"建設仮勘定は有形固定資産、長期前払費用は投資その他の資産、創立費は繰延資産。","p":"29"},{"ch":2,"sec":"6 固定資産①","k":"4択","q":"ソフトウェアは、どの区分？","a":"無形固定資産","y":"むけいこていしさん","alt":[],"o":[["有形固定資産","ゆうけいこていしさん"],["繰延資産","くりのべしさん"],["投資その他の資産","とうしそのたのしさん"]],"ex":"特許権・商標権・のれんと同じく形のない資産。","p":"29"},{"ch":2,"sec":"6 固定資産①","k":"記述","q":"他の会社の事業を譲り受けたとき、受け入れた純資産の額を超えて支払った部分は？","a":"のれん","y":"のれん","alt":[],"o":[],"ex":"将来の稼ぐ力（超過収益力）への支払い。無形固定資産。","p":"29"},{"ch":2,"sec":"6 固定資産①","k":"記述","q":"長期保有を目的とする有価証券を表示する科目は？","a":"投資有価証券","y":"とうしゆうかしょうけん","alt":[],"o":[],"ex":"投資その他の資産に表示される。","p":"29"},{"ch":2,"sec":"6 固定資産①","k":"記述","q":"決算日から1年を超えて回収期限が来る貸付金は？","a":"長期貸付金","y":"ちょうきかしつけきん","alt":[],"o":[],"ex":"ワンイヤールールで固定資産（投資その他の資産）。","p":"29"},{"ch":2,"sec":"6 固定資産①","k":"4択","q":"長期前払費用は、どの区分？","a":"投資その他の資産","y":"とうしそのたのしさん","alt":[],"o":[["流動資産","りゅうどうしさん"],["固定負債","こていふさい"],["繰延資産","くりのべしさん"]],"ex":"「費用」とつくが負債ではない。1年を超える前払分なので固定資産。","p":"29"},{"ch":2,"sec":"7 固定資産②（減価償却）","k":"記述","q":"使用や時間の経過による価値の下落を、その期の費用として配分した額は？","a":"減価償却費","y":"げんかしょうきゃくひ","alt":[],"o":[],"ex":"有形・無形固定資産の価値の下落を費用にしたもの。","p":"30"},{"ch":2,"sec":"7 固定資産②（減価償却）","k":"記述","q":"取得してから今までの減価償却費を合計した額は？","a":"減価償却累計額","y":"げんかしょうきゃくるいけいがく","alt":[],"o":[],"ex":"取得原価からこれを引いたものが帳簿価額。","p":"30"},{"ch":2,"sec":"7 固定資産②（減価償却）","k":"穴うめ","q":"帳簿価額は、取得原価から【減価償却累計額】を差し引いた額である","a":"減価償却累計額","y":"ちょうぼかがくは、しゅとくげんかから【げんかしょうきゃくるいけいがく】をさしひいたがくである","alt":[],"o":[],"ex":"取得原価−減価償却累計額＝帳簿価額。","p":"31"},{"ch":2,"sec":"7 固定資産②（減価償却）","k":"4択","q":"毎年同じ額ずつ減価償却費が発生する方法は？","a":"定額法","y":"ていがくほう","alt":[],"o":[["定率法","ていりつほう"],["流動性配列法","りゅうどうせいはいれつほう"],["総額主義","そうがくしゅぎ"]],"ex":"（取得原価−残存価額）÷耐用年数で計算する。","p":"30"},{"ch":2,"sec":"7 固定資産②（減価償却）","k":"4択","q":"最初の年の減価償却費が大きく、年々小さくなっていく方法は？","a":"定率法","y":"ていりつほう","alt":[],"o":[["定額法","ていがくほう"],["重要性の原則","じゅうようせいのげんそく"],["取得原価","しゅとくげんか"]],"ex":"期首の帳簿価額×償却率で計算するため、だんだん小さくなる。","p":"31"},{"ch":2,"sec":"7 固定資産②（減価償却）","k":"4択","q":"次のうち、減価償却を行わない資産はどれ？","a":"土地","y":"とち","alt":[],"o":[["建物","たてもの"],["機械装置","きかいそうち"],["車両運搬具","しゃりょううんぱんぐ"]],"ex":"土地は使っても価値が減らないと考えるため、減価償却しない。","p":"28"},{"ch":2,"sec":"7 固定資産②（減価償却）","k":"穴うめ","q":"無形固定資産は、減価償却累計額を【直接控除】した残高だけが表示される","a":"直接控除","y":"むけいこていしさんは、げんかしょうきゃくるいけいがくを【ちょくせつこうじょ】したざんだかだけがひょうじされる","alt":[],"o":[],"ex":"有形固定資産は「両建て」と「直接控除＋注記」の2つの表示方法がある。","p":"31"},{"ch":2,"sec":"7 固定資産②（減価償却）","k":"計算","q":"取得原価1,000、残存価額0、耐用年数5年。定額法で1年分の減価償却費はいくら？","a":"200","y":"200","alt":[],"o":[],"ex":"（1,000−0）÷5年＝200","p":"30"},{"ch":2,"sec":"7 固定資産②（減価償却）","k":"計算","q":"取得原価900、残存価額100、耐用年数4年。定額法で1年分の減価償却費はいくら？","a":"200","y":"200","alt":[],"o":[],"ex":"（900−100）÷4年＝200。残存価額を先に引くのを忘れずに。","p":"30"},{"ch":2,"sec":"7 固定資産②（減価償却）","k":"計算","q":"期首の帳簿価額800、償却率0.25。定率法で当期の減価償却費はいくら？","a":"200","y":"200","alt":[],"o":[],"ex":"800×0.25＝200","p":"30"},{"ch":2,"sec":"7 固定資産②（減価償却）","k":"計算","q":"機械装置の取得原価1,000、減価償却累計額300。帳簿価額はいくら？","a":"700","y":"700","alt":[],"o":[],"ex":"1,000−300＝700","p":"31"},{"ch":2,"sec":"8 繰延資産","k":"記述","q":"会社を設立するためにかかった費用は？","a":"創立費","y":"そうりつひ","alt":[],"o":[],"ex":"繰延資産の1つ。","p":"33"},{"ch":2,"sec":"8 繰延資産","k":"記述","q":"会社の設立後、営業を始めるまでの準備にかかった費用は？","a":"開業費","y":"かいぎょうひ","alt":[],"o":[],"ex":"繰延資産の1つ。","p":"33"},{"ch":2,"sec":"8 繰延資産","k":"記述","q":"新技術の採用や市場の開拓などのためにかかった費用は？","a":"開発費","y":"かいはつひ","alt":[],"o":[],"ex":"繰延資産の1つ。","p":"33"},{"ch":2,"sec":"8 繰延資産","k":"穴うめ","q":"支出の効果が将来にわたって現れるため、いったん資産にしたものを【繰延資産】という","a":"繰延資産","y":"ししゅつのこうかがしょうらいにわたってあらわれるため、いったんしさんにしたものを【くりのべしさん】という","alt":[],"o":[],"ex":"効果が出る期間の費用として配分するために資産に計上する。定義の穴うめで問われやすい。","p":"32"},{"ch":2,"sec":"9 負債とは","k":"記述","q":"商品の仕入代金のうち、まだ支払っていない額は？","a":"買掛金","y":"かいかけきん","alt":[],"o":[],"ex":"仕入以外の取引による未払いは未払金。","p":"34"},{"ch":2,"sec":"9 負債とは","k":"記述","q":"有価証券の購入など、仕入以外の取引から生じた未払額は？","a":"未払金","y":"みばらいきん","alt":[],"o":[],"ex":"仕入代金の未払いなら買掛金。","p":"34"},{"ch":2,"sec":"9 負債とは","k":"記述","q":"商品を引き渡す前に、前もって受け取った代金は？","a":"前受金","y":"まえうけきん","alt":["けいやくふさい"],"o":[],"ex":"契約負債ともいう。売掛金ではない。","p":"34"},{"ch":2,"sec":"9 負債とは","k":"記述","q":"従業員の給料から差し引いて、一時的に預かっている社会保険料などは？","a":"預り金","y":"あずかりきん","alt":[],"o":[],"ex":"流動負債。","p":"34"},{"ch":2,"sec":"9 負債とは","k":"記述","q":"続けて行うサービスのうち、まだ提供していない期間の分を先に受け取った対価は？","a":"前受収益","y":"まえうけしゅうえき","alt":[],"o":[],"ex":"流動負債。未収収益（資産）と区別すること。","p":"34"},{"ch":2,"sec":"9 負債とは","k":"記述","q":"続けて受けるサービスのうち、受けた分の代金をまだ支払っていないものは？","a":"未払費用","y":"みばらいひよう","alt":[],"o":[],"ex":"流動負債。前払費用（資産）と区別すること。","p":"34"},{"ch":2,"sec":"9 負債とは","k":"記述","q":"法人税、住民税及び事業税のうち、まだ支払っていない額は？","a":"未払法人税等","y":"みばらいほうじんぜいとう","alt":[],"o":[],"ex":"流動負債。","p":"34"},{"ch":2,"sec":"9 負債とは","k":"4択","q":"次のうち、流動負債はどれ？","a":"預り金","y":"あずかりきん","alt":[],"o":[["前渡金","まえわたしきん"],["長期借入金","ちょうきかりいれきん"],["退職給付引当金","たいしょくきゅうふひきあてきん"]],"ex":"前渡金は流動資産、長期借入金と退職給付引当金は固定負債。","p":"34"},{"ch":2,"sec":"9 負債とは","k":"4択","q":"決算日から1年以内に償還期限が来る社債は、どの区分？","a":"流動負債","y":"りゅうどうふさい","alt":[],"o":[["固定負債","こていふさい"],["投資その他の資産","とうしそのたのしさん"],["株主資本","かぶぬししほん"]],"ex":"ワンイヤールールで流動負債（1年以内償還の社債）。1年超なら固定負債。","p":"34"},{"ch":2,"sec":"9 負債とは","k":"4択","q":"退職給付引当金は、どの区分？","a":"固定負債","y":"こていふさい","alt":[],"o":[["流動負債","りゅうどうふさい"],["株主資本","かぶぬししほん"],["評価・換算差額等","ひょうかかんさんさがくとう"]],"ex":"将来の退職金に備えるもので、長期の負債。","p":"35"},{"ch":2,"sec":"9 負債とは","k":"記述","q":"将来の賞与の支給に備えて、当期の負担分を計上する引当金は？","a":"賞与引当金","y":"しょうよひきあてきん","alt":[],"o":[],"ex":"流動負債の引当金。","p":"35"},{"ch":2,"sec":"9 負債とは","k":"記述","q":"将来のアフターサービスの支出に備えて計上する引当金は？","a":"製品保証引当金","y":"せいひんほしょうひきあてきん","alt":[],"o":[],"ex":"流動負債の引当金。","p":"35"},{"ch":2,"sec":"9 負債とは","k":"穴うめ","q":"引当金の条件の1つは、費用や損失が発生する【可能性が高い】ことである","a":"可能性が高い","y":"ひきあてきんのじょうけんの1つは、ひようやそんしつがはっせいする【かのうせいがたかい】ことである","alt":[],"o":[],"ex":"4つの条件：将来の特定の費用・損失／原因が当期以前／発生の可能性が高い／金額を合理的に見積もれる。","p":"35"},{"ch":2,"sec":"9 負債とは","k":"計算","q":"支払手形80、未払法人税等20、前受金15、長期借入金50、未収入金30。流動負債の合計はいくら？","a":"115","y":"115","alt":[],"o":[],"ex":"80＋20＋15＝115。長期借入金は固定負債、未収入金は資産。","p":"34"},{"ch":2,"sec":"10 純資産とは","k":"穴うめ","q":"純資産は、株主資本、評価・換算差額等、株式引受権、【新株予約権】の4つに分かれる","a":"新株予約権","y":"じゅんしさんは、かぶぬししほん、ひょうかかんさんさがくとう、かぶしきひきうけけん、【しんかぶよやくけん】の4つにわかれる","alt":[],"o":[],"ex":"株主資本は資本金・資本剰余金・利益剰余金・自己株式からなる。","p":"36"},{"ch":2,"sec":"10 純資産とは","k":"記述","q":"会社が自社の株式を買い戻して持っているものは？","a":"自己株式","y":"じこかぶしき","alt":["きんこかぶ"],"o":[],"ex":"金庫株ともいう。株主資本のマイナス項目。","p":"37"},{"ch":2,"sec":"10 純資産とは","k":"4択","q":"自己株式は、貸借対照表でどう表示される？","a":"株主資本から控除","y":"かぶぬししほんからこうじょ","alt":[],"o":[["投資その他の資産","とうしそのたのしさん"],["流動資産","りゅうどうしさん"],["固定負債","こていふさい"]],"ex":"実質的には出資の払い戻しなので、株主資本のマイナスとして表示する。","p":"37"},{"ch":2,"sec":"10 純資産とは","k":"記述","q":"株主資本のうち、株主が出資した部分を性質上何という？","a":"払込資本","y":"はらいこみしほん","alt":[],"o":[],"ex":"表示上は資本金と資本剰余金。","p":"37"},{"ch":2,"sec":"10 純資産とは","k":"記述","q":"株主資本のうち、出資をもとに会社が稼いで増やした部分を性質上何という？","a":"留保利益","y":"りゅうほりえき","alt":[],"o":[],"ex":"表示上は利益剰余金。","p":"37"},{"ch":2,"sec":"10 純資産とは","k":"記述","q":"あらかじめ決められた価格で、会社から株式を受け取れる権利は？","a":"新株予約権","y":"しんかぶよやくけん","alt":[],"o":[],"ex":"ストックオプションなど。株主資本とは別に表示する。","p":"37"},{"ch":2,"sec":"10 純資産とは","k":"4択","q":"その他有価証券評価差額金は、純資産のどの区分？","a":"評価・換算差額等","y":"ひょうかかんさんさがくとう","alt":[],"o":[["株主資本","かぶぬししほん"],["新株予約権","しんかぶよやくけん"],["固定負債","こていふさい"]],"ex":"時価との差額のうち、損益に含めないもの。株主資本ではない。","p":"37"},{"ch":2,"sec":"10 純資産とは","k":"穴うめ","q":"出資された額のうち【2分の1】を超えない額は、資本金にしないで資本準備金にできる","a":"2分の1","y":"しゅっしされたがくのうち【にぶんのいち】をこえないがくは、しほんきんにしないでしほんじゅんびきんにできる","alt":[],"o":[],"ex":"資本準備金は資本剰余金の内訳として表示される。","p":"38"},{"ch":2,"sec":"10 純資産とは","k":"計算","q":"資本金500、資本剰余金200、利益剰余金350、自己株式△40、その他有価証券評価差額金20。株主資本はいくら？","a":"1,010","y":"1010","alt":[],"o":[],"ex":"500＋200＋350−40＝1,010。評価差額金は株主資本に入らない。","p":"36"},{"ch":2,"sec":"10 純資産とは","k":"計算","q":"資産合計2,000、負債合計1,200。純資産合計はいくら？","a":"800","y":"800","alt":[],"o":[],"ex":"資産合計−負債合計＝純資産合計","p":"19"},{"ch":2,"sec":"総合（区分の集計）","k":"計算","q":"現金及び預金120、売掛金80、商品60、前払費用10、建物300、長期貸付金40。流動資産の合計はいくら？","a":"270","y":"270","alt":[],"o":[],"ex":"120＋80＋60＋10＝270。建物と長期貸付金は固定資産。","p":"26"},{"ch":2,"sec":"総合（区分の集計）","k":"計算","q":"建物300、土地200、建設仮勘定50、ソフトウェア40、投資有価証券100。有形固定資産の合計はいくら？","a":"550","y":"550","alt":[],"o":[],"ex":"300＋200＋50＝550。ソフトウェアは無形、投資有価証券は投資その他の資産。","p":"28"},{"ch":2,"sec":"総合（区分の集計）","k":"計算","q":"特許権30、のれん20、建設仮勘定25、開発費15、商標権10。無形固定資産の合計はいくら？","a":"60","y":"60","alt":[],"o":[],"ex":"30＋20＋10＝60。建設仮勘定は有形、開発費は繰延資産。","p":"29"},{"ch":3,"sec":"1 損益計算書のしくみ","k":"穴うめ","q":"利益は、収益から【費用】を差し引いて計算する","a":"費用","y":"りえきは、しゅうえきから【ひよう】をさしひいてけいさんする","alt":[],"o":[],"ex":"費用が収益より大きいときは損失になる。","p":"44"},{"ch":3,"sec":"1 損益計算書のしくみ","k":"穴うめ","q":"売上総利益は、売上高から【売上原価】を差し引いたもの","a":"売上原価","y":"うりあげそうりえきは、うりあげだかから【うりあげげんか】をさしひいたもの","alt":[],"o":[],"ex":"商品の販売による利ざやを表す。","p":"46"},{"ch":3,"sec":"1 損益計算書のしくみ","k":"穴うめ","q":"営業利益は、売上総利益から【販売費及び一般管理費】を差し引いたもの","a":"販売費及び一般管理費","y":"えいぎょうりえきは、うりあげそうりえきから【はんばいひおよびいっぱんかんりひ】をさしひいたもの","alt":[],"o":[],"ex":"本業による利益を表す。","p":"46"},{"ch":3,"sec":"1 損益計算書のしくみ","k":"穴うめ","q":"経常利益は、営業利益に営業外収益を加え、【営業外費用】を差し引いたもの","a":"営業外費用","y":"けいじょうりえきは、えいぎょうりえきにえいぎょうがいしゅうえきをくわえ、【えいぎょうがいひよう】をさしひいたもの","alt":[],"o":[],"ex":"資金の調達・運用も含めた経営努力の成果を表す。","p":"46"},{"ch":3,"sec":"1 損益計算書のしくみ","k":"穴うめ","q":"税引前当期純利益は、経常利益に特別利益を加え、【特別損失】を差し引いたもの","a":"特別損失","y":"ぜいびきまえとうきじゅんりえきは、けいじょうりえきにとくべつりえきをくわえ、【とくべつそんしつ】をさしひいたもの","alt":[],"o":[],"ex":"臨時の要因を加味した利益。","p":"46"},{"ch":3,"sec":"1 損益計算書のしくみ","k":"記述","q":"本業による利益を表すのは、5段階の利益のうちどれ？","a":"営業利益","y":"えいぎょうりえき","alt":[],"o":[],"ex":"売上総利益−販売費及び一般管理費。","p":"46"},{"ch":3,"sec":"1 損益計算書のしくみ","k":"記述","q":"資金の調達・運用も含めた「経営努力の成果」を表し、一般にもっとも重視される利益は？","a":"経常利益","y":"けいじょうりえき","alt":[],"o":[],"ex":"営業利益＋営業外収益−営業外費用。","p":"54"},{"ch":3,"sec":"1 損益計算書のしくみ","k":"記述","q":"法人税等を差し引いた後の、その期間の最終的な利益は？","a":"当期純利益","y":"とうきじゅんりえき","alt":[],"o":[],"ex":"税引前当期純利益−（法人税等＋法人税等調整額）。","p":"58"},{"ch":3,"sec":"1 損益計算書のしくみ","k":"4択","q":"5段階の利益のうち、売上総利益の次に表示される利益は？","a":"営業利益","y":"えいぎょうりえき","alt":[],"o":[["経常利益","けいじょうりえき"],["当期純利益","とうきじゅんりえき"],["税引前当期純利益","ぜいびきまえとうきじゅんりえき"]],"ex":"売上総利益→営業利益→経常利益→税引前当期純利益→当期純利益の順。","p":"46"},{"ch":3,"sec":"1 損益計算書のしくみ","k":"記述","q":"売上総利益の別名は？","a":"粗利益","y":"あらりえき","alt":["あらり"],"o":[],"ex":"「粗利（あらり）」ともいう。","p":"51"},{"ch":3,"sec":"1 損益計算書のしくみ","k":"4択","q":"収益を左側、費用を右側に並べる損益計算書の様式は？","a":"勘定式","y":"かんじょうしき","alt":[],"o":[["報告式","ほうこくしき"],["流動性配列法","りゅうどうせいはいれつほう"],["固定性配列法","こていせいはいれつほう"]],"ex":"一般的には上から順に並べる報告式が使われる。","p":"47"},{"ch":3,"sec":"2 損益計算のルール","k":"記述","q":"収益は、対価の受け取りが確実になった時点で計上するという原則は？","a":"実現主義の原則","y":"じつげんしゅぎのげんそく","alt":["じつげんしゅぎ"],"o":[],"ex":"商品を引き渡したときに計上するので「販売基準」ともいう。","p":"48"},{"ch":3,"sec":"2 損益計算のルール","k":"記述","q":"費用は、財やサービスを使って経済的価値を消費した時点で計上するという原則は？","a":"発生主義の原則","y":"はっせいしゅぎのげんそく","alt":["はっせいしゅぎ"],"o":[],"ex":"現金の受け払いとは関係なく、価値の消費で計上する。","p":"48"},{"ch":3,"sec":"2 損益計算のルール","k":"記述","q":"実現した収益に、発生した費用を対応させて利益を計算するという原則は？","a":"費用収益対応の原則","y":"ひようしゅうえきたいおうのげんそく","alt":[],"o":[],"ex":"収益は実現主義、それに対応する費用は発生主義で計上する。","p":"49"},{"ch":3,"sec":"2 損益計算のルール","k":"4択","q":"費用は、どの考え方で計上する？","a":"発生主義","y":"はっせいしゅぎ","alt":[],"o":[["実現主義","じつげんしゅぎ"],["現金主義","げんきんしゅぎ"],["総額主義","そうがくしゅぎ"]],"ex":"収益は実現主義、費用は発生主義。入れかえたひっかけがよく出る。","p":"48"},{"ch":3,"sec":"2 損益計算のルール","k":"4択","q":"売上高と売上原価のように、対応関係が個別にわかるものは？","a":"個別的対応","y":"こべつてきたいおう","alt":[],"o":[["期間的対応","きかんてきたいおう"],["実現主義","じつげんしゅぎ"],["総額主義","そうがくしゅぎ"]],"ex":"売上高と販売費及び一般管理費は期間的対応。","p":"49"},{"ch":3,"sec":"2 損益計算のルール","k":"4択","q":"売上高と販売費及び一般管理費の対応関係は？","a":"期間的対応","y":"きかんてきたいおう","alt":[],"o":[["個別的対応","こべつてきたいおう"],["発生主義","はっせいしゅぎ"],["重要性の原則","じゅうようせいのげんそく"]],"ex":"直接の関係はないが、同じ期間で対応させる。受取利息と支払利息も期間的対応。","p":"49"},{"ch":3,"sec":"3 売上総利益と売上原価","k":"穴うめ","q":"商業の売上原価は、期首商品棚卸高に当期商品仕入高を足し、【期末商品棚卸高】を引いて求める","a":"期末商品棚卸高","y":"しょうぎょうのうりあげげんかは、きしゅしょうひんたなおろしだかにとうきしょうひんしいれだかをたし、【きまつしょうひんたなおろしだか】をひいてもとめる","alt":[],"o":[],"ex":"仕入高そのものではなく、販売した分だけが売上原価になる。","p":"51"},{"ch":3,"sec":"3 売上総利益と売上原価","k":"記述","q":"製造業の売上原価の計算で、商業の「当期商品仕入高」にあたるものは？","a":"当期製品製造原価","y":"とうきせいひんせいぞうげんか","alt":[],"o":[],"ex":"期首製品棚卸高＋当期製品製造原価−期末製品棚卸高。","p":"51"},{"ch":3,"sec":"3 売上総利益と売上原価","k":"計算","q":"期首商品棚卸高100、当期商品仕入高800、期末商品棚卸高150。売上原価はいくら？","a":"750","y":"750","alt":[],"o":[],"ex":"100＋800−150＝750","p":"51"},{"ch":3,"sec":"3 売上総利益と売上原価","k":"計算","q":"売上高1,000、売上原価650。売上総利益はいくら？","a":"350","y":"350","alt":[],"o":[],"ex":"1,000−650＝350","p":"50"},{"ch":3,"sec":"3 売上総利益と売上原価","k":"計算","q":"売上高3,000、売上総利益1,200、期首商品棚卸高400、当期商品仕入高2,000。期末商品棚卸高はいくら？","a":"600","y":"600","alt":[],"o":[],"ex":"売上原価＝3,000−1,200＝1,800。期末＝400＋2,000−1,800＝600。","p":"51"},{"ch":3,"sec":"4 販売費及び一般管理費","k":"4択","q":"次のうち、販売費及び一般管理費に入るものはどれ？","a":"広告宣伝費","y":"こうこくせんでんひ","alt":[],"o":[["支払利息","しはらいりそく"],["減損損失","げんそんそんしつ"],["災害損失","さいがいそんしつ"]],"ex":"支払利息は営業外費用、減損損失・災害損失は特別損失。","p":"53"},{"ch":3,"sec":"4 販売費及び一般管理費","k":"4択","q":"次のうち、販売費及び一般管理費に入るものはどれ？","a":"研究開発費","y":"けんきゅうかいはつひ","alt":[],"o":[["社債利息","しゃさいりそく"],["有価証券評価損","ゆうかしょうけんひょうかそん"],["固定資産売却損","こていしさんばいきゃくそん"]],"ex":"研究開発費は販管費。社債利息と有価証券評価損は営業外費用、固定資産売却損は特別損失。","p":"53"},{"ch":3,"sec":"4 販売費及び一般管理費","k":"記述","q":"固定資産税や印紙税など、もうけに関係なくかかる税金を表す科目は？","a":"租税公課","y":"そぜいこうか","alt":[],"o":[],"ex":"販売費及び一般管理費に入る。もうけにかかる税金は「法人税、住民税及び事業税」。","p":"53"},{"ch":3,"sec":"4 販売費及び一般管理費","k":"記述","q":"売掛金などのうち、回収できないと見込まれる額を費用にしたものは？","a":"貸倒引当金繰入額","y":"かしだおれひきあてきんくりいれがく","alt":[],"o":[],"ex":"販売費及び一般管理費に入る。","p":"53"},{"ch":3,"sec":"4 販売費及び一般管理費","k":"計算","q":"売上総利益900、給料200、広告宣伝費80、減価償却費70、支払利息30。営業利益はいくら？","a":"550","y":"550","alt":[],"o":[],"ex":"900−（200＋80＋70）＝550。支払利息は営業外費用なので引かない。","p":"52"},{"ch":3,"sec":"5 営業外収益・営業外費用","k":"4択","q":"次のうち、営業外収益はどれ？","a":"受取配当金","y":"うけとりはいとうきん","alt":[],"o":[["固定資産売却益","こていしさんばいきゃくえき"],["投資有価証券売却益","とうしゆうかしょうけんばいきゃくえき"],["売上高","うりあげだか"]],"ex":"固定資産売却益と投資有価証券売却益は特別利益、売上高は営業収益。","p":"55"},{"ch":3,"sec":"5 営業外収益・営業外費用","k":"記述","q":"自社が発行した社債に対して支払う利息は？","a":"社債利息","y":"しゃさいりそく","alt":[],"o":[],"ex":"営業外費用。持っている他社の社債から受け取るのは有価証券利息（営業外収益）。","p":"55"},{"ch":3,"sec":"5 営業外収益・営業外費用","k":"記述","q":"持っている株式から受け取る配当金は？","a":"受取配当金","y":"うけとりはいとうきん","alt":[],"o":[],"ex":"営業外収益。","p":"55"},{"ch":3,"sec":"5 営業外収益・営業外費用","k":"記述","q":"借入金にともなって支払う利息は？","a":"支払利息","y":"しはらいりそく","alt":[],"o":[],"ex":"営業外費用。","p":"55"},{"ch":3,"sec":"5 営業外収益・営業外費用","k":"4択","q":"売買目的有価証券の評価損は、どの区分？","a":"営業外費用","y":"えいぎょうがいひよう","alt":[],"o":[["特別損失","とくべつそんしつ"],["販売費及び一般管理費","はんばいひおよびいっぱんかんりひ"],["売上原価","うりあげげんか"]],"ex":"有価証券（売買目的）の売却損益・評価損益は営業外。投資有価証券の売却損益は特別損益。","p":"55"},{"ch":3,"sec":"5 営業外収益・営業外費用","k":"記述","q":"少額で、区分して表示するほど重要でない営業外の収益をまとめたものは？","a":"雑収入","y":"ざっしゅうにゅう","alt":[],"o":[],"ex":"費用のほうは雑支出（雑損失）。","p":"55"},{"ch":3,"sec":"5 営業外収益・営業外費用","k":"計算","q":"営業利益500、受取利息30、受取配当金20、支払利息40、固定資産売却益60。経常利益はいくら？","a":"510","y":"510","alt":[],"o":[],"ex":"500＋30＋20−40＝510。固定資産売却益は特別利益なので入れない。","p":"54"},{"ch":3,"sec":"6 特別利益・特別損失","k":"記述","q":"固定資産を売って得た利益は、何という科目？","a":"固定資産売却益","y":"こていしさんばいきゃくえき","alt":[],"o":[],"ex":"特別利益。","p":"57"},{"ch":3,"sec":"6 特別利益・特別損失","k":"記述","q":"固定資産の収益性が大きく下がったときに計上する評価損は？","a":"減損損失","y":"げんそんそんしつ","alt":[],"o":[],"ex":"特別損失。","p":"57"},{"ch":3,"sec":"6 特別利益・特別損失","k":"記述","q":"火災や地震などの災害による損失は？","a":"災害損失","y":"さいがいそんしつ","alt":[],"o":[],"ex":"特別損失。","p":"57"},{"ch":3,"sec":"6 特別利益・特別損失","k":"4択","q":"投資有価証券売却益は、どの区分？","a":"特別利益","y":"とくべつりえき","alt":[],"o":[["営業外収益","えいぎょうがいしゅうえき"],["売上高","うりあげだか"],["評価・換算差額等","ひょうかかんさんさがくとう"]],"ex":"売買目的以外の有価証券の売却益は臨時的なので特別利益。","p":"57"},{"ch":3,"sec":"6 特別利益・特別損失","k":"4択","q":"次のうち、特別損失はどれ？","a":"固定資産売却損","y":"こていしさんばいきゃくそん","alt":[],"o":[["社債利息","しゃさいりそく"],["有価証券売却損","ゆうかしょうけんばいきゃくそん"],["租税公課","そぜいこうか"]],"ex":"社債利息と有価証券売却損は営業外費用、租税公課は販管費。","p":"57"},{"ch":3,"sec":"6 特別利益・特別損失","k":"計算","q":"経常利益400、固定資産売却益50、減損損失80、災害損失20。税引前当期純利益はいくら？","a":"350","y":"350","alt":[],"o":[],"ex":"400＋50−80−20＝350","p":"56"},{"ch":3,"sec":"7 当期純利益と法人税等","k":"記述","q":"法人税、住民税及び事業税をまとめて何という？","a":"法人税等","y":"ほうじんぜいとう","alt":[],"o":[],"ex":"税引前当期純利益から差し引く。販管費には入れない。","p":"58"},{"ch":3,"sec":"7 当期純利益と法人税等","k":"記述","q":"税効果会計で、損益計算書の税負担を税引前当期純利益に合うよう調整する項目は？","a":"法人税等調整額","y":"ほうじんぜいとうちょうせいがく","alt":[],"o":[],"ex":"当期純利益＝税引前当期純利益−（法人税等＋法人税等調整額）。","p":"58"},{"ch":3,"sec":"7 当期純利益と法人税等","k":"記述","q":"会計の利益と税法の所得のズレを調整し、税負担を利益に対応させる会計処理は？","a":"税効果会計","y":"ぜいこうかかいけい","alt":[],"o":[],"ex":"その結果、貸借対照表に繰延税金資産・繰延税金負債が出てくる。","p":"58"},{"ch":3,"sec":"7 当期純利益と法人税等","k":"計算","q":"税引前当期純利益1,000、法人税等320、法人税等調整額△20（マイナス）。当期純利益はいくら？","a":"700","y":"700","alt":[],"o":[],"ex":"1,000−（320−20）＝700","p":"58"},{"ch":3,"sec":"7 当期純利益と法人税等","k":"計算","q":"税引前当期純利益800、法人税等250、法人税等調整額10。当期純利益はいくら？","a":"540","y":"540","alt":[],"o":[],"ex":"800−（250＋10）＝540","p":"58"},{"ch":3,"sec":"総合（区分の集計）","k":"計算","q":"受取利息10、有価証券評価益15、受取配当金5、固定資産売却益30、投資有価証券売却益20。営業外収益の合計はいくら？","a":"30","y":"30","alt":[],"o":[],"ex":"10＋15＋5＝30。固定資産売却益と投資有価証券売却益は特別利益。","p":"55"},{"ch":3,"sec":"総合（区分の集計）","k":"計算","q":"支払利息40、社債利息30、有価証券評価損10、固定資産売却損20、投資有価証券売却損35。営業外費用の合計はいくら？","a":"80","y":"80","alt":[],"o":[],"ex":"40＋30＋10＝80。固定資産売却損と投資有価証券売却損は特別損失。","p":"55"},{"ch":3,"sec":"総合（区分の集計）","k":"計算","q":"売上高2,000、売上原価1,200、販売費及び一般管理費500、営業外収益60、営業外費用40。経常利益はいくら？","a":"320","y":"320","alt":[],"o":[],"ex":"2,000−1,200−500＋60−40＝320","p":"46"},{"ch":4,"sec":"1 キャッシュ・フロー計算書の役割","k":"記述","q":"資金の流入（収入）を英語で何という？","a":"キャッシュ・インフロー","y":"きゃっしゅいんふろー","alt":[],"o":[],"ex":"流出（支出）はキャッシュ・アウトフロー。","p":"66"},{"ch":4,"sec":"1 キャッシュ・フロー計算書の役割","k":"記述","q":"収入と支出の差し引きで求めた、その期間のキャッシュの純増減額を何という？","a":"正味のキャッシュ・フロー","y":"しょうみのきゃっしゅふろー","alt":[],"o":[],"ex":"キャッシュ・インフロー−キャッシュ・アウトフロー。","p":"66"},{"ch":4,"sec":"1 キャッシュ・フロー計算書の役割","k":"記述","q":"損益計算書では黒字なのに、資金が足りなくなって倒産することを何という？","a":"黒字倒産","y":"くろじとうさん","alt":[],"o":[],"ex":"収益・費用と収入・支出はタイミングがずれるため、利益とキャッシュ・フローは一致しない。","p":"66"},{"ch":4,"sec":"1 キャッシュ・フロー計算書の役割","k":"穴うめ","q":"キャッシュ・フロー計算書が対象とするキャッシュの範囲は、【現金及び現金同等物】である","a":"現金及び現金同等物","y":"きゃっしゅふろーけいさんしょがたいしょうとするきゃっしゅのはんいは、【げんきんおよびげんきんどうとうぶつ】である","alt":[],"o":[],"ex":"現金＝手元現金＋要求払預金。","p":"67"},{"ch":4,"sec":"1 キャッシュ・フロー計算書の役割","k":"記述","q":"当座預金・普通預金・通知預金のように、いつでも引き出せる預金を何という？","a":"要求払預金","y":"ようきゅうばらいよきん","alt":[],"o":[],"ex":"手元現金とあわせて「現金」に含まれる。","p":"67"},{"ch":4,"sec":"1 キャッシュ・フロー計算書の役割","k":"4択","q":"次のうち、現金同等物に含まれるものは？","a":"預入期間3か月以内の定期預金","y":"よいれきかん3かげついないのていきよきん","alt":[],"o":[["預入期間1年の定期預金","よいれきかん1ねんのていきよきん"],["市場性のある株式","しじょうせいのあるかぶしき"],["売掛金","うりかけきん"]],"ex":"「容易に換金可能」「価値の変動リスクが小さい」「短期の投資」の3つを満たすもの。","p":"67"},{"ch":4,"sec":"1 キャッシュ・フロー計算書の役割","k":"4択","q":"市場性のある株式が現金同等物に含まれない理由は？","a":"価値の変動リスクがあるから","y":"かちのへんどうりすくがあるから","alt":[],"o":[["換金できないから","かんきんできないから"],["長期の投資だから","ちょうきのとうしだから"],["負債だから","ふさいだから"]],"ex":"現金同等物は「価値の変動についてわずかなリスクしか負わない」ことが条件。","p":"67"},{"ch":4,"sec":"1 キャッシュ・フロー計算書の役割","k":"穴うめ","q":"定期預金が現金同等物かどうかは、【預入】から満期までの期間が3か月以内かで判断する","a":"預入","y":"ていきよきんがげんきんどうとうぶつかどうかは、【よいれ】からまんきまでのきかんが3かげついないかではんだんする","alt":[],"o":[],"ex":"決算日から満期までではない点に注意。","p":"67"},{"ch":4,"sec":"2 キャッシュ・フロー計算書のしくみ","k":"4択","q":"キャッシュ・フロー計算書の3つの区分に含まれないものは？","a":"売上活動によるキャッシュ・フロー","y":"うりあげかつどうによるきゃっしゅふろー","alt":[],"o":[["営業活動によるキャッシュ・フロー","えいぎょうかつどうによるきゃっしゅふろー"],["投資活動によるキャッシュ・フロー","とうしかつどうによるきゃっしゅふろー"],["財務活動によるキャッシュ・フロー","ざいむかつどうによるきゃっしゅふろー"]],"ex":"3区分は営業活動・投資活動・財務活動。","p":"68"},{"ch":4,"sec":"2 キャッシュ・フロー計算書のしくみ","k":"記述","q":"本業でどれだけキャッシュを生み出したかを表す区分は？","a":"営業活動によるキャッシュ・フロー","y":"えいぎょうかつどうによるきゃっしゅふろー","alt":["えいぎょうきゃっしゅふろー"],"o":[],"ex":"営業CF。本業の現金を生み出す力を表す。","p":"69"},{"ch":4,"sec":"2 キャッシュ・フロー計算書のしくみ","k":"記述","q":"設備投資や有価証券の売買、貸付けなどによる収支を表す区分は？","a":"投資活動によるキャッシュ・フロー","y":"とうしかつどうによるきゃっしゅふろー","alt":["とうしきゃっしゅふろー"],"o":[],"ex":"投資CF。","p":"69"},{"ch":4,"sec":"2 キャッシュ・フロー計算書のしくみ","k":"記述","q":"借入れや返済、株式の発行、配当金の支払いなどの収支を表す区分は？","a":"財務活動によるキャッシュ・フロー","y":"ざいむかつどうによるきゃっしゅふろー","alt":["ざいむきゃっしゅふろー"],"o":[],"ex":"財務CF。資金の調達と返済。","p":"69"},{"ch":4,"sec":"2 キャッシュ・フロー計算書のしくみ","k":"4択","q":"次のうち、財務活動によるキャッシュ・フローに入るものは？","a":"配当金の支払い","y":"はいとうきんのしはらい","alt":[],"o":[["貸付金の回収による収入","かしつけきんのかいしゅうによるしゅうにゅう"],["有形固定資産の取得による支出","ゆうけいこていしさんのしゅとくによるししゅつ"],["商品の仕入れによる支出","しょうひんのしいれによるししゅつ"]],"ex":"貸付金の回収と有形固定資産の取得は投資活動、商品の仕入れによる支出は営業活動。","p":"69"},{"ch":4,"sec":"2 キャッシュ・フロー計算書のしくみ","k":"4択","q":"次のうち、投資活動によるキャッシュ・フローに入るものは？","a":"有価証券の売却による収入","y":"ゆうかしょうけんのばいきゃくによるしゅうにゅう","alt":[],"o":[["株式の発行による収入","かぶしきのはっこうによるしゅうにゅう"],["自己株式の取得による支出","じこかぶしきのしゅとくによるししゅつ"],["借入金の返済による支出","かりいれきんのへんさいによるししゅつ"]],"ex":"株式の発行・自己株式の取得・借入金の返済は財務活動。","p":"76"},{"ch":4,"sec":"2 キャッシュ・フロー計算書のしくみ","k":"4択","q":"災害による保険金の受取りなど、投資にも財務にも当たらない収支はどの区分？","a":"営業活動","y":"えいぎょうかつどう","alt":[],"o":[["投資活動","とうしかつどう"],["財務活動","ざいむかつどう"],["表示しない","ひょうじしない"]],"ex":"便宜上、営業活動によるキャッシュ・フローの区分に表示する。","p":"69"},{"ch":4,"sec":"2 キャッシュ・フロー計算書のしくみ","k":"計算","q":"営業CF500、投資CF△300、財務CF△50、現金及び現金同等物の期首残高400。期末残高はいくら？","a":"550","y":"550","alt":[],"o":[],"ex":"500−300−50＝150が増加額。400＋150＝550。","p":"68"},{"ch":4,"sec":"3 営業CFの表示方法（直接法と間接法）","k":"記述","q":"営業収入や仕入れの支出など、収支の項目ごとに総額を示して営業CFを表す方法は？","a":"直接法","y":"ちょくせつほう","alt":[],"o":[],"ex":"営業CFがどんな要因でできているかが直接わかる。","p":"70"},{"ch":4,"sec":"3 営業CFの表示方法（直接法と間接法）","k":"記述","q":"税引前当期純利益に調整を加えて、逆算で営業CFを表す方法は？","a":"間接法","y":"かんせつほう","alt":[],"o":[],"ex":"利益と営業CFの差の原因がわかる。","p":"70"},{"ch":4,"sec":"3 営業CFの表示方法（直接法と間接法）","k":"4択","q":"直接法と間接法で、営業活動によるキャッシュ・フローの金額は？","a":"同じになる","y":"おなじになる","alt":[],"o":[["直接法のほうが大きい","ちょくせつほうのほうがおおきい"],["間接法のほうが大きい","かんせつほうのほうがおおきい"],["毎期ちがう","まいきちがう"]],"ex":"表示方法が違うだけで、金額は同じ。","p":"70"},{"ch":4,"sec":"3 営業CFの表示方法（直接法と間接法）","k":"穴うめ","q":"間接法では、【税引前当期純利益】からスタートして営業CFを計算する","a":"税引前当期純利益","y":"かんせつほうでは、【ぜいびきまえとうきじゅんりえき】からすたーとしてえいぎょうきゃっしゅふろーをけいさんする","alt":[],"o":[],"ex":"当期純利益ではない点に注意。","p":"71"},{"ch":4,"sec":"3 営業CFの表示方法（直接法と間接法）","k":"4択","q":"間接法で、減価償却費はどう調整する？","a":"加算する","y":"かさんする","alt":[],"o":[["減算する","げんさんする"],["調整しない","ちょうせいしない"],["投資CFに入れる","とうしきゃっしゅふろーにいれる"]],"ex":"費用だが現金の支出をともなわないので、利益に足し戻す。","p":"72"},{"ch":4,"sec":"3 営業CFの表示方法（直接法と間接法）","k":"4択","q":"間接法で、有形固定資産売却益はどう調整する？","a":"減算する","y":"げんさんする","alt":[],"o":[["加算する","かさんする"],["調整しない","ちょうせいしない"],["財務CFに入れる","ざいむきゃっしゅふろーにいれる"]],"ex":"営業活動に関係しない損益なので取り除く。売却の収入は投資CFに表示する。","p":"73"},{"ch":4,"sec":"3 営業CFの表示方法（直接法と間接法）","k":"4択","q":"間接法で、売上債権が増加したときはどう調整する？","a":"減算する","y":"げんさんする","alt":[],"o":[["加算する","かさんする"],["調整しない","ちょうせいしない"],["投資CFに入れる","とうしきゃっしゅふろーにいれる"]],"ex":"売上は計上したがまだ入金していない分があるので、利益から引く。","p":"73"},{"ch":4,"sec":"3 営業CFの表示方法（直接法と間接法）","k":"4択","q":"間接法で、仕入債務（買掛金など）が増加したときはどう調整する？","a":"加算する","y":"かさんする","alt":[],"o":[["減算する","げんさんする"],["調整しない","ちょうせいしない"],["財務CFに入れる","ざいむきゃっしゅふろーにいれる"]],"ex":"まだ支払っていない分だけ現金が残るので加算。資産とは逆になる。","p":"73"},{"ch":4,"sec":"3 営業CFの表示方法（直接法と間接法）","k":"4択","q":"間接法で、棚卸資産が増加したときはどう調整する？","a":"減算する","y":"げんさんする","alt":[],"o":[["加算する","かさんする"],["調整しない","ちょうせいしない"],["投資CFに入れる","とうしきゃっしゅふろーにいれる"]],"ex":"在庫を買った分だけ現金が出ているので減算。","p":"73"},{"ch":4,"sec":"3 営業CFの表示方法（直接法と間接法）","k":"計算","q":"税引前当期純利益500、減価償却費100、売上債権の増加30、仕入債務の増加20。法人税等の支払いはないものとして、営業CFはいくら？","a":"590","y":"590","alt":[],"o":[],"ex":"500＋100−30＋20＝590","p":"73"},{"ch":4,"sec":"3 営業CFの表示方法（直接法と間接法）","k":"計算","q":"税引前当期純利益800、減価償却費150、有形固定資産売却益50、棚卸資産の減少40、法人税等の支払額240。営業CFはいくら？","a":"700","y":"700","alt":[],"o":[],"ex":"800＋150−50＋40＝940が小計。940−240＝700。","p":"72"},{"ch":4,"sec":"4 キャッシュ・フロー計算書の分析","k":"穴うめ","q":"フリー・キャッシュ・フローは、営業活動によるキャッシュ・フローと【投資活動によるキャッシュ・フロー】を足したもの","a":"投資活動によるキャッシュ・フロー","y":"ふりーきゃっしゅふろーは、えいぎょうかつどうによるきゃっしゅふろーと【とうしかつどうによるきゃっしゅふろー】をたしたもの","alt":[],"o":[],"ex":"本業で稼いだ現金で投資をした後、自由に使える分を表す。","p":"74"},{"ch":4,"sec":"4 キャッシュ・フロー計算書の分析","k":"計算","q":"営業CF1,000、投資CF△600、財務CF△200。フリー・キャッシュ・フローはいくら？","a":"400","y":"400","alt":[],"o":[],"ex":"1,000＋（△600）＝400。財務CFは使わない。","p":"74"},{"ch":4,"sec":"4 キャッシュ・フロー計算書の分析","k":"計算","q":"営業CF300、投資CF△500。フリー・キャッシュ・フローはいくら？（マイナスなら - をつけて打つ）","a":"△200","y":"-200","alt":[],"o":[],"ex":"300＋（△500）＝△200。投資の資金を営業CFだけではまかなえていない。","p":"74"},{"ch":4,"sec":"4 キャッシュ・フロー計算書の分析","k":"4択","q":"営業CF＋、投資CF－、財務CF＋の会社は、どんな状態？","a":"稼いだ現金と借入れで投資している","y":"かせいだげんきんとかりいれでとうししている","alt":[],"o":[["資産を売って借金を返している","しさんをうってしゃっきんをかえしている"],["過去の蓄えを取り崩している","かこのたくわえをとりくずしている"],["営業で現金が出ていっている","えいぎょうでげんきんがでていっている"]],"ex":"将来の戦略が明確で健全と考えられるパターン。","p":"75"},{"ch":4,"sec":"4 キャッシュ・フロー計算書の分析","k":"4択","q":"営業CFがマイナスの状態が続くと、どうなるおそれがある？","a":"資金繰りが苦しくなる","y":"しきんぐりがくるしくなる","alt":[],"o":[["利益が必ず増える","りえきがかならずふえる"],["自己資本比率が上がる","じこしほんひりつがあがる"],["借入金が自然に減る","かりいれきんがしぜんにへる"]],"ex":"資産の売却や借入れをしなければ、資金が回らなくなる可能性が高い。","p":"74"},{"ch":4,"sec":"総合（区分の集計）","k":"計算","q":"有形固定資産の取得による支出△200、貸付けによる支出△50、有価証券の売却による収入120、借入れによる収入100。投資CFはいくら？（マイナスなら - をつけて打つ）","a":"△130","y":"-130","alt":[],"o":[],"ex":"−200−50＋120＝△130。借入れは財務CF。","p":"76"},{"ch":4,"sec":"総合（区分の集計）","k":"計算","q":"株式の発行による収入80、借入金の返済による支出△60、配当金の支払額△30、貸付金の回収による収入40。財務CFはいくら？（マイナスなら - をつけて打つ）","a":"△10","y":"-10","alt":[],"o":[],"ex":"80−60−30＝△10。貸付金の回収は投資CF。","p":"76"},{"ch":5,"sec":"1 分析の分類と判断基準","k":"4択","q":"企業の外部の者が、公表された情報をもとに行う分析は？","a":"外部分析","y":"がいぶぶんせき","alt":[],"o":[["内部分析","ないぶぶんせき"],["定性分析","ていせいぶんせき"],["単表分析","たんぴょうぶんせき"]],"ex":"3級ではおもに外部分析を扱う。","p":"82"},{"ch":5,"sec":"1 分析の分類と判断基準","k":"記述","q":"財務諸表の数値や販売数量など、数値で表せる情報を何という？","a":"定量情報","y":"ていりょうじょうほう","alt":[],"o":[],"ex":"経営方針や技術力など数値で表せないものは定性情報。財務諸表分析は定量情報が中心。","p":"82"},{"ch":5,"sec":"1 分析の分類と判断基準","k":"4択","q":"次のうち、定性情報はどれ？","a":"経営者の資質","y":"けいえいしゃのししつ","alt":[],"o":[["従業員数","じゅうぎょういんすう"],["販売シェア","はんばいしぇあ"],["株価","かぶか"]],"ex":"従業員数・販売シェア・株価は数値で表せるので定量情報。","p":"82"},{"ch":5,"sec":"1 分析の分類と判断基準","k":"記述","q":"自己資本比率のように、算出した比率を使う分析は？","a":"比率分析","y":"ひりつぶんせき","alt":[],"o":[],"ex":"1株当たり利益のように実数を示す指標を使うのは実数分析。","p":"83"},{"ch":5,"sec":"1 分析の分類と判断基準","k":"記述","q":"異なる期間の財務諸表を使って比べる分析は？","a":"複期分析","y":"ふくきぶんせき","alt":[],"o":[],"ex":"ある特定の期間で異なる種類の財務諸表を使うのは単期分析。","p":"83"},{"ch":5,"sec":"1 分析の分類と判断基準","k":"4択","q":"1つの企業の指標を複数期間で比べて、改善・悪化の傾向をみる方法は？","a":"時系列比較","y":"じけいれつひかく","alt":[],"o":[["他社指標との比較","たしゃしひょうとのひかく"],["標準指標による比較","ひょうじゅんしひょうによるひかく"],["絶対基準","ぜったいきじゅん"]],"ex":"期間比較ともいう。その企業だけの情報なので業界での地位はわからない。","p":"84"},{"ch":5,"sec":"1 分析の分類と判断基準","k":"記述","q":"比較対象を決めて、比べて良し悪しを判断する基準は？","a":"相対基準","y":"そうたいきじゅん","alt":[],"o":[],"ex":"一般に多く使われている。一定の数値を満たすかで判断するのは絶対基準。","p":"84"},{"ch":5,"sec":"2 百分比財務諸表分析","k":"穴うめ","q":"貸借対照表構成比率は、各項目の金額を【資産合計】で割って求める","a":"資産合計","y":"たいしゃくたいしょうひょうこうせいひりつは、かくこうもくのきんがくを【しさんごうけい】でわってもとめる","alt":["ふさいじゅんしさんごうけい"],"o":[],"ex":"負債・純資産合計で割っても同じ。純資産合計で割るのではない。","p":"86"},{"ch":5,"sec":"2 百分比財務諸表分析","k":"穴うめ","q":"損益計算書百分比は、各項目の金額を【売上高】で割って求める","a":"売上高","y":"そんえきけいさんしょひゃくぶんひは、かくこうもくのきんがくを【うりあげだか】でわってもとめる","alt":[],"o":[],"ex":"営業外収益や特別利益も売上高を基準にする。","p":"88"},{"ch":5,"sec":"2 百分比財務諸表分析","k":"記述","q":"売上総利益を売上高で割った比率は？","a":"売上高総利益率","y":"うりあげだかそうりえきりつ","alt":["あらりえきりつ"],"o":[],"ex":"粗利益率ともいう。","p":"88"},{"ch":5,"sec":"2 百分比財務諸表分析","k":"4択","q":"販売費及び一般管理費がある場合、売上高営業利益率と売上高総利益率の関係は？","a":"売上高営業利益率のほうが小さい","y":"うりあげだかえいぎょうりえきりつのほうがちいさい","alt":[],"o":[["売上高営業利益率のほうが大きい","うりあげだかえいぎょうりえきりつのほうがおおきい"],["必ず同じになる","かならずおなじになる"],["決まっていない","きまっていない"]],"ex":"営業利益＝売上総利益−販管費なので、必ず小さくなる。","p":"89"},{"ch":5,"sec":"2 百分比財務諸表分析","k":"計算","q":"資産合計2,000、流動資産800。流動資産の構成比率は何％？","a":"40","y":"40","alt":[],"o":[],"ex":"800÷2,000×100＝40％","p":"86"},{"ch":5,"sec":"2 百分比財務諸表分析","k":"計算","q":"売上高5,000、営業利益400。売上高営業利益率は何％？","a":"8","y":"8","alt":[],"o":[],"ex":"400÷5,000×100＝8％","p":"88"},{"ch":5,"sec":"2 百分比財務諸表分析","k":"計算","q":"売上高2,000、売上高総利益率30％、売上高営業利益率12％。販売費及び一般管理費はいくら？","a":"360","y":"360","alt":[],"o":[],"ex":"30％−12％＝18％が販管費の比率。2,000×18％＝360。","p":"89"},{"ch":5,"sec":"3 成長性分析","k":"記述","q":"対象年度の数値を、前年度の数値で割って百分比で表した指標は？","a":"対前年度比率","y":"たいぜんねんどひりつ","alt":[],"o":[],"ex":"前年度を100％として計算する。","p":"90"},{"ch":5,"sec":"3 成長性分析","k":"記述","q":"前年度からの増減額を、前年度の数値で割って百分比で表した指標は？","a":"伸び率","y":"のびりつ","alt":[],"o":[],"ex":"伸び率＝対前年度比率−100％。","p":"92"},{"ch":5,"sec":"3 成長性分析","k":"記述","q":"特定の年度の数値を100％として、各年度の数値を比べる指標は？","a":"対基準年度比率","y":"たいきじゅんねんどひりつ","alt":[],"o":[],"ex":"複数年度の推移をつかみやすい。","p":"92"},{"ch":5,"sec":"3 成長性分析","k":"穴うめ","q":"伸び率は、対前年度比率から【100】％を引いたものに等しい","a":"100","y":"のびりつは、たいぜんねんどひりつから【100】ぱーせんとをひいたものにひとしい","alt":[],"o":[],"ex":"対前年度比率110％なら伸び率10％。","p":"93"},{"ch":5,"sec":"3 成長性分析","k":"4択","q":"前年度より数値が減ったとき、伸び率は？","a":"マイナスになる","y":"まいなすになる","alt":[],"o":[["0になる","ぜろになる"],["100％をこえる","ひゃくぱーせんとをこえる"],["計算できない","けいさんできない"]],"ex":"伸び率はマイナスになることがある。","p":"93"},{"ch":5,"sec":"3 成長性分析","k":"計算","q":"前年度の売上高800、当年度の売上高1,000。対前年度比率は何％？","a":"125","y":"125","alt":[],"o":[],"ex":"1,000÷800×100＝125％","p":"90"},{"ch":5,"sec":"3 成長性分析","k":"計算","q":"前年度の営業利益400、当年度の営業利益460。伸び率は何％？","a":"15","y":"15","alt":[],"o":[],"ex":"（460−400）÷400×100＝15％","p":"92"},{"ch":5,"sec":"3 成長性分析","k":"計算","q":"基準年度の売上高1,200、X3年度の売上高960。X3年度の対基準年度比率は何％？","a":"80","y":"80","alt":[],"o":[],"ex":"960÷1,200×100＝80％","p":"92"},{"ch":5,"sec":"3 成長性分析","k":"計算","q":"売上高100が、2年連続で対前年度比率110％で伸びた。2年後の売上高はいくら？","a":"121","y":"121","alt":[],"o":[],"ex":"100×1.1＝110、110×1.1＝121。複利効果で120にはならない。","p":"91"},{"ch":5,"sec":"4 安全性分析","k":"記述","q":"流動負債に対する流動資産の比率で、短期の支払能力をみる指標は？","a":"流動比率","y":"りゅうどうひりつ","alt":[],"o":[],"ex":"かつては銀行家比率とも呼ばれた。高いほど安全。","p":"94"},{"ch":5,"sec":"4 安全性分析","k":"記述","q":"流動資産から流動負債を差し引いた額は？","a":"正味運転資本","y":"しょうみうんてんしほん","alt":["しょうみうんてんしきん"],"o":[],"ex":"正味運転資金ともいう。マイナスになることもある。","p":"95"},{"ch":5,"sec":"4 安全性分析","k":"穴うめ","q":"当座資産は、流動資産から【棚卸資産】を差し引いたもの","a":"棚卸資産","y":"とうざしさんは、りゅうどうしさんから【たなおろししさん】をさしひいたもの","alt":[],"o":[],"ex":"棚卸資産は売ってからでないと資金にならないため除く。","p":"96"},{"ch":5,"sec":"4 安全性分析","k":"記述","q":"流動比率よりも厳しく、当座資産で流動負債を返せるかをみる指標は？","a":"当座比率","y":"とうざひりつ","alt":[],"o":[],"ex":"100％以上が望ましい。","p":"96"},{"ch":5,"sec":"4 安全性分析","k":"穴うめ","q":"手元流動性は、現金及び預金と【有価証券】を足したもの","a":"有価証券","y":"てもとりゅうどうせいは、げんきんおよびよきんと【ゆうかしょうけん】をたしたもの","alt":[],"o":[],"ex":"流動資産の有価証券。手元資金ともいう。","p":"97"},{"ch":5,"sec":"4 安全性分析","k":"記述","q":"総資本（負債・純資産合計）に占める自己資本の割合は？","a":"自己資本比率","y":"じこしほんひりつ","alt":[],"o":[],"ex":"高いほど長期的な財務の安定性が高い。100％を超えることはない。","p":"98"},{"ch":5,"sec":"4 安全性分析","k":"4択","q":"財務諸表分析で「他人資本」と呼ばれるものは？","a":"負債","y":"ふさい","alt":[],"o":[["純資産","じゅんしさん"],["資産","しさん"],["売上高","うりあげだか"]],"ex":"純資産は自己資本。資産を自己資本と呼ぶわけではない。","p":"98"},{"ch":5,"sec":"4 安全性分析","k":"4択","q":"正味運転資本がマイナスのとき、流動比率は？","a":"100％を下回る","y":"100ぱーせんとをしたまわる","alt":[],"o":[["100％を上回る","100ぱーせんとをうわまわる"],["ちょうど100ぱーせんと","ちょうど100ぱーせんと"],["マイナスになる","まいなすになる"]],"ex":"流動負債が流動資産より大きいということなので。","p":"95"},{"ch":5,"sec":"4 安全性分析","k":"4択","q":"流動資産が減り、流動負債が増えると、流動比率はどうなる？","a":"下がる","y":"さがる","alt":[],"o":[["上がる","あがる"],["変わらない","かわらない"],["マイナスになる","まいなすになる"]],"ex":"分子が減って分母が増えるので下がる。安全性の面では悪化。","p":"94"},{"ch":5,"sec":"4 安全性分析","k":"計算","q":"流動資産600、流動負債400。流動比率は何％？","a":"150","y":"150","alt":[],"o":[],"ex":"600÷400×100＝150％","p":"94"},{"ch":5,"sec":"4 安全性分析","k":"計算","q":"流動資産600、流動負債400。正味運転資本はいくら？","a":"200","y":"200","alt":[],"o":[],"ex":"600−400＝200","p":"95"},{"ch":5,"sec":"4 安全性分析","k":"計算","q":"流動資産500、棚卸資産150、流動負債250。当座比率は何％？","a":"140","y":"140","alt":[],"o":[],"ex":"（500−150）÷250×100＝140％","p":"96"},{"ch":5,"sec":"4 安全性分析","k":"計算","q":"現金及び預金120、有価証券80、売掛金100、商品60。手元流動性はいくら？","a":"200","y":"200","alt":[],"o":[],"ex":"120＋80＝200。売掛金と商品は入れない。","p":"97"},{"ch":5,"sec":"4 安全性分析","k":"計算","q":"負債合計1,200、純資産合計800。自己資本比率は何％？","a":"40","y":"40","alt":[],"o":[],"ex":"800÷（1,200＋800）×100＝40％","p":"99"},{"ch":5,"sec":"4 安全性分析","k":"計算","q":"流動資産1,200、流動比率150％。流動負債はいくら？","a":"800","y":"800","alt":[],"o":[],"ex":"1,200÷1.5＝800（逆算の問題） function shuffle(arr, rnd=Math.random){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const seq = {miss:[[140,.08,'square',.05]], word:[[880,.06,'triangle',.08],[1320,.09,'triangle',.08]], perfect:[[880,.06,'triangle',.08],[1320,.06,'triangle',.08],[1760,.12,'triangle',.08]],
      tick:[[660,.09,'sine',.1]], go:[[990,.25,'sine',.12]], win:[[660,.1,'triangle',.1],[880,.1,'triangle',.1],[1320,.3,'triangle',.1]], lose:[[440,.15,'sine',.1],[330,.3,'sine',.1]]}[type];
    let t=AC.currentTime;
    for(const [f,d,w,v] of seq){ const o=AC.createOscillator(), g=AC.createGain(); o.type=w; o.frequency.value=f; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02); t+=d*.8; }
  }catch(e){}
}

let NET = null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error(src)); document.head.appendChild(s); }); }
function getFbConfig(){
  try{ if(typeof FIREBASE_CONFIG!=='undefined' && FIREBASE_CONFIG) return FIREBASE_CONFIG; }catch(e){}
  try{ if(typeof firebaseConfig!=='undefined' && firebaseConfig) return firebaseConfig; }catch(e){}
  return window.FIREBASE_CONFIG || window.firebaseConfig || window.FB_CONFIG || null;
}
const clean = v => v===undefined ? null : JSON.parse(JSON.stringify(v));
async function firebaseBackend(){
  const cfg = getFbConfig();
  if(!(window.firebase && firebase.database)){
    if(!cfg) throw new Error('noconfig');
    await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app-compat.js`);
    await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-database-compat.js`);
  }
  if(!firebase.apps.length){ if(!cfg) throw new Error('noconfig'); firebase.initializeApp(cfg); }
  const db = firebase.database();
  let off = 0; db.ref('.info/serverTimeOffset').on('value', s=>{ off = s.val()||0; });
  const R = p => db.ref('rooms/'+ROOM+(p?'/'+p:''));
  return {
    kind:'firebase',
    now:()=>Date.now()+off,
    set:(p,v)=>R(p).set(clean(v)),
    update:(p,v)=>R(p).update(clean(v)),
    remove:p=>R(p).remove(),
    get:async p=>(await R(p).once('value')).val(),
    on:(p,cb)=>{ const r=R(p), h=s=>cb(s.val()); r.on('value',h); return ()=>r.off('value',h); },
    onDisc:p=>R(p).onDisconnect().remove(),
    cancelDisc:p=>R(p).onDisconnect().cancel(),
    onConn:cb=>db.ref('.info/connected').on('value', s=>cb(!!s.val())),
  };
}
function localBackend(){
  const KEY = 'typing.localdb.'+ROOM;
  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel(KEY) : null;
  const load = ()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } };
  let tree = load();
  const L = new Set(), disc = new Set();
  const getAt = (t,p)=>{ if(!p) return t; let c=t; for(const s of p.split('/')){ if(c==null||typeof c!=='object') return null; c=c[s]; } return c===undefined?null:c; };
  const prune = o=>{ if(o&&typeof o==='object'){ for(const k of Object.keys(o)){ prune(o[k]); if(o[k]&&typeof o[k]==='object'&&!Object.keys(o[k]).length) delete o[k]; } } };
  const setAt = (t,p,v)=>{ const ss=p.split('/'); let c=t; for(let i=0;i<ss.length-1;i++){ if(c[ss[i]]==null||typeof c[ss[i]]!=='object') c[ss[i]]={}; c=c[ss[i]]; } const last=ss[ss.length-1]; if(v==null) delete c[last]; else c[last]=clean(v); };
  const notify = ()=>{ for(const l of L){ const v=getAt(tree,l.p); const s=JSON.stringify(v); if(s!==l.last){ l.last=s; l.cb(v==null?null:JSON.parse(s)); } } };
  const write = fn=>{ tree=load(); fn(tree); prune(tree); try{ localStorage.setItem(KEY, JSON.stringify(tree)); }catch(e){} if(bc) bc.postMessage(1); notify(); return Promise.resolve(); };
  const reload = ()=>{ tree=load(); notify(); };
  if(bc) bc.onmessage = reload;
  window.addEventListener('storage', e=>{ if(e.key===KEY) reload(); });
  window.addEventListener('pagehide', ()=>{ if(disc.size) write(t=>{ for(const p of disc) setAt(t,p,null); }); });
  return {
    kind:'local',
    now:()=>Date.now(),
    set:(p,v)=>write(t=>setAt(t,p,v)),
    update:(p,v)=>write(t=>{ for(const k in v) setAt(t,p+'/'+k,v[k]); }),
    remove:p=>write(t=>setAt(t,p,null)),
    get:async p=>{ tree=load(); const v=getAt(tree,p); return v==null?null:clean(v); },
    on:(p,cb)=>{ const l={p,cb,last:undefined}; L.add(l); setTimeout(()=>{ if(L.has(l)){ tree=load(); const v=getAt(tree,p); l.last=JSON.stringify(v); cb(v==null?null:clean(v)); } },0); return ()=>L.delete(l); },
    onDisc:p=>{ disc.add(p); return Promise.resolve(); },
    cancelDisc:p=>{ disc.delete(p); return Promise.resolve(); },
    onConn:cb=>cb(true),
  };
}

// ループ
function loop(g){
  if(g.dead || G!==g) return;
  if(g.run){
    if(g.mode==='attack' && elapsed() >= ATTACK_SEC*1000){ endAttack(); return; }
    if(g.mode==='cpu'){
      g.cpu.step(performance.now());
      if(g.cpu.done && !g.myFin){ endCpu(false); return; }
    }
    if(g.mode==='online') onlineTick();
  }
  if(!g.dead){ renderHud(); if(g.mode!=='attack') renderBars(); requestAnimationFrame(()=>loop(g)); }

function finishMine(){

  if(G.mode==='cpu'){ endCpu(true); return; }
