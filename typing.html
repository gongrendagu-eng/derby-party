// ===== CPU =====
function makeCpu(list, kps){
  const lens = [];
  list.forEach(it=>new Typer(it.k).units.forEach(u=>lens.push(u.c[0].length)));
  const total = lens.length;
  const need = i => lens[i]/kps*(0.75+Math.random()*0.55) + (Math.random()<0.05 ? 0.5 : 0);
  const c = {ui:0, t:0, last:null, done:false, cur:need(0)};
  c.step = now=>{
    if(c.done) return;
    if(c.last==null){ c.last=now; return; }
    c.t += (now-c.last)/1000; c.last=now;
    while(c.t >= c.cur){ c.t -= c.cur; c.ui++; if(c.ui>=total){ c.done=true; c.t1=now; return; } c.cur=need(c.ui); }
  };
  c.prog = ()=> c.done ? 1 : (c.ui + Math.min(1, c.t/c.cur))/total;
  return c;
}
function endCpu(win){
  G.run=false; G.dead=true; if(!G.t1) G.t1=performance.now();
  renderBars(); sfx(win?'win':'lose');
  const t = elapsed(), lv=CPU_LV[G.lv];
  showResult({
    tag:`🤖 CPU対戦 ・ ${lv.ic} ${lv.name} ・ ${catOf(G.cat).name} ${G.list.length}問`,
    big: win ? 'WIN!' : 'LOSE…', bigCls: win?'win':'lose', unit:'',
    title: win ? `${fmtT(t)}でゴール！` : `CPUのほうが速かった… (${Math.round(myProg()*100)}%まで)`,
    stats: statsOf(t),
    again:()=>startSolo('cpu'), back:setupCpu,
  });
}
function statsOf(t){
  const acc = G.ok+G.miss ? Math.round(G.ok/(G.ok+G.miss)*1000)/10 : 0;
  return {kps: t>0 ? Math.round(G.ok/(t/1000)*10)/10 : 0, acc, keys:G.ok, miss:G.miss, combo:G.maxCombo, words:G.words};
}

// ===== スコアアタック結果・ランキング =====
function gradeOf(kps){
  if(kps>=7) return '⚡ タイピングの神';
  if(kps>=5.5) return '🏯 名人';
  if(kps>=4.5) return '🥋 達人';
  if(kps>=3.5) return '🔨 職人';
  if(kps>=2.5) return '📗 一人前';
  if(kps>=1.5) return '🌱 見習い';
  return '🥚 たまご';
}
async function endAttack(){
  G.run=false; G.dead=true; G.t1 = G.t0 + ATTACK_SEC*1000;
  const g = G, st = statsOf(ATTACK_SEC*1000);
  sfx('win');
  showResult({
    tag:`🏆 スコアアタック ・ ${catOf(g.cat).icon} ${catOf(g.cat).name}`,
    big: g.score.toLocaleString(), unit:'点', title: gradeOf(st.kps), stats: st,
    best:'ランキングに送信中…',
    again:()=>startSolo('attack'), back:setupAttack, rank:()=>openRank(g.cat),
  });
  try{
    const rec = {name:NAME, score:g.score, kps:st.kps, acc:st.acc, words:g.words, t:NET.now()};
    const path = `rank/${g.cat}/${PID}`;
    const cur = await NET.get(path);
    let msg;
    if(!cur || rec.score > (cur.score||0)){ await NET.set(path, rec); msg = cur ? `🎉 自己ベスト更新！（前回 ${cur.score.toLocaleString()}点）` : '🎉 ランキングに登録しました！'; }
    else { if(cur.name!==NAME) await NET.update(path,{name:NAME}); msg = `自己ベスト：${cur.score.toLocaleString()}点`; }
    const all = Object.values(await NET.get(`rank/${g.cat}`) || {}).sort((a,b)=>b.score-a.score);
    const pos = all.findIndex(r=>r.score <= Math.max(rec.score, cur?cur.score:0)) + 1;
    const bestEl = $('#resBest'); if(bestEl) bestEl.textContent = `${msg} ・ ランキング ${pos||all.length}位 / ${all.length}人`;
  }catch(e){ const bestEl=$('#resBest'); if(bestEl) bestEl.textContent='ランキングに送信できませんでした（通信を確認してください）'; }
}
let RESULT_AGAIN=null, RESULT_AT=0;
function showResult(o){
  const s = o.stats;
  const el = $('#s-result');
  el.innerHTML = `<div class="panel res">
    <span class="tag">${esc(o.tag)}</span>
    <div class="big ${o.bigCls||''}">${o.big}</div><div class="unit">${o.unit||''}</div>
    <div class="title">${esc(o.title||'')}</div>
    <div class="best" id="resBest">${esc(o.best||'')}</div>
    ${o.places||''}
    ${s?`<div class="stats">
      <div class="stat"><div class="l">打/秒</div><div class="v">${s.kps}</div></div>
      <div class="stat"><div class="l">正確率</div><div class="v">${s.acc}%</div></div>
      <div class="stat"><div class="l">打った文字</div><div class="v">${s.keys}</div></div>
      <div class="stat"><div class="l">最大コンボ</div><div class="v">${s.combo}</div></div>
    </div>`:''}
    <div class="row" style="justify-content:center">
      ${o.back?'<button class="btn" id="rBack">設定にもどる</button>':''}
      ${o.rank?'<button class="btn" id="rRank">📊 ランキング</button>':''}
      ${o.extra||''}
      ${o.again?'<button class="btn pri" id="rAgain">もう一度（Enter）</button>':''}
    </div>
  </div>`;
  if(o.back) el.querySelector('#rBack').onclick = o.back;
  if(o.rank) el.querySelector('#rRank').onclick = o.rank;
  if(o.again) el.querySelector('#rAgain').onclick = o.again;
  if(o.bind) o.bind(el);
  RESULT_AGAIN = o.again || null; RESULT_AT = performance.now();
  $('#ov').classList.remove('on');
  show('result');
}

let RANK_UNSUB=null, ADMIN=false;
const RANK_TABS = ()=>[{id:QZ_RANK, name:'ビジ検3級クイズ', icon:'📚'}].concat(CATS);
const rankName = id => (RANK_TABS().find(c=>c.id===id)||{name:''}).name;
function openRank(catId){
  if(RANK_UNSUB){ RANK_UNSUB(); RANK_UNSUB=null; }
  const el = $('#s-rank');
  const isQ = catId===QZ_RANK;
  const draw = data=>{
    const rows = Object.entries(data||{}).map(([id,r])=>Object.assign({id},r)).filter(r=>typeof r.score==='number').sort((a,b)=>b.score-a.score || a.t-b.t);
    let pos=0, prev=null;
    const trs = rows.map((r,i)=>{ if(r.score!==prev){ pos=i+1; prev=r.score; } const medal = pos===1?'🥇':pos===2?'🥈':pos===3?'🥉':pos;
      const d = r.t ? new Date(r.t) : null;
      return `<tr class="${r.id===PID?'me':''}"><td class="pos">${medal}</td><td class="nm">${esc(r.name)}${r.id===PID?' <small style="color:var(--you)">あなた</small>':''}</td><td class="num">${(r.score||0).toLocaleString()}</td><td class="num">${isQ ? (r.correct??'-') : (r.kps??'-')}</td><td class="num">${r.acc??'-'}%</td><td class="num" style="color:var(--dim)">${d?(d.getMonth()+1)+'/'+d.getDate():''}</td>${ADMIN?`<td><button class="del" data-del="${esc(r.id)}">削除</button></td>`:''}</tr>`; }).join('');
    el.innerHTML = `<div class="panel" style="max-width:860px">
      <div class="row"><h2>📊 ランキング</h2><span class="spacer"></span><span class="hint">ルーム ${ROOM}</span></div>
      <p class="sub">${isQ?`ビジ検3級クイズ（${QZ_ATTACK_SEC}秒スコアアタック）の自己ベスト（1人1つ）。`:'スコアアタックの自己ベスト（1人1つ）。お題ごとに分かれています。'}</p>
      <div class="tabs">${RANK_TABS().map(c=>`<button class="chip ${c.id===catId?'on':''}" data-cat="${c.id}">${c.icon} ${c.name}</button>`).join('')}</div>
      ${rows.length ? `<table class="rk"><thead><tr><th>順位</th><th>名前</th><th class="num">スコア</th><th class="num">${isQ?'正解数':'打/秒'}</th><th class="num">${isQ?'正答率':'正確率'}</th><th class="num">日付</th>${ADMIN?'<th></th>':''}</tr></thead><tbody>${trs}</tbody></table>` : '<div class="empty">まだ記録がありません。最初の1位をねらおう！</div>'}
      <div class="row" style="margin-top:18px"><button class="btn" id="bk">← タイトル</button><span class="spacer"></span>
        ${ADMIN?`<button class="btn danger sm" id="reset">このお題をリセット</button><button class="btn sm" id="adm">先生モード終了</button>`:`<button class="btn sm" id="adm">先生用</button>`}
        <button class="btn pri" id="play">このお題で挑戦</button></div>
    </div>`;
    el.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ if(b.dataset.cat!==QZ_RANK){ PREF.cat=b.dataset.cat; savePref(); } openRank(b.dataset.cat); });
    el.querySelector('#bk').onclick = ()=>{ if(RANK_UNSUB){RANK_UNSUB();RANK_UNSUB=null;} toTitle(); };
    el.querySelector('#play').onclick = ()=>{ if(RANK_UNSUB){RANK_UNSUB();RANK_UNSUB=null;} if(!NAME){ toTitle(); toast('先にニックネームを入れてください'); return; } if(isQ){ PREF.qzMode='attack'; savePref(); setupQuiz(); return; } PREF.cat=catId; savePref(); setupAttack(); };
    el.querySelector('#adm').onclick = ()=>{ if(ADMIN){ ADMIN=false; draw(data); return; } const p=prompt('先生用パスワード'); if(p===TEACHER_PASS){ ADMIN=true; draw(data); } else if(p!=null) toast('パスワードがちがいます'); };
    const rs = el.querySelector('#reset'); if(rs) rs.onclick = ()=>{ if(confirm(`「${rankName(catId)}」のランキングを全部消します。よろしいですか？`)) NET.remove(`rank/${catId}`); };
    el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const r=rows.find(x=>x.id===b.dataset.del); if(confirm(`「${r?r.name:''}」の記録を削除しますか？`)) NET.remove(`rank/${catId}/${b.dataset.del}`); });
  };
  el.innerHTML = '<div class="panel"><div class="empty">読み込み中…</div></div>';
  show('rank');
  RANK_UNSUB = NET.on(`rank/${catId}`, draw);
}

// ===== オンライン対戦 =====
let LB = {subs:[], bid:null, lobby:null, race:null, host:false};
function leaveLobbySubs(){ LB.subs.forEach(f=>f()); LB.subs=[]; if(RANK_UNSUB){ RANK_UNSUB(); RANK_UNSUB=null; } }
function openLobby(){
  leaveLobbySubs(); presence();
  let online={}, lobbies={};
  const el = $('#s-lobby');
  const draw = ()=>{
    const now = NET.now();
    const ls = Object.entries(lobbies||{}).map(([id,l])=>Object.assign({id},l)).filter(l=>l && l.created && now-l.created < 2*3600e3).sort((a,b)=>b.created-a.created);
    const ons = Object.entries(online||{}).map(([id,o])=>({id,name:o&&o.name}));
    el.innerHTML = `<div class="lobby">
      <div class="panel" style="margin:0;max-width:none">
        <div class="row"><h2>🌐 オンライン対戦</h2><span class="spacer"></span><button class="btn pri" id="mk">＋ 部屋をつくる</button></div>
        <p class="sub">部屋をつくって仲間を待つか、待っている部屋に参加しよう（最大${MAX_PLAYERS}人）。タイピングレースと、ビジ検3級の早押しクイズがあります。</p>
        <div class="blist">${ls.length ? ls.map(l=>{ const n=Object.keys(l.members||{}).length; const racing=l.state!=='wait'; const full=n>=MAX_PLAYERS;
          return `<div class="bitem ${racing?'racing':''}"><div><div class="bn">${esc(l.hostName)} の部屋</div><div class="bm">${lobbyLabel(l)} ・ ${n}/${MAX_PLAYERS}人${racing?' ・ 対戦中':''}</div></div><span class="spacer"></span>
          <button class="btn sm ${racing||full?'':'pri'}" data-join="${esc(l.id)}" ${racing||full?'disabled':''}>${racing?'対戦中':full?'満員':'参加する'}</button></div>`; }).join('') : '<div class="empty">待っている部屋はまだありません。「部屋をつくる」から始めよう。</div>'}</div>
        <div class="row" style="margin-top:18px"><button class="btn" id="bk">← タイトル</button></div>
      </div>
      <div class="panel" style="margin:0;max-width:none"><h2 style="font-size:18px">いまオンライン ${ons.length}人</h2><p class="sub" style="margin-bottom:10px">この画面を開いている人</p>
        <div class="onl">${ons.map(o=>`<span class="${o.id===PID?'me':''}">${esc(o.name||'?')}</span>`).join('')}</div></div>
    </div>`;
    el.querySelector('#bk').onclick = toTitle;
    el.querySelector('#mk').onclick = createRoomDialog;
    el.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>joinRoom(b.dataset.join));
  };
  LB.subs.push(NET.on('online', v=>{ online=v||{}; draw(); }));
  LB.subs.push(NET.on('lobby', v=>{ lobbies=v||{};
    // 古い部屋のお掃除
    const now=NET.now(); for(const [id,l] of Object.entries(lobbies)){ if(!l || !l.created || now-l.created>2*3600e3){ NET.remove(`lobby/${id}`); NET.remove(`race/${id}`); } }
    draw(); }));
  show('lobby');
}
function lobbyLabel(l){
  if(l.kind==='quiz') return `📚 ビジ検3級 早押しクイズ ・ ${(l.chs||[]).length===5?'全章':'第'+(l.chs||[]).join('・')+'章'} ・ ${l.n}問`;
  return `${catOf(l.cat).icon} ${catOf(l.cat).name} ・ ${l.n}問`;
}
function createRoomDialog(){
  const el = $('#s-setup');
  const draw = ()=>{
    const quiz = PREF.onKind==='quiz';
    el.innerHTML = `<div class="panel">
      <h2>＋ 部屋をつくる</h2><p class="sub">あなたがホストになります。参加者がそろったらスタートを押してください。</p>
      <div class="field"><label>対戦の種類</label>${chips('kind', [{v:'typing',t:'⌨ タイピングレース'},{v:'quiz',t:'📚 ビジ検3級 早押しクイズ'}], PREF.onKind)}</div>
      ${quiz ? `<div class="field"><label>範囲（複数えらべます）</label>${mchips('chs', QZ_CHAPTERS.map(c=>({v:String(c.ch), t:`第${c.ch}章 ${c.name}`})), PREF.onQzChs.map(String))}</div>
        <div class="field"><label>問題数</label>${chips('qn', [5,10,15].map(n=>({v:n,t:n+'問'})), PREF.onQzN)}</div>`
      : `<div class="field"><label>お題</label>${chips('cat', catChips(), PREF.onCat)}</div>
        <div class="field"><label>お題の数</label>${chips('n', [3,5,10].map(n=>({v:n,t:n+'問'})), PREF.onN)}</div>`}
      <div class="row" style="margin-top:22px"><button class="btn" id="bk">← もどる</button><span class="spacer"></span><button class="btn pri" id="go">部屋をつくる（Enter）</button></div>
    </div>`;
    bindChips(el, (k,v)=>{ if(k==='kind'){ PREF.onKind=v; savePref(); draw(); return; } if(k==='cat') PREF.onCat=v; if(k==='n') PREF.onN=+v; if(k==='qn') PREF.onQzN=+v; savePref(); });
    bindMchips(el, (k,vs)=>{ PREF.onQzChs = vs.map(Number); savePref(); });
    el.querySelector('#bk').onclick = openLobby;
    el.querySelector('#go').onclick = go;
  };
  const go = async ()=>{
    SETUP_GO = null;
    const bid = rid(6);
    const base = {host:PID, hostName:NAME, state:'wait', created:NET.now(), members:{[PID]:NAME}};
    const l = PREF.onKind==='quiz' ? Object.assign(base, {kind:'quiz', chs:PREF.onQzChs.slice().sort(), n:PREF.onQzN}) : Object.assign(base, {kind:'typing', cat:PREF.onCat, n:PREF.onN});
    await NET.set(`lobby/${bid}`, l);
    NET.onDisc(`lobby/${bid}`);
    enterRoom(bid, true);
  };
  draw(); show('setup'); SETUP_GO = go;
}
async function joinRoom(bid){
  const l = await NET.get(`lobby/${bid}`);
  if(!l){ toast('その部屋はもうありません'); return; }
  if(l.state!=='wait'){ toast('その部屋は対戦中です'); return; }
  if(Object.keys(l.members||{}).length>=MAX_PLAYERS){ toast('満員です'); return; }
  await NET.set(`lobby/${bid}/members/${PID}`, NAME);
  NET.onDisc(`lobby/${bid}/members/${PID}`);
  enterRoom(bid, false);
}
function enterRoom(bid, host){
  leaveLobbySubs();
  LB.bid = bid; LB.host = host; LB.lobby = null; LB.race = null;
  LB.subs.push(NET.on(`lobby/${bid}`, v=>{
    const was = LB.lobby; LB.lobby = v;
    if(!v || !v.members || !v.members[PID]){
      LB.lobby = was;   // 回線が一瞬切れただけのこともあるので、少し待ってから確かめる
      clearTimeout(LB.goneTm);
      LB.goneTm = setTimeout(async ()=>{
        if(LB.bid!==bid) return;
        const now = await NET.get(`lobby/${bid}`);
        if(now && now.members && now.members[PID]) return;
        if(G && G.mode==='online' && G.bid===bid && !G.over) return;
        toast(now ? '部屋から外れました' : 'ホストが部屋を閉じました'); exitRoom();
      }, 6000);
      return;
    }
    clearTimeout(LB.goneTm);
    if(v.state==='wait' && SCREEN!=='wait' && !(G && G.mode==='online' && !G.over && G.bid===bid && G.run)){ if(G) G.dead=true; drawWait(); }
    else if(SCREEN==='wait') drawWait();
  }));
  LB.subs.push(NET.on(`race/${bid}`, v=>{
    LB.race = v;
    if(!v && G && G.mode==='online' && G.bid===bid && !G.over && G.seed){
      G.over = true; G.dead = true; if(QZ){ QZ.dead = true; clearInterval(QZ.tm); } $('#ov').classList.remove('on'); toast('対戦が中止されました');
      if(LB.lobby) drawWait(); else exitRoom(); return;
    }
    if(v && v.quiz){
      if(v.players && v.players[PID] && !(G && G.mode==='online' && G.seed===v.seed)) startQuizOnline(v);
      qzOnlineUpdate(v); return;
    }
    if(v && v.seed && v.players && v.players[PID] && !(G && G.mode==='online' && G.seed===v.seed)) startOnline(v);
    if(G && G.mode==='online' && v && G.seed===v.seed){ renderBars(); onlineTick(); }
  }));
  drawWait();
}
function drawWait(){
  const l = LB.lobby, el = $('#s-wait');
  if(!l){ el.innerHTML='<div class="panel"><div class="empty">部屋に入っています…</div></div>'; show('wait'); return; }
  const mem = Object.entries(l.members||{});
  const isHost = l.host===PID;
  const slots = [];
  for(let i=0;i<MAX_PLAYERS;i++){ const m=mem[i]; slots.push(m ? `<div class="mem ${m[0]===PID?'me':''}"><small>${m[0]===l.host?'👑 ホスト':'参加者'}${m[0]===PID?' ・ あなた':''}</small>${esc(m[1])}</div>` : `<div class="mem empty2">あき</div>`); }
  el.innerHTML = `<div class="panel" style="max-width:860px">
    <h2>${esc(l.hostName)} の部屋</h2><p class="sub">${lobbyLabel(l)} ・ ${mem.length}/${MAX_PLAYERS}人</p>${l.kind==='quiz'?'<p class="hint" style="margin:-10px 0 14px">同じ問題を全員で解きます。いちばん早く正解すると3点、ほかの正解者は1点。</p>':''}
    <div class="members">${slots.join('')}</div>
    <div class="row"><button class="btn" id="lv">${isHost?'部屋を閉じる':'部屋を出る'}</button><span class="spacer"></span>
      ${isHost ? `<button class="btn pri" id="st" ${mem.length<2?'disabled':''}>スタート！</button>` : '<span class="hint">ホストがスタートするのを待っています…</span>'}</div>
    ${isHost && mem.length<2 ? '<p class="hint" style="text-align:right;margin:8px 0 0">2人以上そろうとスタートできます</p>' : ''}
  </div>`;
  el.querySelector('#lv').onclick = ()=>leaveBattle(false);
  const st = el.querySelector('#st'); if(st) st.onclick = hostStart;
  show('wait');
}
async function hostStart(){
  const l = LB.lobby; if(!l || l.host!==PID) return;
  const mem = l.members||{}; if(Object.keys(mem).length<2) return;
  const players = {}; for(const [id,name] of Object.entries(mem)) players[id] = {name, p:0};
  const seed = Math.floor(Math.random()*2**31)+1;
  const start = NET.now()+4500;
  if(l.kind==='quiz') await NET.set(`race/${LB.bid}`, {seed, start, quiz:{chs:l.chs, n:l.n}, qi:0, phase:'q', qAt:start, players});
  else await NET.set(`race/${LB.bid}`, {seed, start, cat:l.cat, n:l.n, players});
  await NET.update(`lobby/${LB.bid}`, {state:'race'});
}
function startOnline(race){
  const cat = catOf(race.cat);
  const list = shuffle(cat.items, mulberry(race.seed)).slice(0, race.n);
  newGame('online', {cat:cat.id, list, seed:race.seed, bid:LB.bid, start:race.start, lastPush:0, lastP:-1});
  setPhrase(0);
  show('game'); focusKeys(); renderAll();
  const wait = Math.max(0, race.start - NET.now());
  countdown(wait, ()=>{ G.run=true; G.t0 = performance.now() - Math.max(0, NET.now()-race.start); loop(G); });
}
function racePlayers(){
  const r = LB.race; if(!r || !r.players) return [];
  const ps = Object.entries(r.players).map(([id,p])=>Object.assign({id},p));
  const fins = ps.filter(p=>p.fin!=null).sort((a,b)=>a.fin-b.fin);
  fins.forEach((p,i)=>p.place=i+1);
  return ps.sort((a,b)=>{ if(a.fin!=null && b.fin!=null) return a.fin-b.fin; if(a.fin!=null) return -1; if(b.fin!=null) return 1; return (b.p||0)-(a.p||0); });
}
function pushProg(force){
  if(!G || G.mode!=='online') return;
  const now = performance.now(), p = Math.round(myProg()*1000)/1000;
  if(!force && (now-G.lastPush<250 || p===G.lastP)) return;
  G.lastPush = now; G.lastP = p;
  NET.update(`race/${G.bid}/players/${PID}`, {p});
}
function onlineFinish(){
  const fin = Math.max(0, NET.now() - G.start);
  const st = statsOf(elapsed());
  NET.update(`race/${G.bid}/players/${PID}`, {p:1, fin, kps:st.kps, acc:st.acc});
  sfx('win');
  const ov=$('#ov'); ov.classList.add('on');
  ov.innerHTML = `<div class="waitmsg"><b>GOAL!</b><span id="goalMsg">${fmtT(fin)} ・ ほかの人を待っています…</span></div>`;
}
function onlineTick(){
  if(!G || G.mode!=='online' || G.over || !G.run) return;
  pushProg();
  const r = LB.race; if(!r || r.seed!==G.seed || !r.players) return;
  const ps = Object.values(r.players);
  const fins = ps.filter(p=>p.fin!=null).map(p=>p.fin);
  const now = NET.now();
  let end = false, left = null;
  if(fins.length && fins.length>=ps.length) end = true;
  else if(fins.length){ const dl = r.start + Math.min(...fins) + AFTER_FIRST_SEC*1000; left = Math.ceil((dl-now)/1000); if(now>=dl) end = true; }
  if(now > r.start + 5*60e3) end = true;
  if(G.myFin){ const gm=$('#goalMsg'); if(gm && left!=null) gm.textContent = `ほかの人を待っています… あと${Math.max(0,left)}秒`; }
  else if(left!=null){ $('#next').textContent = `⏰ 1位がゴール！ のこり ${Math.max(0,left)} 秒`; }
  if(end) endOnline();
}
function endOnline(){
  const g = G; g.over = true; g.run = false; g.dead = true;
  if(!g.myFin) pushProg(true);
  const ps = racePlayers();
  const fins = ps.filter(p=>p.fin!=null);
  ps.forEach((p,i)=>{ if(p.place==null) p.place = i+1; });
  const me = ps.find(p=>p.id===PID) || {place:ps.length};
  const isHost = LB.lobby && LB.lobby.host===PID;
  const st = statsOf(g.myFin ? (g.t1-g.t0) : elapsed());
  sfx(me.place===1?'win':'lose');
  showResult({

// ---- 進行 ----
function qzNew(mode, list, extra){
  if(QZ){ QZ.dead = true; clearInterval(QZ.tm); }
  QZ = Object.assign({mode, list, i:-1, score:0, correct:0, wrong:0, hinted:0, keys:0, miss:0, results:[], phase:'ask', dead:false, t0:performance.now()}, extra||{});
  QZ.tm = setInterval(qzTick, 100);
  return QZ;
}
function qzStart(mode, list){
  qzNew(mode, list);
  show('quiz'); qzFocus();
  if(mode==='attack'){
    QZ.phase = 'count'; QZ.countEnd = performance.now()+3000; qzRender();
  } else qzNext();
}
function qzLoad(q, seed){
  const cur = {q, hint:0, miss:0, t0:performance.now()};
  if(q.k==='記述'){ cur.tys = [new Typer(q.y), ...q.alt.map(a=>new Typer(a))]; cur.alive = cur.tys.map((_,i)=>i); }
  else if(q.k==='穴うめ'){
    const pre = q.y.split('【')[0], blank = q.y.split('【')[1].split('】')[0], full = q.y.replace(/[【】]/g,'');
    cur.ty = new Typer(full); cur.blank = new Set(); let pos = 0;
    cur.ty.units.forEach((u,i)=>{ const s=pos, e=pos+u.k.length; if(e>pre.length && s<pre.length+blank.length) cur.blank.add(i); pos=e; });
  }
  else if(q.k==='4択'){
    const rnd = seed ? mulberry(seed) : Math.random;
    cur.opts = shuffle([{t:q.a, y:q.y, ok:true}, ...q.o.map(o=>({t:o[0], y:o[1], ok:false}))], rnd);
    cur.tys = cur.opts.map(o=>new Typer(o.y)); cur.alive = cur.opts.map((_,i)=>i);
  }
  else cur.buf = '';
  return cur;
}
function qzNext(){
  if(!QZ || QZ.dead) return;
  QZ.i++;
  if(QZ.mode==='attack' && QZ.i >= QZ.list.length) QZ.list = QZ.list.concat(shuffle(QZ.list));
  if(QZ.i >= QZ.list.length){ qzEnd(); return; }
  QZ.cur = qzLoad(QZ.list[QZ.i]); QZ.phase = 'ask'; QZ.fb = null;
  qzRender(); qzFocus();
}
function qzLead(c){ return c.alive.includes(0) ? c.tys[0] : c.tys[c.alive[0]]; }
function qzAnswered(ok, how){
  const c = QZ.cur, q = c.q;
  const pts = ok ? Math.round(QZ_PTS[q.k] * QZ_HINT_RATE[c.hint]) : 0;
  if(QZ.mode!=='online'){
    QZ.score += pts; ok ? QZ.correct++ : QZ.wrong++; if(ok && c.hint) QZ.hinted++;
    const w = qzWeak();
    if(!ok || c.hint) w[q.id] = (w[q.id]||0)+1; else delete w[q.id];
    lsSet('weak', w);
  }
  QZ.results.push({q, ok, hint:c.hint, how});
  QZ.fb = {ok, pts, how, pick:c.pick};
  sfx(ok ? (c.hint ? 'word' : 'perfect') : 'lose');
  if(QZ.mode==='online'){ qzOnlineSend(ok); return; }
  QZ.phase = 'fb'; QZ.fbAt = performance.now();
  qzRender();
}
function qzGiveUp(){ if(QZ.phase!=='ask') return; QZ.cur.pick = null; qzAnswered(false, 'giveup'); }
function qzChar(ch){
  if(!QZ || QZ.phase!=='ask') return;
  if(/[^\x20-\x7e]/.test(ch)){ imeWarn(); return; }
  const c = QZ.cur, q = c.q; ch = ch.toLowerCase();
  if(q.k==='計算'){
    if(/[0-9]/.test(ch) || (ch==='.' && !c.buf.includes('.')) || (ch==='-' && !c.buf)) c.buf += ch;
    qzRender(); return;
  }
  if(ch===' ') return;
  let ok = false, done = false;
  if(q.k==='穴うめ'){
    const r = c.ty.key(ch); ok = r!=='miss'; done = r==='done';
  } else {
    const keep = [];
    for(const i of c.alive){ const r = c.tys[i].key(ch); if(r!=='miss'){ keep.push(i); if(r==='done') done = done===false ? i : done; } }
    if(keep.length){ ok = true; c.alive = keep; }
  }
  QZ.keys++;
  if(!ok){ c.miss++; QZ.miss++; sfx('miss'); const pc=$('#qcard'); pc.classList.remove('miss'); void pc.offsetWidth; pc.classList.add('miss'); qzRender(); return; }
  if(q.k==='4択'){
    if(done!==false){ c.pick = done; qzAnswered(c.opts[done].ok, 'pick'); return; }
    if(c.alive.length===1 && !c.opts[c.alive[0]].ok){ c.pick = c.alive[0]; qzAnswered(false, 'pick'); return; }
  } else if(done!==false){ qzAnswered(true, 'typed'); return; }
  qzRender();
}
function qzSubmitCalc(){
  const c = QZ.cur; if(!c.buf || c.buf==='-') return;
  const ok = Math.abs(parseFloat(c.buf) - parseFloat(c.q.y)) < 1e-9;
  qzAnswered(ok, 'calc');
}
function qzKeydown(e){
  if(e.key==='Escape'){ e.preventDefault(); qzQuit(); return; }
  if(!QZ) return;
  if(QZ.phase==='fb'){
    if((e.key==='Enter'||e.key===' ') && performance.now()-QZ.fbAt>350){ e.preventDefault(); qzAdvance(); }
    return;
  }
  if(QZ.phase!=='ask') return;
  if(e.isComposing || e.key==='Process' || e.keyCode===229){ imeWarn(); return; }
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const k = QZ.cur.q.k;
  if(e.key==='Enter'){ e.preventDefault(); k==='計算' ? qzSubmitCalc() : qzGiveUp(); return; }
  if(e.key==='Backspace' && k==='計算'){ e.preventDefault(); QZ.cur.buf = QZ.cur.buf.slice(0,-1); qzRender(); return; }
  if(e.key.length===1){ e.preventDefault(); qzChar(e.key); }
}
function qzAdvance(){
  if(QZ.mode==='attack' && performance.now()-QZ.t0 >= QZ_ATTACK_SEC*1000){ qzEnd(); return; }
  qzNext();
}
function qzQuit(){
  if(!QZ) return;

function qzFocus(){ const k=$('#qkeyIn'); try{ k.focus({preventScroll:true}); }catch(e){ k.focus(); } }
function qzTick(){
  if(!QZ || QZ.dead) return;

  if(QZ.phase==='count'){

    else qzRender();
    return;
  }
  if(QZ.mode==='attack'){
    if(now-QZ.t0 >= QZ_ATTACK_SEC*1000 && QZ.phase==='ask'){ qzEnd(); return; }
    if(QZ.phase==='fb' && now-QZ.fbAt > (QZ.fb.ok ? 1300 : 2600)){ qzAdvance(); return; }
  }
  qzHintTick(now);

}
function qzHintTick(now){
  const c = QZ.cur;
  if(QZ.phase==='ask' && c && (c.q.k==='記述'||c.q.k==='穴うめ')){
    const t = now - c.t0, h = t>=QZ_HINT_MS[1] ? 2 : t>=QZ_HINT_MS[0] ? 1 : 0;

function qzRoma(ty, from, hideFn){
  // from: 何番目のユニットから案内を出すか / hideFn(i): かくすユニット
  let s = '';
  for(let j=from; j<ty.units.length; j++){
    const u = ty.units[j], r = j===ty.i ? ty.cur().slice(ty.buf.length) : u.c[0];
    s += hideFn && hideFn(j) ? `<span class="hid">${'＿'.repeat(Math.max(1,u.k.length))}</span>` : esc(r);
  }
  return s;
}

  let qq = esc(q.q), body = '';
  if(q.k==='穴うめ'){
    const ty = c.ty, blankDone = [...c.blank].every(i=>i<ty.i) || ans;

    qq = esc(q.q).replace(/【(.+?)】/, (_, a)=> blankDone ? `<span class="qblank fill">${a}</span>` : `<span class="qblank">${typedBlank ? esc(typedBlank) : '？'}</span>`);
    const kana = ty.units.map((u,i)=>{ const hide = c.blank.has(i) && i>=ty.i && c.hint<1 && !ans; return `<span class="${i<ty.i?'d':(i===ty.i?'c':'')}">${hide?'＿'.repeat(u.k.length):esc(u.k)}</span>`; }).join('');
    const roma = ans ? '' : `<span class="d">${esc(ty.typed)}</span>` + qzRoma(ty, ty.i, j=>c.blank.has(j) && c.hint<2);
    body = `<div class="kana">${kana}</div><div class="roma qr">${roma}</div>`;
  }
  else if(q.k==='記述'){
    const ty = qzLead(c);
    const done = ty.units.slice(0, ty.i).map(u=>u.k).join('');
    let rest = '';
    if(!ans){
      if(c.hint===1){ const r=ty.units.slice(ty.i); rest = r.map((u,j)=>j===0?`<span class="hk">${esc(u.k)}</span>`:'<span class="hk o">○</span>').join(''); }
      if(c.hint===2) rest = `<span class="hk">${esc(ty.units.slice(ty.i).map(u=>u.k).join(''))}</span>`;
    }
    const shown = ans ? (fb.ok ? esc(done) : `<s>${esc(done)}</s>`) : esc(done);
    body = `<div class="qans ${ans?(fb.ok?'ok':'ng'):''}">${shown}${!ans&&ty.buf?`<span class="buf">${esc(ty.buf)}</span>`:''}${ans?'':'<i class="caret"></i>'}${rest}</div>`
         + (c.hint>=2 && !ans ? `<div class="roma qr"><span class="d">${esc(ty.typed)}</span>${qzRoma(ty, ty.i)}</div>` : `<div class="qtyped">${esc(ty.typed)}</div>`);

  if(!ans){
    if(q.k==='計算') help = 'Enter：答える ・ Backspace：1文字消す';
    else if(q.k==='4択') help = '正しいと思う選択肢を打ち始めよう（最初の数文字で決まります）';
    else help = (c.hint===0 ? '少し待つとヒントが出ます' : c.hint===1 ? `ヒント1（${Math.round(QZ_HINT_RATE[1]*100)}点満点）` : `ヒント2（${Math.round(QZ_HINT_RATE[2]*100)}点満点）`) + ' ・ Enter：答えを見る';
  }
  $('#qhint').textContent = help + '　Esc：やめる';
  // 答え合わせ
  if(ans && fb && QZ.mode!=='online'){
    const head = fb.ok ? `⭕ 正解！ <b>+${fb.pts}</b>${c.hint?'（ヒントあり）':''}` : (fb.how==='giveup' ? '📖 答えを確認しよう' : '❌ ざんねん');
    $('#qfb').innerHTML = `<div class="fbp ${fb.ok?'ok':'ng'}"><div class="h">${head}</div>
      <div class="a">正解：<b>${esc(q.a)}</b>${q.k==='計算'?'':` <small>${esc(q.y.replace(/[【】]/g,''))}</small>`}</div>
      <div class="ex">${esc(q.ex)}</div><div class="pg">テキスト ${esc(q.p)}ページ</div>
      <div class="nx">${QZ.mode==='attack' ? '' : 'Enter：つぎへ'}</div></div>`;
  } else if(QZ.mode!=='online') $('#qfb').innerHTML = '';
}

// ---- 結果 ----
async function qzEnd(){
  if(!QZ || QZ.dead) return;
  const z = QZ; z.dead = true; clearInterval(z.tm);
  const n = z.results.length, acc = n ? Math.round(z.correct/n*1000)/10 : 0;
  const miss = z.results.filter(r=>!r.ok || r.hint);
  const missHtml = miss.length ? `<div class="qmiss"><div class="mh">見直そう（${miss.length}問）</div>${miss.slice(0,12).map(r=>`<div class="mi">${qzKb(r.q.k)} <span class="mq">${esc(r.q.q.replace(/【(.+?)】/,'【？】'))}</span><b>${esc(r.q.a)}</b></div>`).join('')}${miss.length>12?`<div class="hint">ほか${miss.length-12}問</div>`:''}</div>` : '<div class="best">全問ノーヒントで正解！</div>';
  if(z.mode==='attack'){
    sfx('win');
    showResult({tag:`📚 ビジ検3級クイズ ・ スコアアタック ${QZ_ATTACK_SEC}秒`, big:z.score.toLocaleString(), unit:'点', title:`${z.correct}問正解 ・ 正答率 ${acc}%`, best:'ランキングに送信中…', places:missHtml,
      again:()=>qzGoSolo(), back:setupQuiz, rank:()=>openRank(QZ_RANK)});
    try{
      const rec = {name:NAME, score:z.score, correct:z.correct, acc, kps:z.correct, t:NET.now()};
      const path = `rank/${QZ_RANK}/${PID}`, cur = await NET.get(path);
      let msg;
      if(!cur || rec.score > (cur.score||0)){ await NET.set(path, rec); msg = cur ? `🎉 自己ベスト更新！（前回 ${cur.score.toLocaleString()}点）` : '🎉 ランキングに登録しました！'; }
      else { if(cur.name!==NAME) await NET.update(path,{name:NAME}); msg = `自己ベスト：${cur.score.toLocaleString()}点`; }
      const all = Object.values(await NET.get(`rank/${QZ_RANK}`)||{}).sort((a,b)=>b.score-a.score);
      const pos = all.findIndex(r=>r.score <= Math.max(rec.score, cur?cur.score:0)) + 1;
      const be=$('#resBest'); if(be) be.textContent = `${msg} ・ ランキング ${pos||all.length}位 / ${all.length}人`;
    }catch(e){ const be=$('#resBest'); if(be) be.textContent='ランキングに送信できませんでした（通信を確認してください）'; }
  } else {
    sfx(z.correct===n ? 'win' : 'word');
    const retry = miss.map(r=>r.q);
    showResult({tag:`📚 ビジ検3級クイズ ・ じっくり練習 ${n}問`, big:`${z.correct} / ${n}`, unit:'問正解', title:`正答率 ${acc}% ・ ${z.score.toLocaleString()}点`, places:missHtml,
      back:setupQuiz, extra: retry.length ? '<button class="btn" id="rRetry">見直す問題をもう一度</button>' : '',
      bind: el=>{ const b=el.querySelector('#rRetry'); if(b) b.onclick=()=>qzStart('practice', shuffle(retry)); },
      again:()=>qzGoSolo()});
  }
}

// ---- オンライン（早押し） ----
function qzOnlinePool(race){ return shuffle(QUIZ.filter(q=>(race.quiz.chs||[]).includes(q.ch)), mulberry(race.seed)).slice(0, race.quiz.n); }
function startQuizOnline(race){
  if(G) G.dead = true;
  newGame('online', {quiz:true, seed:race.seed, bid:LB.bid, start:race.start, run:true});
  G.dead = true;   // タイピングのループは使わない
  qzNew('online', qzOnlinePool(race), {seed:race.seed, bid:LB.bid, phase:'count', countEnd:race.start, qAt:0});
  show('quiz'); qzFocus(); qzRender();
}
function qzOnlineUpdate(r){
  if(!QZ || QZ.mode!=='online' || QZ.seed!==r.seed || QZ.dead) return;
  QZ.race = r;
  if(r.phase==='end'){ qzOnlineEnd(r); return; }
  if(NET.now() < r.start) return;
  if(r.qi !== QZ.i){
    QZ.i = r.qi; QZ.cur = qzLoad(QZ.list[r.qi], r.seed + r.qi); QZ.phase = 'ask'; QZ.fb = null; QZ.mine = null;
    sfx('go'); $('#qfb').innerHTML='';
  }
  const mine = r.ans && r.ans['q'+r.qi] && r.ans['q'+r.qi][PID];
  if(r.phase==='rev' && QZ.phase!=='rev'){ QZ.phase = 'rev'; if(!QZ.fb) QZ.fb = {ok:false, pts:0, how:'timeup'}; }
  else if(mine && QZ.phase==='ask'){ QZ.phase = 'wait'; }
  qzRender(); qzOnlinePanel();
}
function qzOnlineSend(ok){
  QZ.phase = 'wait';
  NET.set(`race/${QZ.bid}/ans/q${QZ.i}/${PID}`, {ok:ok?1:0, t:NET.now()});
  qzRender(); qzOnlinePanel();
}
function qzOnlineScores(r){
  const pts = {}; Object.keys(r.players||{}).forEach(id=>pts[id]={pts:0, first:0, ok:0});
  const upto = r.phase==='end' ? r.quiz.n-1 : (r.phase==='rev' ? r.qi : r.qi-1);
  for(let i=0;i<=upto;i++){
    const a = (r.ans && r.ans['q'+i]) || {};
    const oks = Object.entries(a).filter(([id,x])=>x.ok && pts[id]).sort((x,y)=>x[1].t-y[1].t);
    oks.forEach(([id],k)=>{ pts[id].pts += k===0 ? 3 : 1; pts[id].ok++; if(k===0) pts[id].first++; });
  }
  return pts;
}
function qzOnlineRanked(r){
  const s = qzOnlineScores(r);
  const ps = Object.entries(r.players||{}).map(([id,p])=>Object.assign({id, name:p.name}, s[id]||{pts:0,first:0,ok:0}));
  ps.sort((a,b)=>b.pts-a.pts || b.first-a.first);
  let place=0, prev=null; ps.forEach((p,i)=>{ if(p.pts!==prev){ place=i+1; prev=p.pts; } p.place=place; });
  return ps;
}
function qzOnlineHud(){
  const r = QZ.race; $('#qtbar').style.display='none';
  if(!r){ $('#qhud').innerHTML = hbox('問題', '-'); return; }
  const ps = qzOnlineRanked(r), me = ps.find(p=>p.id===PID) || {pts:0, place:'-'};
  let left = '';
  if(r.phase==='q'){
    const a = (r.ans && r.ans['q'+r.qi]) || {}, oks = Object.values(a).filter(x=>x.ok).map(x=>x.t);
    const dl = oks.length ? Math.min(Math.min(...oks)+QZ_GRACE, r.qAt+QZ_LIMIT) : r.qAt+QZ_LIMIT;
    left = Math.max(0, Math.ceil((dl-NET.now())/1000));
  }
  $('#qhud').innerHTML = hbox('問題', `${Math.min(r.qi+1, r.quiz.n)} / ${r.quiz.n}`) + hbox('あなたの点', me.pts, 'big') + hbox('順位', `${me.place}位`, 'combo') + hbox('のこり', left===''?'-':left+'秒');
  const max = Math.max(3, r.quiz.n*3);
  $('#qbars').innerHTML = ps.map(p=>barHtml({name:p.name, sub:p.id===PID?'あなた':'', cls:p.id===PID?'me':'op', p:p.pts/max, fin:false, tx:p.pts+'点'})).join('');
}
function qzOnlinePanel(){
  const r = QZ.race; if(!r || !QZ.cur) return;
  const a = (r.ans && r.ans['q'+r.qi]) || {};
  const names = Object.fromEntries(Object.entries(r.players||{}).map(([id,p])=>[id,p.name]));
  const order = Object.entries(a).filter(([id,x])=>x.ok && names[id]).sort((x,y)=>x[1].t-y[1].t);
  const q = QZ.cur.q, mine = a[PID];
  if(QZ.phase==='wait'){
    $('#qfb').innerHTML = `<div class="fbp ${mine&&mine.ok?'ok':'ng'}"><div class="h">${mine&&mine.ok ? (order[0]&&order[0][0]===PID ? '🥇 いちばん乗り！ +3' : '⭕ 正解！ +1') : '❌ ざんねん…'}</div><div class="nx">ほかの人を待っています…</div></div>`;
  } else if(QZ.phase==='rev'){
    const who = order.length ? order.map(([id],k)=>`<span class="${id===PID?'me':''}">${k===0?'🥇':'⭕'} ${esc(names[id])} +${k===0?3:1}</span>`).join('') : '<span>正解者なし</span>';
    $('#qfb').innerHTML = `<div class="fbp ${mine&&mine.ok?'ok':'ng'}"><div class="who">${who}</div>
      <div class="a">正解：<b>${esc(q.a)}</b>${q.k==='計算'?'':` <small>${esc(q.y.replace(/[【】]/g,''))}</small>`}</div>
      <div class="ex">${esc(q.ex)}</div><div class="pg">テキスト ${esc(q.p)}ページ</div><div class="nx">まもなく次の問題…</div></div>`;
  } else $('#qfb').innerHTML = '';
}
function qzOnlineTick(){
  const r = QZ.race, now = NET.now();
  if(QZ.phase==='count'){
    if(r && now >= r.start){ QZ.phase='ask'; qzOnlineUpdate(r); } else qzRender();
    return;
  }
  qzHintTick(performance.now());
  qzOnlineHud();
  // ホストが進行を管理する
  if(!r || !LB.lobby || LB.lobby.host!==PID || r.phase==='end' || now < r.start) return;
  const ids = Object.keys(r.players||{}), a = (r.ans && r.ans['q'+r.qi]) || {};
  const key = `${r.qi}:${r.phase}`;
  if(QZ.hostKey===key) return;
  if(r.phase==='q'){
    const oks = Object.values(a).filter(x=>x.ok).map(x=>x.t), first = oks.length ? Math.min(...oks) : null;
    if(ids.every(id=>a[id]) || (first && now > first+QZ_GRACE) || now > r.qAt+QZ_LIMIT){ QZ.hostKey = key; NET.update(`race/${QZ.bid}`, {phase:'rev', revAt:now}); }
  } else if(r.phase==='rev' && now > r.revAt+QZ_REV){
    QZ.hostKey = key;
    if(r.qi+1 >= r.quiz.n) NET.update(`race/${QZ.bid}`, {phase:'end'});
    else NET.update(`race/${QZ.bid}`, {qi:r.qi+1, phase:'q', qAt:now});
  }
}
function qzOnlineEnd(r){
  if(!QZ || QZ.dead) return;
  QZ.dead = true; clearInterval(QZ.tm);
  if(G){ G.over = true; G.run = false; }
  const ps = qzOnlineRanked(r), me = ps.find(p=>p.id===PID) || {place:ps.length};
  const isHost = LB.lobby && LB.lobby.host===PID;
  const n = r.quiz.n, mine = qzOnlineScores(r)[PID] || {ok:0};
  sfx(me.place===1 ? 'win' : 'lose');
  showResult({
    tag:`🌐 オンライン ・ 📚 ビジ検3級クイズ ${n}問 ・ ${ps.length}人`,
    big:`${me.place}位`, bigCls: me.place===1?'win':'', unit:`/ ${ps.length}人`,
    title: me.place===1 ? '🏆 優勝！' : `${mine.ok}問正解`,
    places:`<div class="places">${ps.map(p=>`<div class="place ${p.id===PID?'me':''}"><div class="p">${p.place===1?'🥇':p.place===2?'🥈':p.place===3?'🥉':p.place}</div><div class="n">${esc(p.name)}</div><div class="t">${p.pts}点</div><div class="k">1着 ${p.first}回・正解 ${p.ok}</div></div>`).join('')}</div>`,
    extra:`<button class="btn" id="rLeave">${isHost?'部屋を閉じる':'部屋を出る'}</button>` + (isHost?'<button class="btn pri" id="rRe">同じメンバーでもう一回</button>':'<span class="hint">ホストの「もう一回」を待っています</span>'),
    bind: el=>{ el.querySelector('#rLeave').onclick=()=>leaveBattle(false); const re=el.querySelector('#rRe'); if(re) re.onclick=hostRematch; },
  });
}
$('#qkeyIn').addEventListener('input', e=>{ const v=e.target.value; e.target.value=''; for(const ch of v) qzChar(ch); });

</script>
